# SonarCloud configuration for imboy (Erlang/OTP backend)
#
# 关联：.claude/plans/quality-loop.md v1.3 T4.3（v1.1 §332: 三独立 SonarCloud 项目）
# 创建：2026-05-09 / iteration 78 / T4.3
# 用户配置：在 SonarCloud 创建 imboy 项目获取 SONAR_TOKEN，配置到 GitHub Secret

sonar.projectKey=imboy
sonar.organization=imboy-pub
sonar.projectName=imboy (Erlang Backend)
sonar.projectVersion=1.0.0-rc.1

# Source layout
sonar.sources=src,include
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclusions（与 elvis.config / .gitleaks.toml 对齐）
sonar.exclusions=\
  _build/**,\
  deps/**,\
  ebin/**,\
  rel/**,\
  logs/**,\
  log/**,\
  .rebar3/**,\
  src/imboy_pb.erl,\
  include/imboy_pb.hrl,\
  doc/api/**,\
  *.beam

sonar.test.exclusions=\
  test/fixtures/**,\
  apps/*/test/fixtures/**

# Coverage（make eunit 后产出）
sonar.erlang.coveragePlugin=cover
sonar.erlang.coverageReportPaths=cover/cover.coverdata

# Erlang language settings
sonar.erlang.file.suffixes=.erl,.hrl
