# IMBoy Nginx 反向代理配置
#
# 使用方法:
#   1. 修改 server_name 和 SSL 证书路径
#   2. cp config/nginx-imboy.conf /etc/nginx/sites-available/imboy
#   3. ln -s /etc/nginx/sites-available/imboy /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name imboy.pub api.imboy.pub;
    return 301 https://$host$request_uri;
}

# HTTPS + WebSocket
server {
    listen 443 ssl http2;
    server_name api.imboy.pub;

    # SSL 证书（Let's Encrypt 或自签）
    ssl_certificate     /etc/ssl/certs/api.imboy.pub.pem;
    ssl_certificate_key /etc/ssl/private/api.imboy.pub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API 代理
    location / {
        proxy_pass http://127.0.0.1:9800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://127.0.0.1:9800/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Prometheus 指标（仅内网访问）
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:9800/metrics;
    }

    # Admin 后台
    location /adm/ {
        proxy_pass http://127.0.0.1:9800/adm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location /static/ {
        proxy_pass http://127.0.0.1:9800/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# go-fastdfs 文件服务代理
server {
    listen 443 ssl http2;
    server_name fs.imboy.pub;

    ssl_certificate     /etc/ssl/certs/fs.imboy.pub.pem;
    ssl_certificate_key /etc/ssl/private/fs.imboy.pub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100m;
    }
}
