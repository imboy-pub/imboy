# Coturn TURN 服务器配置
# 文档: https://github.com/coturn/coturn/wiki/turnserver

# 基础设置
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# 域名（改为你的域名）
realm=turn.imboy.pub

# 静态密钥（必须修改！与后端 sys.config 中 turn_secret 一致）
static-auth-secret=CHANGE_ME_TO_A_STRONG_SECRET

# Relay 端口范围
min-port=49152
max-port=65535

# 日志
log-file=/var/log/turnserver.log
simple-log

# TLS 证书（与 HTTPS 共用或单独配置）
# cert=/etc/ssl/certs/turn.imboy.pub.pem
# pkey=/etc/ssl/private/turn.imboy.pub.key

# 安全加固
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# 性能
total-quota=100
stale-nonce=600
