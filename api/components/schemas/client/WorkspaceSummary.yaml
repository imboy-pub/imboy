type: object
properties:
  id:
    type: integer
    format: int64
    minimum: 1
  name:
    type: string
  logo:
    type: string
  owner_id:
    type: integer
    format: int64
    minimum: 1
  organization_id:
    type:
    - integer
    - 'null'
    format: int64
  status:
    type: string
    enum:
    - active
    - archived
  created_at:
    type: integer
    format: int64
    description: Unix 毫秒；经 elib_response:success 转换。 / Unix milliseconds.
