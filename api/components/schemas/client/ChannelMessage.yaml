type: object
properties:
  id:
    type: integer
    format: int64
    minimum: 1
  channel_id:
    type: integer
    format: int64
    minimum: 1
  author_id:
    type: integer
    format: int64
    minimum: 1
  author_name:
    type: string
  author_avatar:
    type: string
  msg_type:
    type: string
  content:
    type: string
  payload:
    type:
    - object
    - string
  is_pinned:
    type: boolean
  revoked:
    type: boolean
  view_count:
    type: integer
  reaction_count:
    type: integer
  comment_count:
    type: integer
  my_reactions:
    type: array
    items:
      type: string
  created_at:
    type: integer
    format: int64
    description: Unix 毫秒 / Unix milliseconds
required:
- id
- channel_id
- msg_type
- created_at
