type: object
properties:
  id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  organization_id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  workspace_id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  conversation_id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  business_identity_id:
    type:
    - string
    - 'null'
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  status:
    type: string
    enum:
    - queued
    - active
    - closed
  rating:
    type:
    - integer
    - 'null'
  queued_at:
    type:
    - integer
    - 'null'
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
  claimed_at:
    type:
    - integer
    - 'null'
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
  closed_at:
    type:
    - integer
    - 'null'
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
  version:
    type: integer
required:
- id
- organization_id
- workspace_id
- status
- version
