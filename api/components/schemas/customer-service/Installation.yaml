type: object
properties:
  id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  organization_id:
    type: string
    pattern: ^[0-9]+$
    description: 无损十进制 TSID 字符串。
  public_widget_id:
    type: string
  display_name:
    type: string
  allowed_origins:
    type: array
    items:
      type: string
  branding:
    $ref: Branding.yaml
  consent_version:
    type: string
  status:
    type: string
    enum:
    - active
    - revoked
  revoked_at:
    type:
    - integer
    - 'null'
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
  version:
    type: integer
  created_at:
    type: integer
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
  updated_at:
    type: integer
    format: int64
    description: Unix 秒；客服 response helper 保留底层秒值。
