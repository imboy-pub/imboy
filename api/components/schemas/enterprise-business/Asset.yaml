  asset_id:
    type: string
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID；此接口出站以字符串传输。
  conversation_id:
    type: string
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID；此接口出站以字符串传输。
  message_id:
    type: string
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID；此接口出站以字符串传输。
  session_state:
    type: string
  object_hash:
    type: string
  mime:
    type: string
  size_bytes:
    type: integer
  file_name:
    type:
    - string
    - 'null'
