    description: 完整十进制实体 ID。
  workspace_id:
    type: string
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
  conversation_id:
    type: string
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
  sender_contact_id:
    type:
    - string
    - 'null'
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
  sender_business_identity_id:
    type:
    - string
    - 'null'
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
  actor_user_id:
    type:
    - string
    - 'null'
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
  policy_id:
    type:
    - string
    - 'null'
    pattern: ^[0-9]+$
    description: 完整十进制实体 ID。
