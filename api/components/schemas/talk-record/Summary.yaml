type: object
required:
- id
- status
- overview
- decisions
- actions
- source_transcript_version
- source_content_revision
- model_version
- confirmed_by
- revision
- etag
- created_at
- updated_at
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  status:
    type: string
    enum:
    - draft
    - confirmed
    - stale
  overview:
    type: string
  source_transcript_version:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  source_content_revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  model_version:
    type: [string, 'null']
  confirmed_by:
    type: [integer, 'null']
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  etag:
    type: string
    description: 摘要版本令牌，如 summary:1；HTTP ETag 头另带双引号。
  created_at:
    type: integer
    description: 经公共响应序列化后的 Unix 毫秒。
  updated_at:
    type: [integer, 'null']
    description: 经公共响应序列化后的 Unix 毫秒；未设置为 null。
  decisions:
    type: array
    items:
      type: object
      properties:
        text:
          type: string
        segment_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
  actions:
    type: array
    items:
      type: object
      properties:
        text:
          type: string
        segment_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        assignee_user_id:
          anyOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          - type: 'null'
        due_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
