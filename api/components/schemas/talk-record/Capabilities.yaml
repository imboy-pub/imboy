type: object
properties:
  scopes:
    type: array
    items:
      type: string
      enum:
      - personal
      - organization
  languages:
    type: array
    items:
      type: string
  max_duration_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  max_recording_bytes:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  max_part_bytes:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  storage_remaining_bytes:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  queue_limit:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  recording_enabled:
    type: boolean
  processing_available:
    type: boolean
  asr_enabled:
    type: boolean
  summary_enabled:
    type: boolean
  voice_id_enabled:
    type: boolean
  policy_version:
    type: string
  processor_config_version:
    type: string
  processor_location_category:
    type: string
  retention_policy:
    type: object
    properties:
      personal:
        type: string
      organization:
        type: string
  processor_location:
    type: string
  source_types:
    type: array
    items:
      type: string
      enum:
      - live_recording
  client_processing:
    $ref: ClientPolicy.yaml
