type: object
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  owner_user_id:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  created_by:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  client_recording_id:
    type: string
    format: uuid
  scope:
    type: string
    enum:
    - personal
    - organization
  organization_id:
    anyOf:
    - type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    - type: 'null'
  workspace_id:
    anyOf:
    - type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    - type: 'null'
  title:
    type: string
  notes:
    type: string
  language:
    type: string
  processing_mode:
    type: string
    enum:
    - record_only
    - transcribe
    - summarize
  capture_status:
    type: string
    enum:
    - draft
    - recording
    - paused
    - interrupted
    - ended
  media_status:
    type: string
    enum:
    - uploading
    - verifying
    - assembling
    - available
    - retryable_failed
  transcript_status:
    type: string
  summary_status:
    type: string
  cleanup_status:
    type: string
  duration_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  acl_revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  content_revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  deleted_at:
    anyOf:
    - type: string
      format: date-time
    - type: 'null'
  capabilities_for_actor:
    type: object
    properties:
      edit:
        type: boolean
      share:
        type: boolean
      export:
        type: boolean
      delete:
        type: boolean
      transfer_owner:
        type: boolean
  custody_status:
    type: string
    enum:
    - active
    - handover_required
  visibility:
    type: string
    enum:
    - owned
    - shared
  etag:
    type: string
  client_processing:
    $ref: ClientPolicy.yaml
