type: object
additionalProperties: false
required:
- result
- result_hash
properties:
  result:
    oneOf:
    - type: object
      additionalProperties: false
      required:
      - model_version
      - status
      - speakers
      - segments
      properties:
        model_version:
          type: string
          enum:
          - asr-1.0
          - volc.seedasr.auc
        status:
          type: string
          enum:
          - ready
          - no_speech
        speakers:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - label
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 48
              confidence:
                type: [integer, 'null']
                minimum: 0
                maximum: 1
        segments:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required:
            - start_ms
            - end_ms
            - speaker_label
            - text
            properties:
              start_ms:
                type: integer
                minimum: 0
              end_ms:
                type: integer
                minimum: 0
              speaker_label:
                type: string
                minLength: 1
                maxLength: 48
              text:
                type: string
                maxLength: 20000
              confidence:
                type: [integer, 'null']
                minimum: 0
                maximum: 1
        language:
          type: string
          maxLength: 32
    - type: object
      additionalProperties: false
      required:
      - model_version
      - overview
      - decisions
      - actions
      properties:
        model_version:
          type: string
          enum:
          - glm-5.3-flash
        overview:
          type: string
          minLength: 1
          maxLength: 20000
        decisions:
          type: array
          maxItems: 200
          items: &id001
            type: object
            additionalProperties: false
            required:
            - text
            - segment_ids
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 4000
              segment_ids:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
              owner_user_id:
                type: [integer, 'null']
                enum:
                - null
              due_date:
                type: [string, 'null']
                enum:
                - null
        actions:
          type: array
          maxItems: 200
          items: *id001
  result_hash:
    type: string
    pattern: ^[0-9a-f]{64}$
  provider_request_id:
    type: string
    maxLength: 128
    pattern: ^[A-Za-z0-9_.:-]*$
description: At most 1 MiB encoded result. Canonical hashing accepts integer milliseconds
  and no floating point values; omit unknown confidence or use null. Speaker labels
  are chunk-local ASCII [A-Za-z0-9_-], never real identities. Provider trace ID is
  untrusted diagnostic metadata.
