type: object
additionalProperties: false
required:
- confirmed
- execution_mode
- provider
- model
- policy_version
- config_version
properties:
  confirmed:
    type: boolean
    enum:
    - true
  execution_mode:
    type: string
    enum:
    - client_byok
  provider:
    type: string
    enum:
    - minimax
    - doubao
    - zhipu
  model:
    type: string
    enum:
    - asr-1.0
    - volc.seedasr.auc
    - glm-5.3-flash
  policy_version:
    type: string
    minLength: 1
    maxLength: 64
  config_version:
    type: string
    pattern: ^[0-9a-f]{64}$
