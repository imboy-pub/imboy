type: object
required:
- client_mark_id
properties:
  client_mark_id:
    type: string
    format: uuid
  capture_id:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  capture_offset_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  position_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  text:
    type: string
    maxLength: 1000
anyOf:
- required:
  - capture_id
  - capture_offset_ms
- required:
  - position_ms
  not:
    required:
    - capture_id
description: Explicit capture_id+capture_offset_ms is canonical. If position_ms is
  also supplied it must match; otherwise projection-only position_ms is resolved by
  server.
