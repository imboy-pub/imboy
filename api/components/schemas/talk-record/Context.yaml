type: object
properties:
  scope:
    type: string
    enum:
    - personal
    - organization
  organization_id:
    anyOf:
    - type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    - type: 'null'
  workspace_id:
    anyOf:
    - type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    - type: 'null'
  display_name:
    type: string
  retention_policy:
    type: object
    properties:
      personal:
        type: string
      organization:
        type: string
  processing_notice_version:
    type: string
  capabilities:
    type: object
    properties:
      can_create:
        type: boolean
      processing_available:
        type: boolean
  name:
    type: string
  workspaces:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        name:
          type: string
  client_processing:
    $ref: ClientPolicy.yaml
