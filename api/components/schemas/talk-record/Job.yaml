type: object
properties:
  job_id:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  kind:
    type: string
    enum:
    - assemble
    - transcribe
    - summarize
    - export
    - purge
  state:
    type: string
    enum:
    - queued
    - running
    - retry_wait
    - succeeded
    - failed
    - cancelled
  attempt:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  error_code:
    anyOf:
    - type: string
    - type: 'null'
  retryable:
    type: boolean
  suspended:
    type: boolean
  retry_at:
    anyOf:
    - type: string
      format: date-time
    - type: 'null'
  created_at:
    type: string
    format: date-time
  finished_at:
    anyOf:
    - type: string
      format: date-time
    - type: 'null'
