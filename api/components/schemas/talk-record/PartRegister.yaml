type: object
required:
- seq
- start_ms
- end_ms
- sha256
- codec
properties:
  seq:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  start_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  end_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  capture_offset_ms:
    type: integer
    format: int64
    minimum: 0
    maximum: 9223372036854775807
  sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
  byte_size:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  size:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  codec:
    type: string
    enum: [aac]
    description: Required V1 wire codec for ADTS AAC. Missing, null and other formats
      return invalid_codec before declaration or idempotency writes. Actual bytes
      remain subject to hash, media type and decode verification.
  sample_rate:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  channels:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
anyOf:
- required:
  - byte_size
- required:
  - size
description: end_ms > start_ms. At least byte_size or size positive; same capture
  seq with another hash conflicts.
