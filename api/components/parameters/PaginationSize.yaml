# ----------------------------------------------------------------------------
# imboy/api/components/parameters/PaginationSize.yaml
# 管理后台分页 - size 参数 / Admin pagination - size parameter
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 2)
# 调用方：api/openapi.yaml#/components/parameters/PaginationSize
# ----------------------------------------------------------------------------
in: query
name: size
schema:
  type: integer
  default: 20
  minimum: 1
  maximum: 1000
description: |
  ## 中文
  每页条数（elib_param:page/1 默认 20，最大 1000）；具体端点可进一步限制。
  客户端希望每页 10 条时须显式传 size=10。
  ## English
  Items per page (elib_param:page/1 default 20, max 1000); endpoint limits take precedence.
  Clients requesting ten rows must send size=10 explicitly.
