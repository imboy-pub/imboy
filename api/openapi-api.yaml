# ----------------------------------------------------------------------------
# imboy/api/openapi-api.yaml — IMBoy REST API 编辑真源（surface api：业务 v1 端点）
#
# 三受众布局（2026-09-22 api-surface-reorg）：本文件是**手工编辑真源**之一。
# 汇总入口 api/openapi.yaml 由 gen_aggregate.py 从三个 root 生成，请勿手改。
# 修改流程：改本文件（或 paths/ 下对应端点文件）→ redocly lint →
#   python3 api/gen_aggregate.py 重新生成聚合文件。
# ----------------------------------------------------------------------------
openapi: 3.1.0
info:
  title: IMBoy REST API — api surface
  version: 1.0.0-rc.3
  x-stability: stable
  summary: IMBoy 后端 HTTP / REST 接口冻结版（业务 surface）
  description: |
    本文件是 IMBoy REST API **surface api**（业务端点）的编辑真源，桥接 354 条
    path（362 个操作，2026-09-22 三受众重组）。覆盖认证、用户、消息、群组、
    好友、频道、朋友圈、项目协作等业务路径；完整路径清单以
    `imboy/src/imboy_router.erl` 为权威；契约机器真源见
    `.contract/api_contract.json`（contract-export）。

    **响应信封**：所有响应统一为 `{ code, msg, sv_ts, payload }`，定义见
    [envelope.schema.json](./envelope.schema.json)。

    **认证**：Bearer JWT，载荷中的 `sub` 为 TSID（integer 字符串）；白名单
    路径免鉴权（见 `imboy_router:open/0`）。

    **版本策略**：1.0.x 期间保证路径签名向后兼容，破坏性变更通过 `/v2` 路径前缀发布。
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy

servers:
  - url: https://{apiDomain}
    description: 生产环境（部署方按实际域名替换 apiDomain）
    variables:
      apiDomain:
        default: api.imboy.app
        description: 生产 API 域名占位；自托管/私有部署需改为对应域名
  - url: http://127.0.0.1:{devPort}
    description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
    variables:
      devPort:
        default: '9800'
        description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖

tags:
  - name: auth
    description: 登录、注册、token 刷新
  - name: user
    description: 用户资料
  - name: msg
    description: 消息查询与历史
  - name: bot
    description: 开发者服务 Bot（Webhook 推送 + api_token 认证）
  - name: project
    description: 项目协作（W2）：成员 / 里程碑 / 频道关联 / 四聚合
  - name: organization
    description: Organization 治理与成员管理
  - name: workspace
    description: Workspace 协作空间与成员管理
  - name: admin
    description: 管理后台鉴权端点
  - name: system
    description: 系统配置与品牌
  - name: wallet
    description: 钱包与支付
  - name: ai-agent
    description: AI 助手（平台 LLM 推理）

# ----------------------------------------------------------------------------
# T3.2 split phase 4 / B (2026-05-16)：paths 段由"内联端点"改为"按域 $ref"。
