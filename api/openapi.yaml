# ----------------------------------------------------------------------------
# imboy/api/openapi.yaml — IMBoy REST API 代码生成驱动真源
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2
# 起源：从 imboy/doc/api/openapi.yaml（340L 手写冻结契约，2026-04-15）迁移
# 角色变化：
#   - 旧位置 imboy/doc/api/openapi.yaml → 降级为人类可读参考（保留不删）
#   - 本文件 imboy/api/openapi.yaml → 升级为代码生成真源（机器消费）
# 修改流程：
#   - 任何端点变更必须先改本文件
#   - 通过 redocly lint + oasdiff 校验（T4.2）
#   - 由 T3.4 的 codegen 脚本再生三端客户端代码
# 迁移日期：2026-05-09 / iteration 67 / T3.2
# ----------------------------------------------------------------------------
openapi: 3.1.0
info:
  title: IMBoy REST API
  version: 1.0.0-rc.1
  x-stability: stable
  summary: IMBoy 后端 HTTP / REST 接口冻结版
  description: |
    本文件是 IMBoy 1.0.0-rc.1 REST API 的冻结契约。覆盖核心路径（认证、用户、消息、
    管理后台首启向导）。完整路径清单以 `imboy/src/imboy_router.erl` 为权威；本文件只
    冻结**对外稳定**的端点。

    **响应信封**：所有响应统一为 `{ code, msg, sv_ts, payload }`，定义见
    [envelope.schema.json](./envelope.schema.json)。

    **认证**：Bearer JWT，载荷中的 `sub` 为 TSID（integer 字符串）。`/adm/setup/*`
    与少数白名单路径免鉴权（见 `imboy_router:open/0`）。

    **版本策略**：1.0.x 期间保证路径签名向后兼容，破坏性变更通过 `/v2` 路径前缀发布。
  license:
    name: MulanPSL-2.0
    url: https://license.coscl.org.cn/MulanPSL2
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy

servers:
  - url: https://{apiDomain}
    description: 生产环境（部署方按实际域名替换 apiDomain）
    variables:
      apiDomain:
        default: api.imboy.app
        description: 生产 API 域名占位；自托管/私有部署需改为对应域名
  - url: http://127.0.0.1:{devPort}
    description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
    variables:
      devPort:
        default: '9800'
        description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖

tags:
  - name: auth
    description: 登录、注册、token 刷新
  - name: user
    description: 用户资料
  - name: msg
    description: 消息查询与历史
  - name: admin-setup
    description: 首启初始化向导（免鉴权，仅允许执行一次）
  - name: admin
    description: 管理后台鉴权端点

