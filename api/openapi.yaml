components:
  securitySchemes:
    csVisitToken:
      in: header
      name: X-CS-Visit-Token
      type: apiKey
    csShopKey:
      in: header
      name: X-CS-Shop-Key
      type: apiKey
    seatBearerAuth:
      bearerFormat: Seat JWT (purpose=seat)
      scheme: bearer
      type: http
    mcpClientCredential:
      type: http
      scheme: bearer
      description: 独立 MCP client secret，由 MCP 治理面签发；非用户 JWT。
    botToken:
      type: http
      scheme: bearer
      description: 开发者 Bot 的 opaque api_token；不是用户 JWT。
    wsQueryToken:
      type: apiKey
      in: query
      name: token
      description: WebSocket 浏览器接入使用的访问 JWT；Authorization header 优先。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT 载荷 `sub` 为 TSID integer 字符串；刷新入口为 `/api/v1/refreshtoken`。

        '
    adminSessionId:
      type: apiKey
      in: cookie
      name: adm_user_id
      description: 管理员 ID Cookie；必须与 adminSessionSignature 同时使用。 / Session user ID.
    adminSessionSignature:
      type: apiKey
      in: cookie
      name: adm_user_sig
      description: 服务端签发的会话签名（含到期/撤销校验）；必须与 adminSessionId 同时使用。 / Signed session.
    ibIntHmacCredential:
      type: apiKey
      in: header
      name: X-Imboy-Credential
      description: 服务端签发的 ib_int_ 加 1..24 位十进制数字定位符；不发送 secret，也不使用 Authorization 头。
    ibIntHmacTimestamp:
      type: apiKey
      in: header
      name: X-Imboy-Timestamp
      description: Unix 秒；300 秒时间窗口。
    ibIntHmacNonce:
      type: apiKey
      in: header
      name: X-Imboy-Nonce
      description: 每请求随机单次 nonce，16..128 字符，仅 A-Z、a-z、0-9、下划线和短横线。
    ibIntHmacSignature:
      type: apiKey
      in: header
      name: X-Imboy-Signature
      description: sha256=<64位小写hex>；原文见 README §3。
