# GENERATED by api/gen_aggregate.py; edit the three audience roots instead.
openapi: 3.1.0
info:
  title: IMBoy REST API
  version: 1.0.0-rc.3
  x-stability: stable
  summary: IMBoy HTTP / REST 三受众聚合入口
  description: Generated from openapi-api.yaml, openapi-adm.yaml and openapi-internal.yaml. Edit the audience
    roots and path files, then run python3 api/gen_aggregate.py. Authentication and wire formats are defined
    separately for each audience.
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy
servers:
- url: https://{apiDomain}
  description: 生产环境（部署方按实际域名替换 apiDomain）
  variables:
    apiDomain:
      default: api.imboy.app
      description: 生产 API 域名占位；自托管/私有部署需改为对应域名
- url: http://127.0.0.1:{devPort}
  description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
  variables:
    devPort:
      default: '9800'
      description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖
tags:
- name: oa-login
  description: OA 入站登录、明确关联已有账号或新建账号
- name: auth
  description: 登录、注册、token 刷新
- name: channel
  description: 频道与订阅
- name: e2ee
  description: 设备公钥、Olm 预密钥与历史密文恢复
- name: user
  description: 用户资料
- name: msg
  description: 消息查询与历史
- name: bot
  description: 开发者服务 Bot（Webhook 推送 + api_token 认证）
- name: project
  description: 项目协作（W2）：成员 / 里程碑 / 频道关联 / 四聚合
- name: organization
  description: Organization 治理与成员管理
- name: workspace
  description: Workspace 协作空间与成员管理
- name: admin
  description: 管理后台鉴权端点
- name: system
  description: 系统配置与品牌
- name: wallet
  description: 钱包与支付
- name: ai-agent
  description: AI 助手（平台 LLM 推理）
- name: talk-record
  description: Explicitly authorized personal and organization recording resources
- name: customer-service
  description: 客服、访客接待、坐席与嵌入集成 / Customer service
- name: enterprise-business
  description: 企业客户、业务身份、托管会话与交接 / Enterprise business
- name: admin-setup
  description: 首启初始化向导（免鉴权，仅允许执行一次）
- name: organizations
  description: Organization 平台治理 / Organization platform governance
- name: bots
  description: 开发者 Bot 治理 / Developer bot governance
- name: internal
  description: 企业集成 Internal API（HMAC 签名；限流/幂等见端点扩展）
