# ----------------------------------------------------------------------------
# imboy/api/openapi.yaml — 三受众聚合桥接（GENERATED，请勿手改）
#
# 本文件由 gen_aggregate.py 从三个编辑真源生成并维护并集：
#   openapi-api.yaml（surface api）/ openapi-adm.yaml（surface adm）/
#   openapi-internal.yaml（surface internal）。
# 手改会被下次生成覆盖；改契约请改对应 root 或 paths/ 下端点文件，
# 然后运行 python3 api/gen_aggregate.py。保留本聚合文件是为了让
# check_rest_contract_coverage.sh / check_release_consistency.sh /
# contract_gate.py 等工具与单文件导入方零改动工作。
# ----------------------------------------------------------------------------
openapi: 3.1.0
info:
  title: IMBoy REST API
  version: 1.0.0-rc.3
  x-stability: stable
  summary: IMBoy HTTP / REST 接口聚合入口（三受众并集）
  description: |
    本文件是**生成式聚合桥接**：三个受众编辑真源（openapi-api.yaml /
    openapi-adm.yaml / openapi-internal.yaml）的 paths 并集，由
    gen_aggregate.py 维护。请勿手改本文件；改契约请改对应 root 或
    paths/ 下端点文件，然后运行 python3 api/gen_aggregate.py。
    完整路径清单以 `imboy/src/imboy_router.erl` 为权威；契约机器真源见
    `.contract/api_contract.json`（contract-export）。
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy
servers:
  - url: https://{apiDomain}
    description: 生产环境（部署方按实际域名替换 apiDomain）
    variables:
      apiDomain:
        default: api.imboy.app
        description: 生产 API 域名占位；自托管/私有部署需改为对应域名
  - url: http://127.0.0.1:{devPort}
    description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
    variables:
      devPort:
        default: '9800'
        description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖

tags:
  - name: auth
    description: 登录、注册、token 刷新
  - name: user
    description: 用户资料
  - name: msg
    description: 消息查询与历史
  - name: bot
    description: 开发者服务 Bot（Webhook 推送 + api_token 认证）
  - name: project
    description: 项目协作（W2）：成员 / 里程碑 / 频道关联 / 四聚合
  - name: organization
    description: Organization 治理与成员管理
  - name: workspace
    description: Workspace 协作空间与成员管理
  - name: admin
    description: 管理后台鉴权端点
  - name: system
    description: 系统配置与品牌
  - name: wallet
    description: 钱包与支付
  - name: ai-agent
    description: AI 助手（平台 LLM 推理）

  - name: admin-setup
    description: 首启初始化向导（免鉴权，仅允许执行一次）
  - name: internal
    description: 企业集成 Internal API（ib_int 凭证；scope/限流/幂等见各端点扩展字段）

