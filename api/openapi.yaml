components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 载荷 `sub` 为 TSID integer 字符串；过期后前端需调用 `/passport/refresh`
        而非直接重连（此前反转逻辑已于 1.0.0-rc.1 修复）。

    ibIntBearer:
      type: http
      scheme: bearer
      bearerFormat: ib_int_<application_id>.<secret>
      description: |
        企业集成凭证：与单个企业应用一一对应，授权范围 = 签发时授予的
        scope 集合（固定 10 枚举、无通配）。secret 平台侧只存不可逆摘要，
        泄露即轮换；应用停用/归档后所有请求返回 application_disabled（403）。

  schemas:
    Envelope:
      $ref: './components/schemas/Envelope.yaml'
    User:
      $ref: './components/schemas/User.yaml'
    Message:
      $ref: './components/schemas/Message.yaml'

  parameters:
    PaginationPage:
      $ref: './components/parameters/PaginationPage.yaml'
    PaginationSize:
      $ref: './components/parameters/PaginationSize.yaml'
    PaginationKeyword:
      $ref: './components/parameters/PaginationKeyword.yaml'
    ConvKey:
      $ref: './components/parameters/ConvKey.yaml'
    SinceSeq:
      $ref: './components/parameters/SinceSeq.yaml'
    HistoryLimit:
      $ref: './components/parameters/HistoryLimit.yaml'

security:
  - bearerAuth: []
