      x-imboy-scope: files:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object_key
              properties:
                object_key:
                  type: string
                  description: presign 返回的 object_key
                file_hash256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
                  description: SHA-256 完整性参考（可选）
      responses:
