  /api/internal/v1/directory/persons:
    get:
      tags:
      - internal
      summary: 来源人员核对列表
      description: 只读核对本来源数据。采用 HMAC 签名，并逐语句复核应用、凭据、来源启用及有效期。尚未建立组织的配置不在列表中，由可信 Admin 入口查看。来源无效或归属不符不放行。按外部 ID 的 UTF-8 字节序升序，page_size
        1..100，未知或重复参数拒绝。 projection_status 结合来源退役、任职状态、账号状态、实际组织成员及部门关系计算；linked 不表示已投影。只返回本来源在目标组织有任职来源记录的人员，不枚举全实例用户；user_id
        对退役或停用账号返回 null。
      operationId: internalSourcePersons
      x-imboy-authentication: hmac
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      parameters:
      - name: page_size
        in: query
        description: 默认 50，最大 100；拒绝重复或未知参数。
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        description: 签名游标，绑定来源应用、组织、页族和所有过滤条件，24 小时有效。
        schema:
          type: string
          minLength: 1
          maxLength: 8192
      - name: external_organization_id
        in: query
        required: true
        description: 必须为本应用已同步且当前启用、未过期的可信来源组织。
        schema:
          type: string
          minLength: 1
          maxLength: 256
          description: 不透明 UTF-8 外部标识；服务端按 UTF-8 字节限制 1..256。
      - name: external_user_id
        in: query
        description: 精确匹配；参与游标绑定。
        schema:
          type: string
          minLength: 1
          maxLength: 256
          description: 不透明 UTF-8 外部标识；服务端按 UTF-8 字节限制 1..256。
      - name: source_status
        in: query
        description: 精确匹配；参与游标绑定。
        schema:
          type: string
          enum:
          - active
          - removed
      - name: membership_status
        in: query
        description: 精确匹配；参与游标绑定。
        schema:
          type: string
          enum:
          - active
          - removed
      - name: projection_status
        in: query
        description: 精确匹配；参与游标绑定。
        schema:
          type: string
          enum:
          - unlinked
          - pending
          - projected
          - removed
          - retired
      responses:
        '200':
          description: 来源目录实时分页；无业务写副作用；不是快照。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 禁止缓存人员目录。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - page_size
                - has_more
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - external_user_id
                      - source_version
                      - source_status
                      - binding_status
                      - user_id
                      - membership_version
