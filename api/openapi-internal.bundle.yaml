    get:
      tags:
      - internal
      summary: 企业群成员列表
      description: |
        群 active（status=1）成员 keyset 列表——§10.2 唯一升序 family
        （created_at ASC, id ASC）。群定位跨 Org/个人群/已归档一律
        resource_not_found（不泄露存在性）；同 Org 但群所属工作空间不符合业务归属
