  /api/internal/v1/directory/sync:
    post:
      tags:
      - internal
      summary: INT-43 来源目录显式增量同步
      description: 来源由当前 Application 及可信配置识别，须启用目录来源，且目标组织由当前应用的可信来源映射覆盖。客户端不能指定 user_id、Owner 或接入授权；组织首次建立仅使用可信配置中已确认的 Human
        Owner。来源关联、组织/部门/人员变更、目录投影及审计同事务提交。首次同步只建来源档案，不凭姓名等字段创建或绑定 IMBoy 账号；后续经 OA 双重身份证明关联。组织、部门、人员和成员关系各按对应版本及内容摘要校验：低版本或同版本不同内容冲突，同版本同内容可重放。未包含记录不代表删除；removed
        为显式移除，组织离职保留实例用户及其他组织关系，Owner 须先交接。source_status=removed 的账号关联退休不可自动恢复；membership=removed 可通过更高版本显式恢复。
      operationId: internalDirectorySync
      x-imboy-authentication: hmac
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 1..128 个可打印 ASCII 字符。同 key/同内容重放原结果；不同内容或尚未完成返回 409 idempotency_conflict。
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - organization
              - departments
              - persons
              properties:
                organization:
                  type: object
                  additionalProperties: false
                  required:
                  - external_id
                  - name
                  - version
                  properties:
                    external_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: 有效 UTF-8，最多 256 字节（服务端按字节校验）
                    name:
                      type: string
                      minLength: 1
                      maxLength: 200
                      description: 有效 UTF-8，最多 200 字节（服务端按字节校验）
                    version:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 9223372036854775807
                departments:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - external_id
                    - parent_external_id
                    - name
                    - version
                    - status
                    properties:
                      external_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                        description: 有效 UTF-8，最多 256 字节（服务端按字节校验）
                      parent_external_id:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 256
                        description: 根部门必须显式传 null；父节点须属于同一来源组织
                      name:
                        type: string
                        minLength: 1
                        maxLength: 128
                        description: 有效 UTF-8，最多 128 字节（服务端按字节校验）
                      version:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9223372036854775807
                      status:
                        type: string
                        enum:
                        - active
                        - removed
                  description: external_id 必须唯一；未出现的记录不删除，禁止非法父节点或循环
                persons:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - external_user_id
                    - display_name
                    - source_status
                    - source_version
                    - membership
                    properties:
                      external_user_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                        description: 有效 UTF-8，最多 256 字节（服务端按字节校验）
                      display_name:
                        type: string
                        minLength: 1
                        maxLength: 128
                        description: 有效 UTF-8，最多 128 字节（服务端按字节校验）
                      source_status:
                        type: string
                        enum:
                        - active
                        - removed
                      source_version:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9223372036854775807
                      membership:
                        type: object
                        additionalProperties: false
                        required:
                        - version
                        - status
                        - department_external_ids
                        properties:
                          version:
                            type: integer
                            format: int64
                            minimum: 1
                            maximum: 9223372036854775807
                          status:
                            type: string
                            enum:
                            - active
                            - removed
                          department_external_ids:
                            type: array
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 256
                              description: 有效 UTF-8，最多 256 字节（服务端按字节校验）
                        allOf:
                        - if:
                            properties:
                              status:
                                const: removed
                          then:
                            properties:
                              department_external_ids:
                                maxItems: 0
                    allOf:
                    - if:
                        properties:
                          source_status:
                            const: removed
                      then:
                        properties:
                          membership:
                            properties:
                              status:
                                const: removed
                  description: external_user_id 必须唯一；来源人员状态与组织任职状态独立版本管理
