openapi: 3.1.0
info:
  title: IMBoy Internal API — internal surface
  version: 1.0.0
  x-stability: stable
  summary: IMBoy 企业内部集成 API（Internal API v1，冻结）
  description: |
    本文件是 IMBoy **surface internal**（企业集成）的编辑真源，桥接 19 条
    path（23 个操作）。受众为企业 OA / 第三方集成系统开发者。

    **认证**：所有请求携带 `Authorization: Bearer ib_int_<application_id>.<secret>`；
    凭证由平台管理员在 Admin 管理台签发，scope 固定 10 枚举、无通配。

    **响应模型**：成功响应为**裸 payload**（无 `{code,msg,payload}` 业务信封）；
    错误响应统一 `{"error":{"code","message"}}`，13 个稳定错误码见
    `components/responses/internal/`（README §7 冻结表）。

    **限流与幂等**：三只独立桶 internal_read / internal_write / internal_sso；
    写动作必须携带 `Idempotency-Key` 头（同 key 重放返回首次结果）。

    **路由冻结**：method+path 不在冻结表内一律 resource_not_found（fail-closed）。
    人类文档：[internal/v1/README.md](./internal/v1/README.md)（本 API 整个
    v1/ 目录可直接交付集成方）。

    **版本策略**：v1 已冻结——只追加新端点/新可选字段，不做破坏性变更。
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy
servers:
  - url: https://{apiDomain}
    description: 生产环境（部署方按实际域名替换 apiDomain）
    variables:
      apiDomain:
        default: api.imboy.app
        description: 生产 API 域名占位；自托管/私有部署需改为对应域名
  - url: http://127.0.0.1:{devPort}
    description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
    variables:
      devPort:
        default: '9800'
        description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖
security:
  - ibIntBearer: []
tags:
  - name: internal
    description: 企业集成 Internal API（ib_int 凭证；scope/限流/幂等见各端点扩展字段）
paths:
  /api/internal/v1/application:
    get:
      tags:
        - internal
      summary: 读取本应用信息（健康检查与联调首选）
      description: |
        返回本应用元数据、本次凭证的授权 scope 与凭证清单。字段实证自
        `enterprise_application_handler:self_payload/2`：application/credentials
        为平台行数据的 binary 键透出（最小字段集，不含 secret）。
      operationId: internalApplicationSelf
      x-imboy-scope: application:read
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      responses:
        '200':
          description: 应用自检信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type: integer
                    format: int64
                    description: 所属组织 TSID
                  application_id:
                    type: integer
                    format: int64
                    description: 应用 TSID
                  credential_id:
                    type:
                      - integer
                      - 'null'
                    format: int64
                    description: 本次凭证 ID（无凭证上下文时 null）
                  application_key:
                    type:
                      - string
                      - 'null'
                    description: 应用 key
                  application:
                    type: object
                    description: 应用行元数据（binary 键透出）
                  granted_scopes:
                    type: array
                    items:
                      type: string
                    description: 本次凭证被授予的 scope 集合
                  credentials:
                    type: array
                    items:
                      type: object
                    description: 凭证清单（不含 secret）
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/application_disabled'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
        '503':
          $ref: '#/components/responses/security_gate_closed'
  /api/internal/v1/identity-mappings:
    put:
      tags:
        - internal
      summary: 绑定外部身份（OA 用户 → 平台用户）
      description: |
        把 OA 侧用户标识绑定到本组织平台用户（TSID）。字段实证自
        `enterprise_identity_handler:bind/3` + `enterprise_identity_logic:mapping_view/1`。
        幂等重放返回 `{replayed: true, user_id, status}` 形态。
      operationId: internalIdentityBind
      security:
        - ibIntBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键（同一 key 重复提交返回首次结果）
          schema:
            type: string
            minLength: 1
      x-imboy-scope: identities:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_user_id
                - user_id
              properties:
                external_user_id:
                  type: string
                  description: OA 侧用户标识（同 org+app 内唯一）
                user_id:
                  type: integer
                  format: int64
                  description: 平台用户 TSID（须为本组织成员）
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 首次绑定 / 幂等重放命中
                    properties:
                      replayed:
                        type: boolean
                      external_user_id:
                        type: string
                      user_id:
                        type: integer
                        format: int64
                      status:
                        type: string
                        description: 映射状态（如 active）
                  - type: object
                    description: 幂等重放（带 user_id 资源定位）
                    properties:
                      replayed:
                        type: boolean
                        enum:
                          - true
                      user_id:
                        type: integer
                        format: int64
                      status:
                        type: string
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '422':
          $ref: '#/components/responses/identity_not_mapped'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
    delete:
      tags:
        - internal
      summary: 解绑外部身份（软删映射）
      description: |
        撤销 external identity 映射（软删）。解绑后该用户对本应用的消息/群操作
        立即不可达（identity_not_mapped）。响应字段实证自
        `enterprise_identity_logic`（revoke 返回 `{external_user_id, status: removed, revoked: true}`）。
      operationId: internalIdentityRevoke
      security:
        - ibIntBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
            minLength: 1
      x-imboy-scope: identities:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_user_id
              properties:
                external_user_id:
                  type: string
                  description: 要解绑的 OA 侧用户标识
      responses:
        '200':
          description: 解绑结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_user_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - removed
                  revoked:
                    type: boolean
                    enum:
                      - true
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/identity-mappings/resolve:
    post:
      tags:
        - internal
      summary: 批量解析外部身份 → 平台用户
      description: |
        OA 标识批量解析为平台用户 TSID；未映射的标识不出现在结果 mappings 中
        （整体语义见 endpoints.md INT-03）。请求字段实证自 handler
        `maps:get(<<"external_user_ids">>, ...)`（**数组**，非单数）；
        响应实证自 `enterprise_identity_logic:rows_to_pairs/1`。
      operationId: internalIdentityResolve
      security:
        - ibIntBearer: []
      x-imboy-scope: identities:read
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_user_ids
              properties:
                external_user_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: OA 侧用户标识列表
      responses:
        '200':
          description: 解析结果（已映射的标识）
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        external_user_id:
                          type: string
                        user_id:
                          type: integer
                          format: int64
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/identity-mappings/directory:
    post:
      tags:
        - internal
      summary: 已映射身份目录（cursor 分页，无 list-all）
      description: |
        本组织本应用已映射用户目录。受限 cursor directory：游标不透明且不可跨页族
        复用；只返回最小字段（不返回姓名/手机号/邮箱等 PII）；不存在 list-all/export
        形态。请求字段实证自 handler `page_opts/1`（cursor / page_size / workspace_id）；
        响应实证自 `enterprise_directory_logic`（`{items, page_size, has_more, next_cursor}`）。
      operationId: internalIdentityDirectory
      security:
        - ibIntBearer: []
      x-imboy-scope: identities:read
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                  description: 上一页返回的 next_cursor（首页缺省）
                page_size:
                  type: integer
                  description: 页大小（服务端夹紧上限）
                workspace_id:
                  type: integer
                  format: int64
                  description: 按 workspace 过滤
      responses:
        '200':
          description: 已映射目录页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        external_user_id:
                          type: string
                        user_id:
                          type: integer
                          format: int64
                  page_size:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    description: 下页游标（has_more=false 时 null）
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/directory/users:
    post:
      tags:
        - internal
      summary: 可映射用户目录（cursor 分页，只回元数据）
      description: |
        查询本组织可映射（尚未绑定或已绑定）的平台用户，只返回最小元数据。
        响应 items 字段实证自 `enterprise_directory_logic`：user_id /
        external_user_id（本应用未映射则 null）/ member_role 等。
      operationId: internalDirectoryUsers
      security:
        - ibIntBearer: []
      x-imboy-scope: identities:read
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                  description: 上一页返回的 next_cursor（首页缺省）
                page_size:
                  type: integer
                  description: 页大小（服务端夹紧上限）
      responses:
        '200':
          description: 可映射用户目录页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          format: int64
                        external_user_id:
                          type:
                            - string
                            - 'null'
                          description: 本应用已映射的 OA 标识；未映射为 null
                        member_role:
                          type: string
                          description: 组织内角色
                  page_size:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/groups:
    post:
      tags:
        - internal
      summary: 创建 Workspace 企业群
      description: |
        成员用 OA 侧 external_user_id 列表（1..200 项，自动去重）；owner 缺省取
        首个成员且必须在 members 内。
      operationId: internalGroupCreate
      security:
        - ibIntBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
            minLength: 1
      x-imboy-scope: groups:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspace_id
                - title
                - members
              properties:
                workspace_id:
                  type: integer
                  format: int64
                  description: 归属 Workspace TSID（边界资源）
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                members:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                  description: OA 侧用户标识列表（须已映射本组织）
                owner_external_user_id:
                  type: string
                  description: 群主的 OA 标识（缺省取首个成员；必须在 members 内）
                introduction:
                  type: string
                  maxLength: 2000
                  description: 群介绍（缺省空串）
      responses:
        '200':
          description: 创建结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: integer
                    format: int64
                  workspace_id:
                    type: integer
                    format: int64
                  owner_user_id:
                    type: integer
                    format: int64
                  member_count:
                    type: integer
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '422':
          $ref: '#/components/responses/identity_not_mapped'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/groups/{group_id}:
    get:
      tags:
        - internal
      summary: 读取企业群详情
      description: |
        最小字段 + 成员硬上限（超限返回 invalid_request，绝不静默截断）。
        跨组织/个人群/已归档一律 resource_not_found（不泄露存在性）。
      operationId: internalGroupDetail
      security:
        - ibIntBearer: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: 企业群 TSID
          schema:
            type: integer
            format: int64
      x-imboy-scope: groups:write
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      responses:
        '200':
          description: 群详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: integer
                    format: int64
                  workspace_id:
                    type: integer
                    format: int64
                  title:
                    type: string
                  introduction:
                    type: string
                  owner_user_id:
                    type: integer
                    format: int64
                  member_count:
                    type: integer
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          format: int64
                        role:
                          type: string
                        status:
                          type: string
                  origin:
                    type:
                      - object
                      - 'null'
                    description: 来源标记（owner_app / mine 等；非本应用建群为 null）
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
    patch:
      tags:
        - internal
      summary: 修改企业群信息
      description: |
        可更新字段实证自 handler `known_key/1`：title / introduction / members
        （members 为成员覆盖语义）。响应实证自 logic update：`{group_id, title,
        introduction, updated: true}`。
      operationId: internalGroupUpdate
      security:
        - ibIntBearer: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: 企业群 TSID
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
            minLength: 1
      x-imboy-scope: groups:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                introduction:
                  type: string
                  maxLength: 2000
                members:
                  type: array
                  items:
                    type: string
                  description: 成员覆盖（external_user_id 列表）
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: integer
                    format: int64
                  title:
                    type: string
                  introduction:
                    type: string
                  updated:
                    type: boolean
                    enum:
                      - true
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
    delete:
      tags:
        - internal
      summary: 解散（归档）企业群
      description: |
        归档式解散；重复解散返回 `{group_id, archived: true, already: true}`。
      operationId: internalGroupArchive
      security:
        - ibIntBearer: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: 企业群 TSID
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
            minLength: 1
      x-imboy-scope: groups:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      responses:
        '200':
          description: 归档结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: integer
                    format: int64
                  archived:
                    type: boolean
                    enum:
                      - true
                  already:
                    type: boolean
                    description: 重复解散时 true
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/groups/{group_id}/members:
    put:
      tags:
        - internal
      summary: 向企业群添加成员（幂等）
      description: |
        成员须为本组织已映射用户；已在群（active）计入 already_member，不重复开世代。
        群 owner 不可被移除（owner invariant 由 INT-06 强制）。
      operationId: internalGroupAddMembers
      security:
        - ibIntBearer: []
      parameters:
        - name: group_id
          in: path
          required: true
          description: 企业群 TSID
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
