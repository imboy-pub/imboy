        - `webhook.ping` **不在可订阅白名单**（INT-12 `events` 填它会被拒绝）；
          本端点是它唯一的产生途径，也不依赖当前订阅列表；
        - 端点未配置 / disabled / 被安全守卫拒绝 → `invalid_request`（400）；
        - 成功仅代表**已入箱**（`enqueued:true`），不代表对方已接收——投递结果
