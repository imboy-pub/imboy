      x-imboy-authentication: hmac
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      responses:
        '200':
          description: 应用自检信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    description: 所属组织 TSID
                  application_id:
                    type: integer
                    format: int64
                    description: 应用 TSID
                  credential_id:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    description: 本次凭证 ID（无凭证上下文时 null）
                  application_key:
                    type:
                    - string
                    - 'null'
                    description: 应用 key
                  application:
                    type: object
                    description: 应用行元数据（binary 键透出）
                  authentication:
                    type: string
                    const: hmac
                    description: HMAC 请求的认证方式
                  credentials:
                    type: array
                    items:
                      type: object
                    description: 凭证清单（不含 secret）
                required: []
        '401':
          description: 凭证缺失/格式错/不存在的 locator
