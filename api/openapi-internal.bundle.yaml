components:
  securitySchemes:
    ibIntHmacCredential:
      type: apiKey
      in: header
      name: X-Imboy-Credential
      description: 服务端签发的 ib_int_ 定位符；不发送 secret。
    ibIntHmacTimestamp:
      type: apiKey
      in: header
      name: X-Imboy-Timestamp
      description: Unix 秒；300 秒时间窗口。
    ibIntHmacNonce:
      type: apiKey
      in: header
      name: X-Imboy-Nonce
      description: 每请求随机单次 nonce，16..128 字符。
    ibIntHmacSignature:
      type: apiKey
      in: header
      name: X-Imboy-Signature
      description: sha256=<64位小写hex>；原文见 README §3。
