          description: 会话不存在或跨应用（status/renew；不泄露存在性）
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - msg
                - sv_ts
                - payload
                properties:
                  code:
                    type: integer
                    description: |
                      ## 中文
                      业务状态码。0 表示成功，其余为业务错误码（见 `include/error_code.hrl`）。
                      ## English
                      Business status code. 0 = success; non-zero values map to error codes
                      defined in `include/error_code.hrl`.
                  msg:
                    type: string
                    description: |
                      ## 中文
                      人类可读的状态描述；成功时通常为 "ok"。
                      ## English
                      Human-readable status message; typically "ok" on success.
                  sv_ts:
                    type: integer
                    description: |
                      ## 中文
                      服务端时间戳（毫秒，UTC）。注：实际为 64-bit，但 1.0.0-rc.1 历史契约
                      未声明 format，保留原签名避免破坏性变更（codegen 仍按 integer 处理）。
                      ## English
