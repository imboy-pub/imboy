              - sender_mode
              - recipient_user_id
              - msg_type
              properties:
                sender_mode:
                  type: string
                  enum:
                  - application
                  - human
                sender_user_id:
                  type: string
                  description: human 模式必填；OA 侧标识（须本组织已映射、已启用）
