      - name: business_identity_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        description: 本企业 customer_service 业务身份 TSID，即坐席主键。
      - name: Idempotency-Key
        in: header
        required: true
        description: 有效 ASCII 幂等键；同业务重试复用此值。
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
      responses:
        '200':
          description: 企业客服坐席配置
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - organization_id
                - business_identity_id
                - enabled
                - max_concurrent
                - version
                properties:
                  organization_id:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                  business_identity_id:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                  enabled:
                    type: boolean
                  max_concurrent:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  version:
                    type: integer
                    minimum: 1
          headers:
