  /api/internal/v1/webhook/test-delivery:
    post:
      tags:
      - internal
      summary: 出站连通性测试（合成 webhook.ping 投递）
      description: |
        向当前配置的出站端点投递一条合成 `webhook.ping` 事件，供你方验证回调
        链路：URL 可达性、四签名头（`x-imboy-delivery/event/timestamp/signature`）
        的验证逻辑、防火墙放行。投递走与真实事件完全相同的入箱管线——
        SSRF guard 即时 pin、8 键信封、5/30/300s 退避重试、死信与重放；
        结果在 INT-23 投递列表可见、终态后可 INT-13 重放。

