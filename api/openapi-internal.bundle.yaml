      operationId: internalIdentityBind
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 幂等键（同一 key 重复提交返回首次结果）
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-imboy-authentication: hmac
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - external_user_id
              - user_id
              properties:
                external_user_id:
                  type: string
                  description: OA 侧用户标识（同 org+app 内唯一）
                user_id:
                  type: integer
                  format: int64
                  description: 平台用户 TSID（须为本组织成员）
                  minimum: 1
                  maximum: 9223372036854775807
      responses:
