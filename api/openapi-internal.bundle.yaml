    put:
      tags:
      - internal
      summary: 绑定外部身份（OA 用户 → 平台用户）
      description: '绑定本组织有效 Human 成员的外部标识。首次执行返回 external_user_id、user_id、status=active；幂等重放保留首次响应原字节，用 Idempotent-Replayed:
