            minLength: 1
      x-imboy-scope: files:write
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_name
                - mime_type
              properties:
                file_name:
                  type: string
                  minLength: 1
                  maxLength: 256
                mime_type:
                  type: string
                  description: MIME 类型（须在白名单内）
                size_bytes:
                  type: integer
                  format: int64
                  description: 大小预检提示（正整数，<= 有效上限）
      responses:
        '200':
          description: 预签名结果
          content:
            application/json:
              schema:
                type: object
