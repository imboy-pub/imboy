  /api/internal/v1/webhook:
    put:
      tags:
        - internal
      summary: 登记或更新出站 Webhook
      description: |
        配置本应用的回调端点与订阅事件（upsert）。url 即时过 SSRF guard（DNS
        解析私网/保留段拒）；events 须在事件白名单内（空列表 = 只停用订阅）。
        rotate=true 轮换 secret，响应返回新明文一次。
      operationId: internalWebhookConfigure
      security:
        - ibIntBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
            minLength: 1
      x-imboy-scope: webhooks:manage
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS 回调地址（SSRF guard 即时校验）
                events:
                  type: array
                  items:
                    type: string
                  description: 订阅事件列表（⊆ 事件白名单；空列表 = 只停用订阅）
                status:
                  type: string
                  enum:
                    - enabled
                    - disabled
                  description: 缺省 enabled
                rotate:
                  type: boolean
                  description: true = 轮换 secret（响应返回新明文一次）
      responses:
        '200':
          description: 配置结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  events:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                    enum:
                      - enabled
                      - disabled
                  rotated:
                    type: boolean
                  secret:
                    type:
                      - string
                      - 'null'
                    description: rotate=true 时返回新 secret 明文（仅此一次）；否则 null
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/webhook/deliveries:
    get:
      tags:
        - internal
      summary: Webhook 投递列表 + 健康度摘要
      description: |
        本应用的投递元数据分页（**不含 payload/正文/secret/签名 URL**）。
        summary 成功率口径 = success / (success + dead)，在途（pending/retry）
        不计入分母。
      operationId: internalWebhookDeliveries
      security:
        - ibIntBearer: []
      parameters:
        - name: page
          in: query
          required: false
          description: 页码（默认 1）
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 页大小（默认 20，服务端夹紧上限）
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: status
          in: query
          required: false
          description: 按投递状态过滤
          schema:
            type: string
      x-imboy-scope: webhooks:manage
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      responses:
        '200':
          description: 投递列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        delivery_id:
                          type: string
                        event_type:
                          type: string
                        status:
                          type: string
                          description: 如 pending/retry/success/dead
                        attempt_count:
                          type: integer
                        correlation_id:
                          type:
                            - string
                            - 'null'
                  summary:
                    type: object
                    description: 投递健康度摘要
                    properties:
                      status_counts:
                        type: object
                        description: 各状态计数
                      dead_letter_count:
                        type: integer
                      success_count:
                        type: integer
                      success_rate:
                        type:
                          - number
                          - 'null'
                        description: success/(success+dead)；无已终结投递时 null
                      in_flight_count:
                        type: integer
                        description: pending+retry
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/webhook/deliveries/{delivery_id}/replay:
    post:
      tags:
        - internal
      summary: 重放失败的 Webhook 投递
      description: |
        按 delivery_id 重放（失败投递可重放；重放产生新 delivery 行，幂等键由
        平台侧派生，在途重放由唯一索引仲裁为 idempotency_conflict）。
      operationId: internalWebhookReplay
      security:
        - ibIntBearer: []
      parameters:
        - name: delivery_id
          in: path
          required: true
          description: 投递 ID（INT-23 列表中的 delivery_id）
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键（平台对 replay 派生专用幂等资源；可不传）
          schema:
            type: string
      x-imboy-scope: webhooks:manage
      x-imboy-rate-bucket: internal_write
      x-imboy-idempotency: platform_derived
      responses:
        '200':
          description: 重放受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayed:
                    type: boolean
                    enum:
                      - true
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '409':
          $ref: '#/components/responses/idempotency_conflict'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
  /api/internal/v1/oa/sso/exchange:
    post:
      tags:
        - internal
      summary: OA SSO 一次性 code 原子交换
      description: |
        一个 code 只能成功交换一次（single_use_code），重放即失败——不存在
        「二次成功」。code TTL 60 秒。成功 payload 永不含 IMBoy 凭证（R-6）；
        TSID 以 JSON integer 输出（INV-8）。独立限流桶 internal_sso。
      operationId: internalOaSsoExchange
      security:
        - ibIntBearer: []
      x-imboy-scope: sso:exchange
      x-imboy-rate-bucket: internal_sso
      x-imboy-idempotency: single_use_code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - redirect_uri
                - nonce
              properties:
                code:
                  type: string
                  description: OA 流程签发的一次性 code（前缀 oa_sso_，TTL 60s）
                redirect_uri:
                  type: string
                  description: 签发时绑定的 redirect URI（须匹配）
                nonce:
                  type: string
                  description: 签发时携带的 nonce（须匹配）
      responses:
        '200':
          description: 交换成功（登录态建立所需的平台侧事实）
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type: integer
                    format: int64
                  application_id:
                    type: integer
                    format: int64
                  user_id:
                    type: integer
                    format: int64
                    description: 平台用户 TSID
                  external_user_id:
                    type: string
                    description: OA 侧标识
                  consumed_at:
                    type: string
                    description: 消费时间（ISO-8601 UTC 毫秒）
        '400':
          $ref: '#/components/responses/invalid_request'
        '401':
          $ref: '#/components/responses/invalid_credential'
        '403':
          $ref: '#/components/responses/insufficient_scope'
        '404':
          $ref: '#/components/responses/resource_not_found'
        '422':
          $ref: '#/components/responses/identity_not_mapped'
        '429':
          $ref: '#/components/responses/rate_limited'
        '500':
          $ref: '#/components/responses/internal_error'
components:
  securitySchemes:
    ibIntBearer:
      type: http
      scheme: bearer
      bearerFormat: ib_int_<application_id>.<secret>
      description: |
        企业集成凭证：与单个企业应用一一对应，授权范围 = 签发时授予的
        scope 集合（固定 10 枚举、无通配）。secret 平台侧只存不可逆摘要，
        泄露即轮换；应用停用/归档后所有请求返回 application_disabled（403）。
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 机器可读稳定错误码（snake_case，长期稳定，勿按 message 做逻辑）
              enum:
                - invalid_request
                - invalid_credential
                - credential_expired
                - application_disabled
                - organization_disabled
                - insufficient_scope
                - organization_boundary_violation
                - resource_not_found
                - idempotency_conflict
                - identity_not_mapped
                - rate_limited
                - security_gate_closed
                - internal_error
            message:
              type: string
              description: 人类可读说明（文案不保证稳定）
  responses:
    invalid_credential:
      description: 凭证缺失/格式错/不存在的 locator
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - invalid_credential
    application_disabled:
      description: 应用被停用/归档
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - application_disabled
    rate_limited:
      description: 触发限流（fail-closed）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - rate_limited
    internal_error:
      description: 内部错误（安全兜底：未列入稳定表的码一律收敛为此值）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - internal_error
    security_gate_closed:
      description: 平台安全闸关闭（暂时拒绝服务）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - security_gate_closed
    invalid_request:
      description: 请求参数/形状非法
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - invalid_request
    insufficient_scope:
      description: 凭证未被授予所需 scope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - insufficient_scope
    idempotency_conflict:
      description: Idempotency-Key 与既有请求冲突
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - idempotency_conflict
    identity_not_mapped:
      description: 目标用户未做身份映射
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - identity_not_mapped
    resource_not_found:
      description: 资源不存在或不属于本组织（不区分「不存在」与「不归你」）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
            properties:
              error:
                properties:
                  code:
                    enum:
                      - resource_not_found
