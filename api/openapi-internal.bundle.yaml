                    - string
                    - 'null'
                    description: 留存截止（ISO-8601；未设置 null）
                  hold_state:
                    type: string
                  purge_state:
                    type: string
                  purged:
                    type: boolean
                  retention_days:
                    type:
                    - integer
                    - 'null'
                    description: set_retention 时回显
