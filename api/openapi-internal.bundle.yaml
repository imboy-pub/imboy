        - internal
      summary: 确认企业附件入库（HEAD/size/hash/scope 校验）
      description: |
        直传完成后的确认：服务端以 HEAD 真实值复核大小与 MIME（超限/非法类型对象
        被删除），登记 attachment 行并建立治理行。object_key 必须是本 org/app 域
        且已 presign 登记的对象。
      operationId: internalFileConfirm
      security:
        - ibIntBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键
          schema:
            type: string
