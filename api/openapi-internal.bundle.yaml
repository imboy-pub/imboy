      default: api.imboy.app
      description: 生产 API 域名占位；自托管/私有部署需改为对应域名
- url: http://127.0.0.1:{devPort}
  description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
  variables:
    devPort:
      default: '9800'
      description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖
tags:
- name: internal
  description: 企业集成 Internal API（ib_int 凭证；scope/限流/幂等见各端点扩展字段）
security:
- ibIntBearer: []
paths:
  /api/internal/v1/application:
    get:
      tags:
      - internal
      summary: 读取本应用信息（健康检查与联调首选）
      description: |
        返回本应用元数据、本次凭证的授权 scope 与凭证清单。字段实证自
        `enterprise_application_handler:self_payload/2`：application/credentials
        为平台行数据的 binary 键透出（最小字段集，不含 secret）。
      operationId: internalApplicationSelf
      x-imboy-scope: application:read
      x-imboy-rate-bucket: internal_read
      x-imboy-idempotency: not_required
      responses:
        '200':
          description: 应用自检信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type: integer
                    format: int64
                    description: 所属组织 TSID
                  application_id:
                    type: integer
                    format: int64
                    description: 应用 TSID
                  credential_id:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    description: 本次凭证 ID（无凭证上下文时 null）
                  application_key:
                    type:
                    - string
                    - 'null'
                    description: 应用 key
                  application:
                    type: object
                    description: 应用行元数据（binary 键透出）
                  granted_scopes:
                    type: array
                    items:
                      type: string
                    description: 本次凭证被授予的 scope 集合
                  credentials:
                    type: array
                    items:
                      type: object
                    description: 凭证清单（不含 secret）
        '401':
          description: 凭证缺失/格式错/不存在的 locator
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: object
                      required:
                      - code
                      - message
                      properties:
                        code:
                          type: string
                          description: 机器可读稳定错误码（snake_case，长期稳定，勿按 message 做逻辑）
                          enum:
                          - invalid_request
                          - invalid_credential
                          - credential_expired
                          - application_disabled
                          - organization_disabled
                          - insufficient_scope
                          - organization_boundary_violation
                          - resource_not_found
                          - idempotency_conflict
                          - identity_not_mapped
