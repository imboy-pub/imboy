# POST /friend/reject — 拒绝好友申请 / Reject friend request
# Handler: src/api/friend_handler.erl#reject/2
post:
  tags: [user]
  summary: 拒绝好友申请
  description: |
    拒绝收到的好友申请。需提供申请人 ID。
  operationId: rejectFriend
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [from]
          properties:
            from: { type: integer, description: '申请人 uid / Requester UID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 未鉴权
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
