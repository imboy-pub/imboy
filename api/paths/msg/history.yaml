# ----------------------------------------------------------------------------
# imboy/api/paths/msg/history.yaml
# GET /msg/history — 按 conv_seq 游标拉取历史消息 / Fetch history by cursor
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 4 / B)
# 调用方：api/openapi.yaml#/paths/~1msg~1history
# Handler：src/api/msg_handler.erl#history/1
# 修订：参数与代码对齐（chat_type/peer_id/after_seq/limit）
# ----------------------------------------------------------------------------
get:
  tags: [msg]
  summary: 按 conv_seq 游标拉取历史消息
  description: |
    IMBoy 消息永久存储使用 `conv_seq` 游标（per-conversation 单调递增）保证严格顺序。
    客户端持久化 `last_conv_seq`，每次请求传入以拉取增量。
  operationId: getMsgHistory
  parameters:
    - in: query
      name: chat_type
      required: true
      schema: { type: string, enum: [c2c, c2g] }
      description: 会话类型 / Conversation type
    - in: query
      name: peer_id
      required: true
      schema: { type: string }
      description: 对端 ID（C2C 为对方 uid，C2G 为 group_id）/ Peer ID
    - in: query
      name: after_seq
      required: false
      schema: { type: integer, minimum: 0 }
      description: "游标：从该 conv_seq 之后拉取 / Cursor: fetch after this seq"
    - in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: 单次拉取条数 / Batch size
  responses:
    '200':
      description: 增量消息数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: array
                    items:
                      $ref: '../../components/schemas/Message.yaml'
    '4XX':
      description: 未鉴权（401）、参数非法或调用方无权访问该会话（403）
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
