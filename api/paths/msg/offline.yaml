# ----------------------------------------------------------------------------
# imboy/api/paths/msg/offline.yaml
# POST /api/msg/offline — 拉取离线消息 / Fetch offline messages
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 13 / D-msg)
# 调用方:  api/openapi.yaml#/paths/~1msg~1offline
# Handler: src/api/msg_handler.erl#offline/2 → messaging_logic:offline/2
# 修订(Q32)：参数从 query 改为 requestBody（POST body），limit 默认值改为 1000
# 修订(响应层)：payload 按 c2c/c2g/s2c 分桶，每桶 {list,total,has_more,next_last_msg_at}
#   桶结构完全内联（path 文件内不可定义 components，避免 bundle 时 $ref 断裂）
# ----------------------------------------------------------------------------
post:
  tags: [msg]
  summary: 客户端上线后拉取离线消息
  description: |
    ## 中文
    客户端上线后调用，按 C2C / C2G / S2C 三类拉取自上次 ACK 后服务端为
    当前 uid 累积的离线消息。
    投递语义：服务端把消息标记为"已投递但待 ACK"，客户端收到后必须调用
    `/msg/offline_ack` 显式确认；超时未 ACK 会按 2s/5s/7s/11s 重投递。
    详见 docs/architecture/overview.md#消息 QoS 投递。
    ## English
    Called by the client after coming online to fetch offline messages
    accumulated by the server for the current uid, bucketed into C2C /
    C2G / S2C. The server marks them as "delivered, awaiting ACK"; the
    client MUST follow up with `/msg/offline_ack` or the messages will
    be re-delivered (2s/5s/7s/11s back-off).
  operationId: getOfflineMessages
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 2000
              default: 1000
              description: 每类离线消息拉取上限 / Per-bucket limit
            c2c_last_msg_at:
              type: integer
              description: C2C 离线消息起始时间戳（毫秒）/ C2C cursor
            c2g_last_msg_at:
              type: integer
              description: C2G 离线消息起始时间戳（毫秒）/ C2G cursor
            s2c_last_msg_at:
              type: integer
              description: S2C 离线消息起始时间戳（毫秒）/ S2C cursor
  responses:
    '200':
      description: "离线消息桶 { c2c: {...}, c2g: {...}, s2c: {...} }"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 按类型分桶的离线消息（每桶结构相同）/ Offline messages bucketed by type
                    properties:
                      c2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
                      c2g:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
                      s2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
    '4XX':
      description: 未鉴权
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
