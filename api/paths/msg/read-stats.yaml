# ----------------------------------------------------------------------------
# imboy/api/paths/msg/read-stats.yaml
# GET /v1/msg/read_stats — 群消息已读统计 / Group message read stats
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 13 / D-msg)
# 调用方:  api/openapi.yaml#/paths/~1v1~1msg~1read_stats
# Handler: src/api/msg_handler.erl#read_stats/2 → messaging_logic:read_stats/2
# ----------------------------------------------------------------------------
get:
  tags: [msg]
  summary: 群消息的已读 / 总人数统计
  description: |
    ## 中文
    返回指定群消息的已读人数与群总人数，用于 UI 渲染"已读 N/M"提示。
    仅对发送方可见。
    ## English
    Return read-count and total-member-count for a group message, for
    rendering the "Read N/M" indicator. Only visible to the sender.
  operationId: msgReadStats
  parameters:
    - in: query
      name: msg_id
      required: true
      schema: { type: string }
      description: 群消息 TSID / Group message TSID.
  responses:
    '200':
      description: 统计 { read_count, total_count }
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: msg_id 缺失或非法 / 调用方非发送者 / 消息不存在
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
