# GET /api/adm/project/detail — 项目详情（Admin 治理只读，W0）
get:
  tags: [admin]
  summary: Admin 项目详情
  description: |
    ## 中文
    管理后台项目详情：基本信息 + Owner + 成员分页预览 + 关联资源清单
    （projects/groups/channels 的 id 归一）。workspaces:read ACL。
    ## English
    Admin project detail: base info + owner + member preview + linked resources.
  operationId: admProjectDetail
  parameters:
    - name: project_id
      in: query
      required: true
      schema: { type: integer, format: int64 }
  responses:
    '200':
      description: 项目详情
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
    '4XX':
      description: project_id 缺失（400）/ ACL（403）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
