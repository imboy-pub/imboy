# GET /api/adm/project/aggregations — 项目聚合（Admin 治理只读，W2）
get:
  tags: [admin]
  summary: Admin 项目聚合（type 分派）
  description: |
    ## 中文
    W2 治理只读面：按 type 分派的聚合查询（pinned / resources / activity /
    related_posts 等），对 resources / related_posts 无分页语义的同型包装。
    workspaces:read ACL，fail-closed。
    ## English
    W2 governance read surface: type-dispatched aggregation wrapper.
  operationId: admProjectAggregations
  parameters:
    - name: project_id
      in: query
      required: true
      schema: { type: integer, format: int64 }
    - name: type
      in: query
      schema: { type: string, enum: [pinned, resources, activity, related_posts], default: pinned }
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: size
      in: query
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: 聚合结果
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
    '4XX':
      description: 参数缺失（400）/ ACL（403）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
