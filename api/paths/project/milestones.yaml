# /api/v1/projects/{project_id}/milestones — 里程碑创建(POST)/列表(GET)（W2 ZC-03）
post:
  tags: [project]
  summary: 创建里程碑
  description: |
    ## 中文
    在项目下创建里程碑（name + 可选 due_date）。Owner / active 项目成员可创建；
    Guest 403；工作区归档 980。请求体携带 status 会被拒绝（状态由 reach 单向推进）。
    成功后写 project_event=milestone_created；返回事务内取到的完整里程碑行。
    ## English
    Create a milestone under the project. Passing `status` in the body is
    rejected — status only moves forward via reach.
  operationId: projectMilestonesCreate
  parameters:
    - name: project_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name]
          properties:
            name:
              type: string
              maxLength: 255
            due_date:
              type: string
              format: date
              description: YYYY-MM-DD；缺省为无截止日
  responses:
    '200':
      description: 创建成功（返回完整里程碑行）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      workspace_id: { type: integer, format: int64 }
                      project_id: { type: integer, format: int64 }
                      name: { type: string }
                      due_date: { type: [string, "null"], format: date }
                      status: { type: string, enum: [planned, reached] }
                      reached_at: { type: [string, "null"] }
                      created_at: { type: string }
                      updated_at: { type: string }
    '4XX':
      description: name 缺失（400）/ Guest（403）/ 归档（980）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
get:
  tags: [project]
  summary: 里程碑列表（分页，status 过滤）
  description: |
    ## 中文
    项目里程碑分页列表，可按 status（planned/reached）过滤。
    active 工作区成员且项目成员可读。
    ## English
    Paginated milestone list with optional status filter.
  operationId: projectMilestonesList
  parameters:
    - name: project_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    - name: status
      in: query
      schema: { type: string, enum: [planned, reached] }
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: size
      in: query
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: 里程碑分页（list 元素见 milestones POST 的 payload 行结构）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { type: object }
                      page: { type: integer }
                      size: { type: integer }
                      total: { type: integer }
                      total_page: { type: integer }
    '4XX':
      description: 无权限（403）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
