# POST /api/v1/billing/cancel — 取消订阅
post:
  tags: [user]
  summary: 取消订阅
  description: |
    取消指定订阅（周期结束前仍有效，之后不再续费）。

    **归属校验（fail-closed）**：须登录且 `subscription_id` 归属当前用户，
    否则 HTTP 仍为 200，信封 `code`=403 —— 未登录 msg「未登录」；
    订阅不存在 / 无主（owner_uid=0）/ 非本人一律 msg「无权操作该订阅」
    （不区分「不存在」与「非本人」，避免枚举他人订阅 id）。
    （src/api/billing_handler.erl:293-307、src/logic/billing_logic.erl:208）

  operationId: billingCancel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [subscription_id]
          properties:
            subscription_id: { type: integer, format: int64, description: 订阅 ID }
  responses:
    '200':
      description: 取消成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      subscription_id: { type: integer, format: int64 }
    '4XX':
      description: 订阅 id 不合法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
