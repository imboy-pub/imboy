# GET /api/v1/billing/invoice/list — 账单列表
get:
  tags: [user]
  summary: 账单列表
  description: |
    查询指定订阅的账单列表。

    **归属校验（fail-closed）**：须登录且 `subscription_id` 归属当前用户，
    否则 HTTP 仍为 200，信封 `code`=403 —— 未登录 msg「未登录」；
    订阅不存在 / 无主（owner_uid=0）/ 非本人一律 msg「无权操作该订阅」
    （不区分「不存在」与「非本人」，避免枚举他人订阅 id）。
    （src/api/billing_handler.erl:293-307、src/logic/billing_logic.erl:208）

  operationId: billingInvoiceList
  parameters:
    - name: subscription_id
      in: query
      required: true
      schema: { type: integer }
      description: 订阅 ID
  responses:
    '200':
      description: 账单列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            invoice_no: { type: string }
                            subscription_id: { type: integer, format: int64 }
                            amount: { type: integer, description: 金额（分） }
                            status: { type: string, description: 'pending | paid | void' }
                            created_at: { type: integer, description: 毫秒 }
    '4XX':
      description: 订阅 id 不合法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
