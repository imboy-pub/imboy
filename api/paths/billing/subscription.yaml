# GET /api/v1/billing/subscription — 查询当前租户订阅
get:
  tags: [user]
  summary: 查询当前订阅
  description: 查询指定租户当前的订阅状态。
  operationId: billingSubscription
  parameters:
    - name: tenant_id
      in: query
      required: false
      schema: { type: integer, default: 0 }
      description: 租户 ID（默认 0，单租户）
  responses:
    '200':
      description: 订阅详情（无订阅时为空对象）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 订阅对象（无订阅时字段为空）
                    properties:
                      id: { type: integer, format: int64 }
                      plan_id: { type: integer, format: int64 }
                      status: { type: string, description: 'active | canceled | expired' }
                      current_period_start_ms: { type: integer }
                      current_period_end_ms: { type: integer }
    '4XX':
      description: 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
