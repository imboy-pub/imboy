# POST /api/v1/billing/invoice/generate — 生成账单
post:
  tags: [user]
  summary: 生成账单
  description: |
    为指定订阅生成当期账单。若当期已生成则返回 already_generated=true。

    **归属校验（fail-closed）**：须登录且 `subscription_id` 归属当前用户，
    否则 HTTP 仍为 200，信封 `code`=403 —— 未登录 msg「未登录」；
    订阅不存在 / 无主（owner_uid=0）/ 非本人一律 msg「无权操作该订阅」
    （不区分「不存在」与「非本人」，避免枚举他人订阅 id）。
    （src/api/billing_handler.erl:293-307、src/logic/billing_logic.erl:208）

  operationId: billingInvoiceGenerate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [subscription_id]
          properties:
            subscription_id: { type: integer, format: int64 }
  responses:
    '200':
      description: 生成结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      invoice_id: { type: integer, format: int64 }
                      already_generated: { type: boolean, description: 当期已生成时为 true，此时无 invoice_id }
    '4XX':
      description: 订阅 id 不合法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
