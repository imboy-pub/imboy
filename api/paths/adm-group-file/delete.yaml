# POST /api/adm/group/file/delete — admin
post:
  tags: [admin]
  summary: 管理后台删除群文件
  description: 管理员删除指定群文件（软删除）。Delete a group file by admin (soft delete).
  operationId: adm_group_file_delete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [file_id]
          properties:
            file_id: { type: string, description: 'TSID 格式文件 ID / File ID in TSID string format' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
