# POST /v1/group/category/delete
post:
  tags: [user]
  summary: 删除群分组
  description: |
    ## 中文 / English
    删除群分组
    Delete group category
  operationId: deleteGroupCategory
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 删除成功；无 payload
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 空对象，无实质 payload.
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
