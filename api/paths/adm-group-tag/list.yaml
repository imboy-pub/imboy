# GET /adm/group/tag/list — admin
get:
  tags: [admin]
  summary: 管理后台群标签列表
  operationId: adm_group_tag_list
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: integer }
      description: 群 ID
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
