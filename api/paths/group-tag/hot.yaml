# GET /v1/group/tag/hot
get:
  tags: [user]
  summary: 热门群标签 TopN
  description: |
    ## 中文 / English
    热门群标签 TopN
    Hot tags TopN
  operationId: hotGroupTag
  parameters:
    - in: query
      name: limit
      required: false
      description: 每页条数 / Page size
      schema: { type: integer, default: 20, maximum: 100 }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            tag_name:
                              type: string
                            use_count:
                              type: integer
                              description: 使用该标签的群数量
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
