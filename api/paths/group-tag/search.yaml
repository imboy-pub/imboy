# GET /api/v1/group/tag/search
get:
  tags: [user]
  summary: 搜索带某标签的群
  description: |
    ## 中文 / English
    搜索带某标签的群
    Search groups by tag
  operationId: searchGroupByTag
  parameters:
    - in: query
      name: tag_name
      required: true
      description: 标签名称 / Tag name
      schema: { type: string }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 带该标签的群组列表
                        items:
                          type: object
                          properties:
                            gid:
                              type: integer
                              format: int64
                            group_name:
                              type: string
                            avatar:
                              type: string
                            member_count:
                              type: integer
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
