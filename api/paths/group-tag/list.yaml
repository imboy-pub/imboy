# GET /v1/group/tag/list
get:
  tags: [user]
  summary: 群当前标签列表
  description: |
    ## 中文 / English
    群当前标签列表
    List tags of a group
  operationId: listGroupTag
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
