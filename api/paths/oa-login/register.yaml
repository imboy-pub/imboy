post:
  tags:
  - oa-login
  summary: OA 入站登录 register
  description: 仅 login 意图可新建，须显式 confirm_create=true。创建、关联、投影、审计和消费同事务；可信来源
    或人员状态尚未就绪时仍可登录并返回 projection_pending=true，不自动扩权。
  operationId: oaLoginRegister
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - application_key
          - code_verifier
          - did
          - pending_token
          - confirm_create
          properties:
            application_key:
              type: string
              description: 发起端本地保存的预期应用键，不得从回调替换
            code_verifier:
              type: string
              minLength: 43
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            did:
              type: string
              minLength: 1
              maxLength: 40
              description: UTF-8 最多 40 字节；pending 与 Human JWT 必须同一 DID
            pending_token:
              type: string
              minLength: 43
              maxLength: 43
              pattern: ^[A-Za-z0-9_-]+$
            cos:
              type: string
            dname:
              type: string
            dvsn:
              type: string
            confirm_create:
              type: boolean
              enum:
              - true
  responses:
    '200':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 0
              msg:
                type: string
              sv_ts:
                type: integer
                format: int64
              payload:
                type: object
                required:
                - id
                - uid
                - user_id
                - projection_pending
                - token
                - refreshtoken
                properties:
                  id:
                    type: integer
                    format: int64
                  uid:
                    type: integer
                    format: int64
                  user_id:
                    type: integer
                    format: int64
                  projection_pending:
                    type: boolean
                  token:
                    type: string
                  refreshtoken:
                    type: string
    '400':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 400
              msg:
                type: string
                enum:
                - invalid_request
                - explicit_confirmation_required
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '401':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 401
              msg:
                type: string
                enum:
                - invalid_ticket
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '403':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 403
              msg:
                type: string
                enum:
                - organization_boundary_violation
                - account_not_active
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '409':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 409
              msg:
                type: string
                enum:
                - identity_conflict
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '500':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 500
              msg:
                type: string
                enum:
                - internal_error
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '402':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 402
              msg:
                type: string
                enum:
                - account_quota_exceeded
              sv_ts:
                type: integer
                format: int64
              payload: {}
