post:
  tags:
  - oa-login
  summary: OA 入站登录 exchange
  description: 已关联 login 复用原账号并返回设备会话；未关联或 link 意图仅返回 pending_token。issued 60 秒有效；pending
    300 秒完成窗口，同一 verifier/DID，重试不续期。
  operationId: oaLoginExchange
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - application_key
          - code_verifier
          - did
          - ticket
          properties:
            application_key:
              type: string
              description: 发起端本地保存的预期应用键，不得从回调替换
            code_verifier:
              type: string
              minLength: 43
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            did:
              type: string
              minLength: 1
              maxLength: 40
              description: UTF-8 最多 40 字节；pending 与 Human JWT 必须同一 DID
            ticket: &id001
              type: string
              minLength: 43
              maxLength: 43
              pattern: ^[A-Za-z0-9_-]+$
            cos:
              type: string
            dname:
              type: string
            dvsn:
              type: string
  responses:
    '200':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 0
              msg:
                type: string
              sv_ts:
                type: integer
                format: int64
              payload:
                oneOf:
                - type: object
                  required:
                  - id
                  - uid
                  - user_id
                  - projection_pending
                  - token
                  - refreshtoken
                  properties:
                    id:
                      type: integer
                      format: int64
                    uid:
                      type: integer
                      format: int64
                    user_id:
                      type: integer
                      format: int64
                    projection_pending:
                      type: boolean
                    token:
                      type: string
                    refreshtoken:
                      type: string
                - type: object
                  required:
                  - pending_token
                  - requires_account_choice
                  - expires_in
                  properties:
                    pending_token: *id001
                    requires_account_choice:
                      type: boolean
                      enum:
                      - true
                    expires_in:
                      type: integer
                      enum:
                      - 300
    '400':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 400
              msg:
                type: string
                enum:
                - invalid_request
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '401':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 401
              msg:
                type: string
                enum:
                - invalid_ticket
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '403':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 403
              msg:
                type: string
                enum:
                - insufficient_scope
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '409':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 409
              msg:
                type: string
                enum:
                - identity_conflict
              sv_ts:
                type: integer
                format: int64
              payload: {}
    '500':
      description: 响应
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - sv_ts
            - payload
            properties:
              code:
                type: integer
                enum:
                - 500
              msg:
                type: string
                enum:
                - internal_error
              sv_ts:
                type: integer
                format: int64
              payload: {}
