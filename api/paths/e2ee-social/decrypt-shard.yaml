# POST /v1/e2ee/social/decrypt_shard
post:
  tags: [user]
  summary: 获取待解密的加密 shard（客户端本地解密）
  description: |
    ## 中文 / English
    零信任：服务端按 shard_id 返回加密分片，代理客户端用本地私钥解密后回传明文分片；服务端不接触私钥。
    Zero-trust: server returns the encrypted shard by shard_id; the proxy client decrypts locally.
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeSocialDecryptShard
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [shard_id]
          properties:
            shard_id:
              type: string
              description: 需要联系人解密的 shard ID
            ciphertext:
              type: string
              x-not-implemented: true
              description: 加密密文（x-not-implemented：当前后端未读取此字段）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [encrypted_shard]
                    properties:
                      encrypted_shard:
                        type: string
                        description: |
                          零信任：服务端仅返回加密分片，由代理客户端用本地私钥解密后回传明文分片。
                          Zero-trust: server returns the encrypted shard only; the proxy client decrypts it locally with its own private key.
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
