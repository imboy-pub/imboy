# POST /v1/e2ee/social/decrypt_shard
post:
  tags: [user]
  summary: 请求联系人解密 shard
  description: |
    ## 中文 / English
    请求联系人解密 shard
    See doc/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeSocialDecryptShard
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            shard_id: { type: string }
            ciphertext: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
