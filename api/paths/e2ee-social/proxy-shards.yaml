# GET /v1/e2ee/social/proxy_shards
get:
  tags: [user]
  summary: 代理 shards 查询
  description: |
    ## 中文 / English
    代理 shards 查询
    See docs/api/e2ee_*.md for crypto invariants.
  operationId: e2eeSocialProxyShards
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [shards]
                    properties:
                      shards:
                        type: array
                        description: 当前用户作为代理保管的分片列表 / Shards held by current user as proxy
                        items:
                          type: object
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
