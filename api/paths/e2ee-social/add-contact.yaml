# POST /v1/e2ee/social/contacts/add
post:
  tags: [user]
  summary: 添加恢复联系人
  description: |
    ## 中文 / English
    添加恢复联系人
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeSocialAddContact
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [contact_uid]
          properties:
            contact_uid:
              type: string
              description: 被添加为恢复联系人的用户 UID
            nickname:
              type: string
              description: 联系人昵称（可选，客户端本地展示用）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: 添加可信联系人成功
                        description: 操作结果描述 / Operation result message
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
