# GET /location/peopleNearby
get:
  tags: [user]
  summary: 附近的人列表
  description: |
    ## 中文 / English
    附近的人列表
  operationId: locationPeopleNearby
  parameters:
    - in: query
      name: longitude
      required: true
      schema: { type: number, format: float }
    - in: query
      name: latitude
      required: true
      schema: { type: number, format: float }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
