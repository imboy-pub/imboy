# GET /adm/group/category/list — admin
get:
  tags: [admin]
  summary: 管理后台群分类列表
  description: 分页获取指定群的分类列表，支持关键词搜索（管理员视角）。List group categories with pagination and keyword search (admin view).
  operationId: adm_group_category_list
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: integer }
      description: 群 ID
    - in: query
      name: uid
      required: true
      schema: { type: string }
      description: 用户 ID
    - in: query
      name: keyword
      required: false
      schema: { type: string }
      description: 搜索关键词
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { type: object, additionalProperties: true, description: '记录对象（字段以对应表/handler 为准）' }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
