# GET /adm/group/category/list — admin
get:
  tags: [admin]
  summary: 管理后台群分类列表
  operationId: adm_group_category_list
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: integer }
      description: 群 ID
    - in: query
      name: uid
      required: true
      schema: { type: string }
      description: 用户 ID
    - in: query
      name: keyword
      required: false
      schema: { type: string }
      description: 搜索关键词
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
