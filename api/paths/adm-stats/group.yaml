# GET /adm/stats/group — admin
get:
  tags: [admin]
  summary: admin adm-stats - group
  description: |
    ## 中文 / English
    管理后台 adm-stats handler 的 `group` 动作；路径 `/adm/stats/group`。
    Admin handler `adm-stats`, action `group`. Path `/adm/stats/group`.
  operationId: adm_stats_group
  parameters:
    - name: days
      in: query
      required: false
      schema:
        type: integer
        default: 7
      description: '统计天数 / Number of days to aggregate'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      daily_new:
                        type: array
                        description: 每日新建群组趋势（近 days 天）
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
                      public_groups:
                        type: integer
                        description: 公开群数量（type=1）
                      private_groups:
                        type: integer
                        description: 私密群数量（type=2）
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
