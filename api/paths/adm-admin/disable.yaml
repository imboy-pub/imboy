# POST /adm/admin/disable — admin
post:
  tags: [admin]
  summary: 管理后台禁用管理员
  operationId: adm_admin_disable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [admin_id, uid]
          properties:
            admin_id: { type: integer, description: '操作者管理员 ID' }
            uid: { type: integer, description: '被禁用的管理员 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
