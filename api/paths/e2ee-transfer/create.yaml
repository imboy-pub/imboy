# POST /v1/e2ee/transfer/create
post:
  tags: [user]
  summary: 新设备 - 创建迁移会话
  description: |
    ## 中文 / English
    新设备 - 创建迁移会话
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeTransferCreate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [to_uid, from_device_id, encrypted_key_bundle]
          properties:
            to_uid:
              type: integer
              description: 目标用户 UID（接收迁移邀请的账户）
            from_device_id:
              type: string
              description: 发送方设备 ID / Sender device id
            encrypted_key_bundle:
              type: string
              description: |
                零信任：发送方客户端用接收方公钥加密自身私钥后的密文，服务端仅存储/中转，不接触明文私钥。
                Sender's private key encrypted with the receiver's public key on the client; server only stores/relays ciphertext.
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [session_id, expires_at]
                    properties:
                      session_id:
                        type: string
                        description: 新创建的迁移会话 UUID / Newly created transfer session UUID
                      expires_at:
                        type: integer
                        description: 会话过期时间（Unix 秒）/ Session expiry as Unix timestamp
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
