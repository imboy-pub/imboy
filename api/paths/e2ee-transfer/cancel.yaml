# POST /api/v1/e2ee/transfer/cancel
post:
  tags: [user]
  summary: 取消迁移会话
  description: |
    ## 中文 / English
    取消迁移会话
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeTransferCancel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [session_id]
          properties:
            session_id:
              type: string
              description: 迁移会话 ID
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: 已取消传输
                        description: 操作结果描述 / Operation result message
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
