# GET /v1/group/file/download
get:
  tags: [user]
  summary: 下载 / 取 URL
  description: |
    ## 中文 / English
    下载 / 取 URL
    Download / get URL
  operationId: downloadGroupFile
  parameters:
    - in: query
      name: file_id
      required: true
      description: 文件 ID / File ID
      schema: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 302 重定向到文件 URL（handler 直接调用 cowboy_req:reply(302)，无 JSON payload）
      headers:
        Location:
          schema:
            type: string
            format: uri
          description: 文件直链 URL
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
