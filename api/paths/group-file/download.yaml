# GET /v1/group/file/download
get:
  tags: [user]
  summary: 下载 / 取 URL
  description: |
    ## 中文 / English
    下载 / 取 URL
    Download / get URL
  operationId: downloadGroupFile
  parameters:
    - in: query
      name: file_id
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
