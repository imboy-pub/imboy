# GET /v1/group/file/search
get:
  tags: [user]
  summary: 群文件搜索
  description: |
    ## 中文 / English
    群文件搜索
    Search group files
  operationId: searchGroupFile
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: string }
    - in: query
      name: keyword
      required: true
      schema: { type: string }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
