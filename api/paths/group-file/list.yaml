# GET /v1/group/file/list
get:
  tags: [user]
  summary: 群文件列表（含分页/分类过滤）
  description: |
    ## 中文 / English
    群文件列表（含分页/分类过滤）
    List group files
  operationId: listGroupFile
  parameters:
    - in: query
      name: gid
      required: true
      description: 群组 ID / Group ID
      schema: { type: string }
    - in: query
      name: category
      required: false
      description: 文件分类过滤（如 document/image/video）/ File category filter
      schema: { type: string }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: group_file_logic:list 返回的分页对象
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            file_id:
                              type: integer
                              format: int64
                            gid:
                              type: integer
                              format: int64
                            uploader_id:
                              type: integer
                              format: int64
                            file_name:
                              type: string
                            file_size:
                              type: integer
                              description: 文件大小（字节）
                            file_type:
                              type: string
                              description: MIME 类型
                            category:
                              type: string
                            file_url:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
