# ----------------------------------------------------------------------------
# imboy/api/paths/friend-denylist/add.yaml
# POST /friend/denylist/add — 添加黑名单 / Add to denylist
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 10 / D-user-denylist)
# 调用方:  api/openapi.yaml#/paths/~1friend~1denylist~1add
# Handler: src/api/user_denylist_handler.erl#add/2 → user_denylist_logic:add/2
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 把某用户加入黑名单
  description: |
    ## 中文
    把指定 denied_user_id 拉入当前用户的黑名单。
    副作用：拒收对方后续消息、若为好友会**保留好友关系**但屏蔽其 moments
    与 presence；返回 payload 含 (user_id, denied_user_id, created_at)。
    幂等：已在黑名单中再次添加只更新 created_at。
    ## English
    Add the target user (`denied_user_id`) to the current user's
    denylist. Future messages from the target are silently dropped.
    Existing friendship is preserved but moments / presence are hidden.
    Idempotent — re-adding only refreshes `created_at`.
  operationId: addDenylist
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [denied_user_id]
          properties:
            denied_user_id:
              type: string
              description: 目标用户 TSID（字符串形式）/ Target user TSID (string).
  responses:
    '200':
      description: 加入成功；payload 含 user_id / denied_user_id / created_at
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 来源 user_denylist_handler#add → user_denylist_logic:add
                    properties:
                      user_id: { type: integer, format: int64, description: 操作者 TSID }
                      denied_user_id: { type: integer, format: int64, description: 被拉黑用户 TSID }
                      created_at: { type: integer, description: 时间戳（毫秒） }
    '4XX':
      description: denied_user_id 缺失或非法 / 不能拉黑自己
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
