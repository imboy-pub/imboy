# GET /api/adm — admin
get:
  tags: [admin]
  summary: admin adm-index - index
  description: |
    ## 中文 / English
    管理后台 adm-index handler 的 `index` 动作；路径 `/adm`。
    Admin handler `adm-index`, action `index`. Path `/adm`.
  operationId: adm_index_index
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      coversation_online_user:
                        type: integer
                        description: 当前在线用户数
                      coversation_online_device:
                        type: integer
                        description: 当前在线设备数
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
