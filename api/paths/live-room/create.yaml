# POST /v1/live_room/create
post:
  tags: [user]
  summary: 创建直播间
  description: |
    ## 中文 / English
    创建直播间
  operationId: liveRoomCreate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title: { type: string }
            cover: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
