# POST /api/v1/live_room/create
post:
  tags: [user]
  summary: 创建直播间
  description: |
    ## 中文 / English
    创建直播间
  operationId: liveRoomCreate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title: { type: string }
            cover: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 新建的直播间对象
                    properties:
                      id: { type: integer, format: int64, description: 直播间 TSID }
                      user_id: { type: integer, format: int64, description: 房主 uid }
                      title: { type: string }
                      cover: { type: string }
                      status: { type: integer, description: 直播间状态 }
                      stream_key: { type: string, description: 推流密钥 }
                      created_at: { type: integer, format: int64 }
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
