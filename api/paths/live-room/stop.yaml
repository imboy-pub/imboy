# POST /v1/live_room/stop
post:
  tags: [user]
  summary: 结束直播
  description: |
    ## 中文 / English
    结束直播
  operationId: liveRoomStop
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            room_id: { type: integer }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
