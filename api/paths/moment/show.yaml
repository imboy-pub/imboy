# ----------------------------------------------------------------------------
# imboy/api/paths/moment/show.yaml
# GET /api/v1/moment/{moment_id} — 查看动态 / Show moment
# Handler: src/api/moment_handler.erl#show/2 → moment_logic:get_post/2
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 查看单条动态详情
  description: |
    ## 中文 / English
    按 moment_id 返回动态详情；服务端按可见性 + denylist + 好友关系决定
    是否允许查看。
    Return moment detail by id; server enforces visibility + denylist +
    friendship checks.
  operationId: showMoment
  parameters:
    - in: path
      name: moment_id
      required: true
      description: '动态 ID / Moment ID'
      schema: { type: string }
  responses:
    '200':
      description: 动态详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 动态详情 / Moment detail
                    properties:
                      id: { type: integer, format: int64 }
                      uid: { type: integer, format: int64 }
                      text: { type: string }
                      images: { type: array, items: { type: string } }
                      visibility: { type: string }
                      like_count: { type: integer }
                      comment_count: { type: integer }
                      is_liked: { type: boolean }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: moment_id 缺失 / 无权查看 / 已删除
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
