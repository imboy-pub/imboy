# ----------------------------------------------------------------------------
# imboy/api/paths/moment/user-posts.yaml
# GET /api/v1/moments/user/{uid} — 指定用户的动态列表 / User's moments
# Handler: src/api/moment_handler.erl#user_posts/2 → moment_logic:user_posts/4
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 查看指定用户的动态列表
  description: |
    ## 中文 / English
    返回目标用户的动态分页；服务端按可见性 + 好友关系过滤。
    Paginate the target user's moments; server enforces visibility +
    friendship filters.
  operationId: userMoments
  parameters:
    - in: path
      name: uid
      required: true
      description: '目标用户 ID / Target user ID'
      schema: { type: string }
    - in: query
      name: cursor
      required: false
      description: '游标（分页）/ Pagination cursor'
      schema: { type: integer, default: 0 }
    - in: query
      name: limit
      required: false
      description: '返回条数上限 / Max items to return'
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    '200':
      description: 动态列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 用户动态列表（游标分页）/ User moments (cursor pagination)
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            uid: { type: integer, format: int64 }
                            text: { type: string }
                            images: { type: array, items: { type: string } }
                            visibility: { type: string }
                            like_count: { type: integer }
                            comment_count: { type: integer }
                            is_liked: { type: boolean }
                            created_at: { type: integer, description: Unix 毫秒时间戳 }
                      next_cursor: { type: integer, description: 下一页游标，0 表示无更多 }
    '4XX':
      description: uid 非法 / 被对方拉黑 / 无权查看
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
