# ----------------------------------------------------------------------------
# imboy/api/paths/moment/delete-comment.yaml
# POST /api/v1/moment/{moment_id}/comment/{comment_id}/delete — 删评论 / Delete comment
# Handler: src/api/moment_handler.erl#delete_comment/2 → moment_logic:delete_comment/3
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 删除动态下的评论
  description: |
    ## 中文 / English
    删除评论；评论作者或动态作者可删。
    Delete a comment; allowed for either the commenter or the moment author.
  operationId: deleteMomentComment
  parameters:
    - in: path
      name: moment_id
      required: true
      description: 朋友圈动态 ID / Moment ID
      schema: { type: string }
    - in: path
      name: comment_id
      required: true
      description: 评论 ID / Comment ID
      schema: { type: string }
  responses:
    '200':
      description: 删除成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 无 payload，成功即删除评论 / No payload on success
    '4XX':
      description: 评论或动态不存在 / 无权删除
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
