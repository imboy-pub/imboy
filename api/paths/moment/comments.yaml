# ----------------------------------------------------------------------------
# imboy/api/paths/moment/comments.yaml
# GET /api/v1/moment/{moment_id}/comments — 评论列表 / List comments
# Handler: src/api/moment_handler.erl#comments/2 → moment_logic:list_comments/4
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 动态的评论列表（游标分页）
  description: |
    ## 中文 / English
    游标分页返回某条动态的评论。
    Cursor-paginate the comments on a moment.
  operationId: listMomentComments
  parameters:
    - in: path
      name: moment_id
      required: true
      description: '动态 ID / Moment ID'
      schema: { type: string }
    - in: query
      name: cursor
      required: false
      description: '游标（分页）/ Pagination cursor'
      schema: { type: integer, default: 0 }
    - in: query
      name: limit
      required: false
      description: '返回条数上限 / Max items to return'
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    '200':
      description: 评论列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 评论列表（游标分页）/ Comments (cursor pagination)
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            moment_id: { type: integer, format: int64 }
                            uid: { type: integer, format: int64 }
                            content: { type: string }
                            reply_to_uid: { type: integer, format: int64 }
                            created_at: { type: integer, description: Unix 毫秒时间戳 }
                      next_cursor: { type: integer, description: 下一页游标，0 表示无更多 }
    '4XX':
      description: 无权查看 / 动态不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
