# ----------------------------------------------------------------------------
# imboy/api/paths/moment/add-comment.yaml
# POST /api/v1/moment/{moment_id}/comment — 发表评论 / Add comment
# Handler: src/api/moment_handler.erl#add_comment/2 → moment_logic:add_comment/4
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 给动态发表评论或回复
  description: |
    ## 中文 / English
    在动态下发表评论；reply_to_uid 非空时为楼中回复指定用户。
    Comment on a moment. Set `reply_to_uid` to reply to a specific user
    within the thread.
  operationId: addMomentComment
  parameters:
    - in: path
      name: moment_id
      required: true
      description: '动态 ID / Moment ID'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: string
              description: 评论文本 / Comment body.
            reply_to_uid:
              type: string
              description: 被回复用户 TSID（可选）/ Optional target user TSID.
  responses:
    '200':
      description: 评论成功；payload 含新 comment_id
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 新发布的评论对象 / Newly created comment
                    properties:
                      id: { type: integer, format: int64, description: 评论 TSID }
                      moment_id: { type: integer, format: int64 }
                      uid: { type: integer, format: int64, description: 评论者 uid }
                      content: { type: string }
                      reply_to_uid: { type: integer, format: int64 }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: content 为空 / 无权评论 / 动态不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
