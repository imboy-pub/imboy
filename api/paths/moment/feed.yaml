# ----------------------------------------------------------------------------
# imboy/api/paths/moment/feed.yaml
# GET /v1/moments/feed — 关注流 / Moments feed
# Handler: src/api/moment_handler.erl#feed/2 → moment_logic:feed/3
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 当前用户的动态关注流（游标分页）
  description: |
    ## 中文 / English
    按 cursor 分页拉取关注流（好友 + 自己 + 公开订阅）。
    Cursor-based feed of friends + self + followed public moments.
  operationId: feedMoments
  parameters:
    - in: query
      name: cursor
      required: false
      schema: { type: integer, default: 0 }
      description: 上一页末尾的游标 ID / Cursor id from previous page.
    - in: query
      name: limit
      required: false
      description: '返回条数上限 / Max items to return'
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    '200':
      description: feed 列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 动态关注流（游标分页）/ Moments feed (cursor pagination)
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            uid: { type: integer, format: int64 }
                            text: { type: string }
                            images: { type: array, items: { type: string } }
                            visibility: { type: string }
                            like_count: { type: integer }
                            comment_count: { type: integer }
                            is_liked: { type: boolean }
                            created_at: { type: integer, description: Unix 毫秒时间戳 }
                      next_cursor: { type: integer, description: 下一页游标，0 表示无更多 }
    '4XX':
      description: 未鉴权 / feature 未启用
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
