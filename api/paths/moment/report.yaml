# ----------------------------------------------------------------------------
# imboy/api/paths/moment/report.yaml
# POST /api/v1/moment/{moment_id}/report — 举报动态 / Report moment
# Handler: src/api/moment_handler.erl#report/2 → moment_logic:report_post/4
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 举报动态
  description: |
    ## 中文 / English
    举报一条动态；reason 用枚举（违规类型），description 自由描述。
    服务端写入审核工单供 admin 处理。
    Report a moment. `reason` is a coarse category; `description` is
    free-text. Persisted to the moderation queue for admin review.
  operationId: reportMoment
  parameters:
    - in: path
      name: moment_id
      required: true
      description: 朋友圈动态 ID / Moment ID
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: 举报原因类别 / Reason category.
            description:
              type: string
              description: 详细描述 / Free-text description.
  responses:
    '200':
      description: 举报已记录
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 举报记录对象 / Report record
                    properties:
                      id: { type: integer, format: int64, description: 举报记录 TSID }
                      target_type: { type: string, description: "moment" }
                      target_id: { type: integer, format: int64 }
                      reporter_uid: { type: integer, format: int64 }
                      reason: { type: string }
                      description: { type: string }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: moment_id 缺失 / reason 缺失 / 重复举报
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
