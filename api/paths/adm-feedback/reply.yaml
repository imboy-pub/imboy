# POST /adm/feedback/reply — admin
post:
  tags: [admin]
  summary: admin adm-feedback - reply
  description: |
    ## 中文 / English
    管理后台 adm-feedback handler 的 `reply` 动作；路径 `/adm/feedback/reply`。
    Admin handler `adm-feedback`, action `reply`. Path `/adm/feedback/reply`.
  operationId: adm_feedback_reply
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功（返回提交的 PostVals）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 回复成功时返回原始提交参数
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
