# DELETE /adm/channel/{channel_id}/subscriber/{user_id} — admin
delete:
  tags: [admin]
  summary: admin adm-channel - remove_subscriber
  description: |
    ## 中文 / English
    管理后台 adm-channel handler 的 `remove_subscriber` 动作；路径 `/adm/channel/{channel_id}/subscriber/{user_id}`。
    Admin handler `adm-channel`, action `remove_subscriber`. Path `/adm/channel/{channel_id}/subscriber/{user_id}`.
  operationId: adm_channel_remove_subscriber
  parameters:
    - in: path
      name: channel_id
      required: true
      description: 频道 ID / Channel ID
      schema: { type: string }
    - in: path
      name: user_id
      required: true
      description: 用户 ID / User ID
      schema: { type: string }
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 操作成功，payload 为空对象 / Empty object on success
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
