# PUT /api/adm/channel/{channel_id}/message/{message_id}/pin — admin
put:
  tags: [admin]
  summary: admin adm-channel - pin_message
  description: |
    ## 中文 / English
    管理后台 adm-channel handler 的 `pin_message` 动作；路径 `/adm/channel/{channel_id}/message/{message_id}/pin`。
    Admin handler `adm-channel`, action `pin_message`. Path `/adm/channel/{channel_id}/message/{message_id}/pin`.
  operationId: adm_channel_pin_message
  parameters:
    - in: path
      name: channel_id
      required: true
      description: 频道 ID / Channel ID
      schema: { type: string }
    - in: path
      name: message_id
      required: true
      description: 消息 ID / Message ID
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [pinned]
          properties:
            pinned:
              type: boolean
              description: 是否置顶该消息 / Whether to pin the message
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 操作成功，payload 为空对象 / Empty object on success
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
