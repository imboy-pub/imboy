# PUT /api/adm/channel/{channel_id}/admin/{user_id}/role — admin
put:
  tags: [admin]
  summary: admin adm-channel - update_admin_role
  description: |
    ## 中文 / English
    管理后台 adm-channel handler 的 `update_admin_role` 动作；路径 `/adm/channel/{channel_id}/admin/{user_id}/role`。
    Admin handler `adm-channel`, action `update_admin_role`. Path `/adm/channel/{channel_id}/admin/{user_id}/role`.
  operationId: adm_channel_update_admin_role
  parameters:
    - in: path
      name: channel_id
      required: true
      description: 频道 ID / Channel ID
      schema: { type: string }
    - in: path
      name: user_id
      required: true
      description: 用户 ID / User ID
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [role]
          properties:
            role:
              type: integer
              minimum: 1
              maximum: 3
              description: 管理员角色等级，1-3 / Admin role level, 1-3
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 操作成功，payload 为空对象 / Empty object on success
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
