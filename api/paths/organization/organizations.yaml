post:
  tags: [organization]
  summary: 创建 Organization
  description: |
    已认证用户可创建。创建者在同一事务中成为 active Owner。
    该操作不会创建或加入任何 Workspace、Group，也不会授予垂直业务权限。
  operationId: organizationCreate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
  responses:
    '200':
      description: 创建成功或业务错误信封
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    $ref: '../../components/schemas/Organization.yaml'
    '405':
      description: Method Not Allowed
