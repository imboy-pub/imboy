put:
  tags: [organization]
  summary: 调整 Organization 成员角色
  description: |
    仅主 Owner 可在 admin/member 间调整角色。主 Owner 不可通过本接口降级，
    Owner 转移应使用独立流程。该操作不改变 Workspace/Group 成员关系。
  operationId: organizationMemberRoleUpdate
  parameters:
    - name: organization_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    - name: user_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [role]
          properties:
            role: { type: string, enum: [admin, member] }
  responses:
    '200':
      description: 成功或业务错误信封（400/403/404/409/500）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
    '405':
      description: Method Not Allowed
