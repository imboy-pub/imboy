delete:
  tags: [organization]
  summary: 移除 Organization 成员
  description: |
    Owner/Admin 可移除普通 member；只有主 Owner 可移除 admin；主 Owner 不可
    通过本接口移除。只将 organization_member 标为 removed，不删除或停用任何
    Workspace/Group 成员关系，跨 Organization 协作保持有效。
  operationId: organizationMemberRemove
  parameters:
    - name: organization_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    - name: user_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    '200':
      description: 成功或业务错误信封（400/403/404/409/500）
      content:
        application/json:
          schema: { $ref: '../../components/schemas/Envelope.yaml' }
    '405':
      description: Method Not Allowed
