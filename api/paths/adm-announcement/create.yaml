# POST /adm/announcement/create — admin
post:
  tags: [admin]
  summary: admin adm-announcement - create
  description: |
    ## 中文 / English
    管理后台 adm-announcement handler 的 `create` 动作；路径 `/adm/announcement/create`。
    Admin handler `adm-announcement`, action `create`. Path `/adm/announcement/create`.
  operationId: adm_announcement_create
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [title]
          properties:
            title: { type: string, description: '公告标题 / Announcement title' }
            body: { type: string, description: '公告正文 / Announcement body' }
            type: { type: string, enum: [info, warning, critical], default: info, description: '公告类型 / Type' }
            pinned: { type: integer, enum: [0, 1], default: 0, description: '是否置顶 / Pinned' }
            expired_at: { type: string, description: '过期时间 ISO8601（可选）/ Expiry time' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
