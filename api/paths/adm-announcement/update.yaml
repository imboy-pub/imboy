# PUT /api/adm/announcement/update — admin
put:
  tags: [admin]
  summary: admin adm-announcement - update
  description: |
    ## 中文 / English
    管理后台 adm-announcement handler 的 `update` 动作；路径 `/adm/announcement/update`。
    Admin handler `adm-announcement`, action `update`. Path `/adm/announcement/update`.
  operationId: adm_announcement_update
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [id]
          properties:
            id:
              type: string
              description: 公告 ID（TSID）/ Announcement ID (TSID)
            title:
              type: string
              description: 公告标题 / Announcement title
            content:
              type: string
              description: 公告内容 / Announcement content
            type:
              type: integer
              description: 公告类型 / Announcement type
            status:
              type: integer
              description: 公告状态 / Announcement status
            expired_at:
              type: integer
              description: 过期时间戳（毫秒）/ Expiry timestamp (ms)
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
