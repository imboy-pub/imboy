# POST /api/adm/moment/report/resolve — admin
post:
  tags: [admin]
  summary: admin adm-moment - report_resolve
  description: |
    ## 中文 / English
    管理后台 adm-moment handler 的 `report_resolve` 动作；路径 `/adm/moment/report/resolve`。
    Admin handler `adm-moment`, action `report_resolve`. Path `/adm/moment/report/resolve`.
  operationId: adm_moment_report_resolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 处理成功，payload 为空对象 / Empty object on success
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
