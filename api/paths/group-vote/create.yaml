# POST /api/v1/group/vote/create
post:
  tags: [user]
  summary: 群投票 - 创建
  description: |
    ## 中文 / English
    群投票 - 创建
    Create group vote
  operationId: createGroupVote
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [gid, title, options, vote_type]
          properties:
            gid: { type: integer, minimum: 1 }
            title: { type: string, maxLength: 200 }
            description: { type: string }
            options: { type: array, items: { type: string }, minItems: 2, maxItems: 20 }
            vote_type: { type: integer, enum: [1, 2], description: "1=单选, 2=多选 / 1=single, 2=multi" }
            is_anonymous: { type: boolean, default: false }
            end_at: { type: string, description: "截止时间 ISO8601 / Deadline" }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
