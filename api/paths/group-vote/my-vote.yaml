# GET /api/v1/group/vote/my_vote
get:
  tags: [user]
  summary: 查询自己投了什么
  description: |
    ## 中文 / English
    查询自己投了什么
    My vote on a poll
  operationId: myVoteGroupVote
  parameters:
    - in: query
      name: vote_id
      required: true
      description: 投票 ID / Vote ID
      schema: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: group_vote_logic:get_my_vote 返回的投票记录
                    properties:
                      vote_id:
                        type: string
                      user_id:
                        type: integer
                        format: int64
                      option_ids:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: 用户已选的选项 ID 列表
                      voted_at:
                        type: string
                        format: date-time
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
