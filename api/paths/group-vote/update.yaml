# POST /api/v1/group/vote/update
post:
  tags: [user]
  summary: 修改已投选项（换票）
  description: |
    ## 中文 / English
    修改已投选项（换票）——用户撤回原有投票并改投新选项。
    Change the user's previously cast vote to new option(s).
  operationId: updateGroupVote
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [vote_id, option_ids]
          properties:
            vote_id: { type: integer, minimum: 1, description: '投票 ID' }
            option_ids: { type: array, items: { type: integer }, minItems: 1, description: '新选中的选项 ID 列表' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
