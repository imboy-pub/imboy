# POST /api/v1/group/vote/cancel
post:
  tags: [user]
  summary: 取消投票（作废）
  description: |
    ## 中文 / English
    取消投票（作废）
    Cancel vote
  operationId: cancelGroupVote
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [vote_id]
          properties:
            vote_id: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
