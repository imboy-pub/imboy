# POST /api/v1/wallet/topup
post:
  tags: [user]
  summary: 充值
  description: |
    ## 中文
    mock 充值（仅非生产环境）。生产环境（pro/prod/production，及未配置）直接拒绝，
    防止凭空生成钱包余额。真实充值请走 /v1/wallet/recharge/*。
    ## English
    Mock topup (non-production only). Rejected in prod / when env unset,
    to prevent minting wallet balance. Use /v1/wallet/recharge/* for real recharges.
  operationId: walletTopup
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            amount: { type: integer, minimum: 100, maximum: 1000000 }
            method:
              type: string
              x-not-implemented: true
              description: '支付方式（x-not-implemented：当前后端未读取此字段）'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 充值后钱包状态
                    properties:
                      balance: { type: integer, description: 余额（分） }
                      balance_yuan: { type: number, description: 余额（元） }
                      frozen: { type: integer, description: 冻结金额（分） }
    '4XX':
      description: 参数非法 / 无权限 / 生产环境拒绝
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
