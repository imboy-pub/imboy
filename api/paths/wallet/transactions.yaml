# GET /api/v1/wallet/transactions
get:
  tags: [user]
  summary: 钱包交易流水
  description: |
    ## 中文 / English
    钱包交易流水
  operationId: walletTransactions
  parameters:
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          description: 交易流水记录（字段以 wallet_transaction 表为准）
                          additionalProperties: true
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
