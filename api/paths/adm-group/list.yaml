# GET /api/adm/group/list — admin
get:
  tags: [admin]
  summary: admin adm-group - list
  description: |
    ## 中文 / English
    管理后台 adm-group handler 的 `list` 动作；路径 `/adm/group/list`。
    Admin handler `adm-group`, action `list`. Path `/adm/group/list`.
  operationId: adm_group_list
  parameters:
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
    - name: status
      in: query
      required: false
      description: 群组状态筛选 / Group status filter
      schema:
        type: integer
    - name: type
      in: query
      required: false
      description: 群组类型筛选 / Group type filter
      schema:
        type: integer
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '群组 TSID (string) / Group TSID'
                            title:
                              type: string
                              description: '群名称 / Group name'
                            avatar:
                              type: string
                              description: '群头像 URL / Group avatar URL'
                            introduction:
                              type: string
                              description: '群介绍 / Group introduction'
                            owner_uid:
                              type: string
                              description: '群主 UID (string) / Owner UID'
                            creator_uid:
                              type: string
                              description: '创建者 UID (string) / Creator UID'
                            type:
                              type: integer
                              description: '群类型 / Group type'
                            join_limit:
                              type: integer
                              description: '加群限制 / Join restriction'
                            member_count:
                              type: integer
                              description: '当前成员数 / Current member count'
                            status:
                              type: integer
                              description: '群状态 / Group status'
                            created_at:
                              type: string
                              description: '创建时间 / Created at'
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
