# ----------------------------------------------------------------------------
# imboy/api/paths/auth/findpassword.yaml
# POST /passport/findpassword — 找回密码 / Reset password
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 5 / D-auth)
# 调用方：api/openapi.yaml#/paths/~1passport~1findpassword
# Handler：src/api/passport_handler.erl#find_password/1
# ----------------------------------------------------------------------------
post:
  tags: [auth]
  summary: 通过验证码重置密码
  description: |
    ## 中文
    使用验证码（来自 `/passport/getcode` 的 `scene=forgot_pwd` 调用）将
    指定账号的密码重置为新密码。重置成功后所有设备上的旧 token 立即失效。
    副作用：写入密码变更审计、强制踢出现有会话。
    ## English
    Reset a password using a verification code (issued by
    `/passport/getcode` with `scene=forgot_pwd`). All existing tokens for
    the account are revoked on success.
  operationId: findPassword
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [type, account, pwd, code]
          properties:
            type:
              type: string
              enum: [email, sms]
              default: email
            account:
              type: string
              description: 邮箱或手机号 / Email or mobile.
            pwd:
              type: string
              description: 新密码（同 signup 加密策略）/ New password (same encryption rules as signup).
            code:
              type: string
              description: 验证码 / Verification code.
            rsa_encrypt:
              type: string
              enum: ["0", "1"]
              default: "1"
            sys_version:
              type: string
  responses:
    '200':
      description: 密码重置成功
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: 验证码错误 / 账号不存在 / 密码强度不足
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
