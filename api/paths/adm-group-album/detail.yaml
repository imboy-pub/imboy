# GET /adm/group/album/detail — admin
get:
  tags: [admin]
  summary: 管理后台群相册详情
  operationId: adm_group_album_detail
  parameters:
    - in: query
      name: album_id
      required: true
      schema: { type: string }
      description: 相册 ID
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
