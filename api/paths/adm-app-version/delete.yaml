# DELETE /api/adm/app_version/delete — admin
delete:
  tags: [admin]
  summary: admin adm-app-version - delete
  description: |
    ## 中文 / English
    管理后台 adm-app-version handler 的 `delete` 动作；路径 `/adm/app_version/delete`。
    Admin handler `adm-app-version`, action `delete`. Path `/adm/app_version/delete`.
  operationId: adm_app_version_delete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [id]
          properties:
            id: { type: integer, description: '要删除的版本记录 ID / App version record ID to delete' }
  responses:
    '200':
      description: 成功（返回提交的 PostVals）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 删除成功时返回原始提交参数
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
