# POST /v1/group_schedule/create
post:
  tags: [user]
  summary: 群日程 - 创建
  description: |
    ## 中文 / English
    群日程 - 创建
    Create group schedule
  operationId: createGroupSchedule
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [gid, title, start_at]
          properties:
            gid: { type: integer, minimum: 1 }
            title: { type: string, maxLength: 200 }
            description: { type: string }
            location: { type: string }
            start_at: { type: string, description: 'ISO 8601' }
            end_at: { type: string }
            invitees: { type: array, items: { type: string } }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
