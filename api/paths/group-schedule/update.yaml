# POST /api/v1/group_schedule/update
post:
  tags: [user]
  summary: 群日程 - 修改
  description: |
    ## 中文 / English
    群日程 - 修改
    Update group schedule
  operationId: updateGroupSchedule
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [schedule_id]
          properties:
            schedule_id: { type: integer, minimum: 1 }
            title: { type: string }
            description: { type: string }
            location: { type: string }
            start_at: { type: string }
            end_at: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
