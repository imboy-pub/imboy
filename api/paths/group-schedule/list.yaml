# GET /v1/group_schedule/list
get:
  tags: [user]
  summary: 群下日程列表
  description: |
    ## 中文 / English
    群下日程列表
    List group schedules
  operationId: listGroupSchedule
  parameters:
    - in: query
      name: group_id
      required: true
      description: 群组 ID / Group ID
      schema: { type: string }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            schedule_id:
                              type: string
                            group_id:
                              type: integer
                              format: int64
                            creator_id:
                              type: integer
                              format: int64
                            title:
                              type: string
                            location:
                              type: string
                            start_at:
                              type: string
                              format: date-time
                            end_at:
                              type: string
                              format: date-time
                            status:
                              type: integer
                            created_at:
                              type: string
                              format: date-time
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
