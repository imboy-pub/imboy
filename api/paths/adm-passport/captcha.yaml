# GET /api/adm/passport/captcha — admin
get:
  tags: [admin]
  summary: admin adm-passport - captcha
  description: |
    ## 中文 / English
    管理后台 adm-passport handler 的 `captcha` 动作；路径 `/adm/passport/captcha`。
    Admin handler `adm-passport`, action `captcha`. Path `/adm/passport/captcha`.
  operationId: adm_passport_captcha
  responses:
    '200':
      description: 返回 PNG 验证码图片；同时通过 Set-Cookie 写入 captcha_key（HttpOnly）
      content:
        image/png:
          schema:
            type: string
            format: binary
    '503':
      description: ImageMagick convert 未安装时返回 JSON 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
              msg:
                type: string
              hint:
                type: string
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
