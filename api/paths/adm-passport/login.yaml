# POST /api/adm/passport/login — admin
post:
  tags: [admin]
  summary: admin adm-passport - login
  description: |
    ## 中文 / English
    管理后台 adm-passport handler 的 `login` 动作；路径 `/adm/passport/login`。
    Admin handler `adm-passport`, action `login`. Path `/adm/passport/login`.
  operationId: adm_passport_login
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required: [account, pwd, captcha, csrf_token]
          properties:
            account: { type: string, description: '管理员账号' }
            pwd: { type: string, description: '密码' }
            captcha: { type: string, description: '验证码' }
            csrf_token: { type: string, description: 'CSRF 令牌' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
