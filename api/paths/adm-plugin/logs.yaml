# GET /api/adm/plugin/logs — admin
get:
  tags: [admin]
  summary: 管理后台插件日志列表
  description: 获取插件审计日志列表，支持按插件名称筛选及分页。List plugin audit logs with optional filtering by plugin name and pagination.
  operationId: adm_plugin_logs
  parameters:
    - in: query
      name: plugin_name
      required: false
      schema: { type: string }
      description: 插件名称筛选
    - in: query
      name: limit
      required: false
      schema: { type: integer, default: 20 }
      description: 每页条数
    - in: query
      name: offset
      required: false
      schema: { type: integer, default: 0 }
      description: 偏移量
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 插件审计日志列表
                        items:
                          type: object
                          additionalProperties: true
                      limit:
                        type: integer
                        description: 每页条数
                      offset:
                        type: integer
                        description: 偏移量
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
