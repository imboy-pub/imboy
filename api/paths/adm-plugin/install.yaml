# POST /adm/plugin/install — admin
post:
  tags: [admin]
  summary: admin adm-plugin - install
  description: |
    ## 中文 / English
    管理后台 adm-plugin handler 的 `install` 动作；路径 `/adm/plugin/install`。
    Admin handler `adm-plugin`, action `install`. Path `/adm/plugin/install`.
  operationId: adm_plugin_install
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name, path]
          properties:
            name: { type: string, description: '插件名称 / Plugin name' }
            path: { type: string, description: '插件路径（本地安装必填）/ Plugin path (required for local install)' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 安装后的插件信息对象（imboy_plugin_manager:install 返回）
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
