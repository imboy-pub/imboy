# POST /adm/group/schedule/cancel — admin
post:
  tags: [admin]
  summary: 管理后台取消群日程
  operationId: adm_group_schedule_cancel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [schedule_id]
          properties:
            schedule_id: { type: integer, description: '目标 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
