# POST /api/adm/group/schedule/cancel — admin
post:
  tags: [admin]
  summary: 管理后台取消群日程
  description: 管理员取消指定群日程（标记为已取消状态）。Cancel a group schedule by admin (marks as cancelled).
  operationId: adm_group_schedule_cancel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [schedule_id]
          properties:
            schedule_id: { type: string, description: 'TSID 格式日程 ID / Schedule ID in TSID string format' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
