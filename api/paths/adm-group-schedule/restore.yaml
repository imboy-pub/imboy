# POST /api/adm/group/schedule/restore — admin
post:
  tags: [admin]
  summary: 管理后台恢复群日程
  description: 管理员恢复已取消或已删除的群日程。Restore a cancelled or deleted group schedule by admin.
  operationId: adm_group_schedule_restore
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [schedule_id]
          properties:
            schedule_id: { type: string, description: 'TSID 格式日程 ID / Schedule ID in TSID string format' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
