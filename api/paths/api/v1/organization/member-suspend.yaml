post:
  tags:
  - organization
  summary: 暂停组织成员
  operationId: organizationMemberSuspend
  description: '组织治理动作；offboard 本人调用表示离开，治理他人表示移除。suspend 是可恢复撤权，restore 仅接受 suspended；removed 为终态，需重新邀请。主 Owner
    与资源依赖受保护。 / Member lifecycle with ownership/dependency guards.

    访问 JWT 认证；业务失败通常返回 HTTP 200 与非零 code，须检查 code。 / JWT; inspect business code.'
  parameters:
  - name: organization_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 组织 TSID；业务归属，不替代授权 / Organization business ID
  - name: user_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 用户 TSID / User ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      organization_id:
                        type: integer
                        format: int64
                        minimum: 1
                      user_id:
                        type: integer
                        format: int64
                        minimum: 1
                      role:
                        type: string
                        enum:
                        - owner
                        - admin
                        - member
                      status:
                        type: string
                        enum:
                        - active
                        - suspended
                        - removed
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: Method Not Allowed
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
