post:
  tags:
  - organization
  summary: 移动部门
  operationId: organizationDepartmentMove
  description: '组织 Owner/Admin；parent_id=null 提升到根。禁止跨组织、成环或移入归档父节点；必填 expected_version。 / Governors; acyclic same-organization
    move with CAS.

    访问 JWT 认证；业务失败通常返回 HTTP 200 与非零 code，须检查 code。 / JWT; inspect business code.'
  parameters:
  - name: organization_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 组织 TSID；业务归属，不替代授权 / Organization business ID
  - name: department_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 部门 TSID / Department ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            parent_id:
              type:
              - integer
              - 'null'
              format: int64
            expected_version:
              type: integer
              minimum: 1
          required:
          - parent_id
          - expected_version
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/client/OrganizationDepartment.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: Method Not Allowed
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
