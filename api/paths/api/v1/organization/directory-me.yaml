get:
  tags:
  - organization
  summary: 我的组织部门
  operationId: organizationDirectoryMe
  description: '无部门返回空 list；member_count 为组织 active 成员总数。 / Empty list when no departments; member_count covers
    active organization members.

    成功为业务信封；目录应用错误使用真实 HTTP 状态和 error 对象。 / Directory errors use semantic HTTP status and error object.'
  parameters:
  - name: organization_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 组织 TSID；业务归属，不替代授权 / Organization business ID
  responses:
    '200':
      description: 业务结果 / Business result
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                payload:
                  type: object
                  properties:
                    organization_id:
                      type: integer
                      format: int64
                      minimum: 1
                    list:
                      type: array
                      items:
                        $ref: ../../../../components/schemas/client/OrganizationDirectoryDepartment.yaml
                    member_count:
                      type: integer
                  required:
                  - organization_id
                  - list
                  - member_count
    '400':
      description: 参数或游标非法
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
            required:
            - error
    '403':
      description: 组织非 active 或当前成员权限不足 / Organization or membership disabled
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
            required:
            - error
    '503':
      description: 安全门或依赖不可用
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
            required:
            - error
    '405':
      description: Method Not Allowed
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
    '404':
      description: 目录资源不存在 / Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
            required:
            - error
    '500':
      description: 内部错误 / Internal failure
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
            required:
            - error
