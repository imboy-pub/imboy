post:
  tags:
  - organization
  summary: 拒绝组织邀请
  operationId: organizationInvitationReject
  description: '拒绝仅目标用户；撤销仅组织 Owner/Admin。相同终态重复命令幂等。 / Target rejects, governors revoke; same terminal transition
    is idempotent.

    访问 JWT 认证；业务失败通常返回 HTTP 200 与非零 code，须检查 code。 / JWT; inspect business code.'
  parameters:
  - name: organization_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 组织 TSID；业务归属，不替代授权 / Organization business ID
  - name: invitation_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 邀请 TSID / Invitation ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    allOf:
                    - $ref: ../../../../components/schemas/client/OrganizationInvitation.yaml
                    - type: object
                      properties:
                        already_terminal:
                          type: boolean
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: Method Not Allowed
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
