      type: integer
      format: int64
      minimum: 1
    description: 组织 TSID；业务归属，不替代授权 / Organization business ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            workspace_id:
              type: integer
              format: int64
              minimum: 1
          required:
