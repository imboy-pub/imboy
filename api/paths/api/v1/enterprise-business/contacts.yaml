get:
  tags:
  - enterprise-business
  summary: 企业客户列表
  description: '可选 enterprise_business 功能面，部署未启用时不可调用。组织标识来自路径，workspace_id 必须显式提供；每次请求重新校验成员、业务身份和权限。此面成功用业务信封，实体ID返回十进制字符串，时间保留用例原值。

    Optional enterprise_business feature; current resource membership and permissions are rechecked on
    every request. after_id为升序键集位置；未传limit时当前实现不限制条数，调用方应显式提供limit。'
  operationId: ebTenantContactsGet
  security:
  - bearerAuth: []
  x-imboy-feature: enterprise_business
  x-handler: eb_tenant_handler
  x-action: contacts
  parameters:
  - name: org_id
    in: path
    required: true
    description: 路径中的业务实体ID。
    schema:
      type: string
      pattern: ^[0-9]+$
  - name: after_id
    in: query
    required: false
    description: 十进制实体 ID，字符串可无损传输。
    schema:
      oneOf:
      - type: string
        pattern: ^[0-9]+$
      - type: integer
        minimum: 1
      description: 十进制实体 ID，字符串可无损传输。
  - name: limit
    in: query
    required: false
    description: limit 参数；语义见动作说明。
    schema:
      type: integer
  - name: workspace_id
    in: query
    required: true
    description: 十进制实体 ID，字符串可无损传输。
    schema:
      oneOf:
      - type: string
        pattern: ^[0-9]+$
      - type: integer
        minimum: 1
      description: 十进制实体 ID，字符串可无损传输。
  x-imboy-auth-context:
    auth_context: enterprise_member
    required_function: sales
    required_permission: contact.read
  responses:
    '200':
      description: 业务响应；成功code=0，载荷为当前用例视图。
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                payload:
                  type: array
                  items:
                    $ref: ../../../../components/schemas/enterprise-business/Contact.yaml
    '400':
      description: 请求形状或客户端派生字段非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '401':
      description: 凭证无效
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '403':
      description: 当前成员、职能或治理权限不满足
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '404':
      description: 目标不存在或不可访问
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '405':
      description: 不支持的方法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '409':
      description: 版本或业务状态冲突
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '422':
      description: 缺少必填参数或业务参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '500':
      description: 内部处理或配置错误
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  tags:
  - enterprise-business
  summary: 创建企业客户
  description: '可选 enterprise_business 功能面，部署未启用时不可调用。组织标识来自路径，workspace_id 必须显式提供；每次请求重新校验成员、业务身份和权限。此面成功用业务信封，实体ID返回十进制字符串，时间保留用例原值。

    Optional enterprise_business feature; current resource membership and permissions are rechecked on
    every request.'
  operationId: ebTenantContactsPost
  security:
  - bearerAuth: []
  x-imboy-feature: enterprise_business
  x-handler: eb_tenant_handler
  x-action: contacts
  parameters:
  - name: org_id
    in: path
    required: true
    description: 路径中的业务实体ID。
    schema:
      type: string
      pattern: ^[0-9]+$
  x-imboy-auth-context:
    auth_context: enterprise_member
    required_function: sales
    required_permission: contact.read
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            channel:
              type: string
            subject:
              type: string
            display_name:
              type: string
            imboy_user_id:
              oneOf:
              - type: string
                pattern: ^[0-9]+$
              - type: integer
                minimum: 1
              description: 十进制实体 ID，字符串可无损传输。
            subject_mask:
              type: string
            workspace_id:
              oneOf:
              - type: string
                pattern: ^[0-9]+$
              - type: integer
                minimum: 1
              description: 十进制实体 ID，字符串可无损传输。
          required:
          - channel
          - subject
          - workspace_id
  responses:
    '200':
      description: 业务响应；成功code=0，载荷为当前用例视图。
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                payload:
                  type: object
                  properties:
                    contact:
                      $ref: ../../../../components/schemas/enterprise-business/Contact.yaml
                    contact_identity:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^[0-9]+$
                          description: 完整十进制实体 ID；此接口出站以字符串传输。
                        contact_id:
                          type: string
                          pattern: ^[0-9]+$
                          description: 完整十进制实体 ID；此接口出站以字符串传输。
                        channel:
                          type: string
                        subject_mask:
                          type:
                          - string
                          - 'null'
                    reused:
                      type: boolean
                    personal_friend_rows:
                      type: integer
                    audit_id:
                      type: string
                      pattern: ^[0-9]+$
                      description: 完整十进制实体 ID；此接口出站以字符串传输。
    '400':
      description: 请求形状或客户端派生字段非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '401':
      description: 凭证无效
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '403':
      description: 当前成员、职能或治理权限不满足
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '404':
      description: 目标不存在或不可访问
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '405':
      description: 不支持的方法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '409':
      description: 版本或业务状态冲突
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '422':
      description: 缺少必填参数或业务参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '500':
      description: 内部处理或配置错误
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
