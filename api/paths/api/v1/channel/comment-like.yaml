post:
  tags:
  - channel
  summary: 点赞评论
  operationId: channelCommentLike
  description: 评论删除要求作者或频道管理员；点赞/取消要求内容权益。归档写保护仍生效。 / Authors or channel admins delete; content entitlement for
    reactions.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 频道 TSID / Channel ID
  - name: comment_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: comment_id
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
