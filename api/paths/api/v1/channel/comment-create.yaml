post:
  tags:
  - channel
  summary: 创建频道消息评论
  operationId: channelCommentCreate
  description: 访问 JWT 认证；普通业务错误使用非零 code，须检查信封。 / Inspect envelope code for business errors.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 频道 TSID / Channel ID
  - name: message_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 消息 TSID / Message ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            content:
              type: string
            parent_id:
              type: integer
              format: int64
              minimum: 0
              default: 0
          required:
          - content
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/client/ChannelComment.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
