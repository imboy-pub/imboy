get:
  tags:
  - channel
  summary: 频道消息评论列表
  operationId: channelCommentsList
  description: 需要频道内容访问权益；cursor 为上一页末条评论 ID，响应仅 list，无 next_cursor。 / Content access required; last row ID is the
    next request cursor, no response cursor field.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 频道 TSID / Channel ID
  - name: message_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 消息 TSID / Message ID
  - name: cursor
    in: query
    required: false
    schema:
      type: integer
      format: int64
      default: 0
    description: cursor
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 200
      default: 20
    description: limit
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/client/ChannelComment.yaml
                    required:
                    - list
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
