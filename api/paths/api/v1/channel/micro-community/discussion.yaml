  x-business-error-codes:
  - 400
  - 403
  - 404
  - 405
  - 409
  - 500
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityBinding
