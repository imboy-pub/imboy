get:
  tags:
  - channel
  operationId: getMicroCommunityDiscussion
  summary: 读取讨论群 / Read discussion binding
  description: 要求有效订阅及付费权益，或双端管理例外；未绑定返回null。 / Require subscription and paid entitlement, or dual-manager exemption;
    unbound returns null. 所有新入口在phase1_delivery或channel关闭时拒绝；不可通过缓存绕过。业务错误仍HTTP 200，以code判断。 / New endpoints fail
    closed under phase1_delivery or disabled channel; business failures use HTTP 200 with nonzero code.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityEntityId
    description: 频道 TSID / Channel ID
  responses:
    '200':
      description: '业务信封：code=0成功，非零失败。 / Business envelope: code 0 succeeds; nonzero fails.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityBindingEnvelope
            - $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityErrorEnvelope
  x-business-error-codes:
  - 400
  - 403
  - 404
  - 405
  - 500
  - 503
