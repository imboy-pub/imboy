  description: 操作者必须双端管理；相同owner、personal、active私有仅邀请且非E2EE；初绑/换群检查仅owner成员且无内容。 / Dual management, same owner,
    personal active private invitation-only non-E2EE; initial/replacement groups must be owner-only and unused.
    所有新入口在phase1_delivery或channel关闭时拒绝；不可通过缓存绕过。业务错误仍HTTP 200，以code判断。 / New endpoints fail closed under phase1_delivery
