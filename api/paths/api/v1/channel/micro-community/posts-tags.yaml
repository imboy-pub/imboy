put:
  tags:
  - channel
  operationId: setMicroCommunityPostTags
  summary: 更新标签 / Update tags
  description: 作者在既有编辑窗口内或频道管理；只更新payload.tags，附件和其他字段保留。 / Author within edit window or channel manager; update
    only payload.tags, preserving attachments and other fields. 所有新入口在phase1_delivery或channel关闭时拒绝；不可通过缓存绕过。业务错误仍HTTP
    200，以code判断。 / New endpoints fail closed under phase1_delivery or disabled channel; business failures use HTTP
    200 with nonzero code.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityEntityId
  - name: message_id
    in: path
    required: true
    schema:
      $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityEntityId
  responses:
    '200':
      description: '业务信封：code=0成功，非零失败。 / Business envelope: code 0 succeeds; nonzero fails.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityTagsResultEnvelope
            - $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityErrorEnvelope
  x-business-error-codes:
  - 400
  - 401
  - 403
  - 404
  - 405
  - 503
  - 980
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../../../openapi-api.yaml#/components/schemas/MicroCommunityTagsPatch
