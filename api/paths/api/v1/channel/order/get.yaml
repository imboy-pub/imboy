# GET (channel) getChannelOrder
get:
  tags: [user]
  summary: 查询订单
  description: |
    ## 中文 / English
    查询订单
    Get order
  operationId: getChannelOrder
  parameters:
    - in: path
      name: order_no
      required: true
      description: '订单号 / Order number'
      schema: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 订单详情 / Order detail
                    required: [amount]
                    properties:
                      order_no: { type: string }
                      channel_id: { type: integer, format: int64 }
                      user_id: { type: integer, format: int64 }
                      amount:
                        type: string
                        pattern: '^(0|[1-9][0-9]{0,7})[.][0-9]{2}(?![\s\S])'
                        example: '9.90'
                        description: '金额（元），固定两位非负十进制字符串；numeric(10,2)，范围 0.00–99999999.99 / Amount in yuan, fixed two decimals'
                      status: { type: integer, description: "0=待支付 1=已支付 2=已退款" }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
                      paid_at: { type: integer, description: 支付时间，Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../../../components/schemas/Envelope.yaml' } }
