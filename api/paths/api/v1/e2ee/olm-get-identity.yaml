get:
  tags:
  - e2ee
  summary: 读取单设备 Olm 身份公钥
  operationId: olmGetIdentity
  description: 需启用 E2EE；返回公钥，不含私钥。
  parameters:
  - name: uid
    in: query
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 目标用户 TSID / Target user ID
  - name: device_id
    in: query
    required: true
    schema:
      type: string
    description: 设备标识 / Device ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/client/OlmIdentity.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
