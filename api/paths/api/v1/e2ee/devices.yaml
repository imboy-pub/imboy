get:
  tags:
  - e2ee
  summary: 列出用户活跃的 Olm 设备
  operationId: e2eeDevices
  description: 仅返回 status=1 且已注册 Olm 身份的设备；不返回已撤销设备。 / Active devices with registered Olm identities only.
  parameters:
  - name: uid
    in: query
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 目标用户 TSID / Target user ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        format: int64
                        minimum: 1
                      devices:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/client/OlmDevice.yaml
                    required:
                    - user_id
                    - devices
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
