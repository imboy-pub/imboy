get:
  tags:
  - e2ee
  summary: 读取 JWT 当前设备的 one-time key 余量
  operationId: olmPrekeyCount
  description: 需启用 E2EE；prekey_count 的用户与设备只取自 JWT，不接受目标 uid/device_id。
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      count:
                        type: integer
                        minimum: 0
                    required:
                    - count
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
