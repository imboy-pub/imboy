get:
  tags:
  - e2ee
  summary: 查询历史 RSA 设备公钥（兼容解密）
  description: 历史 RSA 密文兼容接口；新会话使用 Olm 设备与预密钥接口。uid 为单个目标用户，不接受逗号列表。 / Legacy RSA compatibility; use Olm for new
    sessions.
  operationId: e2eeUserKeys
  parameters:
  - in: query
    name: uid
    required: true
    description: 单个目标用户 TSID / Single target user ID
    schema:
      type: integer
      format: int64
      minimum: 1
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    required:
                    - uid
                    - devices
                    properties:
                      uid:
                        type: integer
                        format: int64
                        description: 目标用户 TSID / Target user TSID
                      devices:
                        type: array
                        description: 该用户各设备的公钥条目 / Public key entries per device
                        items:
                          type: object
                          properties:
                            device_id:
                              type: string
                              description: 设备 ID / Device ID
                            device_type:
                              type: string
                              description: 设备类型 / Device type (ios/android/web…)
                            public_key:
                              type: string
                              description: PEM 格式 RSA 公钥 / RSA public key in PEM format
                            key_id:
                              type: string
                              description: 密钥版本 ID / Key version ID
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 参数非法 / 无权限
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
