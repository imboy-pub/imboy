post:
  tags:
  - e2ee
  summary: 批量领取设备预密钥
  operationId: olmBatchClaim
  description: 需启用 E2EE；优先原子消费 one-time key，耗尽后回退 fallback。领取方和目标均有限流；批量部分失败通过 failed 逐设备返回。 / Claims consume OTKs;
    fallback and partial failures are explicit.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            target_uid:
              type: integer
              format: int64
              minimum: 1
            request_id:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9_.-]+$
              description: 可选领取幂等键；非法/空值按未提供处理，重试时复用相同值。 / Reuse on retry; invalid values disable idempotency.
            device_ids:
              type: array
              items:
                type: string
              minItems: 1
              maxItems: 20
              description: 最多 20 个不同设备，重复值去重。
          required:
          - target_uid
          - device_ids
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      claimed:
                        type: object
                        additionalProperties:
                          $ref: ../../../../components/schemas/client/OlmClaim.yaml
                      failed:
                        type: object
                        additionalProperties:
                          type: string
                    required:
                    - claimed
                    - failed
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
