post:
  tags:
  - e2ee
  summary: 上报 Olm identity
  operationId: olmReportIdentity
  description: 需启用 E2EE，并使用绑定设备的访问 JWT。写入的 device_id 必须等于 JWT 绑定设备；服务端仅保存公钥侧材料。 / E2EE capability and device-bound
    JWT required; device_id must match the token.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            device_id:
              type: string
            device_type:
              type: string
            ed25519_key:
              type: string
            curve25519_key:
              type: string
            signature:
              type: string
            transition_signature:
              type: string
              description: 换根时旧身份键的过渡签名；首注册及同根上报可省略。
          required:
          - device_id
          - ed25519_key
          - curve25519_key
          - signature
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      success:
                        type: boolean
                    required:
                    - success
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
