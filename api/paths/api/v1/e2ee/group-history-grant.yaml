get:
  tags:
  - e2ee
  summary: 读取群历史密钥授权边界
  operationId: e2eeGroupHistoryGrant
  description: 需启用 E2EE；按当前用户群成员代次和 session_id 判断历史密钥读取范围，不直接返回私钥。 / E2EE capability and group history-generation
    authorization required.
  parameters:
  - name: gid
    in: query
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: gid
  - name: session_id
    in: query
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 256
    description: session_id
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      gid:
                        type: integer
                        format: int64
                        minimum: 1
                      session_id:
                        type: string
                      epoch_id:
                        type: string
                      generation_no:
                        type: integer
                        minimum: 1
                      start_seq:
                        type: integer
                        format: int64
                        minimum: 1
                      end_seq:
                        type: integer
                        format: int64
                        minimum: 1
                    required:
                    - gid
                    - session_id
                    - epoch_id
                    - generation_no
                    - start_seq
                    - end_seq
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
