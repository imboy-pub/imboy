get:
  tags:
  - wallet
  summary: 红包详情与领取明细
  operationId: walletRedPacketDetail
  description: 仅发送人或已经领取的用户可读；无权益时业务错误。金额为分。 / Sender or existing receiver only, amounts in fen.
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: id
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      packet:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                            minimum: 1
                          sender_uid:
                            type: integer
                            format: int64
                            minimum: 1
                          type:
                            type: string
                          amount:
                            type: integer
                          count:
                            type: integer
                          remain_amount:
                            type: integer
                          remain_count:
                            type: integer
                          greeting:
                            type: string
                          status:
                            type: string
                          scope_type:
                            type:
                            - string
                            - 'null'
                          scope_id:
                            type:
                            - integer
                            - 'null'
                            format: int64
                          expires_at:
                            type: integer
                            format: int64
                            description: Unix 毫秒 / Unix milliseconds
                          created_at:
                            type: integer
                            format: int64
                            description: Unix 毫秒 / Unix milliseconds
                      receivers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              minimum: 1
                            red_packet_id:
                              type: integer
                              format: int64
                              minimum: 1
                            receiver_uid:
                              type: integer
                              format: int64
                              minimum: 1
                            amount:
                              type: integer
                            received_at:
                              type: integer
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                    required:
                    - packet
                    - receivers
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
