post:
  tags:
  - ai-agent
  summary: 授权本人 Agent 受控支付
  operationId: agentMandateAuthorize
  description: Owner 仅取 JWT 身份；目标 Agent 必须属于本人且启用，不能等于本人。单笔额度不得高于累计额度；有效期最多 90 天；新授权撤销该 Agent 既有有效授权。金额单位为分。 / Owner-bound
    mandate; limits in fen, valid up to 90 days.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            agent_uid:
              type: integer
              format: int64
              minimum: 1
            max_amount_fen:
              type: integer
              minimum: 1
            max_total_fen:
              type: integer
              minimum: 1
            expires_in_secs:
              type: integer
              minimum: 1
              maximum: 7776000
            period_secs:
              type: integer
              minimum: 60
              default: 86400
          required:
          - agent_uid
          - max_amount_fen
          - max_total_fen
          - expires_in_secs
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                    required:
                    - id
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
