post:
  tags:
  - ai-agent
  summary: 批准 Agent 任务
  operationId: agentTaskApprove
  description: 审批人仅取 JWT；必须为群成员且不是 Agent 本人，首次决定生效，重复决定返回业务错误。 / JWT approver, group member, non-agent; first decision
    wins.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            task_id:
              type: string
              minLength: 1
            taskId:
              type: string
              description: task_id 的历史兼容键；优先 task_id。
          anyOf:
          - required:
            - task_id
          - required:
            - taskId
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      task_id:
                        type: string
                      status:
                        type: string
                        enum:
                        - approved
                        - rejected
                    required:
                    - task_id
                    - status
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
