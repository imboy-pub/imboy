post:
  tags:
  - user
  summary: 绑定已确认照片到群相册
  operationId: groupAlbumPhotoBind
  description: 校验群成员、相册归属与确认对象；URL 字段为对象引用，客户端仍需授权查看。 / Checks membership, album and confirmed object; resolve object
    references before viewing.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            album_id:
              type: integer
              format: int64
              minimum: 1
            object_key:
              type: string
              minLength: 1
            photo_name:
              type: string
              default: photo.jpg
            photo_size:
              type: integer
              minimum: 0
            mime_type:
              type: string
              default: image/jpeg
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
            gid:
              type: integer
              format: int64
              minimum: 1
          required:
          - gid
          - album_id
          - object_key
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                      photo_id:
                        type:
                        - integer
                        - string
                        description: 新绑定为业务文件标识字符串；重复绑定历史实现返回行 ID。 / Business ID string on create, row ID on duplicate.
                      photo_url:
                        type: string
                      thumbnail_url:
                        type: string
                      duplicate:
                        type: boolean
                    required:
                    - id
                    - photo_id
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
