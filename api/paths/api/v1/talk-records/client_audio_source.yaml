get:
  tags:
  - talk-record
  summary: Purpose-bound third-party assembly audio source
  operationId: talkRecordClientAudioSource
  security: []
  x-handler: talk_record_client_audio_handler
  parameters:
  - name: ticket
    in: query
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 8192
    description: 服务端签发的专用读取票据 / Server-issued read capability
  - name: Range
    in: header
    schema:
      type: string
      maxLength: 106
    description: 单个 bytes 区间 / Single byte range
  description: Single ticket only; duplicate or unknown query parameters rejected. Current authority rechecked before
    IO and every 64KiB chunk. GET/HEAD single range; no redirect, no-store. Not a generic attachment URL. Ticket
    never appears in JSON/errors/logs.
  responses:
    '200':
      description: AAC/ADTS assembly audio
    '206':
      description: Single byte range
    '403':
      description: Expired or revoked purpose authority
    '416':
      description: Invalid range
