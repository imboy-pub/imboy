post:
  tags:
  - talk-record
  summary: capture audio parts — POST
  operationId: talkRecordCaptureAudioPartsPost
  security:
  - bearerAuth: []
  x-device-signature-required: true
  x-handler: talk_record_handler
  description: JWT and default device-signature verification apply. Every request
    rechecks current record ACL and organization/workspace eligibility; participation
    does not grant access. Entity IDs are JSON int64 integers. Register scoped part
    first; upload_ref is the only transfer capability. Pending attachment_id is null.
    PUT raw gateway receipt must be pinned=true with matching sha256 and integer size,
    then call this capture part confirm; do not open a general asset session. Recording
    writes require the current owner and matching capture/device session. Ended epoch-0
    upload may finish after active microphone lease expiry; abandoned/fenced/unknown
    identities are denied.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../../components/schemas/talk-record/PartRegister.yaml
  responses:
    '201':
      description: Authenticated domain response; current ACL and context are rechecked.
      headers:
        ETag:
          schema:
            type: string
          description: Resource revision where emitted.
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                payload:
                  $ref: ../../../../components/schemas/talk-record/AudioPart.yaml
    '401':
      description: JWT/device signature invalid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '404':
      description: Not found or not currently authorized.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '409':
      description: Conflict, fenced capture, incomplete parts or policy/context changed.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '422':
      description: Invalid body, consent, participant eligibility or processing unavailable.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: Record TSID; current ACL is checked.
  - name: cid
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: Capture TSID belonging to this record.
  - name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 1
    description: Same key must keep exact payload; replay still rechecks current authorization.
  - $ref: ../../../../components/parameters/talk-record/DeviceVsn.yaml
  - $ref: ../../../../components/parameters/talk-record/DevicePkg.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceDid.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceCos.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceMethod.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSign.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSk.yaml
