post:
  tags:
  - talk-record
  summary: Durable asynchronous ASR cancel
  operationId: talkRecordProviderCancel
  security:
  - bearerAuth: []
  x-device-signature-required: true
  x-handler: talk_record_provider_handler
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: 谈话记录 TSID / Talk record ID
  - name: task_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: 提供方执行任务 ID / Provider task ID
  - name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
    description: 本操作幂等键；重试同一操作时复用 / Reuse for retries of the same operation
  - name: If-Match
    in: header
    required: true
    schema:
      type: string
      maxLength: 128
    description: Prepare uses client-run ETag; all other mutations use provider-task ETag. JSON etag is unquoted.
  description: Current JWT actor/device, record/editor/enterprise policy, consent and immutable input pins are checked.
    Supplier returned task ID differs from submission UUID. Query never submits. No credentials, arbitrary URLs,
    paths or raw errors are accepted. Source URL is returned only once, after durable submit intent; replays cannot
    resend. Source expiry does not expire accepted task queries. Cancellation revokes local authority without claiming
    supplier cancellation.
  responses:
    '200':
      description: Current task metadata.
      content:
        application/json:
          schema:
            type: object
            description: Existing API success envelope; payload is the durable task response.
            properties:
              data:
                $ref: ../../../../components/schemas/talk-record/ProviderTaskResponse.yaml
    '202':
      description: Durable state accepted; may_submit/may_query is one-shot.
      content:
        application/json:
          schema:
            type: object
            description: Existing API success envelope; payload is the durable task response.
            properties:
              data:
                $ref: ../../../../components/schemas/talk-record/ProviderTaskResponse.yaml
    '401':
      description: JWT or device invalid.
    '403':
      description: Current authorization denied.
    '409':
      description: State, source or input conflict.
    '412':
      description: ETag changed.
    '422':
      description: Strict schema invalid.
    '428':
      description: Precondition required.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties: {}
