get:
  tags:
  - talk-record
  summary: share candidates — GET
  operationId: talkRecordShareCandidatesGet
  security:
  - bearerAuth: []
  x-device-signature-required: true
  x-handler: talk_record_handler
  description: JWT and default device-signature verification apply. Every request
    rechecks current record ACL and organization/workspace eligibility; participation
    does not grant access. Entity IDs are JSON int64 integers.
  responses:
    '200':
      description: Authenticated domain response; current ACL and context are rechecked.
        Check envelope code; legacy authentication/business errors may use HTTP 200
        with nonzero code.
      headers:
        ETag:
          schema:
            type: string
          description: Resource revision where emitted.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/talk-record/Candidate.yaml
                      next_cursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                      revision:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9223372036854775807
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/talk-record/ErrorEnvelope.yaml
    '401':
      description: JWT/device signature invalid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '404':
      description: Not found or not currently authorized.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '409':
      description: Conflict, fenced capture, incomplete parts or policy/context changed.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '422':
      description: Invalid body, consent, participant eligibility or processing unavailable.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
  parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
      maxLength: 100
    description: Search currently authorized results, at most 100 characters.
  - name: cursor
    in: query
    required: false
    schema:
      type: string
    description: Opaque cursor bound to actor, context and filters; cannot be reused
      for another query.
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    description: Page size, default 20 and maximum 100.
  - name: scope
    in: query
    required: true
    schema:
      type: string
      enum:
      - personal
      - organization
    description: personal forbids organization/workspace; organization requires organization_id.
  - name: organization_id
    in: query
    required: false
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: Current organization business scope; never an authorization credential.
  - name: workspace_id
    in: query
    required: false
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: Optional workspace within the selected organization; current access
      is rechecked.
  - $ref: ../../../../components/parameters/talk-record/DeviceVsn.yaml
  - $ref: ../../../../components/parameters/talk-record/DevicePkg.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceDid.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceCos.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceMethod.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSign.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSk.yaml
