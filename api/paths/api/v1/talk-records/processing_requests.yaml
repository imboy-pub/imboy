post:
  tags:
  - talk-record
  summary: processing requests — POST
  operationId: talkRecordProcessingRequestsPost
  security:
  - bearerAuth: []
  x-device-signature-required: true
  x-handler: talk_record_handler
  description: JWT and default device-signature verification apply. Every request
    rechecks current record ACL and organization/workspace eligibility; participation
    does not grant access. Entity IDs are JSON int64 integers. For client_byok,
    the same frozen record, stage and input reuse one logical job across devices
    and idempotency keys. Different provider or policy pins conflict; an unknown
    provider outcome requires the explicit acknowledged successor claim. New jobs
    and claims of failed jobs obey the per-record client queue_limit.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
          - $ref: ../../../../components/schemas/talk-record/ProcessingCreate.yaml
          - $ref: ../../../../components/schemas/talk-record/ClientProcessingCreate.yaml
  responses:
    '202':
      description: Authenticated domain response; current ACL and context are rechecked.
      headers:
        ETag:
          schema:
            type: string
          description: Resource revision where emitted.
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/Envelope.yaml
            - type: object
              properties:
                payload:
                  $ref: ../../../../components/schemas/talk-record/Accepted.yaml
    '401':
      description: JWT/device signature invalid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '404':
      description: Not found or not currently authorized.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '409':
      description: Conflict, fenced capture, incomplete parts, policy/context changed,
        incompatible existing client input or client_queue_full.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '422':
      description: Invalid body, consent, participant eligibility or processing unavailable.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '428':
      description: If-Match required.
    '412':
      description: Revision changed; GET current resource before explicit retry.
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: Record TSID; current ACL is checked.
  - name: If-Match
    in: header
    required: true
    schema:
      type: string
    description: Quoted revision; absent 428, stale 412. ACL mutations use their ACL
      ETag.
  - name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 1
    description: Same key must keep exact payload; replay still rechecks current authorization.
  - $ref: ../../../../components/parameters/talk-record/DeviceVsn.yaml
  - $ref: ../../../../components/parameters/talk-record/DevicePkg.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceDid.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceCos.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceMethod.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSign.yaml
  - $ref: ../../../../components/parameters/talk-record/DeviceSk.yaml
