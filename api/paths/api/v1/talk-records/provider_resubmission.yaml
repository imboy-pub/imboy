post:
  tags:
  - talk-record
  summary: Durable asynchronous ASR resubmission
  operationId: talkRecordProviderResubmission
  security:
  - bearerAuth: []
  x-device-signature-required: true
  x-handler: talk_record_provider_handler
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  - name: task_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  - name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
  - name: If-Match
    in: header
    required: true
    schema:
      type: string
      maxLength: 128
    description: Prepare uses client-run ETag; all other mutations use provider-task
      ETag. JSON etag is unquoted.
  description: Current JWT actor/device, record/editor/enterprise policy, consent
    and immutable input pins are checked. Supplier returned task ID differs from submission
    UUID. Query never submits. No credentials, arbitrary URLs, paths or raw errors
    are accepted. Source URL is returned only once, after durable submit intent; replays
    cannot resend. Source expiry does not expire accepted task queries. Cancellation
    revokes local authority without claiming supplier cancellation. A false acknowledgement
    is a distinct no-charge preparation resume, not a waiver of unknown fees. The
    previous unstarted task remains immutable and the successor records its predecessor.
    Every existing generic-claim successor is rejected.
  responses:
    '200':
      description: Current task metadata.
      content:
        application/json:
          schema:
            type: object
            description: Existing API success envelope; payload is the durable task
              response.
            properties:
              data:
                $ref: ../../../../components/schemas/talk-record/ProviderTaskResponse.yaml
    '202':
      description: Durable state accepted; may_submit/may_query is one-shot.
      content:
        application/json:
          schema:
            type: object
            description: Existing API success envelope; payload is the durable task
              response.
            properties:
              data:
                $ref: ../../../../components/schemas/talk-record/ProviderTaskResponse.yaml
    '401':
      description: JWT or device invalid.
    '403':
      description: Current authorization denied.
    '409':
      description: State, source or input conflict.
    '412':
      description: ETag changed.
    '422':
      description: Strict schema invalid.
    '428':
      description: Precondition required.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            processing_consent:
              type: object
              additionalProperties: false
              required:
              - confirmed
              - execution_mode
              - provider
              - model
              - policy_version
              - config_version
              properties:
                confirmed:
                  const: true
                execution_mode:
                  const: client_byok
                provider:
                  const: doubao
                model:
                  const: volc.seedasr.auc
                policy_version:
                  type: string
                  minLength: 1
                  maxLength: 64
                config_version:
                  type: string
                  pattern: ^[0-9a-f]{64}$
            ack_possible_duplicate_charge:
              type: boolean
              description: 'false only for resume_preparation: latest prepared task
                with no intent, supplier ID, source window, result or dispatched part.
                true requires an eligible possibly-paid predecessor and explicit duplicate-charge
                acknowledgement.'
          required:
          - processing_consent
          - ack_possible_duplicate_charge
