get:
  tags:
  - msg
  summary: WebSocket 接入入口（HTTP→WS upgrade）
  description: 'WebSocket 入口 `/api/v1/ws`。访问 JWT 通过 `Authorization: Bearer <jwt>` 提供；浏览器可使用 query `token`，header
    优先。`Sec-WebSocket-Protocol` 仅协商帧协议，不承载 Bearer token。

    握手拒绝过期、无效、refresh token，以及不符合设备绑定/会话撤销校验的 token。先调用 `/api/v1/refreshtoken` 刷新访问 JWT，再重连。已建立连接的 token 生命周期处理见实时协议文档。

    帧协议参考 `api/asyncapi.yaml`、`api/proto/imboy.proto` 和 `docs/reference/websocket-api-2.md`。

    Access JWT via Authorization or query token; subprotocol header negotiates framing only. Expired access tokens
    are rejected before upgrade.'
  operationId: wsConnect
  parameters:
  - name: Sec-WebSocket-Protocol
    in: header
    required: true
    schema:
      type: string
    description: 客户端支持的子协议列表，服务端按 imboy.v2、imboy-protobuf、imboy-json、text 优先选择。 / Supported subprotocol list.
  - name: did
    in: header
    required: false
    schema:
      type: string
    description: 设备 ID；必须与访问 JWT 绑定设备匹配。 / Device ID matching JWT. header 优先于同名 query。
  - name: did
    in: query
    required: false
    schema:
      type: string
    description: 设备 ID；必须与访问 JWT 绑定设备匹配。 / Device ID matching JWT. header 优先于同名 query。
  - name: cos
    in: header
    required: false
    schema:
      type: string
    description: 设备类型 / Device type header 优先于同名 query。
  - name: cos
    in: query
    required: false
    schema:
      type: string
    description: 设备类型 / Device type header 优先于同名 query。
  - name: vsn
    in: header
    required: false
    schema:
      type: string
    description: 客户端版本 / Client version header 优先于同名 query。
  - name: vsn
    in: query
    required: false
    schema:
      type: string
    description: 客户端版本 / Client version header 优先于同名 query。
  responses:
    '101':
      description: WebSocket 升级成功 / Upgrade successful
    '400':
      description: 缺少子协议 header / Missing subprotocol header
    '406':
      description: 不支持提供的子协议 / Unsupported subprotocol
    '401':
      description: 访问 token 无效/过期/类型不符，或设备会话校验失败。 / Token or device-session authentication rejected.
      headers:
        X-Token-Error:
          description: 认证失败原因；可能省略。 / Optional token failure reason.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
              msg:
                type: string
            required:
            - code
            - msg
    '429':
      description: 设备连接限流 / Device connection rate limit
  security:
  - bearerAuth: []
  - wsQueryToken: []
