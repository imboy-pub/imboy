# ----------------------------------------------------------------------------
# imboy/api/paths/api/v1/group/qrcode.yaml — GET /group/qrcode
# Handler: src/api/group_handler.erl#qrcode/2 → group_member_logic:join_group/4
# 扫描服务器签发的群邀请；不接受客户端生成的 MD5 校验串。
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 扫描群二维码（自动加群）
  description: |
    群二维码必须先由有效群成员通过 POST /api/v1/group/qrcode_token 取得。
    tk 为服务端签发的 JWT，绑定群 ID、邀请者与有效期。扫描者须登录；
    服务端验签后在入群同一事务内锁定并复核邀请者仍为有效成员。
    不接受旧版 md5(exp + SOLIDIFIED_KEY)；旧客户端必须升级后重新生成群码。
    先部署后端，再部署客户端；客户端不会回落到自行签名。

    Obtain a server-signed invitation from POST /api/v1/group/qrcode_token.
    The token binds the group, inviter and expiry. Redemption requires login
    and rechecks active inviter membership under a lock in the join transaction.
    Legacy app-signed MD5 codes are rejected. Deploy the backend first, upgrade
    clients and regenerate group QR codes; no insecure legacy fallback is allowed.
  operationId: groupQrcodeScan
  parameters:
    - in: query
      name: id
      required: true
      schema: { type: string }
      description: 群 TSID / Group TSID.
    - in: query
      name: exp
      required: false
      schema: { type: integer }
      description: 毫秒展示提示，授权以 JWT exp 为准 / Display hint in milliseconds; signed expiry is authoritative.
    - in: query
      name: tk
      required: true
      schema: { type: string }
      description: 服务端群邀请 JWT / Server-issued group invitation JWT.
  responses:
    '200':
      description: 加群成功；payload 含群资料 + 自己作为新成员的资料
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 群资料（含 group_member 字段为当前用户的成员卡片）.
                    properties:
                      id:
                        type: integer
                        format: int64
                      title:
                        type: string
                      avatar:
                        type: string
                      member_count:
                        type: integer
                      member_max:
                        type: integer
                      type:
                        type: string
                        description: 固定为 "group".
                      group_member:
                        type: object
                        description: 当前用户在群内的成员卡片.
    '403':
      description: 未登录 / token 无效、过期或不属于本群 / 邀请者已离群
    '4XX':
      description: 验证码已过期 / 群不存在 / 已达成员上限
      content:
        application/json: { schema: { $ref: '../../../../components/schemas/Envelope.yaml' } }
