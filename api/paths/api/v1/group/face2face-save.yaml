# ----------------------------------------------------------------------------
# imboy/api/paths/api/v1/group/face2face-save.yaml — POST /group/face2face_save
# Handler: src/api/group_handler.erl#face2face_save/2 → group_logic:face2face_save/3
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 保存面对面建群的成员关系
  description: |
    ## 中文 / English
    匹配成功后确认进入聊天。必须已通过有效暗号匹配并成为成员，过期暗号及非成员拒绝。
    重复确认幂等；返回完整群资料 + 成员列表，不重建已删除群。
    Confirm entry after matching; requires existing membership and an unexpired code.
    Repeated confirmation is idempotent; returns group + members without recreating deleted groups.
  operationId: face2faceSave
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [code, gid]
          properties:
            code:
              type: string
              pattern: '^[0-9]{4}$'
              description: 同 face2face 的 4 位验证码 / Same 4-digit code.
            gid:
              type: integer
              minimum: 1
              maximum: 9223372036854775807
  responses:
    '200':
      description: 保存成功；payload { group, member_list }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      group:
                        type: object
                        description: 群组完整资料.
                      member_list:
                        type: array
                        items:
                          type: object
    '4XX':
      description: code 或 gid 不匹配 / 群不存在
      content:
        application/json: { schema: { $ref: '../../../../components/schemas/Envelope.yaml' } }
