post:
  tags:
  - user
  summary: 将已确认附件绑定为群文件
  operationId: groupFileBind
  description: 仅引用已确认且有权归属该群的 object_key；返回业务 file_id 字符串，非 group_file 行 TSID。重复绑定幂等。 / Confirmed group-scoped object
    only, returns business file ID string.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            gid:
              type: integer
              format: int64
              minimum: 1
            object_key:
              type: string
              minLength: 1
            file_name:
              type: string
            file_type:
              type: string
            file_size:
              type: integer
              minimum: 0
            file_md5:
              type: string
          required:
          - gid
          - object_key
          - file_name
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      file_id:
                        type: string
                    required:
                    - file_id
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
