post:
  tags:
  - project
  summary: 关联频道到项目（幂等）
  description: '## 中文

    把频道关联进项目（personal 频道不可关联；重复关联幂等返回 existing）。

    Owner / active 项目成员（非 guest）可操作。

    ## English

    Link a channel to the project. Idempotent on repeat calls (existing).

    Personal channels cannot be linked.

    '
  operationId: projectChannelsLink
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - channel_id
          properties:
            channel_id:
              type: integer
              format: int64
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      status_flag:
                        type: string
                        enum:
                        - created
                        - existing
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
get:
  tags:
  - project
  summary: 项目已关联频道列表（分页）
  description: '## 中文

    项目已关联的频道分页列表。active 项目成员与 guest 可读。

    ## English

    Paginated list of channels linked to the project.

    '
  operationId: projectChannelsList
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 页码，从 1 开始 / Page starting at 1
  - name: size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    description: 每页条数 / Page size
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                      total_page:
                        type: integer
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
