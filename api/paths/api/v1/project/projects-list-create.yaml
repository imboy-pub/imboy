get:
  tags:
  - project
  summary: 工作区项目列表（分页）
  description: '## 中文

    工作区下项目分页列表。active 工作区成员可读。

    ## English

    Paginated project list of the workspace.

    '
  operationId: workspaceProjectsList
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 工作区 TSID / Workspace ID
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 页码，从 1 开始 / Page starting at 1
  - name: size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    description: 每页条数 / Page size
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/client/Project.yaml
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                      total_page:
                        type: integer
                    required:
                    - list
                    - page
                    - size
                    - total
                    - total_page
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
post:
  tags:
  - project
  summary: 创建项目（Owner 事务内自动入项目）
  description: '## 中文

    在工作区下创建项目。创建者自动成为项目 Owner 与首个项目成员

    （同事务幂等回填，W0 存量迁移同语义）。成功后写 project_event。

    ## English

    Create a project. The creator becomes its owner and first member

    (idempotent backfill in the same transaction).

    '
  operationId: workspaceProjectsCreate
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 工作区 TSID / Workspace ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              maxLength: 200
              minLength: 1
            description:
              type: string
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/client/Project.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
