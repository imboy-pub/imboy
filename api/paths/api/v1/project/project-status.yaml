post:
  tags:
  - project
  summary: 项目状态流转（active | done）
  description: '## 中文

    项目状态在 active / done 之间流转；无物理删除，done 即归档语义。

    仅 Project Owner 可操作。

    ## English

    Flip project status between active and done (no hard delete).

    '
  operationId: projectUpdateStatus
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - active
              - done
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/client/Project.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
