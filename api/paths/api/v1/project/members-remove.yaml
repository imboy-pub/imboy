post:
  tags:
  - project
  summary: 移除项目成员（幂等）
  description: '## 中文

    把用户移出项目。Project Owner 或 Workspace Owner 可操作；幂等（重复移除

    返回 already_removed 语义，不报错）。同时写 project_event=member_removed。

    ## English

    Remove a member from the project (project owner or workspace owner).

    Idempotent.

    '
  operationId: projectMembersRemove
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - user_id
          properties:
            user_id:
              type: integer
              format: int64
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      project_id:
                        type: integer
                        format: int64
                      user_id:
                        type: integer
                        format: int64
                      status:
                        type: string
                        enum:
                        - removed
                      status_flag:
                        type: string
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
