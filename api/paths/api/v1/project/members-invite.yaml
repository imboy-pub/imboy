post:
  tags:
  - project
  summary: 邀请项目成员（幂等）
  description: '## 中文

    邀请用户加入项目。仅 Project Owner 可操作；目标必须是同工作区 active 成员。

    幂等：重复邀请返回既有成员（status_flag=existing），不报错、不重复入库。

    同时写 project_event=member_invited（同事务）。

    ## English

    Invite a user to the project (project owner only). Idempotent — repeated

    invites return the existing member with status_flag=existing.

    '
  operationId: projectMembersInvite
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - user_id
          properties:
            user_id:
              type: integer
              format: int64
              description: 被邀请用户 ID（须为同工作区 active 成员）
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      project_id:
                        type: integer
                        format: int64
                      user_id:
                        type: integer
                        format: int64
                      status_flag:
                        type: string
                        enum:
                        - created
                        - existing
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
