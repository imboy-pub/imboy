post:
  tags:
  - project
  summary: 从项目解绑频道（幂等）
  description: '## 中文

    把频道从项目解绑（不删频道本身）；重复解绑幂等。解绑经复合 FK 强制的

    project_channel_rel 删除行，同时写 project_event=channel_unlinked。

    ## English

    Unlink a channel from the project (the channel itself is kept). Idempotent.

    '
  operationId: projectChannelsUnlink
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  - name: channel_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: channel_id
  responses:
    '200':
      description: 解绑成功（幂等）；业务错误 code：参数缺失（400）/ 无权限（403）
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
