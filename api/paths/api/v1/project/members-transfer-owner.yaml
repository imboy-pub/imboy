post:
  tags:
  - project
  summary: 项目 Owner 转移
  description: '## 中文

    把项目 Owner 转移给另一名成员。仅当前 Project Owner 可操作；目标在本项目

    有未完成任务时 409（先改派或完成）。同时写 project_event=member_owner_transferred。

    ## English

    Transfer project ownership to another member (project owner only).

    409 if the target has unfinished assignee tasks in this project.

    '
  operationId: projectMembersTransferOwner
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - user_id
          properties:
            user_id:
              type: integer
              format: int64
              description: 新 Owner（须已是项目成员）
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      project_id:
                        type: integer
                        format: int64
                      from_owner_id:
                        type: integer
                        format: int64
                      to_owner_id:
                        type: integer
                        format: int64
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '409':
      description: 目标在本项目有未完成任务
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
