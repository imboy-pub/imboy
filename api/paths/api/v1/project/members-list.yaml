get:
  tags:
  - project
  summary: 项目成员列表（分页）
  description: '## 中文

    项目成员分页列表。Project Owner、Workspace Owner（治理）与 active

    项目成员可读；非成员直访 403。按 joined_at 升序。

    ## English

    Paginated project member list. Readable by the project owner, the

    workspace owner (governance) and active project members; 403 otherwise.

    '
  operationId: projectMembersList
  parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: 项目 TSID / Project ID
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 页码，从 1 开始 / Page starting at 1
  - name: size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    description: 每页条数 / Page size
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            workspace_id:
                              type: integer
                              format: int64
                            project_id:
                              type: integer
                              format: int64
                            user_id:
                              type: integer
                              format: int64
                            invited_by:
                              type: integer
                              format: int64
                            joined_at:
                              type: string
                            status:
                              type: string
                              enum:
                              - active
                            nickname:
                              type: string
                            avatar:
                              type: string
                            account:
                              type: string
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                      total_page:
                        type: integer
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
