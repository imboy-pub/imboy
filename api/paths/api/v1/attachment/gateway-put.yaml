put:
  tags:
  - user
  summary: V5 受控上传网关（字节直传端点）
  operationId: attachmentGatewayPut
  parameters:
  - in: path
    name: session_key
    required: true
    schema:
      type: string
      format: uuid
    description: V5 会话标识（真实对象键/声明在能力 token 内，路径不寻址）
  - in: query
    name: capability
    required: false
    schema:
      type: string
    description: 上传能力 token；与 x-upload-capability 请求头等价，二选一
  - name: x-upload-capability
    in: header
    required: false
    schema:
      type: string
    description: Alternative to capability query token; at least one valid upload
      capability is required.
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '200':
      description: 已 pin 并转存（pinned=true）
      content:
        application/json:
          schema:
            type: object
            properties:
              pinned:
                const: true
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              size:
                type: integer
                format: int64
                minimum: 1
            required:
            - pinned
            - sha256
            - size
    '403':
      description: 能力 token 无效
    '404':
      description: 未知会话
    '409':
      description: 同 key 已 pin 到不同内容（provider PUT=0；同字节重试幂等）
    '410':
      description: 能力已过期或窗口非法（reupload_required）
    '413':
      description: 超出限额（pin 未发生）
    '502':
      description: 对象存储转存失败（pin 保留，同内容重试合法）
  security: []
  x-device-signature-required: false
  description: 'Narrow upload-capability endpoint: no login JWT or device-signature
    headers are required. The handler verifies a short-lived upload capability (query
    or x-upload-capability header), exact registered session/actor/object/receipt.
    This is a raw byte PUT and raw JSON receipt, never a business envelope. Do not
    log capability URLs or automatically retry a PUT whose outcome is unknown; reconcile
    the capture part receipt.'
