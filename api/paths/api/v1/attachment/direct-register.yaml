post:
  tags:
  - user
  summary: 附件直传会话 register
  operationId: attachmentDirectRegister
  description: direct-v1 会话：register→declare→grant→存储 PUT→finalize；处理中也返回 HTTP 200，通过 state/outcome 和 retry_action
    决定重试。跨主体会话返回不可见，不泄露归属。失败 retry_action 位于错误信封 meta（retry_session/new_session/retry_attempt/poll/abort）。 / HTTP
    200 state machine; follow retry_action, not HTTP 202.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            filename:
              type: string
              default: file
            scope:
              type: string
              default: private
            scope_ref:
              type: string
            client_upload_id:
              type: string
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      object_key:
                        type: string
                        minLength: 1
                      state:
                        type:
                        - string
                        - 'null'
                      session_state:
                        type: string
                      deadline:
                        type: integer
                        format: int64
                        description: Unix 秒 / Unix seconds
                    required:
                    - object_key
                    - state
                    - session_state
                    - deadline
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
