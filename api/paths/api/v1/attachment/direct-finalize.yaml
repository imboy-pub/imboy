post:
  tags:
  - user
  summary: 附件直传会话 finalize
  operationId: attachmentDirectFinalize
  description: direct-v1 会话：register→declare→grant→存储 PUT→finalize；处理中也返回 HTTP 200，通过 state/outcome 和 retry_action
    决定重试。跨主体会话返回不可见，不泄露归属。失败 retry_action 位于错误信封 meta（retry_session/new_session/retry_attempt/poll/abort）。 / HTTP
    200 state machine; follow retry_action, not HTTP 202.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            object_key:
              type: string
              minLength: 1
            attempt_id:
              type: integer
              minimum: 1
          required:
          - object_key
          - attempt_id
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    oneOf:
                    - type: object
                      properties:
                        state:
                          type: string
                          const: CONFIRMED
                        attempt_id:
                          type: integer
                          minimum: 1
                        object_key:
                          type: string
                          minLength: 1
                        size:
                          type: integer
                          minimum: 0
                      required:
                      - state
                      - attempt_id
                      - object_key
                      - size
                    - type: object
                      properties:
                        state:
                          type: string
                          const: FINALIZING
                        attempt_id:
                          type: integer
                          minimum: 1
                        outcome:
                          type: string
                          const: UNKNOWN_QUARANTINED
                        reason:
                          type: string
                        retry_action:
                          type: string
                          const: retry_attempt
                      required:
                      - state
                      - attempt_id
                      - outcome
                      - retry_action
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT 或客户端认证失败 / Authentication rejected
