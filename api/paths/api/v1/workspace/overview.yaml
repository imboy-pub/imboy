get:
  tags:
  - workspace
  summary: 工作区资源摘要
  operationId: workspaceOverview
  description: active 工作区成员可读；member_preview 最多 20 条。 / Active members; up to 20 member previews.
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 工作区 TSID / Workspace ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      workspace_id:
                        type: integer
                        format: int64
                        minimum: 1
                      project_count:
                        type: integer
                      group_count:
                        type: integer
                      channel_count:
                        type: integer
                      member_preview:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/client/WorkspaceMember.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
