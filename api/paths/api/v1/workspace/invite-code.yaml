post:
  tags:
  - workspace
  summary: 生成工作区团队码
  operationId: workspaceInviteCode
  description: 仅 Owner；8 位团队码，7 天有效；重新生成即撤销旧码；3 秒节流。 / Owner only; 8-character code valid for 7 days, replaces prior
    code; throttled.
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 工作区 TSID / Workspace ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 8
                        maxLength: 8
                      expires_at:
                        type: integer
                        format: int64
                        description: Unix 毫秒；经 elib_response:success 转换。 / Unix milliseconds.
                    required:
                    - code
                    - expires_at
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
