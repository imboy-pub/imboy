get:
  tags: [workspace]
  summary: 工作区群目录或本人已加入群
  description: |
    Human JWT 认证，必须为该工作区有效成员。
    默认保持工作区群目录语义，并按创建时间倒序返回。
    member_only=1 时只返回本人有效群成员关系且存在未关闭历史代次的群；
    SQL 重验工作区、工作区成员及所属企业状态。归档工作区允许只读，归档企业拒绝。
    企业身份与工作区身份独立，外部协作者不会因此获得企业目录或文件权限。
    本人模式使用 id 升序游标分页；将 next_cursor 传入下一次请求，直到 has_more=false。
    preview=1（仅本人模式）返回 member_start_seq 和 latest_message（可为 null）。
    摘要取当前代次中最后一条仍存在且未过期的本人时间线消息；含已送达消息，送达 ACK 不代表已读。
    消息内容来自当前投递表，保留编辑、撤回及本人删除语义，不回落到不可变归档或本地旧摘要。
    遵循现有投递数据保留策略；更早内容不生成摘要。该模式不授予其他历史或附件权限。
  operationId: workspaceGroupList
  parameters:
    - in: path
      name: workspace_id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    - in: query
      name: member_only
      schema: { type: integer, enum: [0, 1], default: 0 }
    - in: query
      name: preview
      description: 仅 member_only=1 可启用；读取当前有效代次的消息摘要
      schema: { type: integer, enum: [0, 1], default: 0 }
    - in: query
      name: limit
      description: 服务端收敛到 1–200；默认为 100
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    - in: query
      name: cursor
      description: 本人模式的排他群 ID 下界；目录模式忽略此参数
      schema: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, default: 0 }
  responses:
    '200':
      description: 成功或业务错误信封；消费方须检查 envelope code
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [workspace_id, list]
                    properties:
                      workspace_id: { type: integer, format: int64 }
                      list:
                        type: array
                        items:
                          type: object
                          required: [id, scope, workspace_id]
                          properties:
                            id: { type: integer, format: int64 }
                            title: { type: string }
                            scope: { type: string, enum: [workspace] }
                            workspace_id: { type: integer, format: int64 }
                            status: { type: integer, enum: [1] }
                            member_start_seq: { type: integer, format: int64, minimum: 1 }
                            latest_message:
                              type: object
                              nullable: true
                              required: [msg_id, conv_seq, msg_type, payload, server_ts, expire_at]
                              properties:
                                msg_id: { type: string }
                                conv_seq: { type: integer, format: int64, minimum: 1 }
                                msg_type: { type: string }
                                payload: { type: object }
                                e2ee: { type: object, nullable: true }
                                server_ts: { type: string, format: date-time }
                                expire_at: { type: string, format: date-time, nullable: true }
                      has_more:
                        type: boolean
                        description: 仅本人模式返回
                      next_cursor:
                        type: integer
                        format: int64
                        description: 仅本人模式返回；最后一页为 0
    '405':
      description: Method Not Allowed
