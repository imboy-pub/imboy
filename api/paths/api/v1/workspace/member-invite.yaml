post:
  tags:
  - workspace
  summary: 邀请已注册用户加入工作区
  operationId: workspaceMemberInvite
  description: 仅工作区 Owner；只添加工作区成员，不自动入下级群或订阅频道。 / Owner only; does not join groups or subscribe channels.
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 工作区 TSID / Workspace ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            user_id:
              type: integer
              format: int64
              minimum: 1
            role:
              type: string
              enum:
              - owner
              - member
              - guest
              default: member
          required:
          - user_id
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    allOf:
                    - $ref: ../../../../components/schemas/client/WorkspaceMember.yaml
                    - type: object
                      properties:
                        status_flag:
                          type: string
                          enum:
                          - changed
                          - unchanged
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
