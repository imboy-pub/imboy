get:
  tags:
  - workspace
  summary: 工作区详情
  operationId: workspaceDetail
  description: active 工作区成员（Owner/Member/Guest）可读；非成员业务 403。 / Active workspace membership required.
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 工作区 TSID / Workspace ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/Workspace.yaml
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
