get:
  tags:
  - workspace
  summary: 读取工作区品牌
  operationId: workspaceBrandingGet
  description: 读取需 active 工作区成员；写入仅 Owner。仅 name/logo/primaryColor 白名单字段可读写，写入为合并式。 / Member read, Owner write;
    only whitelisted branding keys, merged on write.
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
    description: 工作区 TSID / Workspace ID
  responses:
    '200':
      description: 成功 code=0 返回以下业务载荷；业务失败 code 非零返回通用错误信封。 / Success payload or nonzero-code business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      workspace_id:
                        type: integer
                        format: int64
                        minimum: 1
                      branding:
                        $ref: ../../../../components/schemas/client/WorkspaceBranding.yaml
                    required:
                    - workspace_id
                    - branding
              - type: object
                required:
                - code
                properties:
                  code:
                    type: integer
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: 访问 JWT、设备绑定或客户端签名认证失败 / JWT, device binding or client signature rejected
