get:
  tags: [msg]
  summary: 客户端上线后拉取离线消息
  description: |
    按 C2C / C2G / S2C 读取当前登录用户的离线消息。C2C/S2C 使用 did
    排除本设备已确认的消息；C2G ACK 只标记送达，不删除时间线、不清已读。
    C2G 按精确创建时间及消息 ID 稳定分页，客户端应使用 next_cursor。
    游标不提供访问权限；每页始终校验当前用户、有效群成员及成员代际。
    客户端落库并成功调用 /api/v1/msg/offline_ack 后才保存游标。
  operationId: getOfflineMessages
  parameters:
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      description: 每类单页上限 / Per-bucket page limit
    - in: query
      name: did
      schema: { type: string }
      description: C2C/S2C 设备送达过滤标识，与 ACK 使用相同设备标识
    - in: query
      name: c2c_last_msg_at
      schema: { type: integer, default: 0 }
    - in: query
      name: c2g_last_msg_at
      schema: { type: integer, default: 0 }
      description: 兼容旧客户端的毫秒时间游标；不能单独区分同时间戳消息
    - in: query
      name: c2g_cursor
      schema: { type: string, maxLength: 512 }
      description: 原样回传上页 c2g.next_cursor；优先于 c2g_last_msg_at。包含精确时间和消息ID，客户端落库且 ACK 成功后保存。非法游标返回400。
    - in: query
      name: s2c_last_msg_at
      schema: { type: integer, default: 0 }
  responses:
    '200':
      description: "离线消息桶 { c2c: {...}, c2g: {...}, s2c: {...} }"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 按类型分桶的离线消息（每桶结构相同）/ Offline messages bucketed by type
                    properties:
                      c2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
                      c2g:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
                          next_cursor: { type: string, description: C2G不透明复合游标；客户端无需解析，下一页原样回传 }
                      s2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '../../../../components/schemas/Message.yaml' }
                            description: 消息列表 / Message list
                          total: { type: integer, description: 该桶消息总数 / Total count }
                          has_more: { type: boolean, description: 是否还有更多 / Whether more exist }
                          next_last_msg_at: { type: integer, description: 下次请求游标时间戳（毫秒）/ Next cursor }
    '4XX':
      description: 未鉴权
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/Envelope.yaml'
