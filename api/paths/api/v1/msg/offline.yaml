get:
  tags:
  - msg
  summary: 拉取本人离线消息桶
  operationId: getOfflineMessages
  description: 返回 c2c/c2g/s2c 三个消息桶。HTTP 行结构与 WS 离线推送不同：C2C/C2G 同时有内部行 id:int64 和业务 msg_id:string；S2C 把 msg_id 移到
    id:string，并返回 action。没有统一的顶层 type/ver。from/to 都是十进制字符串。C2C/S2C 可用 did 排除本设备已确认行；C2G 仍按接收者代次/群成员权限过滤，送达 ACK 不代表已读。C2G
    分页优先使用 next_cursor，客户端落库且 offline_ack 成功后保存游标。 / Bucketed HTTP rows; distinct from realtime envelope IDs and
    categories.
  parameters:
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 1000
    description: 每桶页上限，服务端夹紧为 1..1000。 / Per-bucket bound.
  - in: query
    name: did
    required: false
    schema:
      type: string
    description: C2C/S2C 设备送达过滤标识，须与 ACK 的设备标识一致；省略为兼容 UID 语义。 / Optional device delivery filter.
  - in: query
    name: c2c_last_msg_at
    required: false
    schema:
      type: integer
      format: int64
      minimum: 0
      default: 0
    description: C2C 毫秒时间游标，0 表示不加时间过滤。 / C2C timestamp cursor.
  - in: query
    name: c2g_last_msg_at
    required: false
    schema:
      type: integer
      format: int64
      minimum: 0
      default: 0
    description: C2G 兼容毫秒游标，不能区分同时间戳行；优先使用 c2g_cursor。 / Legacy C2G timestamp cursor.
  - in: query
    name: c2g_cursor
    required: false
    schema:
      type: string
      maxLength: 512
    description: 原样回传 c2g.next_cursor，优先于 c2g_last_msg_at；非法游标为 HTTP200/非零业务 code 400。 / Opaque compound cursor.
  - in: query
    name: s2c_last_msg_at
    required: false
    schema:
      type: integer
      format: int64
      minimum: 0
      default: 0
    description: S2C 毫秒时间游标，0 表示不加时间过滤。 / S2C timestamp cursor.
  responses:
    '200':
      description: 三个消息桶，或非零 code 业务错误。 / Three buckets or business error.
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  code:
                    type: integer
                    const: 0
                  payload:
                    type: object
                    properties:
                      c2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              allOf:
                              - $ref: ../../../../components/schemas/client/OfflineMessage.yaml
                              - type: object
                                properties:
                                  id:
                                    type: integer
                                    format: int64
                                required:
                                - msg_id
                          total:
                            type: integer
                            minimum: 0
                            description: 本次查询条件下未确认行数；不一定等于 list 长度。 / Matching pending row count.
                          has_more:
                            type: boolean
                          next_last_msg_at:
                            type: integer
                            format: int64
                            description: 下次同类请求的兼容毫秒游标。 / Legacy next timestamp cursor.
                        required:
                        - list
                        - total
                        - has_more
                        - next_last_msg_at
                      c2g:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              allOf:
                              - $ref: ../../../../components/schemas/client/OfflineMessage.yaml
                              - type: object
                                properties:
                                  id:
                                    type: integer
                                    format: int64
                                required:
                                - msg_id
                          total:
                            type: integer
                            minimum: 0
                            description: 本次查询条件下未确认行数；不一定等于 list 长度。 / Matching pending row count.
                          has_more:
                            type: boolean
                          next_last_msg_at:
                            type: integer
                            format: int64
                            description: 下次同类请求的兼容毫秒游标。 / Legacy next timestamp cursor.
                          next_cursor:
                            type: string
                            description: 原样回传 c2g_cursor；空桶可能回传原游标或空串。 / Opaque exact timestamp/message cursor.
                        required:
                        - list
                        - total
                        - has_more
                        - next_last_msg_at
                        - next_cursor
                      s2c:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              allOf:
                              - $ref: ../../../../components/schemas/client/OfflineMessage.yaml
                              - type: object
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                    description: 不透明业务消息 ID；可以含字母、连字符或下划线，不是数据库行 TSID。 / Opaque business message
                                      ID, not a database row key.
                                required:
                                - action
                          total:
                            type: integer
                            minimum: 0
                            description: 本次查询条件下未确认行数；不一定等于 list 长度。 / Matching pending row count.
                          has_more:
                            type: boolean
                          next_last_msg_at:
                            type: integer
                            format: int64
                            description: 下次同类请求的兼容毫秒游标。 / Legacy next timestamp cursor.
                        required:
                        - list
                        - total
                        - has_more
                        - next_last_msg_at
                    required:
                    - c2c
                    - c2g
                    - s2c
                required:
                - code
                - payload
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: JWT、设备会话或客户端认证失败。 / Authentication rejected.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
