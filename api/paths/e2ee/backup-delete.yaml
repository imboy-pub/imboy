# POST /api/v1/e2ee/backup/delete
post:
  tags: [user]
  summary: 删除全部云端密钥备份
  description: |
    ## 中文 / English
    删除当前用户全部版本的加密密钥备份（4S 模式）。
    Delete all encrypted key backup versions for the current user.
  operationId: e2eeBackupDelete
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        description: 删除的版本数 / Number of versions deleted
    '4XX':
      description: 功能未启用 / 限流(429)
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
