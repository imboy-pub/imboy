# POST /api/v1/e2ee/backup/delete
post:
  tags: [user]
  summary: 删除某个备份
  description: |
    ## 中文 / English
    删除某个备份
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeBackupDelete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            backup_id: { type: integer, description: '备份 ID / Backup ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        example: true
                        description: 是否已删除 / Whether the backup was deleted
    '4XX':
      description: 参数非法 / 无权限 / backup 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
