# GET /api/v1/e2ee/notifications/pull
get:
  tags: [user]
  summary: 拉取 E2EE 系统通知
  description: |
    ## 中文 / English
    拉取 E2EE 系统通知
    See docs/api/e2ee_*.md for crypto invariants.
  operationId: e2eePullNotifications
  parameters:
    - in: query
      name: since
      required: false
      schema: { type: integer }
      description: 拉取此时间戳之后的通知（毫秒）/ Fetch notifications after this timestamp (ms)
    - in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 200 }
      description: 最多返回条数 / Maximum number of notifications to return
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [notifications, count]
                    properties:
                      notifications:
                        type: array
                        description: 密钥变更通知列表 / Key-change notification records
                        items:
                          type: object
                          properties:
                            uid:
                              type: integer
                              format: int64
                              description: 密钥变更的用户 TSID / User whose key changed
                            event_type:
                              type: string
                              description: 事件类型（key_updated 等）/ Event type
                            created_at:
                              type: integer
                              description: 事件时间戳（毫秒）/ Event timestamp in ms
                      count:
                        type: integer
                        description: 本次返回条数 / Number of notifications returned
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
