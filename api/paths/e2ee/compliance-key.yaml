# POST /v1/e2ee/compliance_key
post:
  tags: [user]
  summary: 合规密钥上报（监管侧）
  description: |
    ## 中文 / English
    合规密钥上报（监管侧）
    See docs/api/e2ee_*.md for crypto invariants and shard policy.
  operationId: e2eeComplianceKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            encrypted_key: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / shard 校验失败
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
