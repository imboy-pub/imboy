# GET /v1/e2ee/backup/list
get:
  tags: [user]
  summary: 服务端持久 shard 列表
  description: |
    ## 中文 / English
    服务端持久 shard 列表
    See docs/api/e2ee_*.md for crypto invariants.
  operationId: e2eeBackupList
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [list]
                    properties:
                      list:
                        type: array
                        description: 备份记录列表 / Backup records
                        items:
                          type: object
                          properties:
                            backup_id:
                              type: integer
                              description: 备份 ID / Backup ID
                            key_version:
                              type: string
                              description: 密钥版本 / Key version
                            created_at:
                              type: integer
                              description: 创建时间戳（毫秒）/ Created at in ms
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
