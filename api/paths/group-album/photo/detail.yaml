# GET /api/group_album/photo/detail — 照片详情 / Photo detail
get:
  tags: [user]
  summary: 照片详情（含 like / comments 计数）
  description: 获取单张照片详情，含点赞数和评论数。Get photo detail including like and comment counts.
  operationId: photoDetailGroupAlbum
  parameters:
    - in: query
      name: photo_id
      required: true
      description: '照片 ID / Photo ID'
      schema: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 照片详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      photo_id:
                        type: integer
                        format: int64
                      album_id:
                        type: integer
                        format: int64
                      uploader_id:
                        type: integer
                        format: int64
                      photo_url:
                        type: string
                      photo_name:
                        type: string
                      like_count:
                        type: integer
                      comment_count:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
    '4XX':
      description: photo 不存在 / 无权限
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
