# GET /group_album/list — 相册列表 / Albums list
get:
  tags: [user]
  summary: 群下的相册列表
  description: |
    ## 中文 / English
    返回群下相册列表。
    List albums of a group.
  operationId: listGroupAlbums
  parameters:
    - in: query
      name: gid
      required: true
      description: 群组 ID / Group ID
      schema: { type: string }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 分页结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            album_id:
                              type: integer
                              format: int64
                            album_name:
                              type: string
                            cover_photo_id:
                              type: integer
                              format: int64
                            photo_count:
                              type: integer
                            created_at:
                              type: string
                              format: date-time
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
    '4XX':
      description: gid 必须 / 非群成员
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
