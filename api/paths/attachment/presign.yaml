# GET /api/v1/attachment/presign — 获取 S3 预签名上传 URL / Get presigned upload URL
# Handler: src/api/attach_handler.erl#presign/2
get:
  tags: [user]
  summary: 获取附件预签名上传 URL
  description: |
    获取 Garage S3 预签名 URL 用于客户端直传。
  operationId: attachmentPresign
  parameters:
    - in: query
      name: filename
      required: true
      schema: { type: string }
      description: 文件名
    - in: query
      name: mime_type
      required: false
      schema: { type: string, default: application/octet-stream }
      description: MIME 类型
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    required: [put_url, object_key, expires_at]
                    properties:
                      put_url:
                        type: string
                        description: Garage S3 预签名 PUT URL，客户端直接 PUT 上传 / Presigned S3 PUT URL for direct upload
                      object_key:
                        type: string
                        description: 对象键（含 uid 前缀），confirm 时回传 / Object key with uid prefix, returned to confirm
                      expires_at:
                        type: integer
                        description: URL 过期时间（Unix 秒）/ URL expiry as Unix timestamp in seconds
    '4XX':
      description: 未鉴权 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
