# POST /adm/group/notice/delete — admin
post:
  tags: [admin]
  summary: 管理后台删除群公告
  description: 管理员删除指定群公告。Delete a group notice by admin.
  operationId: adm_group_notice_delete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [notice_id]
          properties:
            notice_id: { type: string, description: '公告 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
