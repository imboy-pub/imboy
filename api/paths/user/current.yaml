# ----------------------------------------------------------------------------
# imboy/api/paths/user/current.yaml
# GET /user/current — 当前登录用户资料 / Current user profile
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 4 / B)
# 调用方：api/openapi.yaml#/paths/~1user~1current
# Handler：src/api/user_handler.erl#current/1
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 当前登录用户资料
  description: |
    返回 token 解析出的当前用户完整资料（含手机号、昵称、头像、状态、注册时间）。
    副作用：无（纯读，可能命中 depcache 缓存）。
    典型场景：客户端启动后初始化用户态、Profile 页面渲染、接口拦截器维持用户上下文。
  operationId: getCurrentUser
  responses:
    '200':
      description: 用户资料
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    $ref: '../../components/schemas/User.yaml'
    '4XX':
      description: 未鉴权或 token 失效（401）；客户端应触发 /passport/refresh 流程
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
