# ----------------------------------------------------------------------------
# imboy/api/paths/user/change-password.yaml
# POST /user/change_password — 修改密码 / Change password
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 6 / D-user-core)
# 调用方:  api/openapi.yaml#/paths/~1user~1change_password
# Handler: src/api/user_handler.erl#change_password/2 → user_logic:change_password/2
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 凭旧密码修改新密码
  description: |
    ## 中文
    需提供旧密码验证 + 新密码。新密码 RSA-OAEP 加密策略与 signup 一致。
    成功后服务端撤销所有除当前会话外的设备 token。
    ## English
    Requires old password verification plus a new password. New password
    follows the same RSA-OAEP rules as signup. On success, tokens for all
    devices except the current session are revoked.
  operationId: changePassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [existing_pwd, new_pwd]
          properties:
            existing_pwd:
              type: string
              description: 旧密码（按 rsa_encrypt 解密策略）/ Old password.
            new_pwd:
              type: string
              description: 新密码 / New password.
            rsa_encrypt:
              $ref: '../../components/schemas/RsaEncryptFlag.yaml'
  responses:
    '200':
      description: 修改成功（无 payload）
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: 旧密码错误 / 新密码强度不足 / 与旧密码相同
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
