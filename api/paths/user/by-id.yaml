# ----------------------------------------------------------------------------
# imboy/api/paths/user/by-id.yaml
# GET /user/{uid} — 按 uid 查询用户 / Get user by TSID
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 4 / B)
# 调用方：api/openapi.yaml#/paths/~1user~1{uid}
# Handler：src/api/user_handler.erl#by_id/1
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 按 uid 查询用户
  description: |
    按目标用户 TSID 查询其公开资料（不含手机号等敏感字段；具体可见性由后端隐私设置决定）。
    副作用：无（纯读，可能命中 depcache 缓存）。
    典型场景：会话列表 / 群成员列表点击头像查看对方资料、消息渲染补全发送者信息。
  operationId: getUserById
  parameters:
    - in: path
      name: uid
      required: true
      schema: { type: string }
      description: TSID（integer 字符串）
  responses:
    '200':
      description: 用户资料
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: 未鉴权（401）、uid 格式非法或目标用户不存在（404）
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
