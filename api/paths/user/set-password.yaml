# ----------------------------------------------------------------------------
# imboy/api/paths/user/set-password.yaml
# POST /api/user/set_password — 为未设密账号设置密码 / Initial set password
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 6 / D-user-core)
# 调用方:  api/openapi.yaml#/paths/~1user~1set_password
# Handler: src/api/user_handler.erl#set_password/2 → user_logic:set_password/2
# ----------------------------------------------------------------------------
post:
  tags: [user]
  summary: 为未设密账号设置初始密码
  description: |
    ## 中文
    专为 quick_login（运营商一键登录）创建的无密码账号补充密码。
    若账号已设密码会拒绝（请改用 /user/change_password）。
    ## English
    For accounts created via quick_login (no password), set an initial
    password. Rejects if the account already has one (use /user/change_password).
  operationId: setPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [new_pwd]
          properties:
            new_pwd:
              type: string
              description: 新密码 / New password.
            rsa_encrypt:
              $ref: '../../components/schemas/RsaEncryptFlag.yaml'
  responses:
    '200':
      description: 设置成功（无 payload）
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: 账号已设密码 / 密码强度不足
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
