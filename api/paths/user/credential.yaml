# ----------------------------------------------------------------------------
# imboy/api/paths/user/credential.yaml
# GET /user/credential — 获取 WebRTC 凭证 / Issue WebRTC TURN credentials
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 6 / D-user-core)
# 调用方:  api/openapi.yaml#/paths/~1user~1credential
# Handler: src/api/user_handler.erl#credential/2
# 算法：base64(sha1_HMAC(timestamp:username, secret-key))
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 获取 WebRTC TURN 凭证
  description: |
    ## 中文
    生成 WebRTC 连接所需的临时 TURN 凭证（time-limited credentials, RFC 7635 风格）。
    用于音视频通话前的 ICE 候选收集。
    副作用：无（无状态计算）。
    ## English
    Generate time-limited TURN credentials for WebRTC ICE gathering before
    voice / video calls. Stateless.
  operationId: getWebrtcCredential
  responses:
    '200':
      description: 返回 username / credential / ttl 等字段
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
    '4XX':
      description: 未鉴权 / 账号被冻结
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
