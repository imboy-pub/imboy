# GET /adm/storage/orphan — admin
get:
  tags: [admin]
  summary: 管理后台孤儿文件列表
  operationId: adm_storage_orphan
  parameters:
    - in: query
      name: age_days
      required: false
      schema: { type: integer, default: 30 }
      description: 孤立天数阈值 / Orphan age threshold in days
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
