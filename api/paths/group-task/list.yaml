# GET /v1/group/task/list
get:
  tags: [user]
  summary: 群任务列表
  description: |
    ## 中文 / English
    群任务列表
    Group task list
  operationId: listGroupTask
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: string }
    - in: query
      name: status
      required: false
      schema: { type: string, enum: [pending, in_progress, submitted, approved, rejected] }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
