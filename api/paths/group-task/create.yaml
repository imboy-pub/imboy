# POST /v1/group/task/create
post:
  tags: [user]
  summary: 群任务 - 创建
  description: |
    ## 中文 / English
    群任务 - 创建
    Create group task
  operationId: createGroupTask
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [group_id, title]
          properties:
            group_id: { type: integer, minimum: 1 }
            title: { type: string, maxLength: 200 }
            description: { type: string }
            deadline: { type: string }
            user_ids: { type: array, items: { type: string } }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
