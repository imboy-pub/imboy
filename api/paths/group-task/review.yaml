# POST /v1/group/task/review
post:
  tags: [user]
  summary: 批改作业（按分配评分）
  description: |
    ## 中文 / English
    批改作业（按分配评分）——对某次任务分配进行评分与评语。
    Grade an assignment by assignment_id with a numeric score and optional comment.
  operationId: reviewGroupTask
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [assignment_id]
          properties:
            assignment_id: { type: string, description: '任务分配 ID（TSID string）' }
            score: { type: integer, description: '评分（整数，范围由业务定义）' }
            comment: { type: string, description: '评语' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
