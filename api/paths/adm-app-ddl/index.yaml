# GET /adm/app_ddl/index — admin
get:
  tags: [admin]
  summary: admin adm-app-ddl - index
  description: |
    ## 中文 / English
    管理后台 adm-app-ddl handler 的 `index` 动作；路径 `/adm/app_ddl/index`。
    Admin handler `adm-app-ddl`, action `index`. Path `/adm/app_ddl/index`.
  operationId: adm_app_ddl_index
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: DDL 配置列表
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                            ddl:
                              type: string
                              description: 升级 DDL SQL
                            down_ddl:
                              type: string
                              description: 回滚 DDL SQL
                            old_vsn:
                              type: string
                              description: 旧版本号
                            new_vsn:
                              type: string
                              description: 新版本号
                            status:
                              type: integer
                            updated_at:
                              type: string
                            created_at:
                              type: string
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
