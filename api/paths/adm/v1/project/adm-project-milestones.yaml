get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: Admin 项目里程碑分页
  description: 需 workspaces:read。按状态筛选里程碑，total 来自独立 COUNT 查询。 / Read-only milestones with real total count.
  operationId: admProjectMilestones
  parameters:
  - name: project_id
    description: 查询目标项目 ID / Project ID to query
    in: query
    required: true
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: status
    description: 状态筛选，默认 all；取值见 enum / Status filter, defaults to all; allowed values are in enum
    in: query
    schema:
      type: string
      enum:
      - all
      - planned
      - reached
      default: all
  - name: page
    description: 分页页码，默认1 / Page number, defaults to 1
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    description: 每页条数，服务端默认20；聚合pinned/activity下钳制至50 / Page size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 里程碑分页；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/WorkspaceProject.yaml#/$defs/ProjectMilestones
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: project_id 缺失（400）/ ACL（403）
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
