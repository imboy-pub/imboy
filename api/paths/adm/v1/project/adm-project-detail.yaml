get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: Admin 项目详情
  description: 需 workspaces:read。基本项目字段、workspace 概要、owner、task_stats 和 assignees（最多20人）。成员/频道等通过独立治理端点读取。 / Read-only
    project detail with task and assignee summaries.
  operationId: admProjectDetail
  parameters:
  - name: project_id
    description: 查询目标项目 ID / Project ID to query
    in: query
    required: true
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  responses:
    '200':
      description: 项目详情；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/WorkspaceProject.yaml#/$defs/ProjectDetail
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: project_id 缺失（400）/ ACL（403）
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
