# GET /api/adm/project/channels — 项目关联频道分页（Admin 治理只读，W2）
get:
  tags: [admin]
  summary: Admin 项目关联频道分页
  description: |
    ## 中文
    W2 治理只读面：项目已关联频道分页（workspaces:read ACL，fail-closed）。
    ## English
    W2 governance read surface: paginated channels linked to the project.
  operationId: admProjectChannels
  parameters:
    - name: project_id
      description: 查询目标项目 ID / Project ID to query
      in: query
      required: true
      schema: { type: integer, format: int64 }
    - name: page
      description: 分页页码，默认1 / Page number, defaults to 1
      in: query
      schema: { type: integer, default: 1 }
    - name: size
      description: 每页条数，默认10 / Items per page, defaults to 10
      in: query
      schema: { type: integer, default: 10 }
  responses:
    '200':
      description: 频道分页
      content:
        application/json:
          schema: { $ref: '../../../../components/schemas/Envelope.yaml' }
    '4XX':
      description: project_id 缺失（400）/ ACL（403）
      content:
        application/json:
          schema: { $ref: '../../../../components/schemas/Envelope.yaml' }
