get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: Admin 项目关联频道分页
  description: '## 中文

    W2 治理只读面：项目已关联频道分页（workspaces:read ACL，fail-closed）。

    ## English

    W2 governance read surface: paginated channels linked to the project.

    '
  operationId: admProjectChannels
  parameters:
  - name: project_id
    description: 查询目标项目 ID / Project ID to query
    in: query
    required: true
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: page
    description: 分页页码，默认1 / Page number, defaults to 1
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    description: 每页条数，服务端默认20；聚合pinned/activity下钳制至50 / Page size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 频道分页；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/WorkspaceProject.yaml#/$defs/ProjectChannels
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: project_id 缺失（400）/ ACL（403）
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
