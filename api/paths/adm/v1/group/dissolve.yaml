post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-group - dissolve
  description: '## 中文 / English

    管理后台 adm-group handler 的 `dissolve` 动作；路径 `/api/adm/group/dissolve`。

    Admin handler `adm-group`, action `dissolve`. Path `/api/adm/group/dissolve`.

    '
  operationId: adm_group_dissolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - gid
          properties:
            gid:
              type: integer
              description: 解散目标群组 ID / Target group ID to dissolve
          additionalProperties: false
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
