post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-logout-apply - reject
  description: '## 中文 / English

    管理后台 adm-logout-apply handler 的 `reject` 动作；路径 `/api/adm/user/logout_apply/reject`。

    Admin handler `adm-logout-apply`, action `reject`. Path `/api/adm/user/logout_apply/reject`.

    '
  operationId: adm_logout_apply_reject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      uid:
                        type: string
                        description: 用户 ID（TSID 转字符串）
                      status:
                        type: string
                        enum:
                        - rejected
                        description: 驳回状态
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
