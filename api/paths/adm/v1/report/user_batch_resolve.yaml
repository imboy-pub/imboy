post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-report - user_batch_resolve
  description: '## 中文 / English

    管理后台 adm-report handler 的 `user_batch_resolve` 动作；路径 `/api/adm/user/report/batch_resolve`。

    Admin handler `adm-report`, action `user_batch_resolve`. Path `/api/adm/user/report/batch_resolve`.

    '
  operationId: adm_report_user_batch_resolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 批量处理结果 / Batch resolve result
                    properties:
                      success_count:
                        type: integer
                      failed_count:
                        type: integer
                      failed_ids:
                        type: array
                        items:
                          type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
