post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-report - batch_resolve
  description: '## 中文 / English

    管理后台 adm-report handler 的 `batch_resolve` 动作；路径 `/api/adm/report/batch_resolve`。

    Admin handler `adm-report`, action `batch_resolve`. Path `/api/adm/report/batch_resolve`.

    权限 reports:handle 或 moments:report:handle / Permission: reports:handle or moments:report:handle.

    省略 target_type 默认 moment；ID 去重，逐条处理，非原子事务 / Missing target_type defaults to moment; IDs are deduplicated and
    resolved individually, not atomically.

    '
  operationId: adm_report_batch_resolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
          required:
          - report_ids
          - result
          properties:
            target_type:
              type: string
              enum:
              - moment
              - group
              - channel
              - user
              - message
              description: 举报目标类型 / Report target type
            report_ids:
              type: array
              minItems: 1
              items:
                oneOf:
                - type: integer
                  format: int64
                  minimum: 1
                - type: string
                  pattern: ^[1-9][0-9]*$
            result:
              type: integer
              enum:
              - 1
              - 2
              description: 1 无违规，2 违规确认 / 1 dismiss, 2 confirm violation
            note:
              type: string
              default: ''
              description: 备注；非 moment 最多保留500字符 / Note; non-moment notes are capped at 500 characters
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 批量处理结果 / Batch resolve result
                    properties:
                      success_count:
                        type: integer
                        description: 成功处理条数 / Successfully resolved count
                      failed_count:
                        type: integer
                        description: 失败条数 / Failed count
                      failed_ids:
                        type: array
                        description: 失败的举报 ID 列表 / Failed report IDs
                        items:
                          type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
