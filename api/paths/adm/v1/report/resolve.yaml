post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-report - resolve
  description: '## 中文 / English

    管理后台 adm-report handler 的 `resolve` 动作；路径 `/api/adm/report/resolve`。

    Admin handler `adm-report`, action `resolve`. Path `/api/adm/report/resolve`.

    权限 reports:handle 或 moments:report:handle / Permission: reports:handle or moments:report:handle.

    moment 必须显式指定类型；其余工单可从工单记录推断类型 / Specify moment explicitly; other ticket types may be inferred from the stored
    ticket.

    '
  operationId: adm_report_resolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
          required:
          - report_id
          - result
          properties:
            target_type:
              type: string
              enum:
              - moment
              - group
              - channel
              - user
              - message
              description: 举报目标类型 / Report target type
            report_id:
              oneOf:
              - type: integer
                format: int64
                minimum: 1
              - type: string
                pattern: ^[1-9][0-9]*$
            result:
              type: integer
              enum:
              - 1
              - 2
              description: 1 无违规，2 违规确认 / 1 dismiss, 2 confirm violation
            note:
              type: string
              default: ''
              description: 备注；非 moment 最多保留500字符 / Note; non-moment notes are capped at 500 characters
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 处理成功，payload 为空对象 / Empty object on success
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
