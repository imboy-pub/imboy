# GET /api/adm/report/list — admin
get:
  tags: [admin]
  summary: admin adm-report - list
  description: |
    ## 中文 / English
    管理后台 adm-report handler 的 `list` 动作；路径 `/adm/report/list`。
    Admin handler `adm-report`, action `list`. Path `/adm/report/list`.
    权限 reports:read 或 moments:report:read；moment 查询仅使用状态及分页，其他筛选仅对非 moment 生效。
    Permission: reports:read or moments:report:read. Moment queries use status and pagination only; other filters apply to non-moment tickets.
  operationId: adm_report_list
  parameters:
    - $ref: '../../../../components/parameters/PaginationPage.yaml'
    - $ref: '../../../../components/parameters/PaginationSize.yaml'
    - in: query
      name: target_type
      description: 举报目标类型；省略时查询 moment / Report target type; defaults to moment
      schema:
        type: string
        enum:
        - moment
        - group
        - channel
        - user
        - message
        description: 举报目标类型 / Report target type
        default: moment
    - in: query
      name: status
      description: 处理状态；-1 查询全部 / Resolution status; -1 selects all
      schema:
        type: integer
        default: -1
        description: -1 全部，0 待处理，1 无违规，2 违规 / -1 all, 0 pending, 1 dismissed, 2 confirmed
    - in: query
      name: target_id
      description: 被举报对象 ID，仅非 moment 生效 / Target ID; non-moment only
      schema:
        oneOf:
        - type: integer
          format: int64
          minimum: 1
        - type: string
          pattern: ^[1-9][0-9]*$
    - in: query
      name: reporter_uid
      description: 举报人员 ID，仅非 moment 生效 / Reporter ID; non-moment only
      schema:
        oneOf:
        - type: integer
          format: int64
          minimum: 1
        - type: string
          pattern: ^[1-9][0-9]*$
    - in: query
      name: keyword
      description: 关键字，仅非 moment 生效 / Search keyword; non-moment only
      schema:
        type: string
        description: 非 moment 检索关键字，最多128字符 / Non-moment search keyword, capped at 128 characters
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 举报工单分页列表（target_type=auto，默认 moment）/ Paginated report ticket list
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: 举报工单 TSID / Report ticket TSID
                            target_type:
                              type: string
                              description: 举报目标类型 moment/group/channel/user/message / Target type
                            target_id:
                              type: integer
                              format: int64
                              description: 被举报目标 TSID（message 时为服务端消息行 ID）/ Target TSID
                            target_sub_type:
                              type: string
                              enum: ['', c2c, c2g, channel]
                              description: message 举报的消息表面 / Message surface (R-01)
                            target_scope_id:
                              type: integer
                              format: int64
                              description: c2c=对话对端 uid；c2g=群 ID；channel=频道 ID / Scope TSID (R-01)
                            target_author_id:
                              type: integer
                              format: int64
                              description: 被举报消息发送者 / Reported message author (R-01)
                            reporter_uid:
                              type: integer
                              format: int64
                              description: 举报人 TSID / Reporter TSID
                            reason:
                              type: string
                              description: 举报原因 / Reason
                            description:
                              type: string
                              description: 详情描述 / Description
                            evidence:
                              type: object
                              description: 结构化证据（R-01，白名单字段；详情见 detail 端点）/ Structured evidence (R-01)
                            status:
                              type: integer
                              description: 状态 0=待处理 1=无违规 2=违规 / Status
                            handled_by:
                              type: integer
                              format: int64
                              description: 处理管理员 TSID / Handler TSID
                            handled_at:
                              type: string
                              description: 处理时间 / Handled at
                            created_at:
                              type: string
                            updated_at:
                              type: string
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../../../components/schemas/Envelope.yaml' } }
