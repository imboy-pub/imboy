get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 管理员操作日志 / Administrator operation logs
  description: 需 audit:read。无total字段；按created_at倒序。 / Administrator operation logs
  operationId: admAuditOperationLogsGet
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: adm_user_id
    in: query
    required: false
    description: adm_user_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: action
    in: query
    required: false
    description: action
    schema:
      type: string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            adm_user_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            action:
                              type: string
                            target_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            target_type:
                              type: string
                            detail:
                              description: 审计JSON / Audit details
                            ip:
                              type: string
                            created_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
