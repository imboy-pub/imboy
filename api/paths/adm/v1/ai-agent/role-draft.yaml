post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 保存AI角色草稿 / Save AI role draft
  description: 需 users:update。 / Save AI role draft 保存完整草稿，已有草稿也使用缺省description为空、status=1、version=1、capabilities为空及默认knowledge_policy覆盖；这不是部分更新。调用方应显式提交希望保留的完整草稿字段。
  operationId: admAiAgentRoleDraftPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            role_code:
              type: string
            name:
              type: string
              minLength: 1
            description:
              type: string
            status:
              type: integer
            version:
              type: integer
              minimum: 1
              default: 1
            system_prompt:
              type: string
              minLength: 1
            capabilities:
              type: object
              properties:
                knowledge:
                  type: boolean
                group_reply:
                  type: boolean
                proactive:
                  type: boolean
            knowledge_policy:
              type: object
              properties:
                knowledge:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - on_demand
                      - required
                    source:
                      type: string
                      enum:
                      - all
                      - faq
                      - group_rule
                    max_context_bytes:
                      type: integer
                      minimum: 0
                      maximum: 8000
                group_reply:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - mention_only
                proactive:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - welcome_only
                    daily_limit:
                      type: integer
                      minimum: 0
                      maximum: 1000
          required:
          - role_code
          - name
          - system_prompt
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            role_code:
              type: string
            name:
              type: string
              minLength: 1
            description:
              type: string
            status:
              type: integer
            version:
              type: integer
              minimum: 1
              default: 1
            system_prompt:
              type: string
              minLength: 1
            capabilities:
              type: object
              properties:
                knowledge:
                  type: boolean
                group_reply:
                  type: boolean
                proactive:
                  type: boolean
            knowledge_policy:
              type: object
              properties:
                knowledge:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - on_demand
                      - required
                    source:
                      type: string
                      enum:
                      - all
                      - faq
                      - group_rule
                    max_context_bytes:
                      type: integer
                      minimum: 0
                      maximum: 8000
                group_reply:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - mention_only
                proactive:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - 'off'
                      - welcome_only
                    daily_limit:
                      type: integer
                      minimum: 0
                      maximum: 1000
          required:
          - role_code
          - name
          - system_prompt
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          minimum: 1
                          description: JSON int64；客户端需无损解析 / Preserve bigint precision
                        role_code:
                          type: string
                        version:
                          type: integer
                        state:
                          type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
