get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: AI知识库配置 / AI knowledge configuration
  description: 需 users:read。 / AI knowledge configuration
  operationId: admAiAgentKnowledgeConfigGet
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      group_rule:
                        type: string
                        description: 最多8000 UTF-8字节
                      faq:
                        type: string
                        description: 最多8000 UTF-8字节
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 更新AI知识库配置 / Update AI knowledge configuration
  description: 需 users:update。半量保存，未知键忽略；成功返回最新全量配置。 / Update AI knowledge configuration
  operationId: admAiAgentKnowledgeConfigPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            enabled:
              type: boolean
            group_rule:
              type: string
              description: 最多8000 UTF-8字节
            faq:
              type: string
              description: 最多8000 UTF-8字节
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            enabled:
              type: boolean
            group_rule:
              type: string
              description: 最多8000 UTF-8字节
            faq:
              type: string
              description: 最多8000 UTF-8字节
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      group_rule:
                        type: string
                        description: 最多8000 UTF-8字节
                      faq:
                        type: string
                        description: 最多8000 UTF-8字节
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
