post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 启停AI助手 / Set AI agent status
  description: 需 users:update。 / Set AI agent status
  operationId: admAiAgentSetStatusPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            user_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            status:
              type: integer
              enum:
              - 0
              - 1
          required:
          - user_id
          - status
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            user_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            status:
              type: integer
              enum:
              - 0
              - 1
          required:
          - user_id
          - status
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
