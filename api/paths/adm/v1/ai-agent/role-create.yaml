post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 创建AI角色模板 / Create AI role template
  description: 需 users:create。只创建角色身份元数据；行为配置通过draft保存并publish发布。created_by来自管理员会话。 / Create AI role template
  operationId: admAiAgentRoleCreatePost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            description:
              type: string
            status:
              type: integer
              enum:
              - 0
              - 1
              default: 1
          required:
          - code
          - name
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            description:
              type: string
            status:
              type: integer
              enum:
              - 0
              - 1
              default: 1
          required:
          - code
          - name
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      code:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      status:
                        type: integer
                      active_version:
                        type:
                        - integer
                        - 'null'
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
