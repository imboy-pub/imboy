get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: AI助手详情 / AI agent detail
  description: 需 users:read。 / AI agent detail
  operationId: admAiAgentDetailGet
  parameters:
  - name: user_id
    in: query
    required: true
    description: user_id
    schema:
      type: integer
      format: int64
      minimum: 1
      description: JSON int64；客户端需无损解析 / Preserve bigint precision
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/AIAgent.yaml#/$defs/Agent
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
