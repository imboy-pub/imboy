post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 启停AI角色 / Set AI role status
  description: 需 users:update。成功payload为受影响行数。 / Set AI role status
  operationId: admAiAgentRoleSetStatusPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            role_code:
              type: string
            status:
              type: integer
              enum:
              - 0
              - 1
          required:
          - role_code
          - status
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            role_code:
              type: string
            status:
              type: integer
              enum:
              - 0
              - 1
          required:
          - role_code
          - status
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
