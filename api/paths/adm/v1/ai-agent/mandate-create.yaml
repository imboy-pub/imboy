post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 创建AI代付授权 / Create agent payment mandate
  description: 需 finance:write。金额为分；目标必须为启用且绑定owner的Agent，同Agent已有有效授权会先撤销。 / Create agent payment mandate
  operationId: admAiAgentMandateCreatePost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            agent_uid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            max_amount_fen:
              type: integer
              minimum: 1
            max_total_fen:
              type: integer
              minimum: 1
            expires_in_secs:
              type: integer
              minimum: 1
            period_secs:
              type: integer
              minimum: 1
              default: 86400
          required:
          - agent_uid
          - max_amount_fen
          - max_total_fen
          - expires_in_secs
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            agent_uid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            max_amount_fen:
              type: integer
              minimum: 1
            max_total_fen:
              type: integer
              minimum: 1
            expires_in_secs:
              type: integer
              minimum: 1
            period_secs:
              type: integer
              minimum: 1
              default: 86400
          required:
          - agent_uid
          - max_amount_fen
          - max_total_fen
          - expires_in_secs
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
