get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 管理后台群任务详情
  description: 获取指定群任务的详细信息（管理员视角）。Get group task details (admin view).
  operationId: adm_group_task_detail
  parameters:
  - in: query
    name: task_id
    required: true
    schema:
      type: string
    description: 任务 ID
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 详情对象（字段以对应表/handler 为准）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
