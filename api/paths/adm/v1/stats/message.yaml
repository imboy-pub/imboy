get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-stats - message
  description: '## 中文 / English

    管理后台 adm-stats handler 的 `message` 动作；路径 `/api/adm/stats/message`。

    Admin handler `adm-stats`, action `message`. Path `/api/adm/stats/message`.

    '
  operationId: adm_stats_message
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      daily_c2c:
                        type: array
                        description: 每日 C2C 消息趋势（近 days 天）
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
                      daily_c2g:
                        type: array
                        description: 每日 C2G 消息趋势（近 days 天）
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
