post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 接受后台体验事件 / Accept admin UX events
  description: 需 ux:events:ingest。 / Accept admin UX events
  operationId: admStatsUxEventsPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            events:
              type: array
              items: {}
              description: 不透明事件批次；本入口仅统计数量 / Opaque batch; this endpoint counts entries
          required:
          - events
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            events:
              type: array
              items: {}
              description: 不透明事件批次；本入口仅统计数量 / Opaque batch; this endpoint counts entries
          required:
          - events
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      accepted:
                        type: integer
                        minimum: 0
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
