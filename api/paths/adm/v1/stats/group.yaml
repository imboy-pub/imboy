get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-stats - group
  description: '## 中文 / English

    管理后台 adm-stats handler 的 `group` 动作；路径 `/api/adm/stats/group`。

    Admin handler `adm-stats`, action `group`. Path `/api/adm/stats/group`.

    '
  operationId: adm_stats_group
  parameters:
  - name: days
    in: query
    required: false
    schema:
      type: integer
      default: 7
    description: 统计天数 / Number of days to aggregate
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      daily_new:
                        type: array
                        description: 每日新建群组趋势（近 days 天）
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
                      public_groups:
                        type: integer
                        description: 公开群数量（type=1）
                      private_groups:
                        type: integer
                        description: 私密群数量（type=2）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
