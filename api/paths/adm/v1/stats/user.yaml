get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-stats - user
  description: '## 中文 / English

    管理后台 adm-stats handler 的 `user` 动作；路径 `/api/adm/stats/user`。

    Admin handler `adm-stats`, action `user`. Path `/api/adm/stats/user`.

    '
  operationId: adm_stats_user
  parameters:
  - name: days
    in: query
    required: false
    schema:
      type: integer
      default: 7
    description: 统计天数 / Number of days to aggregate
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      daily_new:
                        type: array
                        description: 每日新增用户趋势（近 days 天）
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
                      active_users:
                        type: integer
                        description: 正常状态用户数（status=1）
                      banned_users:
                        type: integer
                        description: 封禁用户数（status=0）
                      deleted_users:
                        type: integer
                        description: 已删除用户数（status=-1）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
