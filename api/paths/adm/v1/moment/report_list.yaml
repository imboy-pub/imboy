get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-moment - report_list
  description: '## 中文 / English

    管理后台 adm-moment handler 的 `report_list` 动作；路径 `/api/adm/moment/report/list`。

    Admin handler `adm-moment`, action `report_list`. Path `/api/adm/moment/report/list`.

    '
  operationId: adm_moment_report_list
  parameters:
  - $ref: ../../../../components/parameters/PaginationPage.yaml
  - $ref: ../../../../components/parameters/PaginationSize.yaml
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 动态举报分页列表 / Paginated moment report list
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: 举报记录 TSID / Report TSID
                            post_id:
                              type: integer
                              format: int64
                              description: 被举报动态 TSID / Reported moment TSID
                            reporter_uid:
                              type: integer
                              format: int64
                              description: 举报人 TSID / Reporter TSID
                            reason:
                              type: string
                              description: 举报原因 / Reason
                            description:
                              type: string
                              description: 举报详情 / Description
                            status:
                              type: integer
                              description: 状态 0=待处理 1=无违规 2=违规删除 / Status
                            handled_by:
                              type: integer
                              format: int64
                              description: 处理管理员 TSID / Handler admin TSID
                            handled_at:
                              type: string
                              description: 处理时间 / Handled at
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            target_type:
                              type: string
                              description: 固定为 moment / Always "moment"
                            target_id:
                              type: integer
                              format: int64
                              description: 等同 post_id / Same as post_id
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
