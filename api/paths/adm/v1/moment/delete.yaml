post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-moment - delete
  description: '## 中文 / English

    管理后台 adm-moment handler 的 `delete` 动作；路径 `/api/adm/moment/delete`。

    Admin handler `adm-moment`, action `delete`. Path `/api/adm/moment/delete`.

    '
  operationId: adm_moment_delete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功（payload 为空对象）/ Success (empty payload)；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 删除成功，payload 为空对象 / Empty object on success
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
