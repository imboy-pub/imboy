get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-admin - config_policy（读取策略）
  description: '## 中文 / English

    管理后台 adm-admin handler 的 `config_policy` 动作；路径 `/api/adm/admin/config/policy`。

    Admin handler `adm-admin`, action `config_policy`. Path `/api/adm/admin/config/policy`.

    '
  operationId: adm_admin_config_policy_get
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 当前有效策略对象（effective_view / saved_view）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
