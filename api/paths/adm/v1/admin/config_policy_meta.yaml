get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-admin - config_policy_meta
  description: '## 中文 / English

    管理后台 adm-admin handler 的 `config_policy_meta` 动作；路径 `/api/adm/admin/config/policy/meta`。

    Admin handler `adm-admin`, action `config_policy_meta`. Path `/api/adm/admin/config/policy/meta`.

    '
  operationId: adm_admin_config_policy_meta
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 策略元数据（meta_view 视图，描述各策略字段类型与默认值）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
