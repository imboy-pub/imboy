post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 执行举报处置 / Execute report action
  description: 需 reports:handle。按动作条件提供target_uid/gid/target_type/target_id/duration_minutes；处置原因进入审计。 / Execute
    report action
  operationId: admReportActionExecutePost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            case_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            action:
              type: string
              enum:
              - warning
              - group_mute
              - group_kick
              - reject
              - account_restrict
              - content_removal
            target_uid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            reason:
              type: string
            gid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            duration_minutes:
              type: integer
              minimum: 0
            target_type:
              type: string
            target_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
          required:
          - case_id
          - action
          - reason
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            case_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            action:
              type: string
              enum:
              - warning
              - group_mute
              - group_kick
              - reject
              - account_restrict
              - content_removal
            target_uid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            reason:
              type: string
            gid:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            duration_minutes:
              type: integer
              minimum: 0
            target_type:
              type: string
            target_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
          required:
          - case_id
          - action
          - reason
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      case_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      action:
                        type: string
                      target_type:
                        type: string
                      target_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      target_uid:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      scope:
                        description: 动作范围JSON / Action scope JSON
                      reason:
                        type: string
                      actor_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      status:
                        type: string
                      result:
                        description: 执行结果JSON / Execution result
                      fail_reason:
                        type:
                        - string
                        - 'null'
                      start_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
                      end_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
                      reversed_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
                      reversed_by:
                        type:
                        - integer
                        - 'null'
                        format: int64
                      reverse_reason:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
                      updated_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
