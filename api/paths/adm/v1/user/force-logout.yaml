post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 强制用户下线 / Force user logout
  description: 需 users:update。 / Force user logout
  operationId: admUserForceLogoutPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            user_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            uid:
              type: integer
              minimum: 1
              description: user_id兼容别名 / Alias
          anyOf:
          - required:
            - user_id
          - required:
            - uid
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            user_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            uid:
              type: integer
              minimum: 1
              description: user_id兼容别名 / Alias
          anyOf:
          - required:
            - user_id
          - required:
            - uid
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
