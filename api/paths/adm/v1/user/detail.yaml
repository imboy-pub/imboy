get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-user - detail
  description: '## 中文 / English

    管理后台 adm-user handler 的 `detail` 动作；路径 `/api/adm/user/detail`。

    Admin handler `adm-user`, action `detail`. Path `/api/adm/user/detail`.

    '
  operationId: adm_user_detail
  parameters:
  - name: uid
    in: query
    required: true
    description: 用户 ID / User ID
    schema:
      type: integer
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 用户详情（含关联统计）
                    properties:
                      id:
                        type: string
                        description: 用户 TSID（字符串）
                      account:
                        type: string
                      nickname:
                        type: string
                      mobile:
                        type: string
                      email:
                        type: string
                      avatar:
                        type: string
                      gender:
                        type: integer
                      region:
                        type: string
                      sign:
                        type: string
                      status:
                        type: integer
                        description: 0=封禁 1=正常
                      experience:
                        type: integer
                      created_at:
                        type: integer
                      device_count:
                        type: integer
                        description: 设备数
                      friend_count:
                        type: integer
                        description: 好友数
                      group_count:
                        type: integer
                        description: 群组数
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
