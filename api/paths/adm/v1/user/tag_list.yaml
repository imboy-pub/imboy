get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 管理后台用户标签列表
  description: 获取指定用户的标签列表，支持按场景、关键词筛选及分页。List a specified user's tags with optional filtering by scene, keyword,
    and pagination.
  operationId: adm_user_tag_list
  parameters:
  - in: query
    name: uid
    required: true
    schema:
      type: integer
    description: 用户 ID
  - in: query
    name: scene
    required: false
    schema:
      type: string
      default: friend
    description: 场景
  - in: query
    name: keyword
    required: false
    schema:
      type: string
    description: 搜索关键词
  - $ref: ../../../../components/parameters/PaginationPage.yaml
  - $ref: ../../../../components/parameters/PaginationSize.yaml
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          description: 记录对象（字段以对应表/handler 为准）
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
