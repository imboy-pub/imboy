get:
  security: []
  tags:
  - admin-setup
  summary: 查询首启向导状态
  description: '## 中文

    免鉴权。用于前端在 `/login` 挂载时决定是否跳转 `/setup`。

    ## English

    No auth. Called by the frontend on `/login` mount to decide whether

    to redirect to `/setup`.

    '
  operationId: getSetupStatus
  responses:
    '200':
      description: 状态查询成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    required:
                    - initialized
                    properties:
                      initialized:
                        type: boolean
                        description: true 表示系统已初始化，不应再进入向导
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 查询异常（服务端内部错误，正常情况此端点不应返回 4xx）
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
