post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 管理员角色 delete / Delete administrator role
  description: 需 roles:update。内置角色1/2/3不可处置；删除前要求无在用管理员。兼容别名，优先使用/api/adm/role/delete。 / Delete administrator role
  operationId: admRoleDeleteAliasPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            role_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            id:
              type: integer
              minimum: 1
              description: role_id缺失时的兼容字段 / Fallback alias
          anyOf:
          - required:
            - role_id
          - required:
            - id
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            role_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
            id:
              type: integer
              minimum: 1
              description: role_id缺失时的兼容字段 / Fallback alias
          anyOf:
          - required:
            - role_id
          - required:
            - id
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
  deprecated: true
