get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-feedback - index
  description: '## 中文 / English

    管理后台 adm-feedback handler 的 `index` 动作；路径 `/api/adm/feedback/index`。

    Admin handler `adm-feedback`, action `index`. Path `/api/adm/feedback/index`.

    '
  operationId: adm_feedback_index
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 反馈列表
                        items:
                          type: object
                          properties:
                            feedback_id:
                              type: string
                              description: 反馈 ID（TSID 转字符串）
                            user_id:
                              type: string
                              description: 用户 ID（TSID 转字符串）
                            device_id:
                              type: string
                            client_operating_system:
                              type: string
                            client_operating_system_vsn:
                              type: string
                            type:
                              type: integer
                            rating:
                              type: integer
                            contact_detail:
                              type: string
                            body:
                              type: string
                            attach:
                              type: string
                            reply_count:
                              type: integer
                            status:
                              type: integer
                            updated_at:
                              type: string
                            created_at:
                              type: string
                            app_vsn:
                              type: string
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
