post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 修改应用状态 / Change application status
  description: 需 enterprise_business:write。expected_version为乐观锁版本，冲突业务码409。 / Change application status
  operationId: admEnterpriseStatusPost
  parameters:
  - name: org_id
    in: path
    required: true
    description: org_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: application_id
    in: path
    required: true
    description: application_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              enum:
              - draft
              - active
              - disabled
              - archived
            expected_version:
              type: integer
              minimum: 1
          required:
          - status
          - expected_version
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      ok:
                        type: boolean
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
