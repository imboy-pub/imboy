get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 应用分页 / List enterprise applications
  description: 需 enterprise_business:read。 / List enterprise applications
  operationId: admEnterpriseApplicationsGet
  parameters:
  - name: org_id
    in: path
    required: true
    description: org_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
  - name: status
    in: query
    required: false
    description: status
    schema:
      type: string
  - name: q
    in: query
    required: false
    description: q
    schema:
      type: string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/adm/EnterpriseIntegration.yaml#/$defs/Application
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 创建应用 / Create enterprise application
  description: 需 enterprise_business:write。 / Create enterprise application
  operationId: admEnterpriseApplicationsPost
  parameters:
  - name: org_id
    in: path
    required: true
    description: org_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            application_key:
              type: string
              minLength: 8
              maxLength: 128
              description: 8-128 ASCII 字节，实例内全局唯一 / Instance-wide unique key
            name:
              type: string
              description: 1-128 UTF-8 字节且非全空白
            redirect_uris:
              type: array
              maxItems: 20
              uniqueItems: true
              items:
                type: string
                pattern: ^https://[^/?#][^#]*$
                maxLength: 2048
          required:
          - application_key
          - name
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/EnterpriseIntegration.yaml#/$defs/Application
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
