delete:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 撤销应用凭据 / Revoke credential
  description: 需 enterprise_business:write。 / Revoke credential
  operationId: admEnterpriseCredentialRevokeDelete
  parameters:
  - name: org_id
    in: path
    required: true
    description: org_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: application_id
    in: path
    required: true
    description: application_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: credential_id
    in: path
    required: true
    description: credential_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      ok:
                        type: boolean
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
