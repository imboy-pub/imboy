post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 签发目录连接凭据 / Issue directory credential
  description: 需 enterprise_business:write。 / Issue directory credential
  operationId: admEnterpriseDirectoryCredentialPost
  parameters:
  - name: application_id
    in: path
    required: true
    description: application_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            expires_at:
              type: string
              format: date-time
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            expires_at:
              type: string
              format: date-time
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/EnterpriseIntegration.yaml#/$defs/CredentialOnce
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
