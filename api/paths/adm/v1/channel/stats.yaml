get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-channel - stats
  description: '## 中文 / English

    管理后台 adm-channel handler 的 `stats` 动作；路径 `/api/adm/channel/{channel_id}/stats`。

    Admin handler `adm-channel`, action `stats`. Path `/api/adm/channel/{channel_id}/stats`.

    '
  operationId: adm_channel_stats
  parameters:
  - in: path
    name: channel_id
    required: true
    description: 频道 ID / Channel ID
    schema:
      type: string
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    description: 频道统计数据 / Channel statistics
                    properties:
                      channel_id:
                        type: integer
                        format: int64
                        description: 频道 ID / Channel ID
                      subscriber_count:
                        type: integer
                        description: 订阅人数 / Subscriber count
                      total_messages:
                        type: integer
                        description: 总消息数 / Total messages
                      total_views:
                        type: integer
                        description: 总阅读数 / Total views
                      total_reactions:
                        type: integer
                        description: 总互动数 / Total reactions
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
