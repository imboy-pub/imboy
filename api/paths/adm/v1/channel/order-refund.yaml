post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 退回频道订单 / Refund channel order
  description: 需 channel_order_refund。 / Refund channel order
  operationId: admChannelOrderRefundPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            order_no:
              type: string
              minLength: 1
            refund_reason:
              type: string
              minLength: 1
          required:
          - order_no
          - refund_reason
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            order_no:
              type: string
              minLength: 1
            refund_reason:
              type: string
              minLength: 1
          required:
          - order_no
          - refund_reason
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      order_no:
                        type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
