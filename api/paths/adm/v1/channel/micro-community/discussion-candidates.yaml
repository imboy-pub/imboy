get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - channel
  operationId: admListMicroCommunityCandidates
  summary: 平台候选空群 / Platform candidates
  description: channels:update与groups:update；list,total,page,size。 / Both platform permissions; list,total,page,size.
    所有新入口在phase1_delivery或channel关闭时拒绝；不可通过缓存绕过。业务错误仍HTTP 200，以code判断。 / New endpoints fail closed under phase1_delivery
    or disabled channel; business failures use HTTP 200 with nonzero code.
  parameters:
  - name: channel_id
    in: path
    required: true
    schema:
      $ref: ../../../../../openapi-adm.yaml#/components/schemas/MicroCommunityEntityId
    description: 频道业务实体 ID，保留完整十进制精度。
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 从 1 开始的页码。
  - name: size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 10
    description: 每页条数。
  responses:
    '200':
      description: '业务信封：code=0成功，非零失败。 / Business envelope: code 0 succeeds; nonzero fails.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: ../../../../../openapi-adm.yaml#/components/schemas/MicroCommunityCandidatePageEnvelope
            - $ref: ../../../../../openapi-adm.yaml#/components/schemas/MicroCommunityErrorEnvelope
  x-business-error-codes:
  - 400
  - 403
  - 404
  - 405
  - 500
