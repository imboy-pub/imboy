post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 处理提现 complete / Complete withdrawal
  description: 需 finance:write。仅待处理记录可操作，重复处理拒绝。 / Complete withdrawal
  operationId: admFinanceWithdrawalCompletePost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
          required:
          - id
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
          required:
          - id
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
