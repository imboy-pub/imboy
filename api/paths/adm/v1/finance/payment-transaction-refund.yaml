post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 退回支付交易 / Refund payment transaction
  description: 需 finance:write。充值和频道订单通过各自专用退款入口处理；此入口用于其余成功交易。 / Refund payment transaction
  operationId: admFinancePaymentTransactionRefundPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            trade_no:
              type: string
              minLength: 1
            refund_reason:
              type: string
          required:
          - trade_no
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            trade_no:
              type: string
              minLength: 1
            refund_reason:
              type: string
          required:
          - trade_no
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      trade_no:
                        type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
