get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-attach - index
  description: '## 中文 / English

    管理后台 adm-attach handler 的 `index` 动作；路径 `/api/adm/storage/index`。

    Admin handler `adm-attach`, action `index`. Path `/api/adm/storage/index`.

    '
  operationId: adm_attach_index
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 附件列表
                        items:
                          type: object
                          additionalProperties: true
                      total:
                        type: integer
                      page:
                        type: integer
                      size:
                        type: integer
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
