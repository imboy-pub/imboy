post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  deprecated: true
  tags:
  - admin
  summary: admin adm-attach - auth
  description: '## 中文 / English

    管理后台 adm-attach handler 的 `auth` 动作；路径 `/api/adm/attach/auth`。

    Admin handler `adm-attach`, action `auth`. Path `/api/adm/attach/auth`.

    '
  operationId: adm_attach_auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      uri:
                        type: array
                        description: 各 URI 授权检查结果列表
                        items:
                          type: object
                          additionalProperties: true
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
