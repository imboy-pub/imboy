get:
  security: []
  tags:
  - admin
  summary: 登录验证码 / Login captcha
  description: 返回 PNG 并设置 captcha_key Cookie。登录请求必须回传该 Cookie。 / Returns PNG and captcha_key cookie required by
    login.
  operationId: adm_passport_captcha
  responses:
    '200':
      description: 返回 PNG 验证码图片；同时通过 Set-Cookie 写入 captcha_key（HttpOnly）
      content:
        image/png:
          schema:
            type: string
            format: binary
      headers:
        Set-Cookie:
          description: captcha_key；HttpOnly、SameSite=Lax，TLS 时 Secure
          schema:
            type: string
    '503':
      description: ImageMagick convert 未安装时返回 JSON 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
              msg:
                type: string
              hint:
                type: string
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
