get:
  security: []
  tags:
  - admin
  summary: 登录元数据 / Login metadata
  description: 登录元数据 / Login metadata
  operationId: adm_passport_meta
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      system_name:
                        type: string
                      csrf_token:
                        type: string
                      public_key:
                        type: string
                    required:
                    - system_name
                    - csrf_token
                    - public_key
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
