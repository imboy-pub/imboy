get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: MCP客户端列表 / MCP clients
  description: 需 mcp_clients:read。当前列表按status过滤。 / MCP clients
  operationId: admMcpClientsGet
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
  - name: status
    in: query
    required: false
    description: status
    schema:
      type: string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            client_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            owner_uid:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            name:
                              type: string
                            description:
                              type: string
                            status:
                              type: string
                            reason:
                              type: string
                            created_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                            approved_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
