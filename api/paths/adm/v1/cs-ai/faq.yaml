get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 客服FAQ列表 / List customer service FAQs
  description: 需 customer_service:read。未编译 customer_service 时返回 not found（业务码404）；业务错误遵循现有HTTP200信封。返回数组，page/size转换为limit/offset，不含分页总数。响应投影不含status；embedded是向量可用标志，不返回embedding。
    / Requires the customer_service build feature and platform permission.
  operationId: admCsAiFaq
  parameters:
  - name: org_id
    in: query
    required: true
    description: 组织业务归属 ID / Organization business ID
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
  - name: intent
    in: query
    required: false
    description: intent
    schema:
      type: string
      default: ''
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: array
                    items:
                      $ref: ../../../../components/schemas/adm/CustomerServiceAI.yaml#/$defs/FAQ
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
