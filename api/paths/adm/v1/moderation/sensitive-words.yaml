get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 敏感词分页 / Sensitive words
  description: 需 reports:read。 / Sensitive words
  operationId: admModerationSensitiveWordsGet
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
  - name: category
    in: query
    required: false
    description: category
    schema:
      type: string
  - name: keyword
    in: query
    required: false
    description: keyword
    schema:
      type: string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            word:
                              type: string
                            category:
                              type: string
                            severity:
                              type: string
                            created_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 新增敏感词 / Add sensitive word
  description: 需 reports:handle。 / Add sensitive word
  operationId: admModerationSensitiveWordsPost
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            word:
              type: string
              minLength: 1
            category:
              type: string
              default: custom
            severity:
              type: string
              default: medium
          required:
          - word
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            word:
              type: string
              minLength: 1
            category:
              type: string
              default: custom
            severity:
              type: string
              default: medium
          required:
          - word
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      word:
                        type: string
                      category:
                        type: string
                      severity:
                        type: string
                      created_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 毫秒 / Unix milliseconds
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
