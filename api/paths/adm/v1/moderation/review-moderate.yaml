post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 人工复审内容 / Moderate queued content
  description: 需 reports:handle。reject会尝试联动撤下内容；审核判定保存成功不等同所有下游撤下动作完成。 / Moderate queued content
  operationId: admModerationReviewModeratePost
  parameters:
  - name: id
    in: path
    required: true
    description: id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            action:
              type: string
              enum:
              - approve
              - reject
            reason:
              type: string
          required:
          - action
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            action:
              type: string
              enum:
              - approve
              - reject
            reason:
              type: string
          required:
          - action
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties: {}
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
