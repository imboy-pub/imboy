post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-plugin - enable
  description: '## 中文 / English

    管理后台 adm-plugin handler 的 `enable` 动作；路径 `/api/adm/plugin/enable`。

    Admin handler `adm-plugin`, action `enable`. Path `/api/adm/plugin/enable`.

    '
  operationId: adm_plugin_enable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: 插件名称 / Plugin name
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 插件名称
                      state:
                        type: string
                        enum:
                        - enabled
                        description: 插件状态
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
