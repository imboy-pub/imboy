get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-plugin - state_query
  description: '## 中文 / English

    管理后台 adm-plugin handler 的 `state_query` 动作；路径 `/api/adm/plugin/state`。

    Admin handler `adm-plugin`, action `state_query`. Path `/api/adm/plugin/state`.

    '
  operationId: adm_plugin_state_query
  parameters:
  - name: name
    in: query
    required: true
    schema:
      type: string
    description: 插件名称 / Plugin name
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 插件当前状态对象（imboy_plugin_manager:get_state 返回）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
