post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-plugin - upgrade
  description: '## 中文 / English

    管理后台 adm-plugin handler 的 `upgrade` 动作；路径 `/api/adm/plugin/upgrade`。

    Admin handler `adm-plugin`, action `upgrade`. Path `/api/adm/plugin/upgrade`.

    '
  operationId: adm_plugin_upgrade
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 插件名称
                      version:
                        type: string
                        description: 升级目标版本
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
