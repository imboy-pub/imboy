get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-plugin - health
  description: '## 中文 / English

    管理后台 adm-plugin handler 的 `health` 动作；路径 `/api/adm/plugin/health`。

    Admin handler `adm-plugin`, action `health`. Path `/api/adm/plugin/health`.

    '
  operationId: adm_plugin_health
  parameters:
  - name: name
    in: query
    required: true
    schema:
      type: string
    description: 插件名称 / Plugin name
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: 插件健康检查结果（imboy_plugin_manager:health_check 返回）
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
