get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - bots
  summary: Bot list / Platform bot list
  description: 需 bots:read；返回不包含 api_token/verify_token。 / Tokens are omitted; feature availability follows deployment
    manifest.
  operationId: admBotList
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            name:
                              type: string
                            username:
                              type: string
                            description:
                              type: string
                            owner_uid:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            is_public:
                              type: boolean
                            status:
                              type: integer
                            nickname:
                              type: string
                            avatar:
                              type: string
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
