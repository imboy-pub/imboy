post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - bots
  summary: Bot disable / Platform bot disable
  description: 需 bots:update；平台处置不检查属主；返回不包含 api_token/verify_token。 / Tokens are omitted; feature availability
    follows deployment manifest.
  operationId: admBotDisable
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            bot_id:
              type: integer
              format: int64
              minimum: 1
              description: JSON int64；客户端需无损解析 / Preserve bigint precision
          required:
          - bot_id
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      status:
                        type: integer
                        const: 0
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
