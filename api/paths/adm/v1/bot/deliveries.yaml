get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: Bot投递死信列表 / Dead bot deliveries
  description: 要求管理员会话，固定size=20。 / Dead bot deliveries
  operationId: admBotDeliveriesGet
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            delivery_id:
                              type: string
                            bot_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: JSON int64；客户端需无损解析 / Preserve bigint precision
                            event_type:
                              type: string
                            correlation_id:
                              type: string
                            attempt_count:
                              type: integer
                              minimum: 0
                            webhook_host:
                              type: string
                            created_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                            updated_at:
                              type:
                              - integer
                              - 'null'
                              format: int64
                              description: Unix 毫秒 / Unix milliseconds
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
