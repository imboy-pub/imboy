get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-index - rbac
  description: '## 中文 / English

    管理后台 adm-index handler 的 `rbac` 动作；路径 `/api/adm/rbac/me`。

    Admin handler `adm-index`, action `rbac`. Path `/api/adm/rbac/me`.

    '
  operationId: adm_index_rbac
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      role_id:
                        type: integer
                        description: 主角色 ID
                      role_ids:
                        type: array
                        items:
                          type: integer
                        description: 全部角色 ID 列表
                      role_name:
                        type: string
                        description: 角色名称
                      role_names:
                        type: array
                        items:
                          type: string
                        description: 全部角色名称列表
                      permissions:
                        type: array
                        items:
                          type: string
                        description: 合并后的权限列表
                      menu_paths:
                        type: array
                        items:
                          type: string
                        description: 可访问菜单路径列表
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
