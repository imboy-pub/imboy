get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-index - current
  description: '## 中文 / English

    管理后台 adm-index handler 的 `current` 动作；路径 `/api/adm/current`。

    Admin handler `adm-index`, action `current`. Path `/api/adm/current`.

    '
  operationId: adm_index_current
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: 管理员 ID (TSID)
                      account:
                        type: string
                      nickname:
                        type: string
                      avatar:
                        type: string
                      role_id:
                        type: integer
                        description: 主角色 ID
                      login_count:
                        type: integer
                      last_login_ip:
                        type: string
                      last_login_at:
                        type: string
                      status:
                        type: integer
                      created_at:
                        type: string
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
