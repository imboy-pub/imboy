get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: admin adm-index - welcome
  description: '## 中文 / English

    管理后台 adm-index handler 的 `welcome` 动作；路径 `/api/adm/welcome`。

    Admin handler `adm-index`, action `welcome`. Path `/api/adm/welcome`.

    '
  operationId: adm_index_welcome
  responses:
    '200':
      description: 成功；非零 code 为业务错误 / Non-zero code is a business error
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      coversation_online_user:
                        type: integer
                        description: 当前在线用户数
                      coversation_online_device:
                        type: integer
                        description: 当前在线设备数
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    4XX:
      description: 无权限 / 参数非法
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
