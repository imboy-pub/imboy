post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - admin
  summary: 工作区 archive / Workspace archive
  description: 需 workspaces:update；当前 handler 仅接收 workspace_id，不接收 replacement_workspace_id。默认工作区需先在组织治理流程交接，冲突业务码409。
    / Default workspace requires prior handover.
  operationId: admWorkspaceArchive
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            workspace_id:
              type: string
              pattern: ^[1-9][0-9]*$
              description: TSID 十进制字符串 / Decimal TSID string
          required:
          - workspace_id
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      workspace_id:
                        type: string
                        pattern: ^[1-9][0-9]*$
                        description: TSID 十进制字符串 / Decimal TSID string
                      status:
                        type: string
                      archived_by:
                        type:
                        - string
                        - 'null'
                      archived_at:
                        type:
                        - integer
                        - 'null'
                        description: 归档时间：整数文本经响应层转换为JSON整数 / Archive timestamp
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
