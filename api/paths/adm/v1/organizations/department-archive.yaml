post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 部门archive / Archive department
  description: 需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. rename/move 使用 expected_version 乐观锁，冲突业务码 409。 / Rename/move require optimistic version.
  operationId: admOrganizationDepartmentArchive
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: department_id
    in: path
    required: true
    description: department_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Department
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
