get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 组织分页 / List organizations
  description: '需 organizations:read。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. '
  operationId: admOrganizationsList
  parameters:
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: status
    in: query
    required: false
    description: all 或状态值 / Status filter
    schema:
      type: string
      default: all
  - name: keyword
    in: query
    required: false
    description: keyword
    schema:
      type: string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Organization
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 创建组织及默认工作区 / Create organization
  description: 需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. registered 需已注册 active human owner_user_id；pending_phone 创建待激活 Owner。短信发送失败不回滚创建，检查 sms_sent。
    / SMS failure does not roll back creation.
  operationId: admOrganizationsCreate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            owner_mode:
              type: string
              enum:
              - registered
              - pending_phone
              default: registered
            owner_user_id:
              type: string
              pattern: ^[1-9][0-9]*$
              description: TSID 十进制字符串 / Decimal TSID string
            owner_mobile:
              type: string
              description: pending_phone 时必填；敏感手机号 / Required in pending_phone mode
            default_workspace_name:
              type: string
          required:
          - name
          anyOf:
          - required:
            - owner_user_id
          - required:
            - owner_mode
            - owner_mobile
            properties:
              owner_mode:
                const: pending_phone
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      created:
                        type: boolean
                      organization:
                        $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Organization
                      default_workspace:
                        anyOf:
                        - $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Workspace
                        - type: 'null'
                      owner_activation:
                        anyOf:
                        - $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/OwnerActivationInvite
                        - type: 'null'
                      sms_sent:
                        type: boolean
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
