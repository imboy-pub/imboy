get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 读取入企码 / Read invitation code
  description: 需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. 码是凭据，因此读取也要求 write。 / Reading credentials requires write permission.
  operationId: admOrganizationInviteCodeRead
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      organization_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      code:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
                      expires_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 秒 / Unix seconds
                      created_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 秒 / Unix seconds
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 生成或轮换入企码 / Rotate invitation code
  description: 需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. 重新生成会撤销旧码。 / Regeneration revokes the previous code.
  operationId: admOrganizationInviteCodeCreate
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            role:
              type: string
              enum:
              - admin
              - member
              default: member
            expires_in:
              type: integer
              minimum: 1
              description: 有效期秒数；缺省使用配置 TTL / TTL seconds
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      organization_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: JSON int64；客户端需无损解析 / Preserve bigint precision
                      code:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
                      expires_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 秒 / Unix seconds
                      created_at:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Unix 秒 / Unix seconds
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
delete:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 撤销入企码 / Revoke invitation code
  description: '需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is
    a business object. '
  operationId: admOrganizationInviteCodeRevoke
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      organization_id:
                        type: string
                        pattern: ^[1-9][0-9]*$
                        description: TSID 十进制字符串 / Decimal TSID string
                      revoked:
                        type: integer
                        minimum: 0
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
