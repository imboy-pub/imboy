post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 按手机号转移 Owner / Transfer owner by phone
  description: 需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. owner_mobile 或 mobile 必填；仅返回脱敏手机号，不将明文写入示例或日志。 / Requires a mobile; response uses masked values.
  operationId: admOrganizationOwnerTransferByPhone
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            owner_mobile:
              type: string
            mobile:
              type: string
              description: 兼容字段；owner_mobile 优先 / Fallback alias
          anyOf:
          - required:
            - owner_mobile
          - required:
            - mobile
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      organization_id:
                        type: string
                        pattern: ^[1-9][0-9]*$
                        description: TSID 十进制字符串 / Decimal TSID string
                      owner_user_id:
                        type: string
                        pattern: ^[1-9][0-9]*$
                        description: TSID 十进制字符串 / Decimal TSID string
                      previous_owner_id:
                        type: string
                        pattern: ^[1-9][0-9]*$
                        description: TSID 十进制字符串 / Decimal TSID string
                      mode:
                        type: string
                        enum:
                        - direct_transfer
                        - pending_transfer
                      invite:
                        anyOf:
                        - $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/OwnerActivationInvite
                        - type: 'null'
                      sms_sent:
                        type: boolean
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
