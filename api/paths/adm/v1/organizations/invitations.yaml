get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 组织邀请列表 / Organization invitations
  description: '需 organizations:read。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. '
  operationId: admOrganizationInvitations
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: status
    in: query
    required: false
    description: status
    schema:
      type: string
      default: all
  - name: limit
    in: query
    required: false
    description: limit
    schema:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: array
                    items:
                      $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Invitation
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
post:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 邀请成员 / Invite member
  description: '需 organizations:write。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is
    a business object. '
  operationId: admOrganizationInvitationCreate
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            target_user_id:
              type: string
              pattern: ^[1-9][0-9]*$
              description: TSID 十进制字符串 / Decimal TSID string
            expires_at:
              type: integer
              description: 可选，Unix 秒；非正数使用域默认 TTL / Unix seconds
          required:
          - target_user_id
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Invitation
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
