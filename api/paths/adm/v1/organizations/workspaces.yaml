get:
  security:
  - adminSessionId: []
    adminSessionSignature: []
  tags:
  - organizations
  summary: 组织工作区关系分页 / Organization workspaces
  description: 需 organizations:read。 Organization 是业务对象，平台操作不代理普通用户身份。 / Platform governance; organization is a
    business object. is_default 来自显式默认关系，不能以最小 ID 推断。 / Explicit default relationship.
  operationId: admOrganizationWorkspaces
  parameters:
  - name: organization_id
    in: path
    required: true
    description: organization_id
    schema:
      type: string
      pattern: ^[1-9][0-9]*$
      description: TSID 十进制字符串 / Decimal TSID string
  - name: page
    in: query
    required: false
    description: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: size
    in: query
    required: false
    description: size
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 成功或业务错误；检查 code / Inspect business code
      content:
        application/json:
          schema:
            anyOf:
            - allOf:
              - $ref: ../../../../components/schemas/Envelope.yaml
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../../../../components/schemas/adm/OrganizationGovernance.yaml#/$defs/Workspace
                      page:
                        type: integer
                      size:
                        type: integer
                      total:
                        type: integer
                        minimum: 0
                      total_page:
                        type: integer
                        minimum: 0
                    required:
                    - list
                    - page
                    - size
                    - total
              - type: object
                properties:
                  code:
                    const: 0
            - $ref: ../../../../components/schemas/BusinessErrorEnvelope.yaml
    '405':
      description: 不支持的 HTTP 方法 / Method Not Allowed
    '401':
      description: Cookie 缺失、无效、到期或已撤销 / Invalid session cookies
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/Envelope.yaml
