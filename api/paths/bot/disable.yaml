# POST (bot) disableBot
post:
  tags: [user]
  summary: 停用 Bot（仅属主）
  description: |
    ## 中文 / English
    停用 Bot（仅属主可操作）。停用后 Bot 无法收发消息。
    Disable bot (owner only). Bot cannot send/receive after disable.
  operationId: disableBot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [bot_id]
          properties:
            bot_id: { type: string, format: tsid }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      user_id: { type: string, format: tsid }
                      status: { type: integer, enum: [0] }
