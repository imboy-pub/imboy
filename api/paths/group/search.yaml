# GET (group) searchGroups
get:
  tags: [user]
  summary: 全文搜索公开群
  description: |
    ## 中文 / English
    全文搜索公开群（FTS，pg_jieba jiebacfg；title A 权重 / introduction B 权重）
    Full-text search public groups (title weight A, introduction weight B)
  operationId: searchGroups
  parameters:
    - in: query
      name: q
      required: true
      description: '搜索关键词 / Search keyword'
      schema: { type: string }
    - in: query
      name: category_id
      required: false
      description: '分类 ID / Category filter'
      schema: { type: integer }
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list: { type: array, items: { type: object } }
                      total: { type: integer }
