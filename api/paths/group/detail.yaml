# ----------------------------------------------------------------------------
# imboy/api/paths/group/detail.yaml — GET /group/detail
# Handler: src/api/group_handler.erl#detail/2 → group_ds:find_by_id/2
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 查询群组详情
  description: |
    ## 中文 / English
    返回群组的完整资料。
    Return the full group profile.
  operationId: groupDetail
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: string }
      description: 群组 TSID / Group TSID.
  responses:
    '200':
      description: 群详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 群组完整资料.
                    properties:
                      id:
                        type: integer
                        format: int64
                      title:
                        type: string
                      avatar:
                        type: string
                      introduction:
                        type: string
                      type:
                        type: integer
                        description: 1=公开 2=私有.
                      owner_uid:
                        type: integer
                        format: int64
                      creator_uid:
                        type: integer
                        format: int64
                      member_count:
                        type: integer
                      member_max:
                        type: integer
                      join_limit:
                        type: integer
                      content_limit:
                        type: integer
                      updated_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
    '4XX':
      description: gid 缺失或非法 / 群不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
