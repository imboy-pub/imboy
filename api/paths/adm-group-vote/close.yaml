# POST /adm/group/vote/close — admin
post:
  tags: [admin]
  summary: 管理后台关闭群投票
  operationId: adm_group_vote_close
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [vote_id]
          properties:
            vote_id: { type: string, description: '投票 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
