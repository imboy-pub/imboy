# GET /adm/group/vote/detail — admin
get:
  tags: [admin]
  summary: 管理后台群投票详情
  description: 获取指定群投票的详细信息及投票结果（管理员视角）。Get group vote details and results (admin view).
  operationId: adm_group_vote_detail
  parameters:
    - in: query
      name: vote_id
      required: true
      schema: { type: string }
      description: 投票 ID
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    additionalProperties: true
                    description: '详情对象（字段以对应表/handler 为准）'
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
