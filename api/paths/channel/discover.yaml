# GET (channel) discoverChannels
get:
  tags: [user]
  summary: 频道发现
  description: |
    ## 中文 / English
    频道发现
    Discover channels
  operationId: discoverChannels
  parameters:
    - in: query
      name: limit
      required: false
      description: '返回条数上限 / Max items to return'
      schema: { type: integer, default: 20, description: '返回条数 / Max results to return' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            type: { type: integer }
                            avatar: { type: string }
                            description: { type: string }
                            subscriber_count: { type: integer }
                            is_subscribed: { type: boolean }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
