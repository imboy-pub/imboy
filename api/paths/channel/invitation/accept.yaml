# POST (channel) acceptChannelInvitation
post:
  tags: [user]
  summary: 接受邀请
  description: |
    ## 中文 / English
    接受邀请
    Accept invitation
  operationId: acceptChannelInvitation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            invitation_id: { type: integer }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
