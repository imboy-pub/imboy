# GET (channel) myChannelInvitations
get:
  tags: [user]
  summary: 我收到的邀请
  description: |
    ## 中文 / English
    我收到的邀请
    My invitations
  operationId: myChannelInvitations
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 我收到的邀请列表 / My received invitations
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            channel_id: { type: integer, format: int64 }
                            inviter_uid: { type: integer, format: int64 }
                            invitee_uid: { type: integer, format: int64 }
                            status: { type: integer, description: "0=待处理 1=已接受 2=已拒绝" }
                            created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
