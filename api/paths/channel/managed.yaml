# GET (channel) managedChannels
get:
  tags: [user]
  summary: 我管理的频道
  description: |
    ## 中文 / English
    我管理的频道
    My managed channels
  operationId: managedChannels
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 我管理的频道列表 / Managed channels
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            type: { type: integer }
                            avatar: { type: string }
                            subscriber_count: { type: integer }
                            status: { type: integer }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
