# GET (channel) subscribedChannels
get:
  tags: [user]
  summary: 我订阅的频道
  description: |
    ## 中文 / English
    我订阅的频道
    My subscriptions
  operationId: subscribedChannels
  parameters:
    - in: query
      name: cursor
      required: false
      description: '游标（上次返回的 next_cursor）/ Pagination cursor'
      schema: { type: string, description: '游标（上次返回的 next_cursor）/ Pagination cursor' }
    - in: query
      name: limit
      required: false
      description: '返回条数上限 / Max items to return'
      schema: { type: integer, default: 20, description: '每页条数 / Page size' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 订阅频道列表（游标分页）/ Subscribed channels (cursor pagination)
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            type: { type: integer }
                            avatar: { type: string }
                            subscriber_count: { type: integer }
                            unread_count: { type: integer }
                      cursor: { type: integer, description: 当前游标 }
                      limit: { type: integer }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
