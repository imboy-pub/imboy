# GET (channel) channelByCustomId
get:
  tags: [user]
  summary: 按 custom_id 查频道
  description: |
    ## 中文 / English
    按 custom_id 查频道
    Lookup by custom_id
  operationId: channelByCustomId
  parameters:
    - in: path
      name: custom_id
      required: true
      description: '频道自定义标识符 / Channel custom identifier'
      schema: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 频道详情 / Channel detail
                    properties:
                      id: { type: integer, format: int64, description: 频道 TSID }
                      name: { type: string }
                      type: { type: integer, description: "1=公开 2=私有" }
                      status: { type: integer }
                      description: { type: string }
                      avatar: { type: string }
                      custom_id: { type: string }
                      tags: { type: array, items: { type: string } }
                      owner_uid: { type: integer, format: int64 }
                      subscriber_count: { type: integer }
                      is_subscribed: { type: boolean }
                      price: { type: integer }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
                      updated_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
