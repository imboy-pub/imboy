# POST (channel) updateChannelAdminRole
post:
  tags: [user]
  summary: 调整管理员角色
  description: |
    ## 中文 / English
    调整管理员角色
    Update admin role
  operationId: updateChannelAdminRole
  parameters:
    - in: path
      name: channel_id
      required: true
      schema: { type: string }
    - in: path
      name: user_id
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            role: { type: string }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
