# POST (channel) updateChannel
post:
  tags: [user]
  summary: 频道修改
  description: |
    ## 中文 / English
    频道修改
    Update channel
  operationId: updateChannel
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name: { type: string }
            description: { type: string }
            avatar: { type: string }
            custom_id: { type: string, description: '频道自定义 ID / Custom channel identifier' }
            tags: { type: array, items: { type: string }, description: '频道标签列表 / Channel tags' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 更新后的频道对象 / Updated channel
                    properties:
                      id: { type: integer, format: int64, description: 频道 TSID }
                      name: { type: string }
                      type: { type: integer }
                      status: { type: integer }
                      description: { type: string }
                      avatar: { type: string }
                      custom_id: { type: string }
                      tags: { type: array, items: { type: string } }
                      owner_uid: { type: integer, format: int64 }
                      subscriber_count: { type: integer }
                      price: { type: integer }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
                      updated_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
