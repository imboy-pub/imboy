# POST (channel) createChannel
post:
  tags: [user]
  summary: 频道 - 创建
  description: |
    ## 中文 / English
    频道 - 创建
    Create channel
  operationId: createChannel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name, type]
          properties:
            name: { type: string, maxLength: 80 }
            type: { type: integer, enum: [1, 2], description: "1=公开, 2=私有 / 1=public, 2=private" }
            custom_id: { type: string, description: '可选自定义 ID' }
            description: { type: string }
            avatar: { type: string }
            tags: { type: array, items: { type: string }, description: '频道标签列表 / Channel tags' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
