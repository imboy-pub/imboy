# POST (channel) createChannel
post:
  tags: [user]
  summary: 频道 - 创建
  description: |
    ## 中文 / English
    频道 - 创建
    Create channel
  operationId: createChannel
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name, type]
          properties:
            name: { type: string, maxLength: 80 }
            type: { type: integer, enum: [1, 2], description: "1=公开, 2=私有 / 1=public, 2=private" }
            custom_id: { type: string, description: '可选自定义 ID' }
            description: { type: string }
            avatar: { type: string }
            tags: { type: array, items: { type: string }, description: '频道标签列表 / Channel tags' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 新创建的频道对象 / Newly created channel
                    properties:
                      id: { type: integer, format: int64, description: 频道 TSID }
                      name: { type: string }
                      type: { type: integer, description: "1=公开 2=私有" }
                      status: { type: integer }
                      description: { type: string }
                      avatar: { type: string }
                      custom_id: { type: string }
                      tags: { type: array, items: { type: string } }
                      owner_uid: { type: integer, format: int64 }
                      subscriber_count: { type: integer }
                      price: { type: integer, description: 订阅价格（分） }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
                      updated_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
