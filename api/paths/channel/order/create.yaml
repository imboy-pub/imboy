# POST (channel) createChannelOrder
post:
  tags: [user]
  summary: 创建订单（订阅付费频道）
  description: |
    ## 中文 / English
    创建订单（订阅付费频道）
    Create channel order
  operationId: createChannelOrder
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            plan:
              type: string
              x-not-implemented: true
              description: '订阅计划（x-not-implemented：当前后端未读取此字段）'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 订单对象 / Order object
                    properties:
                      order_no: { type: string, description: 订单号 }
                      channel_id: { type: integer, format: int64 }
                      user_id: { type: integer, format: int64 }
                      amount: { type: integer, description: 金额（分） }
                      status: { type: integer, description: "0=待支付 1=已支付 2=已退款" }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
