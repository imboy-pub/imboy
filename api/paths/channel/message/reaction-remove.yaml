# POST (channel) removeChannelReaction
post:
  tags: [user]
  summary: 消息移除反应
  description: |
    ## 中文 / English
    消息移除反应
    Remove reaction
  operationId: removeChannelReaction
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
    - in: path
      name: message_id
      required: true
      description: '消息 ID / Message ID'
      schema: { type: string }
    - in: path
      name: reaction_type
      required: true
      description: '反应类型（如 emoji 代码）/ Reaction type (e.g. emoji code)'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 无 payload，成功即移除反应 / No payload on success
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
