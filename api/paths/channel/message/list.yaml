# GET (channel) listChannelMessages
get:
  tags: [user]
  summary: 频道消息列表
  description: |
    ## 中文 / English
    频道消息列表
    Channel messages
  operationId: listChannelMessages
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
    - in: query
      name: cursor
      required: false
      description: 分页游标（上次返回的 next_cursor）/ Pagination cursor
      schema: { type: string, description: '游标（上次返回的 next_cursor）/ Pagination cursor' }
    - in: query
      name: limit
      required: false
      description: 每页条数 / Page size
      schema: { type: integer, default: 20, description: '每页条数 / Page size' }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64, description: 消息 TSID }
                            channel_id: { type: integer, format: int64 }
                            author_uid: { type: integer, format: int64 }
                            author_name: { type: string }
                            author_avatar: { type: string }
                            msg_type: { type: string, description: "text/image/video/audio/file" }
                            content: { type: string }
                            payload: { type: object }
                            pinned: { type: boolean }
                            view_count: { type: integer }
                            reaction_count: { type: integer }
                            created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
