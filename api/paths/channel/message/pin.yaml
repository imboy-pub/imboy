# POST (channel) pinChannelMessage
post:
  tags: [user]
  summary: 消息置顶
  description: |
    ## 中文 / English
    消息置顶
    Pin message
  operationId: pinChannelMessage
  parameters:
    - in: path
      name: channel_id
      required: true
      schema: { type: string }
    - in: path
      name: message_id
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            pinned: { type: boolean }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
