# POST (channel) pinChannelMessage
post:
  tags: [user]
  summary: 消息置顶
  description: |
    ## 中文 / English
    消息置顶
    Pin message
  operationId: pinChannelMessage
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
    - in: path
      name: message_id
      required: true
      description: '消息 ID / Message ID'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            pinned: { type: boolean }
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 置顶后的消息对象 / Updated message after pin/unpin
                    properties:
                      id: { type: integer, format: int64 }
                      channel_id: { type: integer, format: int64 }
                      msg_type: { type: string }
                      content: { type: string }
                      pinned: { type: boolean }
                      created_at: { type: integer, description: Unix 毫秒时间戳 }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
