# POST (channel) editChannelMessage
post:
  tags: [user]
  summary: 编辑自发消息
  description: |
    ## 中文 / English
    编辑自发消息（仅作者本人，受编辑时间窗约束，已撤回消息不可编辑）
    Edit own message (author only, subject to edit window; revoked messages cannot be edited)
  operationId: editChannelMessage
  parameters:
    - in: path
      name: channel_id
      required: true
      description: '频道 ID / Channel ID'
      schema: { type: string }
    - in: path
      name: message_id
      required: true
      description: '消息 ID / Message ID'
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: string
              description: '新消息内容 / New message content'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 无 payload，成功即编辑 / No payload on success
    '4XX':
      description: 参数非法 / 无权限 / 不存在 / 超出编辑时间窗
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
