# POST (channel) publishChannelMessage
post:
  tags: [user]
  summary: 频道发布消息
  description: |
    ## 中文 / English
    频道发布消息
    Publish channel message
  operationId: publishChannelMessage
  parameters:
    - in: path
      name: channel_id
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            content: { type: string }
            type: { type: string }
            payload: { type: object }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限 / 不存在
      content:
        application/json: { schema: { $ref: '../../../components/schemas/Envelope.yaml' } }
