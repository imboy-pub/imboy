# POST /v1/group/notice/unpin — 取消置顶 / Unpin notice
post:
  tags: [user]
  summary: 取消置顶群公告
  description: |
    ## 中文 / English
    取消置顶；幂等。
    Unpin a notice. Idempotent.
  operationId: unpinGroupNotice
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [notice_id]
          properties:
            notice_id: { type: integer, minimum: 1 }
  responses:
    '200':
      description: 取消成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: notice 不存在 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
