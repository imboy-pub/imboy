get:
  tags:
  - internal
  summary: 读取本应用信息（健康检查与联调首选）
  description: '返回本应用元数据、认证方式与凭证清单。使用 HMAC-SHA256 请求签名。字段实证自

    `enterprise_application_handler:self_payload/2`：application/credentials

    为平台行数据的 binary 键透出（最小字段集，不含 secret）。

    '
  operationId: internalApplicationSelf
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: 应用自检信息
      content:
        application/json:
          schema:
            type: object
            properties:
              organization_id:
                type:
                - integer
                - 'null'
                format: int64
                description: 所属组织 TSID
              application_id:
                type: integer
                format: int64
                description: 应用 TSID
              credential_id:
                type:
                - integer
                - 'null'
                format: int64
                description: 本次凭证 ID（无凭证上下文时 null）
              application_key:
                type:
                - string
                - 'null'
                description: 应用 key
              application:
                type: object
                description: 应用行元数据（binary 键透出）
              authentication:
                type: string
                const: hmac
                description: HMAC 请求的认证方式
              credentials:
                type: array
                items:
                  type: object
                description: 凭证清单（不含 secret）
            required: []
    '401':
      $ref: ../../../../components/responses/internal/invalid_credential.yaml
    '403':
      $ref: ../../../../components/responses/internal/application_disabled.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
