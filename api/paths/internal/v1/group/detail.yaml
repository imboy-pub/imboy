get:
  tags:
  - internal
  summary: 读取企业群详情
  description: 读取本组织工作空间内的群资料，跨组织或不存在均返回 resource_not_found；执行当前资源归属检查。
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalGroupDetail
  parameters:
  - name: group_id
    in: path
    required: true
    description: 企业群 TSID
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: 群详情（V2.1 §15.1：以修正后 leaf 为权威的封闭投影，与 enterprise_group_logic:group_detail_tx
        实测键集逐字一致）
      content:
        application/json:
          schema:
            type: object
            required:
            - group_id
            - workspace_id
            - title
            - owner_user_id
            - member_count
            - members
            - origin
            additionalProperties: false
            properties:
              group_id:
                type: integer
                format: int64
              workspace_id:
                type: integer
                format: int64
              title:
                type: string
              owner_user_id:
                type: integer
                format: int64
              member_count:
                type: integer
              members:
                type: array
                items:
                  type: object
                  required:
                  - user_id
                  - role
                  - status
                  additionalProperties: false
                  properties:
                    user_id:
                      type: integer
                      format: int64
                    role:
                      type: string
                    status:
                      type: string
              origin:
                type:
                - object
                - 'null'
                description: 来源标记（application_id/workspace_id/status/mine；非本应用建群为
                  null）
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
patch:
  tags:
  - internal
  summary: 修改企业群信息
  description: |
    部分更新群标题或简介，至少提供 title / introduction 中的一项；未提供的字段保持原值。
    成员变更通过 INT-05/06 调用，本接口不提供成员覆盖。
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalGroupUpdate
  parameters:
  - name: group_id
    in: path
    required: true
    description: 企业群 TSID
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  - name: Idempotency-Key
    in: header
    required: true
    description: 幂等键
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          minProperties: 1
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
            introduction:
              type: string
              maxLength: 2000
  responses:
    '200':
      description: 更新结果
      content:
        application/json:
          schema:
            type: object
            properties:
              group_id:
                type: integer
                format: int64
              title:
                type: string
              introduction:
                type: string
              updated:
                type: boolean
                enum:
                - true
      headers:
        Idempotent-Replayed:
          description: 重放首次已提交的 HTTP 状态与正文时为 true；首次响应不带此头。
          schema: { type: string, enum: ['true'] }
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '409':
      $ref: ../../../../components/responses/internal/idempotency_conflict.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
delete:
  tags:
  - internal
  summary: 解散（归档）企业群
  description: '归档式解散；重复解散返回 `{group_id, archived: true, already: true}`。

    '
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalGroupArchive
  parameters:
  - name: group_id
    in: path
    required: true
    description: 企业群 TSID
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  - name: Idempotency-Key
    in: header
    required: true
    description: 幂等键
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  responses:
    '200':
      description: 归档结果
      content:
        application/json:
          schema:
            type: object
            properties:
              group_id:
                type: integer
                format: int64
              archived:
                type: boolean
                enum:
                - true
              already:
                type: boolean
                description: 重复解散时 true
      headers:
        Idempotent-Replayed:
          description: 重放首次已提交的 HTTP 状态与正文时为 true；首次响应不带此头。
          schema: { type: string, enum: ['true'] }
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '409':
      $ref: ../../../../components/responses/internal/idempotency_conflict.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
