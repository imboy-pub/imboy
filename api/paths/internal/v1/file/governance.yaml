post:
  tags:
  - internal
  summary: 企业附件治理（留存 / 法务 hold / 清除）
  description: '治理动作四选一：set_retention（延长留存，只可延长）、hold（设法务 hold，

    需事由）、release_hold（释放 hold）、purge（hold 释放且留存到期后清除）。

    不变量在 DB 层声明式强制（migration 00000140 触发器）；违规动作归一

    invalid_request（detail 区分 purge_blocked_by_hold / retention_not_elapsed /

    already_purged 等，不新增错误码）。

    '
  security:
  - ibIntHmacCredential: []
    ibIntHmacTimestamp: []
    ibIntHmacNonce: []
    ibIntHmacSignature: []
  operationId: internalFileGovernance
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: 幂等键
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - op
          - object_key
          properties:
            op:
              type: string
              enum:
              - set_retention
              - hold
              - release_hold
              - purge
            object_key:
              type: string
              description: 本 (org, app) 已 confirm 的附件
            retention_days:
              type: integer
              minimum: 1
              maximum: 3650
              description: op=set_retention 必填（延长天数，上限 10 年）
            reason:
              type: string
              minLength: 1
              maxLength: 200
              description: op=hold 必填（法务 hold 事由）
  responses:
    '200':
      description: 治理结果
      content:
        application/json:
          schema:
            type: object
            required:
            - file_id
            - object_key
            - purged
            properties:
              file_id:
                type: integer
                format: int64
              object_key:
                type: string
              retention_until:
                type:
                - string
                - 'null'
                format: date-time
                description: 留存截止；PG 时间规范化为 UTC RFC3339（毫秒精度），未设置为 null。
              hold_state:
                type: string
              purge_state:
                type: string
              purged:
                type: boolean
              retention_days:
                type:
                - integer
                - 'null'
                description: set_retention 时回显
              held:
                type:
                - boolean
                - 'null'
                description: hold/release_hold 时回显
              purged_at:
                type:
                - string
                - 'null'
                format: date-time
                description: 清除时间；PG 时间规范化为 UTC RFC3339（毫秒精度），未设置为 null。
              extended_until:
                type:
                - string
                - 'null'
                format: date-time
                description: 本次延长后的留存截止；PG 时间规范化为 UTC RFC3339（毫秒精度），未设置为 null。
      headers:
        Idempotent-Replayed:
          description: 重放首次已提交的 HTTP 状态与正文时为 true；首次响应不带此头。
          schema:
            type: string
            enum:
            - 'true'
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '409':
      $ref: ../../../../components/responses/internal/idempotency_conflict.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
