# ----------------------------------------------------------------------------
# imboy/api/paths/internal/v1/file/confirm.yaml
# POST /api/internal/v1/files/confirm — 确认入库（INT-08）
# 调用方：api/openapi-internal.yaml#/paths/~1api~1internal~1v1~1files~1confirm
# Handler：src/api/enterprise_asset_handler.erl confirm/3
# 请求/响应实证：enterprise_asset_logic confirm_tx 注释（object_key 必填、
# file_hash256 可选 64 hex；返回 {file_id, object_key, size, mime_type}）
# ----------------------------------------------------------------------------
post:
  tags: [internal]
  summary: 确认企业附件入库（HEAD/size/hash/scope 校验）
  description: |
    直传完成后的确认：服务端以 HEAD 真实值复核大小与 MIME（超限/非法类型对象
    被删除），登记 attachment 行并建立治理行。object_key 必须是本 org/app 域
    且已 presign 登记的对象。
  operationId: internalFileConfirm
  security:
    - ibIntBearer: []
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: 幂等键
      schema: { type: string, minLength: 1 }
  x-imboy-scope: files:write
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [object_key]
          properties:
            object_key:
              type: string
              description: presign 返回的 object_key
            file_hash256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
              description: SHA-256 完整性参考（可选）
  responses:
    '200':
      description: 确认结果
      content:
        application/json:
          schema:
            type: object
            properties:
              file_id: { type: integer, format: int64 }
              object_key: { type: string }
              size: { type: integer, format: int64, description: HEAD 实测字节数 }
              mime_type: { type: string, description: HEAD 实测类型 }
    '400': { $ref: '../../../../components/responses/internal/invalid_request.yaml' }
    '401': { $ref: '../../../../components/responses/internal/invalid_credential.yaml' }
    '403': { $ref: '../../../../components/responses/internal/insufficient_scope.yaml' }
    '404': { $ref: '../../../../components/responses/internal/resource_not_found.yaml' }
    '409': { $ref: '../../../../components/responses/internal/idempotency_conflict.yaml' }
    '429': { $ref: '../../../../components/responses/internal/rate_limited.yaml' }
    '500': { $ref: '../../../../components/responses/internal/internal_error.yaml' }
