get:
  tags:
  - internal
  summary: Workspace 详情
  description: 读取当前组织内的活跃工作空间。跨组织、不存在和已归档资源均返回 resource_not_found。
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalWorkspaceDetail
  parameters:
  - name: workspace_id
    in: path
    required: true
    description: Workspace TSID
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: Workspace 详情
      content:
        application/json:
          schema:
            type: object
            required:
            - workspace_id
            - name
            - owner_id
            - created_at
            - version
            additionalProperties: false
            properties:
              workspace_id:
                type: integer
                format: int64
              name:
                type: string
              owner_id:
                type: integer
                format: int64
              created_at:
                type: string
                description: RFC3339 时间戳
              version:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
patch:
  tags:
  - internal
  summary: 修改企业工作空间
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalWorkspaceUpdate
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  description: 修改当前组织工作空间，必须提供 expected_version；旧版本返回 version_conflict。
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: 本企业的目标工作空间 TSID
  - name: Idempotency-Key
    in: header
    required: true
    description: 有效 ASCII 幂等键；同业务重试复用此值。
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  responses:
    '200':
      description: 工作空间当前状态
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/WorkspaceWriteResult.yaml
      headers:
        Idempotent-Replayed:
          description: 是否重放首次已提交响应；重放时为 true。
          schema:
            type: string
            enum:
            - 'true'
    '409':
      description: 版本、幂等键、创建额度或默认交接冲突
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - expected_version
          properties:
            expected_version:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
            name:
              type: string
              minLength: 1
              maxLength: 200
            logo:
              type: string
              maxLength: 2048
            branding:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                logo:
                  type: string
                  maxLength: 2048
                primaryColor:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
          minProperties: 2
delete:
  tags:
  - internal
  summary: 归档企业工作空间
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalWorkspaceArchive
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  description: 软归档当前组织工作空间，保留历史资料；必须提供 expected_version。默认空间归档须指定有效替代项。
  parameters:
  - name: workspace_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    description: 本企业的目标工作空间 TSID
  - name: Idempotency-Key
    in: header
    required: true
    description: 有效 ASCII 幂等键；同业务重试复用此值。
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  responses:
    '200':
      description: 工作空间当前状态
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/WorkspaceWriteResult.yaml
      headers:
        Idempotent-Replayed:
          description: 是否重放首次已提交响应；重放时为 true。
          schema:
            type: string
            enum:
            - 'true'
    '409':
      description: 版本、幂等键、创建额度或默认交接冲突
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - expected_version
          properties:
            expected_version:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
            replacement_workspace_id:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
