get:
  tags:
  - internal
  summary: Workspace 列表（业务组织归属）
  description: 当前组织业务归属内的活跃工作空间列表。分页使用签名游标，游标绑定组织、应用及筛选条件。
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalWorkspaceList
  parameters:
  - name: page_size
    in: query
    description: 页大小（canonical；缺省 50；1..100，越界 400 拒绝不截断；与已弃用别名 limit 同时出现即 400 invalid_request）
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  - name: limit
    in: query
    deprecated: true
    description: 页大小兼容别名（已弃用，统一用 page_size；缺省 50；1..100，越界 400 拒绝不截断）
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  - name: cursor
    in: query
    description: 上一页返回的 next_cursor（opaque；不得解析或拼接）
    schema:
      type: string
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: Workspace 分页（created_at DESC, id DESC）
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            - limit
            - has_more
            - next_cursor
            additionalProperties: false
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                  - workspace_id
                  - name
                  - owner_id
                  - created_at
                  - version
                  additionalProperties: false
                  properties:
                    workspace_id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    owner_id:
                      type: integer
                      format: int64
                    created_at:
                      type: string
                      description: RFC3339 时间戳
                    version:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 9223372036854775807
              limit:
                type: integer
                minimum: 1
                maximum: 100
              has_more:
                type: boolean
              next_cursor:
                type:
                - string
                - 'null'
                description: has_more=true 时非 null；否则恒 null
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
post:
  tags:
  - internal
  summary: 创建企业工作空间
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalWorkspaceCreate
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  description: 创建工作空间；owner_user_id 必须是当前组织活跃 Owner/Admin。资源、审计和幂等响应同事务提交。
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: 有效 ASCII 幂等键；同业务重试复用此值。
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[ -~]+$
  responses:
    '200':
      description: 工作空间当前状态
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/WorkspaceWriteResult.yaml
      headers:
        Idempotent-Replayed:
          description: 是否重放首次已提交响应；重放时为 true。
          schema:
            type: string
            enum:
            - 'true'
    '409':
      description: 版本、幂等键、创建额度或默认交接冲突
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/unauthorized.yaml
    '403':
      $ref: ../../../../components/responses/internal/forbidden.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
    '503':
      $ref: ../../../../components/responses/internal/security_gate_closed.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - owner_user_id
          - name
          properties:
            owner_user_id:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
            name:
              type: string
              minLength: 1
              maxLength: 200
