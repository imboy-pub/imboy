# ----------------------------------------------------------------------------
# imboy/api/paths/internal/v1/message/direct.yaml
# POST /api/internal/v1/messages/direct — 单聊直发（INT-09）
# 调用方：api/openapi-internal.yaml#/paths/~1api~1internal~1v1~1messages~1direct
# Handler：src/api/enterprise_message_handler.erl direct/3
# 请求/响应实证：enterprise_message_logic 模块注释（sender_mode/sender_user_id/
# recipient_user_id/msg_type/content/object_key；返回 msg_id 等 6 字段）
# ----------------------------------------------------------------------------
post:
  tags: [internal]
  summary: 企业托管单聊消息（OA 直发 / 代发）
  description: |
    以应用身份或代本组织已映射人类用户发送单聊。企业托管消息**固定非端到端
    加密**，审计事实永久保留。sender_mode 区分应用身份与已映射的 Human 身份；两者均以 HMAC 签名调用。
    **as_user_id / actor_user_id 别名参数出现即拒**（INV-5）。
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  operationId: internalMessageDirect
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: 幂等键（重复提交返回首次结果）
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[ -~]+$' }
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [sender_mode, recipient_user_id, msg_type]
          allOf:
            - if:
                properties:
                  sender_mode: { const: human }
              then:
                required: [sender_user_id]
                properties:
                  sender_user_id: { type: string }
            - if:
                properties:
                  msg_type: { const: text }
              then:
                required: [content]
                properties:
                  content: { type: string }
            - if:
                properties:
                  msg_type: { const: file }
              then:
                required: [object_key]
                properties:
                  object_key: { type: string }
          properties:
            sender_mode:
              type: string
              enum: [application, human]
            sender_user_id:
              type: string
              description: human 模式必填；OA 侧标识（须本组织已映射、已启用）
            recipient_user_id:
              type: string
              description: 收件人 OA 侧标识（同组织已映射 active 用户）
            msg_type:
              type: string
              enum: [text, file]
            content:
              type: string
              minLength: 1
              maxLength: 4000
              description: msg_type=text 必填；UTF-8 编码 1..4000 字节
            object_key:
              type: string
              description: msg_type=file 必填（本 org/app 已 confirm 附件）
  responses:
    '200':
      description: 受理结果
      content:
        application/json:
          schema:
            type: object
            required: [msg_id, webhook_resource_id, sender_kind, sender_user_id, origin_kind, origin_application_id, accepted_at]
            properties:
              msg_id: { type: string, format: uuid, description: 客户端消息 ID（UUID v7） }
              webhook_resource_id:
                type: integer
                format: int64
                description: |
                  v1.1.1 追加。webhook 关联键：与 message.enterprise.accepted /
                  failed 事件 resource.id 同源（消息表行 ID）。与 msg_id 是
                  **两个不同标识符**；集成方以此把回调关联回本次发送响应。
              sender_kind: { type: string, enum: [application, human] }
              sender_user_id:
                type: [integer, 'null']
                format: int64
                description: human 发送者的平台 TSID；application 模式为 null
              origin_kind:
                type: string
                enum: [enterprise_application]
              origin_application_id: { type: integer, format: int64 }
              accepted_at: { type: integer, format: int64, description: 受理时间（Unix 毫秒） }
      headers:
        Idempotent-Replayed:
          description: 重放首次已提交的 HTTP 状态与正文时为 true；首次响应不带此头。
          schema: { type: string, enum: ['true'] }
    '400': { $ref: '../../../../components/responses/internal/invalid_request.yaml' }
    '401': { $ref: '../../../../components/responses/internal/unauthorized.yaml' }
    '403': { $ref: '../../../../components/responses/internal/forbidden.yaml' }
    '404': { $ref: '../../../../components/responses/internal/resource_not_found.yaml' }
    '409': { $ref: '../../../../components/responses/internal/idempotency_conflict.yaml' }
    '422': { $ref: '../../../../components/responses/internal/identity_not_mapped.yaml' }
    '429': { $ref: '../../../../components/responses/internal/rate_limited.yaml' }
    '500': { $ref: '../../../../components/responses/internal/internal_error.yaml' }
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
