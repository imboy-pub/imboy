# ----------------------------------------------------------------------------
# imboy/api/paths/internal/v1/webhook/deliveries.yaml
# GET /api/internal/v1/webhook/deliveries — 投递列表（INT-23）
# 调用方：api/openapi-internal.yaml#/paths/~1api~1internal~1v1~1webhook~1deliveries
# Handler：src/api/enterprise_webhook_handler.erl deliveries/3
# 请求实证：query page（默认 1）/ size（默认 20）/ status（可选）；
# 响应实证：enterprise_webhook_logic deliveries_tx + repo SELECT 列
# ----------------------------------------------------------------------------
get:
  tags: [internal]
  summary: Webhook 投递列表 + 健康度摘要
  description: |
    本应用的投递元数据分页（**不含 payload/正文/secret/签名 URL**）。
    summary 成功率口径 = success / (success + dead)，在途（pending/retry）
    不计入分母。
  operationId: internalWebhookDeliveries
  security:
    - ibIntBearer: []
  parameters:
    - name: page
      in: query
      required: false
      description: 页码（默认 1）
      schema: { type: integer, minimum: 1, default: 1 }
    - name: size
      in: query
      required: false
      description: 页大小（默认 20，服务端夹紧上限）
      schema: { type: integer, minimum: 1, default: 20 }
    - name: status
      in: query
      required: false
      description: 按投递状态过滤
      schema: { type: string }
  x-imboy-scope: webhooks:manage
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: 投递列表
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    delivery_id: { type: string }
                    event_type: { type: string }
                    status: { type: string, description: 如 pending/retry/success/dead }
                    attempt_count: { type: integer }
                    correlation_id: { type: [string, 'null'] }
              summary:
                type: object
                description: 投递健康度摘要
                properties:
                  status_counts:
                    type: object
                    description: 各状态计数
                  dead_letter_count: { type: integer }
                  success_count: { type: integer }
                  success_rate:
                    type: [number, 'null']
                    description: success/(success+dead)；无已终结投递时 null
                  in_flight_count: { type: integer, description: pending+retry }
    '400': { $ref: '../../../../components/responses/internal/invalid_request.yaml' }
    '401': { $ref: '../../../../components/responses/internal/invalid_credential.yaml' }
    '403': { $ref: '../../../../components/responses/internal/insufficient_scope.yaml' }
    '429': { $ref: '../../../../components/responses/internal/rate_limited.yaml' }
    '500': { $ref: '../../../../components/responses/internal/internal_error.yaml' }
