# ----------------------------------------------------------------------------
# imboy/api/paths/internal/v1/directory/users.yaml
# POST /api/internal/v1/directory/users — 可映射用户目录（INT-17）
# 调用方：api/openapi-internal.yaml#/paths/~1api~1internal~1v1~1directory~1users
# Handler：src/api/enterprise_directory_handler.erl（page_users_tx 实证）
# ----------------------------------------------------------------------------
post:
  tags: [internal]
  summary: 可映射用户目录（cursor 分页，只回元数据）
  description: |
    查询本组织可映射（尚未绑定或已绑定）的平台用户，只返回最小元数据。
    游标为 CURSOR-V2 签名形态（不透明，HMAC-SHA256，24h 有效，与页族/
    organization/application/workspace 过滤逐字段绑定）；篡改、垃圾串、
    跨页族、换过滤条件、过期（>24h）及旧版未签名形态一律 400
    invalid_request；签名密钥不可用时 503 security_gate_closed。
    响应 items 字段实证自 `enterprise_directory_logic`：user_id /
    external_user_id（本应用未映射则 null）/ member_role 等。
  operationId: internalDirectoryUsers
  security:
    - ibIntBearer: []
  x-imboy-scope: identities:read
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            cursor:
              type: string
              description: >-
                上一页返回的 next_cursor（首页缺省）。CURSOR-V2 签名游标：
                base64url(canonical_json) ++ "." ++
                base64url(HMAC-SHA256)，24h 有效；页族 directory_users，
                绑定 organization_id / application_id / workspace 过滤
                （整 map 相等）。篡改、垃圾串、跨页族、换过滤、过期
                （>24h）及旧版未签名形态（无 HMAC 段）一律 400
                invalid_request。
            page_size:
              type: integer
              description: >-
                页大小，1..100（缺省 50）；越界/非整数一律 400
                invalid_request（拒绝，不静默截断）。
            workspace_id:
              type: integer
              format: int64
              description: >-
                按 workspace 过滤（要求 identities:read 的 Workspace
                Grant 覆盖；参与游标绑定）。
  responses:
    '200':
      description: 可映射用户目录页
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    user_id: { type: integer, format: int64 }
                    external_user_id:
                      type: [string, 'null']
                      description: 本应用已映射的 OA 标识；未映射为 null
                    member_role: { type: string, description: 组织内角色 }
              page_size: { type: integer }
              has_more: { type: boolean }
              next_cursor:
                type: [string, 'null']
                description: 下页游标（CURSOR-V2 签名形态；has_more=false 时 null）
    '400': { $ref: '../../../../components/responses/internal/invalid_request.yaml' }
    '401': { $ref: '../../../../components/responses/internal/invalid_credential.yaml' }
    '403': { $ref: '../../../../components/responses/internal/insufficient_scope.yaml' }
    '429': { $ref: '../../../../components/responses/internal/rate_limited.yaml' }
    '500': { $ref: '../../../../components/responses/internal/internal_error.yaml' }
