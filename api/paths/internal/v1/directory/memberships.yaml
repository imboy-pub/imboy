get:
  tags:
  - internal
  summary: 来源成员状态与离职前检查
  description: 只读检查本来源任职，不枚举用户。采用 HMAC 签名，仍复核应用和可信来源。仅返回阻塞数量和代码；资格是当前业务状态的建议，实际变更仍需相应权限并在事务内复核。停用不删除个人账号、历史或其他组织关系。未知或重复查询参数拒绝。
  operationId: internalDirectoryMemberPreflight
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  parameters:
  - name: external_organization_id
    in: query
    required: true
    schema: &id001
      type: string
      minLength: 1
      maxLength: 256
      description: 不透明 UTF-8 外部标识；按 UTF-8 字节限制 1..256。
    description: 本应用启用且未过期的可信来源外部组织 ID。
  - name: external_user_id
    in: query
    required: true
    schema: *id001
    description: 本来源任职中的外部人员 ID；不接受任意本地用户 ID。
  responses:
    '200':
      description: 实时检查结果；不是离职许可或状态快照。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: 禁止缓存人员目录。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - external_user_id
            - member_status
            - member_version
            - blocker_counts
            - blockers
            - can_suspend
            - can_restore
            - can_remove
            properties:
              external_user_id: *id001
              member_status:
                type:
                - string
                - 'null'
                enum:
                - active
                - suspended
                - removed
                - null
              member_version:
                type:
                - integer
                - 'null'
                format: int64
                minimum: 1
                maximum: 9223372036854775807
              blocker_counts:
                type: object
                additionalProperties: false
                required:
                - owned_workspaces
                - owned_projects
                - unfinished_tasks
                - owned_groups
                - owned_channels
                - active_assignments
                properties:
                  owned_workspaces:
                    type: integer
                    minimum: 0
                  owned_projects:
                    type: integer
                    minimum: 0
                  unfinished_tasks:
                    type: integer
                    minimum: 0
                  owned_groups:
                    type: integer
                    minimum: 0
                  owned_channels:
                    type: integer
                    minimum: 0
                  active_assignments:
                    type: integer
                    minimum: 0
              blockers:
                type: array
                items:
                  type: string
                  enum:
                  - owned_workspaces
                  - owned_projects
                  - unfinished_tasks
                  - owned_groups
                  - owned_channels
                  - active_assignments
                  - not_managed_member
                  - local_suspension_conflict
              can_suspend:
                type: boolean
              can_restore:
                type: boolean
              can_remove:
                type: boolean
    '400':
      description: invalid_request
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - invalid_request
    '401':
      description: invalid_credential / credential_expired
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - invalid_credential
                    - credential_expired
    '403':
      description: application_disabled / organization_boundary_violation
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - application_disabled
                    - organization_boundary_violation
    '404':
      description: resource_not_found
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - resource_not_found
    '429':
      description: rate_limited
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - rate_limited
      headers:
        Retry-After:
          description: 重试等待秒数。
          schema:
            type: integer
            minimum: 1
    '500':
      description: internal_error
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - internal_error
    '503':
      description: security_gate_closed
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - security_gate_closed
patch:
  tags:
  - internal
  summary: 来源托管普通成员停用或恢复
  description: 采用 HMAC 签名；逐事务复核可信来源、组织归属和成员状态。只允许操作本来源已绑定且已投影的普通成员，Owner/Admin
    拒绝。恢复只允许本来源暂停且版本未被人工改变的成员。必须提供 GET 返回的 expected_member_version。状态、来源标记、审计及幂等快照同事务。重放重新鉴权；同键不同请求冲突。
  operationId: internalDirectoryMemberStatus
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
    description: 一次业务状态变更使用稳定键；重试沿用，同键不同请求返回409。
  responses:
    '200':
      description: 成员状态已变更；重放返回原始响应并携带 Idempotency-Replayed。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: 禁止缓存人员目录。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - external_user_id
            - member_status
            - member_version
            properties:
              external_user_id: *id001
              member_status:
                type: string
                enum:
                - active
                - suspended
              member_version: &id002
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
    '400':
      description: invalid_request
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - invalid_request
    '401':
      description: invalid_credential / credential_expired
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - invalid_credential
                    - credential_expired
    '403':
      description: application_disabled / organization_boundary_violation
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - application_disabled
                    - organization_boundary_violation
    '404':
      description: resource_not_found
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - resource_not_found
    '429':
      description: rate_limited
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - rate_limited
      headers:
        Retry-After:
          description: 重试等待秒数。
          schema:
            type: integer
            minimum: 1
    '500':
      description: internal_error
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - internal_error
    '503':
      description: security_gate_closed
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
            properties:
              error:
                properties:
                  code:
                    enum:
                    - security_gate_closed
    '409':
      description: version_conflict / resource_conflict / idempotency_conflict
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/internal/ErrorEnvelope.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - external_organization_id
          - external_user_id
          - status
          - expected_member_version
          properties:
            external_organization_id: *id001
            external_user_id: *id001
            status:
              type: string
              enum:
              - suspended
              - active
            expected_member_version: *id002
