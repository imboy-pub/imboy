put:
  tags:
  - internal
  summary: 绑定外部身份（OA 用户 → 平台用户）
  description: '绑定本组织有效 Human 成员的外部标识。首次执行返回 external_user_id、user_id、status=active；幂等重放保留首次响应原字节，用
    Idempotent-Replayed: true 响应头标识，不添加 replayed 正文字段。重放是历史提交快照；查询当前映射应调用 resolve。'
  operationId: internalIdentityBind
  security:
  - ibIntBearer: []
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: 幂等键（同一 key 重复提交返回首次结果）
    schema:
      type: string
      minLength: 1
      maxLength: 128
  x-imboy-scope: identities:write
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - external_user_id
          - user_id
          properties:
            external_user_id:
              type: string
              description: OA 侧用户标识（同 org+app 内唯一）
            user_id:
              type: integer
              format: int64
              description: 平台用户 TSID（须为本组织成员）
              minimum: 1
              maximum: 9223372036854775807
  responses:
    '200':
      description: 绑定结果
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - external_user_id
            - user_id
            - status
            properties:
              external_user_id:
                type: string
              user_id:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
              status:
                type: string
                enum:
                - active
      headers:
        Idempotent-Replayed:
          description: 重放首次提交的响应快照时为 true。
          schema:
            type: string
            enum:
            - 'true'
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/invalid_credential.yaml
    '403':
      $ref: ../../../../components/responses/internal/insufficient_scope.yaml
    '409':
      $ref: ../../../../components/responses/internal/idempotency_conflict.yaml
    '422':
      $ref: ../../../../components/responses/internal/identity_not_mapped.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
delete:
  tags:
  - internal
  summary: 解绑外部身份（软删映射）
  description: '撤销 external identity 映射（软删）。解绑后该用户对本应用的消息/群操作

    立即不可达（identity_not_mapped）。响应字段实证自

    `enterprise_identity_logic`（revoke 返回 `{external_user_id, status: removed, revoked:
    true}`）。

    '
  operationId: internalIdentityRevoke
  security:
  - ibIntBearer: []
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: 幂等键
    schema:
      type: string
      minLength: 1
      maxLength: 128
  x-imboy-scope: identities:write
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - external_user_id
          properties:
            external_user_id:
              type: string
              description: 要解绑的 OA 侧用户标识
  responses:
    '200':
      description: 解绑结果
      content:
        application/json:
          schema:
            type: object
            properties:
              external_user_id:
                type: string
              status:
                type: string
                enum:
                - removed
              revoked:
                type: boolean
                enum:
                - true
            required:
            - external_user_id
            - status
            - revoked
            additionalProperties: false
      headers:
        Idempotent-Replayed:
          description: 重放首次提交的响应快照时为 true。
          schema:
            type: string
            enum:
            - 'true'
    '400':
      $ref: ../../../../components/responses/internal/invalid_request.yaml
    '401':
      $ref: ../../../../components/responses/internal/invalid_credential.yaml
    '403':
      $ref: ../../../../components/responses/internal/insufficient_scope.yaml
    '404':
      $ref: ../../../../components/responses/internal/resource_not_found.yaml
    '409':
      $ref: ../../../../components/responses/internal/idempotency_conflict.yaml
    '429':
      $ref: ../../../../components/responses/internal/rate_limited.yaml
    '500':
      $ref: ../../../../components/responses/internal/internal_error.yaml
