# INT-50: runtime source is enterprise_message_handler:channel/3 and
# enterprise_channel_message_logic:channel_tx/4. Internal IDs are JSON int64.
post:
  tags: [internal]
  summary: 企业托管频道消息（应用直发 / 人类代发）
  description: |
    向业务归属匹配的 Workspace 企业频道发送固定非端到端加密的消息。
    频道必须 scope=workspace、status=1，且所属 Workspace 有效；个人频道、
    已归档频道和不匹配的业务归属统一返回 resource_not_found。
    application 模式使用本应用的有效 principal；human 模式另须本来源的有效
    Human 映射、有效企业成员身份，以及目标频道 status=1 的订阅。
    as_user_id / actor_user_id 字段一旦出现即拒绝，包括 null。

    消息、origin、受理审计及幂等结果在同一事务提交。相同幂等键、方法、
    具体频道路径与规范化正文重放首次结果，并返回 Idempotent-Replayed: true。
    当前响应确认服务端已受理并持久化，不包含订阅端送达或展示确认。
    此入口不触发单聊/群聊离线推送。

    Enterprise channel delivery uses HMAC authentication, current resource
    attribution and sender eligibility. Human senders must actively subscribe
    to the target channel. Successful responses are bare JSON objects and
    confirm acceptance, not subscriber delivery or display.
  operationId: internalMessageChannel
  security:
    - ibIntHmacCredential: []
      ibIntHmacTimestamp: []
      ibIntHmacNonce: []
      ibIntHmacSignature: []
  parameters:
    - name: channel_id
      in: path
      required: true
      description: 企业 Workspace 频道 TSID；不是个人频道 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
    - name: Idempotency-Key
      in: header
      required: true
      description: 同一业务操作重试须复用同一 key 和相同规范化正文。
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[ -~]+$'}
  x-imboy-authentication: hmac
  x-imboy-rate-bucket: internal_write
  x-imboy-idempotency: required
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          # Unknown fields are ignored at runtime; make the JSON Schema default
          # explicit for example validators, including each conditional branch.
          additionalProperties: true
          required: [sender_mode, msg_type]
          properties:
            sender_mode:
              type: string
              enum: [application, human]
            sender_user_id:
              description: human 模式必填 OA 外部用户标识字符串；application 模式忽略此字段。
            msg_type:
              type: string
              enum: [text, file, image, link_card, business_action_card]
            as_user_id: false
            actor_user_id: false
            content:
              description: text 必填；UTF-8 编码 1..4000 字节，其他消息类型忽略。
            object_key:
              description: file/image 必填；必须是当前组织与应用已 confirm 的附件对象键。
            width:
              description: image 可选正整数宽度；缺省或形状无效时忽略。
            height:
              description: image 可选正整数高度；缺省或形状无效时忽略。
            title:
              description: 两种卡片必填；UTF-8 编码 1..200 字节。
            description:
              description: 两种卡片可选说明；仅保留 UTF-8 编码 1..2000 字节的字符串，其余忽略。
            url:
              description: |
                link_card 必填 http(s) 地址；当前处理器未对该必填地址设 2048 字节上限。
                business_action_card 可选；出现时必须是 1..2048 UTF-8 字节的有效 http(s) 地址。
                地址检查要求 http:// 或 https:// 后、第一个 / 前的部分非空。
            thumb:
              description: 两种卡片可选缩略图 http(s) 地址；仅保留有效且不超过 2048 UTF-8 字节的字符串，其余忽略。
            action_type:
              description: business_action_card 必填；UTF-8 编码 1..100 字节。
            action_params:
              description: business_action_card 可选 JSON 对象；编码后的 JSON 不超过 4000 字节，出现但无效时拒绝。
          allOf:
            - if:
                additionalProperties: true
                properties: {sender_mode: {const: human}}
              then:
                additionalProperties: true
                required: [sender_user_id]
                properties:
                  sender_user_id: {type: string, minLength: 1}
            - if:
                additionalProperties: true
                properties: {msg_type: {const: text}}
              then:
                additionalProperties: true
                required: [content]
                properties:
                  content:
                    type: string
                    minLength: 1
                    maxLength: 4000
                    x-imboy-max-utf8-bytes: 4000
                    description: maxLength 是字符数的必要上界；服务端按 UTF-8 字节数执行 4000 字节限制。
            - if:
                additionalProperties: true
                properties: {msg_type: {enum: [file, image]}}
              then:
                additionalProperties: true
                required: [object_key]
                properties:
                  object_key: {type: string, minLength: 1}
            - if:
                additionalProperties: true
                properties: {msg_type: {enum: [link_card, business_action_card]}}
              then:
                additionalProperties: true
                required: [title]
                properties:
                  title: {type: string, minLength: 1, maxLength: 200, x-imboy-max-utf8-bytes: 200}
            - if:
                additionalProperties: true
                properties: {msg_type: {const: link_card}}
              then:
                additionalProperties: true
                required: [url]
                properties:
                  url: {type: string, pattern: '^https?://[^/]+'}
            - if:
                additionalProperties: true
                properties: {msg_type: {const: business_action_card}}
              then:
                additionalProperties: true
                required: [action_type]
                properties:
                  action_type: {type: string, minLength: 1, maxLength: 100, x-imboy-max-utf8-bytes: 100}
                  url:
                    type: string
                    pattern: '^https?://[^/]+'
                    maxLength: 2048
                    x-imboy-max-utf8-bytes: 2048
                  action_params:
                    type: object
                    x-imboy-max-json-bytes: 4000
        examples:
          applicationText:
            summary: 应用身份频道通知（合成示例）
            value: {sender_mode: application, msg_type: text, content: '项目通知'}
          humanBusinessAction:
            summary: 有效频道订阅者代发业务卡片（合成示例）
            value:
              sender_mode: human
              sender_user_id: oa-user-001
              msg_type: business_action_card
              title: 查看项目进度
              action_type: open_project
              action_params: {external_project_id: synthetic-project-001}
              url: https://oa.example.com/projects/synthetic-project-001
  responses:
    '200':
      description: 裸 JSON 受理结果；所有数值 ID 原样输出为 JSON int64，OA JavaScript 调用方须使用无损解析。
      headers:
        Idempotent-Replayed:
          description: 重放首次已提交的 HTTP 状态与正文时为 true；首次响应不带此头。
          schema: {type: string, enum: ['true']}
      content:
        application/json:
          schema:
            type: object
            required: [msg_id, webhook_resource_id, sender_kind, sender_user_id, origin_kind, origin_application_id, accepted_at]
            properties:
              msg_id:
                type: string
                format: uuid
                description: UUID v7 业务消息标识；与消息行 ID 不同。
              webhook_resource_id:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
                description: msg_channel 行 ID；与受理/失败 Webhook 的 resource.id 同源。
              sender_kind: {type: string, enum: [application, human]}
              sender_user_id:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
                description: application 模式为应用 principal 的平台用户 ID；human 模式为已映射 Human 的平台用户 ID，均不为 null。
              origin_kind: {type: string, enum: [enterprise_application]}
              origin_application_id:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
              accepted_at: {type: integer, format: int64, description: 受理时间（Unix 毫秒）}
    '400': {$ref: '../../../../components/responses/internal/invalid_request.yaml'}
    '401': {$ref: '../../../../components/responses/internal/unauthorized.yaml'}
    '403': {$ref: '../../../../components/responses/internal/forbidden.yaml'}
    '404': {$ref: '../../../../components/responses/internal/resource_not_found.yaml'}
    '409': {$ref: '../../../../components/responses/internal/idempotency_conflict.yaml'}
    '422': {$ref: '../../../../components/responses/internal/identity_not_mapped.yaml'}
    '429': {$ref: '../../../../components/responses/internal/rate_limited.yaml'}
    '500': {$ref: '../../../../components/responses/internal/internal_error.yaml'}
    '503': {$ref: '../../../../components/responses/internal/security_gate_closed.yaml'}
