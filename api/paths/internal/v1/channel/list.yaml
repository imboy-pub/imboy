# ----------------------------------------------------------------------------
# imboy/api/paths/internal/v1/channel/list.yaml
# GET /api/internal/v1/channels — 工作区频道列表（INT-30，V2.1 新增）
# 调用方：api/openapi-internal.yaml#/paths/~1api~1internal~1v1~1channels
# Handler：src/api/enterprise_channel_handler.erl channels/3
# 投影冻结（V2.1 §15.1 封闭投影）：
#   items[]: channel_id / workspace_id / name / subscriber_count / created_at
# ----------------------------------------------------------------------------
get:
  tags: [internal]
  summary: 工作区频道列表（workspace_id 必填；scope=workspace AND status=1）
  description: |
    指定 Workspace 的工作区频道 keyset 列表（created_at DESC, id DESC）。
    workspace_id 必填——缺失/非整数 400 invalid_request。行集恒被
    scope=workspace AND status=1 过滤（个人频道/已停用/已删除频道不可见）。
    分页为 CURSOR-V2 签名游标（非法/过期/foreign 一律 400，客户端从首页重启）。
  operationId: internalChannelList
  security:
    - ibIntBearer: []
  parameters:
    - name: workspace_id
      in: query
      required: true
      description: Workspace TSID（必填）
      schema: { type: integer, format: int64 }
    - name: limit
      in: query
      description: 页大小（缺省 50；1..100，越界 400 拒绝不截断）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      description: 上一页返回的 next_cursor（opaque）
      schema: { type: string }
  x-imboy-scope: channels:read
  x-imboy-rate-bucket: internal_read
  x-imboy-idempotency: not_required
  responses:
    '200':
      description: 频道分页
      content:
        application/json:
          schema:
            type: object
            required: [items, limit, has_more, next_cursor]
            additionalProperties: false
            properties:
              items:
                type: array
                items:
                  type: object
                  required: [channel_id, workspace_id, name, subscriber_count, created_at]
                  additionalProperties: false
                  properties:
                    channel_id: { type: integer, format: int64 }
                    workspace_id: { type: integer, format: int64 }
                    name: { type: string }
                    subscriber_count: { type: integer, format: int64 }
                    created_at: { type: string, description: RFC3339 时间戳 }
              limit: { type: integer, minimum: 1, maximum: 100 }
              has_more: { type: boolean }
              next_cursor: { type: [string, 'null'] }
    '400': { $ref: '../../../../components/responses/internal/invalid_request.yaml' }
    '401': { $ref: '../../../../components/responses/internal/invalid_credential.yaml' }
    '403': { $ref: '../../../../components/responses/internal/insufficient_scope.yaml' }
    '429': { $ref: '../../../../components/responses/internal/rate_limited.yaml' }
    '500': { $ref: '../../../../components/responses/internal/internal_error.yaml' }
    '503': { $ref: '../../../../components/responses/internal/security_gate_closed.yaml' }
