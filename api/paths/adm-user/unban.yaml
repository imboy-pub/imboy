# POST /adm/user/unban — admin
post:
  tags: [admin]
  summary: admin adm-user - unban
  description: |
    ## 中文 / English
    管理后台 adm-user handler 的 `unban` 动作；路径 `/adm/user/unban`。
    Admin handler `adm-user`, action `unban`. Path `/adm/user/unban`.
  operationId: adm_user_unban
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid]
          properties:
            uid:
              type: integer
              description: 解封目标用户 ID / Target user ID to unban
          additionalProperties: false
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
