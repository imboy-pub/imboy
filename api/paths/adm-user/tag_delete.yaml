# POST /adm/user/tag/delete — admin
post:
  tags: [admin]
  summary: 管理后台删除用户标签
  description: 删除指定用户在特定场景下的标签（管理员操作）。Delete a tag for a specified user under a given scene (admin operation).
  operationId: adm_user_tag_delete
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid]
          properties:
            uid: { type: integer, description: '用户 ID' }
            scene: { type: string, default: friend, description: '场景' }
            tag: { type: string, description: '标签名称' }
            tag_id: { type: integer, description: '标签 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
