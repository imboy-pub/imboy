# POST /api/adm/user/collect/remove — admin
post:
  tags: [admin]
  summary: 管理后台移除用户收藏
  description: 移除指定用户的某条收藏记录（管理员操作）。Remove a specified user's collection record (admin operation).
  operationId: adm_user_collect_remove
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid, kind_id]
          properties:
            uid: { type: integer, description: '用户 ID' }
            kind_id: { type: string, description: '收藏目标 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
