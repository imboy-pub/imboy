# POST /adm/user/logout_apply/approve — admin
post:
  tags: [admin]
  summary: 管理后台批准用户注销申请
  description: 审批通过用户提交的账号注销申请，执行账号注销流程。Approve a user's account deletion request and execute the account deactivation process.
  operationId: adm_user_logout_approve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid]
          properties:
            uid: { type: integer, description: '申请注销的用户 ID' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
