# GET /v1/app/policy
get:
  tags: [user]
  summary: 客户端策略下发
  description: |
    ## 中文 / English
    客户端策略下发
  operationId: appPolicy
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 来源 app_feature_handler#policy → imboy_policy:effective_view()，平台策略键值对
                    additionalProperties: { type: string }
    '4XX':
      description: 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
