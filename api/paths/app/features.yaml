# GET /v1/app/features
get:
  tags: [user]
  summary: 客户端可用功能开关
  description: |
    ## 中文 / English
    客户端可用功能开关
  operationId: appFeatures
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 来源 app_feature_handler#features → imboy_feature:all()，键值对 feature_flag => boolean
                    additionalProperties: { type: boolean }
                    example:
                      e2ee: true
                      live_room: false
    '4XX':
      description: 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
