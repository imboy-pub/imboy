# POST /v1/app_upgrade/report
post:
  tags: [user]
  summary: 客户端升级日志上报
  description: |
    ## 中文 / English
    客户端升级日志上报
  operationId: appUpgradeReport
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [event, client_vsn]
          properties:
            event: { type: string, description: 升级事件类型 / Upgrade event type }
            client_vsn: { type: string, description: 客户端当前版本 / Current client version }
            target_vsn: { type: string, description: 目标升级版本 / Target upgrade version }
            upgrade_type: { type: string, description: 升级方式 / Upgrade type }
            extra: { type: object, description: 额外扩展信息 / Extra extension fields }
  responses:
    '200':
      description: 成功（无 payload，仅记录上报）
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 参数非法 / 无权限
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
