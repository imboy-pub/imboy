# ----------------------------------------------------------------------------
# imboy/api/paths/friend/list.yaml
# GET /api/friend/list — 好友列表 / Friend list
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 11 / D-friend-core)
# 调用方:  api/openapi.yaml#/paths/~1friend~1list
# Handler: src/api/friend_handler.erl#list/2 → friend_ds:page_by_uid/1
# ----------------------------------------------------------------------------
get:
  tags: [user]
  summary: 全量好友列表 + 自身资料
  description: |
    ## 中文
    一次性返回当前用户的所有好友 + 自身基本资料（mine 字段）+ 在线状态。
    payload 形如 `{ mine: <user with state>, friend: [...] }`。
    注意：未分页 — 大账号客户端应考虑端侧缓存与增量同步。
    ## English
    Single-shot fetch of the user's entire friend roster plus the
    current user's own profile (with presence state). Shape:
    `{ mine: <user with state>, friend: [...] }`. NOT paginated;
    large accounts should cache client-side and sync incrementally.
  operationId: listFriends
  responses:
    '200':
      description: 好友列表 + mine
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      mine:
                        type: object
                        description: 当前用户自身资料（含在线状态）.
                        properties:
                          id:
                            type: integer
                            format: int64
                          nickname:
                            type: string
                          avatar:
                            type: string
                          sign:
                            type: string
                          status:
                            type: string
                            description: 在线状态.
                      friend:
                        type: array
                        description: 好友列表.
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                            from_user_id:
                              type: integer
                              format: int64
                            to_user_id:
                              type: integer
                              format: int64
                            nickname:
                              type: string
                            avatar:
                              type: string
                            remark:
                              type: string
                            category_id:
                              type: integer
    '4XX':
      description: 未鉴权
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Envelope.yaml'
