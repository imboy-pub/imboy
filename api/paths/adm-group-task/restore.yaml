# POST /api/adm/group/task/restore — admin
post:
  tags: [admin]
  summary: 管理后台恢复群任务
  description: 管理员恢复已删除的群任务。Restore a deleted group task by admin.
  operationId: adm_group_task_restore
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [task_id]
          properties:
            task_id: { type: string, description: 'TSID 格式任务 ID / Task ID in TSID string format' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
