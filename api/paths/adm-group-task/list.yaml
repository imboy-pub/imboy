# GET /adm/group/task/list — admin
get:
  tags: [admin]
  summary: 管理后台群任务列表
  operationId: adm_group_task_list
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: integer }
      description: 群 ID
    - in: query
      name: status
      required: false
      schema: { type: integer }
      description: 任务状态筛选
    - in: query
      name: deleted
      required: false
      schema: { type: integer }
      description: 是否包含已删除
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
