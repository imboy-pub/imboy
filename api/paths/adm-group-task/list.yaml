# GET /adm/group/task/list — admin
get:
  tags: [admin]
  summary: 管理后台群任务列表
  description: 分页获取指定群的任务列表，支持状态和删除标记筛选（管理员视角）。List group tasks with pagination, status and deletion filters (admin view).
  operationId: adm_group_task_list
  parameters:
    - in: query
      name: gid
      required: true
      schema: { type: integer }
      description: 群 ID
    - in: query
      name: status
      required: false
      schema: { type: integer }
      description: 任务状态筛选
    - in: query
      name: deleted
      required: false
      schema: { type: integer }
      description: 是否包含已删除
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { type: object, additionalProperties: true, description: '记录对象（字段以对应表/handler 为准）' }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
