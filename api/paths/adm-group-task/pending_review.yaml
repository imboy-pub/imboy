# GET /api/adm/group/task/pending_review — admin
get:
  tags: [admin]
  summary: 管理后台待审核群任务列表
  description: 获取待审核的群任务提交列表（管理员视角）。List group task submissions pending review (admin view).
  operationId: adm_group_task_pending_review
  parameters:
    - in: query
      name: task_id
      required: true
      schema: { type: string }
      description: 任务 ID
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { type: object, additionalProperties: true, description: '记录对象（字段以对应表/handler 为准）' }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
