# GET /adm/group/task/detail — admin
get:
  tags: [admin]
  summary: 管理后台群任务详情
  operationId: adm_group_task_detail
  parameters:
    - in: query
      name: task_id
      required: true
      schema: { type: string }
      description: 任务 ID
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
