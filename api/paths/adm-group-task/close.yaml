# POST /api/adm/group/task/close — admin
post:
  tags: [admin]
  summary: 管理后台关闭群任务
  description: 管理员关闭指定群任务（标记为已关闭状态）。Close a group task by admin (marks as closed).
  operationId: adm_group_task_close
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [task_id]
          properties:
            task_id: { type: string, description: 'TSID 格式任务 ID / Task ID in TSID string format' }
  responses:
    '200':
      description: 成功
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
