# POST /adm/channel/report/batch_resolve — admin
post:
  tags: [admin]
  summary: admin adm-report - channel_batch_resolve
  description: |
    ## 中文 / English
    管理后台 adm-report handler 的 `channel_batch_resolve` 动作；路径 `/adm/channel/report/batch_resolve`。
    Admin handler `adm-report`, action `channel_batch_resolve`. Path `/adm/channel/report/batch_resolve`.
  operationId: adm_report_channel_batch_resolve
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 批量处理结果 / Batch resolve result
                    properties:
                      success_count: { type: integer }
                      failed_count: { type: integer }
                      failed_ids:
                        type: array
                        items: { type: string }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
