# GET /adm/group/report/list — admin
get:
  tags: [admin]
  summary: admin adm-report - group_list
  description: |
    ## 中文 / English
    管理后台 adm-report handler 的 `group_list` 动作；路径 `/adm/group/report/list`。
    Admin handler `adm-report`, action `group_list`. Path `/adm/group/report/list`.
  operationId: adm_report_group_list
  parameters:
    - $ref: '../../components/parameters/PaginationPage.yaml'
    - $ref: '../../components/parameters/PaginationSize.yaml'
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/Envelope.yaml'
              - type: object
                properties:
                  payload:
                    type: object
                    description: 群组举报工单分页列表（target_type=group）/ Paginated group report ticket list
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            target_type: { type: string, description: '固定为 group / Always "group"' }
                            target_id: { type: integer, format: int64 }
                            reporter_uid: { type: integer, format: int64 }
                            reason: { type: string }
                            description: { type: string }
                            status: { type: integer, description: '0=待处理 1=无违规 2=违规' }
                            handled_by: { type: integer, format: int64 }
                            handled_at: { type: string }
                            created_at: { type: string }
                            updated_at: { type: string }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
    '4XX':
      description: 无权限 / 参数非法
      content:
        application/json: { schema: { $ref: '../../components/schemas/Envelope.yaml' } }
