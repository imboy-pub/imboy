asyncapi: 3.0.0
info:
  title: IMBoy WebSocket client contract
  version: 2.0.0
  description: |
    本文件从客户端视角描述 send / receive；定义 JSON 信封及文本 ACK，
    不将 JSON schema 当作二进制帧布局或完整业务 action 清单。
    This document describes client send/receive operations, JSON envelopes and text ACKs.

    握手入口为 /api/v1/ws。必须提供有效 access JWT 与支持的子协议。
    JWT 从 Authorization: Bearer <jwt> 读取，缺少该头时才读取 query token；
    过期 JWT 返回 HTTP 401，refresh token 不能用于握手。Sec-WebSocket-Protocol
    仅协商编码，优先级 imboy.v2 > imboy-protobuf > imboy-json > text。

    imboy.v2 使用自定义 9 字节帧头，业务载荷可为 JSON 或 Protobuf；
    JSON 专属字段、E2EE 和控制回执的编码规则见 imboy_codec.erl。
    帧布局见 ../include/imboy_frame.hrl；Protobuf 载荷见 ./proto/imboy.proto
    （指向 ../src/imboy.proto），业务契约见 ../docs/reference/ws-protocol-contract.md。
    普通业务消息 id 是不透明字符串；实体 TSID 与业务消息 ID 不可混用。
    Message IDs are opaque strings. Preserve entity ID precision and order history by conv_seq.
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
defaultContentType: application/json
servers:
  production:
    host: '{apiDomain}'
    protocol: wss
    variables:
      apiDomain:
        default: api.imboy.app
    security:
      - $ref: '#/components/securitySchemes/jwtHeader'
      - $ref: '#/components/securitySchemes/jwtQuery'
  local:
    host: 127.0.0.1:9800
    protocol: ws
    security:
      - $ref: '#/components/securitySchemes/jwtHeader'
      - $ref: '#/components/securitySchemes/jwtQuery'
channels:
  root:
    address: /api/v1/ws
    title: IMBoy WebSocket connection
    description: |
      单连接按 type/action 分发。401/412/子协议错误等 HTTP 握手响应见
      openapi-api.yaml 的 /api/v1/ws。原生 WebSocket ping/pong 与 imboy.v2
      HEARTBEAT_PING/PONG 是传输控制帧，不是 JSON {type: ping} 消息。
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
        headers:
          type: object
          required: [Sec-WebSocket-Protocol]
          properties:
            Sec-WebSocket-Protocol:
              type: string
              description: 支持的子协议列表，例如 imboy.v2, imboy-json；不携带 JWT。
            Authorization:
              type: string
              description: Bearer access JWT；提供时优先于 query token。
        query:
          type: object
          properties:
            token:
              type: string
              description: Authorization 头缺失时使用的 access JWT。
            did:
              type: string
              description: 设备 ID；也可使用 did 请求头，取值须符合登录设备绑定。
            cos:
              type: string
              description: 设备平台；也可使用 cos 请求头。
            vsn:
              type: string
              description: 应用版本；也可使用 vsn 请求头。
    messages:
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientAck:
        $ref: '#/components/messages/ClientAck'
      ServerAck:
        $ref: '#/components/messages/ServerAck'
      AckResult:
        $ref: '#/components/messages/AckResult'
operations:
  sendMessage:
    action: send
    channel:
      $ref: '#/channels/root'
    summary: 客户端发送 C2C / C2G / C2S 消息
    messages:
      - $ref: '#/channels/root/messages/ClientMessage'
  receiveMessage:
    action: receive
    channel:
      $ref: '#/channels/root'
    summary: 客户端接收消息与服务端推送
    messages:
      - $ref: '#/channels/root/messages/ServerMessage'
  sendAck:
    action: send
    channel:
      $ref: '#/channels/root'
    summary: 客户端确认设备已收到消息
    messages:
      - $ref: '#/channels/root/messages/ClientAck'
  receiveServerAck:
    action: receive
    channel:
      $ref: '#/channels/root'
    summary: 客户端接收发送受理回执
    messages:
      - $ref: '#/channels/root/messages/ServerAck'
  receiveAckResult:
    action: receive
    channel:
      $ref: '#/channels/root'
    summary: 客户端接收设备投递确认结果
    messages:
      - $ref: '#/channels/root/messages/AckResult'
components:
  securitySchemes:
    jwtHeader:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 有效 access token；refresh token 或过期 token 返回 401。
    jwtQuery:
      type: httpApiKey
      in: query
      name: token
      description: 浏览器等客户端的 query 认证方式，仅在 Authorization 头缺失时使用。
  messages:
    ClientMessage:
      name: ClientMessage
      payload:
        $ref: '#/components/schemas/ClientEnvelope'
    ServerMessage:
      name: ServerMessage
      payload:
        $ref: '#/components/schemas/ServerEnvelope'
    ClientAck:
      name: ClientAck
      contentType: text/plain
      description: |
        兼容文本 ACK：CLIENT_ACK,<方向>,<原消息id>,<did>。
        imboy.v2 下使用 MSG_C2S 帧承载该原始文本；Protobuf ACK 使用
        PayloadClientAck。8 字节 uint64 ACK 帧仅适用于数值 ID 兼容路径，
        不可用于普通不透明业务消息 ID。确认送达与业务已读动作分别处理。
      payload:
        type: string
        pattern: '^CLIENT_ACK,(C2C|C2G|C2S|S2C),[^,]+,[^,]+$'
    ServerAck:
      name: ServerAck
      payload:
        type: object
        required: [id, type, server_ts]
        properties:
          id:
            $ref: '#/components/schemas/MessageId'
          type:
            type: string
            enum: [C2C_SERVER_ACK, C2G_SERVER_ACK, C2S_SERVER_ACK]
          in_reply_to:
            $ref: '#/components/schemas/MessageId'
          server_ts:
            type: integer
            format: int64
    AckResult:
      name: AckResult
      payload:
        type: object
        required: [type, server_ts]
        properties:
          id:
            $ref: '#/components/schemas/MessageId'
          type:
            type: string
            enum: [CLIENT_ACK_CONFIRM, CLIENT_ACK_ERROR]
          in_reply_to:
            $ref: '#/components/schemas/MessageId'
          action:
            type: string
            enum: [CLIENT_ACK_CONFIRM, CLIENT_ACK_ERROR]
          reason:
            type: string
            description: 错误时的稳定原因；解析失败时可能无法回显消息 ID。
          server_ts:
            type: integer
            format: int64
  schemas:
    MessageId:
      type: string
      minLength: 1
      description: 不透明业务消息 ID；保留原值，不转成数字或重新发号。
    PeerId:
      oneOf:
        - type: integer
          minimum: 1
        - type: string
          minLength: 1
      description: 实体 ID 或 C2S 服务标识；JSON 兼容整数和字符串，禁止损失整数精度。
    ClientEnvelope:
      type: object
      required: [id, type, from, to, msg_type]
      properties:
        id:
          $ref: '#/components/schemas/MessageId'
        type:
          type: string
          enum: [C2C, C2G, C2S]
        from:
          $ref: '#/components/schemas/PeerId'
        to:
          $ref: '#/components/schemas/PeerId'
        msg_type:
          type: string
          minLength: 1
          description: 顶层内容类型；具体允许值及业务参数由对应处理逻辑校验。
        action:
          type: string
          description: 如 message_revoke / message_edit；缺省表示普通消息。
        payload:
          description: 业务载荷；E2EE 场景允许密文字符串，服务端不解密。
        e2ee:
          description: 可空 E2EE 元数据；PFv3 外层结构见 E2EE 协议规范。
        created_at:
          description: 客户端业务时间；JSON 历史格式与 Protobuf 毫秒表示见协议规范。
    ServerEnvelope:
      type: object
      required: [id, type]
      properties:
        id:
          $ref: '#/components/schemas/MessageId'
        type:
          type: string
          enum: [C2C, C2G, C2S, S2C]
        from:
          type: [integer, string]
          description: 系统消息允许空字符串；用户来源保留完整实体 ID。
        to:
          $ref: '#/components/schemas/PeerId'
        msg_type:
          type: string
        action:
          type: string
          description: S2C 分发依据；完整 action 清单以实际发射点与客户端处理器为准。
        payload:
          description: 业务载荷，按 type/action/msg_type 定义。
        e2ee:
          description: 服务端原样透传的 E2EE 元数据。
        conv_seq:
          type: integer
          description: 会话内历史排序和增量游标依据，不从消息 ID 推断顺序。
        in_reply_to:
          $ref: '#/components/schemas/MessageId'
        server_ts:
          type: integer
          format: int64
          description: Unix 毫秒。
