# ----------------------------------------------------------------------------
# imboy/api/asyncapi.yaml — IMBoy WebSocket / 实时通讯 代码生成真源
#
# 关联：.claude/plans/quality-loop.md v1.3 T3.2 (split phase 27 / D-cleanup)
# 起源：从 docs/api/asyncapi.yaml（251 行人类可读历史快照）提升至 api/
#       作为机器消费真源；docs/api/ 版本保留为设计参考。
# 角色：与 api/openapi.yaml（HTTP REST）同级；二者覆盖完整 IMBoy 客户端
#       对外接口面。
# 真源链：
#   - 帧封装与字段位宽真源 → api/proto/imboy_v2_frame.proto
#   - S2C action payload  → api/proto/imboy_s2c.proto
#   - 人类可读设计文档    → docs/api/websocket-api-2.md（1600+ 行，含位图）
# ----------------------------------------------------------------------------
asyncapi: 3.0.0
info:
  title: IMBoy WebSocket API
  version: 2.0.0
  description: |
    IMBoy 1.0.0-rc.1 起正式采用 **IMBoy v2 帧协议**：自托管二进制帧（frame header）
    包裹 JSON/Protobuf payload，向前兼容 v1 JSON。本文件冻结 v2 协议对外可见的消息
    类型与路由方向。

    完整字节布局、字段位宽、错误码请参考权威文档：
    - **api/proto/imboy_v2_frame.proto** — 帧封装真源（codegen 消费）
    - **api/proto/imboy_s2c.proto** — Server→Client action payload
    - **docs/api/websocket-api-2.md** — 人类可读设计文档（1600+ 行，含位图、示例）

    **本 schema 只冻结**：
      - 消息类型枚举（type 字段取值）
      - 主要业务载荷形状（C2C / C2G / ACK / syn）
      - 方向（client→server / server→client）

    **兼容策略**：v2 服务端收到 v1 JSON 帧时自动降级处理；客户端通过 handshake
    协商能力后择优使用 v2。

    **HTTP 升级入口**：见 api/openapi.yaml#paths/~1ws + ~1v1~1ws。
  license:
    name: MulanPSL-2.0
    url: https://license.coscl.org.cn/MulanPSL2

servers:
  production:
    host: "{apiDomain}"
    protocol: wss
    pathname: /ws
    variables:
      apiDomain:
        default: api.example.com
    security:
      - $ref: '#/components/securitySchemes/jwtQuery'

  local:
    host: localhost:9800
    protocol: ws
    pathname: /ws
    security:
      - $ref: '#/components/securitySchemes/jwtQuery'

channels:
  root:
    address: /ws
    title: IMBoy WebSocket 主通道
    description: 所有业务消息通过同一个 WS 连接按 `type` 字段分发
    messages:
      C2CSend:        { $ref: '#/components/messages/C2CSend' }
      C2CDeliver:     { $ref: '#/components/messages/C2CDeliver' }
      C2GSend:        { $ref: '#/components/messages/C2GSend' }
      C2GDeliver:     { $ref: '#/components/messages/C2GDeliver' }
      AckClient:      { $ref: '#/components/messages/AckClient' }
      AckServer:      { $ref: '#/components/messages/AckServer' }
      Heartbeat:      { $ref: '#/components/messages/Heartbeat' }
      TokenRefresh:   { $ref: '#/components/messages/TokenRefresh' }
      RevokeMessage:  { $ref: '#/components/messages/RevokeMessage' }
      EditMessage:    { $ref: '#/components/messages/EditMessage' }
      C2SSend:        { $ref: '#/components/messages/C2SSend' }
      C2SDeliver:     { $ref: '#/components/messages/C2SDeliver' }

operations:
  sendC2C:
    action: send
    channel: { $ref: '#/channels/root' }
    summary: 客户端发送单聊消息
    messages:
      - $ref: '#/channels/root/messages/C2CSend'

  receiveC2C:
    action: receive
    channel: { $ref: '#/channels/root' }
    summary: 服务端下发单聊消息
    messages:
      - $ref: '#/channels/root/messages/C2CDeliver'

  sendC2G:
    action: send
    channel: { $ref: '#/channels/root' }
    summary: 客户端发送群聊消息
    messages:
      - $ref: '#/channels/root/messages/C2GSend'

  receiveC2G:
    action: receive
    channel: { $ref: '#/channels/root' }
    summary: 服务端下发群聊消息
    messages:
      - $ref: '#/channels/root/messages/C2GDeliver'

  sendC2S:
    action: send
    channel: { $ref: '#/channels/root' }
    summary: 客户端发送消息给服务（Bot/Agent/系统服务）
    description: |
      to 字段为 Bot/Agent 的 user_id（account_type=1 或 3）或系统标识。
      Bot（account_type=3）消息经 Webhook 推送到 Bot 服务器（见 bot_developer_guide）。
      Agent（account_type=1）消息经 LLM 推理回复（见 agent-user-guide）。
      bot_* 前缀已废弃，返回 bot_prefix_deprecated 提示。
    messages:
      - $ref: '#/channels/root/messages/C2SSend'

  receiveC2S:
    action: receive
    channel: { $ref: '#/channels/root' }
    summary: 服务端下发服务响应消息（Bot/Agent/系统服务）
    description: |
      Bot Webhook 回复 / Agent LLM 回复 / bot_* 废弃提示 均走此通路。
      S2C action=bot_prefix_deprecated 时提示改用 Agent 账号 C2C 对话。
    messages:
      - $ref: '#/channels/root/messages/C2SDeliver'

  sendAck:
    action: send
    channel: { $ref: '#/channels/root' }
    summary: 客户端 ACK（已收 / 已读）
    messages:
      - $ref: '#/channels/root/messages/AckClient'

components:
  securitySchemes:
    jwtQuery:
      type: httpApiKey
      in: query
      name: token
      description: |
        WS 握手时通过 query string 传入 JWT。连接建立后 token 过期不会立即断开，
        服务端会下发 `token_refresh` 消息要求 8 秒内刷新，超时强制下线。

  messages:
    C2CSend:
      name: C2CSend
      title: 客户端发送单聊
      payload:
        $ref: '#/components/schemas/C2CEnvelope'

    C2CDeliver:
      name: C2CDeliver
      title: 服务端下发单聊
      payload:
        $ref: '#/components/schemas/C2CEnvelope'

    C2GSend:
      name: C2GSend
      title: 客户端发送群聊
      payload:
        $ref: '#/components/schemas/C2GEnvelope'

    C2GDeliver:
      name: C2GDeliver
      title: 服务端下发群聊
      payload:
        $ref: '#/components/schemas/C2GEnvelope'

    AckClient:
      name: AckClient
      title: 客户端 ACK
      payload:
        type: object
        required: [type, msg_id]
        properties:
          type:   { type: string, enum: [ack] }
          msg_id: { type: integer, format: int64 }
          state:  { type: string, enum: [received, read] }

    AckServer:
      name: AckServer
      title: 服务端 ACK
      payload:
        type: object
        required: [type, msg_id, state]
        properties:
          type:   { type: string, enum: [s_ack] }
          msg_id: { type: integer, format: int64 }
          state:  { type: string, enum: [accepted, rejected, duplicated] }
          reason: { type: string, default: null }

    Heartbeat:
      name: Heartbeat
      title: 心跳
      payload:
        type: object
        required: [type]
        properties:
          type: { type: string, enum: [ping, pong] }

    TokenRefresh:
      name: TokenRefresh
      title: 服务端要求刷新 token
      payload:
        type: object
        required: [type]
        properties:
          type:     { type: string, enum: [token_refresh] }
          deadline: { type: integer, description: 8 秒后强制下线的时间戳（毫秒） }

    RevokeMessage:
      name: RevokeMessage
      title: 撤回消息
      payload:
        type: object
        required: [type, msg_id]
        properties:
          type:   { type: string, enum: [revoke] }
          msg_id: { type: integer, format: int64 }

    EditMessage:
      name: EditMessage
      title: 编辑消息
      payload:
        type: object
        required: [type, msg_id, content]
        properties:
          type:    { type: string, enum: [edit] }
          msg_id:  { type: integer, format: int64 }
          content: { type: string }

    C2SSend:
      name: C2SSend
      title: 客户端发送消息给服务（Bot/Agent/系统）
      payload:
        type: object
        required: [type, msg_id, from, to, content_type]
        properties:
          type:
            type: string
            enum: [c2s]
          msg_id:
            type: integer
            format: int64
          from:
            type: integer
            format: int64
          to:
            type: string
            description: Bot/Agent user_id（TSID 字符串）或系统标识（sync）
          content_type:
            type: string
            description: 载荷类型（text/image/audio/video/file 等）
          payload:
            type: object
            description: 消息载荷（content_type 对应结构）

    C2SDeliver:
      name: C2SDeliver
      title: 服务端下发服务响应（Bot 回复 / Agent 回复 / 废弃提示）
      payload:
        type: object
        required: [type, msg_id, from, to]
        properties:
          type:
            type: string
            enum: [s2c]
          msg_id:
            type: integer
            format: int64
          from:
            type: string
            description: Bot/Agent user_id 或 bot_response+msg_id（流式）
          to:
            type: integer
            format: int64
          action:
            type: string
            description: |
              S2C action 标识：
              - undefined/正常 → Bot/Agent 回复内容
              - bot_prefix_deprecated → bot_* 前缀废弃引导
              - c2s_unsupported → 不支持的服务标识
          payload:
            type: object
            description: 响应载荷

  schemas:
    C2CEnvelope:
      type: object
      required: [type, msg_id, from, to, content_type]
      properties:
        type:
          type: string
          enum: [c2c]
        msg_id:
          type: integer
          format: int64
          description: 发送方 TSID 生成的消息 ID（近似时间有序，非全局单调）
        conv_seq:
          type: integer
          description: 服务端回填，per-conversation 严格单调递增
        from:
          type: integer
          format: int64
          description: 发送方 TSID（JSON integer）
        to:
          type: integer
          format: int64
          description: 接收方 TSID（JSON integer）
        content_type:
          type: string
          enum: [text, image, voice, video, file, location, contact]
        content:
          type: object
          description: 类型相关业务字段（文本、URL、坐标等）
        ciphertext:
          type: string
          default: null
          description: E2EE 场景下由客户端加密，服务端不解密
        created_at:
          type: integer
          description: 客户端生成时间戳（毫秒），仅作业务时间参考

    C2GEnvelope:
      type: object
      required: [type, msg_id, from, to, content_type]
      properties:
        type:
          type: string
          enum: [c2g]
        msg_id:      { type: integer, format: int64 }
        conv_seq:    { type: integer }
        from:        { type: integer, format: int64, description: 发送方 TSID }
        to:          { type: integer, format: int64, description: 群 TSID }
        content_type:
          type: string
          enum: [text, image, voice, video, file, location, contact]
        content:     { type: object }
        ciphertext:  { type: string, default: null }
        at_uids:
          type: array
          items: { type: integer, format: int64 }
          description: '@ 提醒的用户 TSID 列表'
        created_at:  { type: integer }
