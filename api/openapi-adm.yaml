components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 载荷 `sub` 为 TSID integer 字符串；过期后前端需调用 `/passport/refresh`
        而非直接重连（此前反转逻辑已于 1.0.0-rc.1 修复）。

  schemas:
    # ----------------------------------------------------------------------
    # T3.2 split phase 1 (2026-05-16)：通用 schema 抽离为独立文件，
    # 便于 review、按域演进、避免单文件膨胀至万行。
    # 根 yaml 仍保持内部锚 #/components/schemas/<Name> 不变，
    # 现有 paths 中的 $ref 无需调整。
    # ----------------------------------------------------------------------
    Envelope:
      $ref: './components/schemas/Envelope.yaml'
    User:
      $ref: './components/schemas/User.yaml'
    Message:
      $ref: './components/schemas/Message.yaml'

  parameters:
    # ----------------------------------------------------------------------
    # T3.2 split phase 2 (2026-05-16)：公共 query 参数抽出。
    # 复用范围：分页参数 → admin 20+ 列表端点；会话/游标参数 → msg 多个端点。
    # 文件名必须 PascalCase 与 components.parameters key 严格一致，
    # 触发 redocly bundle 去重，避免 *ref_N YAML 锚点污染 codegen。
