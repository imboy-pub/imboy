components:
  securitySchemes:
    adminSessionId:
      type: apiKey
      in: cookie
      name: adm_user_id
      description: 管理员 ID Cookie；必须与 adminSessionSignature 同时使用。 / Session user ID.
    adminSessionSignature:
      type: apiKey
      in: cookie
      name: adm_user_sig
      description: 服务端签发的会话签名（含到期/撤销校验）；必须与 adminSessionId 同时使用。 / Signed session.

  schemas:
    MicroCommunityEntityId:
      $ref: './components/schemas/MicroCommunityEntityId.yaml'
    MicroCommunityBinding:
      $ref: './components/schemas/MicroCommunityBinding.yaml'
    MicroCommunityTagsInput:
      $ref: './components/schemas/MicroCommunityTagsInput.yaml'
    MicroCommunityEssenceInput:
      $ref: './components/schemas/MicroCommunityEssenceInput.yaml'
    MicroCommunityTagsPatch:
      $ref: './components/schemas/MicroCommunityTagsPatch.yaml'
    MicroCommunityCandidatePage:
      $ref: './components/schemas/MicroCommunityCandidatePage.yaml'
    MicroCommunityPost:
      $ref: './components/schemas/MicroCommunityPost.yaml'
    MicroCommunityPostPage:
      $ref: './components/schemas/MicroCommunityPostPage.yaml'
    MicroCommunityEssenceResult:
      $ref: './components/schemas/MicroCommunityEssenceResult.yaml'
    MicroCommunityTagsResult:
      $ref: './components/schemas/MicroCommunityTagsResult.yaml'
    MicroCommunityErrorEnvelope:
      $ref: './components/schemas/MicroCommunityErrorEnvelope.yaml'
    MicroCommunityBindingEnvelope:
      $ref: './components/schemas/MicroCommunityBindingEnvelope.yaml'
    MicroCommunityCandidatePageEnvelope:
      $ref: './components/schemas/MicroCommunityCandidatePageEnvelope.yaml'
    MicroCommunityPostPageEnvelope:
      $ref: './components/schemas/MicroCommunityPostPageEnvelope.yaml'
    MicroCommunityEssenceResultEnvelope:
      $ref: './components/schemas/MicroCommunityEssenceResultEnvelope.yaml'
    MicroCommunityTagsResultEnvelope:
      $ref: './components/schemas/MicroCommunityTagsResultEnvelope.yaml'
    Envelope:
      $ref: './components/schemas/Envelope.yaml'
    User:
      $ref: './components/schemas/User.yaml'
    Message:
      $ref: './components/schemas/Message.yaml'

  parameters:
    # ----------------------------------------------------------------------
    # T3.2 split phase 2 (2026-05-16)：公共 query 参数抽出。
    # 复用范围：分页参数 → admin 20+ 列表端点；会话/游标参数 → msg 多个端点。
    # 文件名必须 PascalCase 与 components.parameters key 严格一致，
    # 触发 redocly bundle 去重，避免 *ref_N YAML 锚点污染 codegen。
    # ----------------------------------------------------------------------
    PaginationPage:
      $ref: './components/parameters/PaginationPage.yaml'
    PaginationSize:
      $ref: './components/parameters/PaginationSize.yaml'
    PaginationKeyword:
      $ref: './components/parameters/PaginationKeyword.yaml'
    ConvKey:
      $ref: './components/parameters/ConvKey.yaml'
    SinceSeq:
      $ref: './components/parameters/SinceSeq.yaml'
    HistoryLimit:
      $ref: './components/parameters/HistoryLimit.yaml'

security:
  - adminSessionId: []
    adminSessionSignature: []
