# T3.2 split phase 4 / B (2026-05-16)：paths 段由"内联端点"改为"按域 $ref"。
# 每个端点对应 api/paths/<domain>/<name>.yaml，零语义变化（oasdiff 守门）。
# 子目录约定：adm/ auth/ user/ msg/ 等按业务 tag 拆分；新增端点直接落入
# 对应子目录后在此 paths 段追加 $ref 桥接。
# ----------------------------------------------------------------------------
