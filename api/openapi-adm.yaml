# ----------------------------------------------------------------------------
# imboy/api/openapi-adm.yaml — IMBoy REST API 编辑真源（surface adm：管理后台端点）
#
# 三受众布局（2026-09-22 api-surface-reorg）：本文件是**手工编辑真源**之一。
# 汇总入口 api/openapi.yaml 由 gen_aggregate.py 从三个 root 生成，请勿手改。
# 修改流程：改本文件（或 paths/ 下对应端点文件）→ redocly lint →
#   python3 api/gen_aggregate.py 重新生成聚合文件。
# ----------------------------------------------------------------------------
openapi: 3.1.0
info:
  title: IMBoy REST API — adm surface
  version: 1.0.0-rc.3
  x-stability: stable
  summary: IMBoy 管理后台 HTTP / REST 接口
  description: |
    本文件是 IMBoy REST API **surface adm**（管理后台）的编辑真源。覆盖管理后台的用户/群组/频道/
    举报/公告/插件/运营统计等治理路径与首启初始化向导；完整路径清单以
    `imboy/src/imboy_router.erl` 为权威；契约机器真源见
    `.contract/api_contract.json`（contract-export）。

    **响应信封**：JSON 业务响应使用 `{ code, msg, sv_ts, payload }`；登录页面为 HTML、
    验证码为 PNG，部分基础设施拒绝响应为简化 JSON。业务错误可能使用 HTTP 200 + 非零 code，
    调用方须同时检查 HTTP 状态和业务 code；不要仅凭 HTTP 200 判断成功。信封定义见
    [envelope.schema.json](./envelope.schema.json)。

    **认证 / Authentication**：登录成功签发 `adm_user_id` 和 `adm_user_sig` 两个 Cookie，
    受保护操作必须同时携带；不是客户端 JWT，过期需重新登录。Cookie 的 HttpOnly、SameSite=Lax、
    Secure（TLS 启用时）及 TTL 由 `adm_session_ds` 配置；生产环境强制校验签名、到期和撤销状态。
    非生产环境可显式开启 legacy 单 Cookie 兼容，该调试选项不构成对外契约。
    `/api/adm/passport/*` 与 `/api/adm/setup/*` 不要求登录 Cookie；setup 仍受 IP 白名单和首启状态限制。
    其余操作受管理员访问白名单、会话及各端点 RBAC/特性门控制。
    登录提交须带 meta 返回的单次 `csrf_token` 和 captcha 返回的 `captcha_key` Cookie。
    当前实现未对全部管理写操作统一校验 CSRF header；不要臆造全局 X-CSRF-Token 要求。
    All protected operations require both signed session cookies; login CSRF is explicit and separate.

    **可用范围 / Availability**：本契约涵盖多个产品编译档与运行时特性；声明端点不等于当前
    部署已启用。客服 AI 未编译 customer_service 时返回 HTTP 200、业务码 404；其他特性门以部署 manifest 为准。
    路由覆盖审计以 `imboy_router.erl` 为准；本文件尚未声明的路径不应推断为可用 CRUD。

    **版本策略**：1.0.x 期间保证路径签名向后兼容，破坏性变更通过 `/v2` 路径前缀发布。
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  contact:
    name: IMBoy Maintainers
    url: https://github.com/imboy-pub/imboy

servers:
  - url: https://{apiDomain}
    description: 生产环境（部署方按实际域名替换 apiDomain）
    variables:
      apiDomain:
        default: api.imboy.app
        description: 生产 API 域名占位；自托管/私有部署需改为对应域名
  - url: http://127.0.0.1:{devPort}
    description: 本地开发（IMBOYENV=local make run，端口见 imboy/CLAUDE.md）
    variables:
      devPort:
        default: '9800'
        description: 本地 HTTP 端口；可通过 HTTP_PORT 环境变量覆盖

tags:
  - name: admin
    description: 管理后台鉴权端点
  - name: admin-setup
    description: 首启初始化向导（免鉴权，仅允许执行一次）
  - name: channel
    description: 频道治理 / Channel governance
  - name: organizations
    description: Organization 平台治理 / Organization platform governance
  - name: bots
    description: 开发者 Bot 治理 / Developer bot governance
  - name: ai-agent
    description: AI 助手（平台 LLM 推理）

# ----------------------------------------------------------------------------
# T3.2 split phase 4 / B (2026-05-16)：paths 段由"内联端点"改为"按域 $ref"。
# 每个端点对应 api/paths/<domain>/<name>.yaml，零语义变化（oasdiff 守门）。
# 子目录约定：adm/ auth/ user/ msg/ 等按业务 tag 拆分；新增端点直接落入
# 对应子目录后在此 paths 段追加 $ref 桥接。
# ----------------------------------------------------------------------------
  - name: customer-service
    description: 客服、访客接待、坐席与嵌入集成 / Customer service

  - name: enterprise-business
    description: 企业客户、业务身份、托管会话与交接 / Enterprise business

