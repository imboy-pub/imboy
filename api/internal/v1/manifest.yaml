    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: none

  - id: INT-08
    method: POST
    path: /api/internal/v1/files/confirm
    scope: files:write
    grant: org scoped
    resource: HEAD/size/hash/scope verified confirm
    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: none

  - id: INT-09
    method: POST
    path: /api/internal/v1/messages/direct
    scope: dynamic messages:send*
    scope_rules:
      sender_mode=application: messages:send
      sender_mode=human: messages:send_as_human + required sender_user_id
    grant: org scoped; recipient must be same-org mapped active Human
    resource: enterprise hosted direct message/file; NON-E2EE
    actor: application (audit actor even in human sender_mode)
    idempotency: required
    rate: internal_write
    sender_mode: application|human
    sender_constraints: same-org + mapped + active + workspace-authorized Human only
    persistence: sender_kind, sender_user_id, origin_kind=enterprise_application, origin_application_id

  - id: INT-10
    method: POST
    path: /api/internal/v1/groups/{group_id}/messages
    scope: dynamic messages:send*
    scope_rules:
      sender_mode=application: messages:send
      sender_mode=human: messages:send_as_human + required sender_user_id
    grant: workspace scoped + group granted
    resource: enterprise hosted group message/file; NON-E2EE
    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: application|human
    sender_constraints: same as INT-09

  - id: INT-11
    method: POST
    path: /api/internal/v1/friend-requests
    scope: friend_requests:create
    grant: org scoped; sender+target same-org mapped active Human
    resource: friend request creation ONLY; accept/reject done by receiving Human in existing flow
    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: human  # on behalf of mapped Human sender
    forbidden: auto-accept, auto-confirm, delete, list-all-friends

  - id: INT-12
    method: PUT
    path: /api/internal/v1/webhook
    scope: webhooks:manage
    grant: application self
    resource: configure/rotate/disable own endpoint + subscriptions
    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: none
    events_whitelist: [message.enterprise.accepted, message.enterprise.failed, group.member.changed, file.confirmed]

  - id: INT-13
    method: POST
    path: /api/internal/v1/webhook/deliveries/{delivery_id}/replay
    scope: webhooks:manage
    grant: application self delivery only
    resource: replay own delivery; new delivery id, original event id preserved
    actor: application
    idempotency: required
    rate: internal_write
    sender_mode: none

  - id: INT-14
    method: POST
    path: /api/internal/v1/oa/sso/exchange
    scope: sso:exchange
    grant: org+app bound to the code
    resource: atomic single-use consumption of one-time code (CAS)
    actor: application
    idempotency: single_use_code  # replay of consumed code => reject, not replay-response
    rate: internal_sso
    sender_mode: none
    code_binding: org/app/user/redirect_uri/nonce; only digest stored

  - id: HUMAN-SSO-01  # human-side counterpart, NOT application credential
    method: POST
    path: /api/v1/oa/sso/code
    scope: human JWT (no application scope)
    grant: none
    resource: 60s opaque one-time code issuance for OA SSO
    actor: human_user
    idempotency: not_required
    rate: internal_sso
    sender_mode: none

stable_error_codes: [invalid_credential, credential_expired, application_disabled,
  organization_disabled, insufficient_scope, resource_not_found, identity_not_mapped,
  organization_boundary_violation, idempotency_conflict, rate_limited,
  security_gate_closed, invalid_request, internal_error, version_conflict, resource_conflict, seat_limit_exceeded]

