# Versioned current manifest: INT-01..42. Historical run manifest remains untouched.
# IMBoy Enterprise Internal API Manifest — frozen by A0 at BASE-00
# RUN_ID: enterprise-internal-20260921T043945Z
# Stage coverage: STAGE_GZ (INT-01..INT-14 + human-side SSO code issuance)
# FULL stage extends this manifest ONLY at FULL-00 re-baseline (plan-full §4),
# appending new rows; existing GZ rows' method/path/scope contract is frozen.
# Every route: method / path / scope / grant / resource / actor / idempotency / rate bucket / sender_mode
# Auth order (plan-gz §4.1): TLS -> credential format/digest -> credential active/expiry
#   -> application active -> organization active -> required scope
#   -> organization/workspace/resource boundary -> rate limit -> operation -> audit
# Hard invariants:
#   INV-1  /api/open/v1/* production routes, aliases, handlers, migrations == 0 (verified at BASE-00: grep=0)
#   INV-2  Application Credential may ONLY call /api/internal/v1/*; against /api/adm/* and Human /api/v1/* it MUST get 401/403
#   INV-3  Human JWT may NOT call /api/internal/v1/* application routes (only /api/v1/oa/sso/code)
#   INV-4  No wildcard scopes; messages:send_as_human / friend_requests:create / webhooks:manage never implied by messages:send
#   INV-5  sender contract field is exactly sender_user_id; actor_user_id / as_user_id MUST be rejected
#   INV-6  OA-origin messages are enterprise-hosted and permanently NON-E2EE; Human-Human E2EE paths untouched
#   INV-7  All mutations require Idempotency-Key header; same key+same body -> replay original result; same key+different body -> 409 idempotency_conflict
#   INV-8  TSID int64 in JSON; OA JS consumers must use lossless parser (BigInt), never Number
#   INV-9  Missing internal rate-limit config => fail-closed (reject request or refuse boot), never fail-open

auth_contexts:
  application_credential:
    format: "ib_int_<credential_id>.<secret>"
    verification: sha256_digest + constant_time_compare
    allowed_prefix: "/api/internal/v1/"
    forbidden_prefixes: ["/api/adm/", "/api/v1/"]
  human_jwt:
    allowed: ["/api/v1/oa/sso/code"]
    forbidden_prefix: "/api/internal/v1/"

rate_buckets:  # numeric limits configured by A2 at implementation; bucket keys are frozen here
  internal_read:      {methods: [GET, POST-resolve], fail_closed: true}
  internal_write:     {methods: [PUT, POST, PATCH, DELETE], fail_closed: true}
  internal_sso:       {methods: [POST], fail_closed: true}

routes:
  - id: INT-01
    method: GET
    path: /api/internal/v1/application
    scope: application:read
    grant: none-self  # self context of authenticated application
    resource: application self (org/app/status/scopes)
    actor: application
    idempotency: not_required
    rate: internal_read
    sender_mode: none

  - id: INT-02
    method: PUT
    path: /api/internal/v1/identity-mappings
    scope: identities:write
    grant: org scoped
    resource: enterprise_external_identity (bind external_user_id <-> active member)
