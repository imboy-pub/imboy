# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi.yaml:
  no-ambiguous-paths:
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1update'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1delete'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1subscribe'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1unsubscribe'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1message'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1messages'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1read'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1admin'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1admins'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1stats'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1subscribers'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1invitation'
    - '#/paths/~1api~1v1~1channel~1{channel_id}~1order'
    - '#/paths/~1api~1v1~1channel~1order~1{order_no}'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1messages'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1subscribers'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1admins'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1invitations'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1orders'
    - '#/paths/~1api~1adm~1channel~1{channel_id}~1stats'
paths/ws/connect.yaml:
  operation-2xx-response:
    - '#/get/responses'
