# Lefthook hooks for imboy (Erlang/OTP, cowboy)
# Generated by quality-loop T1.1 on 2026-05-08
# See .claude/plans/quality-loop.md for context

pre-commit:
  parallel: true
  commands:
    erlfmt:
      # 注意 lefthook 的 ** 不匹配零层目录（与 arch-check 同因，2026-10-04 实证：
      # src/imboy_app.erl 一级直置文件的提交曾静默跳过本门禁），故根级文件单列
      glob: "{src/*.erl,src/**/*.erl,src/*.hrl,src/**/*.hrl,apps/**/*.erl,apps/**/*.hrl,test/*.erl,test/**/*.erl,test/*.hrl,test/**/*.hrl}"
      run: erlfmt --check {staged_files}
      stage_fixed: false
    # 编译 + 变更模块 dialyze 门禁（2026-10-12 OA 免登连环事故的机制化规避）：
    # cowboy_req:qs/2 类「不存在的远程函数」Erlang 编译期不报错（remote call
    # 运行时解析），曾零警告绿过 erlfmt/eunit（mock 层掩蔽）直达 prod 500；
    # b77cbc2f 亦曾把编译不过的提交送上 main。本命令串行两步：
    #   1. make compile —— 编译门禁（拦 unsafe variable 等编译错误）
    #   2. 对 staged 的 src/.erl 逐模块 dialyzer 增量分析（复用 .imboy.plt）：
    #      只拦 "Call to missing or unexported function" 类 undef（必崩类，
    #      2026-10-12 qs/2 复盘实证 0.23s/模块稳拦）；其余类型警告不在此拦
    #      （存量 477 legacy 由 CI dialyze-check 基线 ratchet 兜底），零基线负担
    # 降级：PLT 缺失时告警放行（新 clone 先 make dialyze 建基线）。
    compile-dialyze:
      glob: "{src/*.erl,src/**/*.erl,src/*.hrl,src/**/*.hrl,apps/**/*.erl,apps/**/*.hrl}"
      run: |
        make compile || { echo "❌ make compile 失败：编译不过的代码不得提交"; exit 1; }
        [ -f .imboy.plt ] || { echo "⚠️ .imboy.plt 缺失，dialyze 门禁降级放行（运行 make dialyze 建立）"; exit 0; }
        rc=0
        for f in {staged_files}; do
          case "$f" in
            *.erl) ;;
            *) continue ;;
          esac
          beam="ebin/$(basename "${f%.erl}").beam"
          [ -f "$beam" ] || continue
          out=$(dialyzer --plt .imboy.plt -n "$beam" 2>&1)
          if echo "$out" | grep -q "missing or unexported function"; then
            echo "❌ $f 调用了不存在的函数（undef 必崩类，qs/2 事故同类）:"
            echo "$out" | grep "missing or unexported function" | head -5
            rc=1
          fi
        done
        exit $rc
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
    # 迁移文件门禁（ADR-0002）：命名格式 / up-down 成对 / 版本号唯一。
    # 缺 down 会让 erlang_migrate:apply_down/6 返回 {error,{no_down_migration,V}}，
    # 卡死该版本之后的整条回滚链，故在提交前拦住。
    migrations:
      glob: "priv/migrations/*.sql"
      run: bash scripts/check_migrations.sh
    # 纵切架构门禁（ADR-0007 / feature-slice-rules 九铁律）：全仓扫描，故用 glob
    # 收窄为仅在涉及纵切单元或核心层时才跑，避免每次提交都付全仓代价。
    # 注意 lefthook 的 ** 不匹配零层目录：src/lib 一级直置文件（elib_pg.erl 等）
    # 需单独的 src/lib/*.erl 分支，否则这类提交会静默跳过本门禁（2026-10-04 实证）。
    arch-check:
      glob: "{src/lib/*.erl,src/features/**/*.erl,src/products/**/*.erl,src/plugins/**/*.erl}"
      # ⚠️ 2026-10-04 根因更正：exit 138 崩溃真因是 darwin 27 上 Apple /bin/bash 3.2
      # 的 fork 子进程缺陷（崩溃报告 _libcoreservices_fork_child PAC failure）；
      # Xcode /usr/bin/git 向 hook 注入 CPATH/LIBRARY_PATH/SDKROOT/MANPATH 肥环境，
      # 令 fork 密集门禁必崩。此前"剥离 MANPATH 9/9 崩→4/4 过"是相关非因果的巧合。
      # 修复见 .githooks/ 包装器（core.hooksPath 方案，exec 前剥离注入变量），
      # 此处 env -u 保留作纵深防御；bash 为 Apple 3.2（本机无 brew bash）。
      run: env -u MANPATH bash scripts/check_feature_architecture.sh

commit-msg:
  commands:
    # 纯 shell 实现（imboy 是 Erlang 项目，避免引入 node 生态）
    # 校验 Conventional Commits：<type>(<scope>)!?: <subject>
    conventional:
      run: |
        if ! head -1 "{1}" | grep -qE '^(feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert)(\([^)]+\))?!?: .{1,90}$'; then
          echo "❌ commit message 不符合 Conventional Commits 规范" >&2
          echo "   格式: <type>(<scope>)!?: <subject>" >&2
          echo "   type: feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert" >&2
          exit 1
        fi

# pre-push：Gradualizer 变更模块快检（escript 秒级、无 JVM 依赖；CI 深度门禁由 eqWAlizer 承担）
# 依赖: make gradualizer-setup（首次）+ 最近一次 make compile 的 ebin/
# Ratchet 语义：只拦"基线外的新增失败模块"；存量失败（.gradualizer-baseline.txt 内）警告放行，
# 与 CI 观察模式一致。修绿模块后跑 make gradualize-baseline 收紧基线（只准减不准增）。
# 排除清单与 Makefile GRADUALIZE_EXCLUDE 对齐：imboy_pb（gpb 生成）、elib_str（触发上游崩溃）、
# barrel_mcp_*（vendored，不 patch 上游）。
# ⚠️ 门禁生效前提：lefthook 需算出 push 文件集（首选 HEAD @{push}）。新 clone 后执行
#   git config remote.pushDefault gitcode && git branch --set-upstream-to=gitcode/main main
# 否则会以 "no matching push files" 静默跳过全部命令（2026-09-29 三仓实证；
# lefthook 2.1.9 internal/git/repo.go PushFiles：回退解析 origin/HEAD 得 main 后 diff HEAD main 恒空）。
pre-push:
  commands:
    gradualize-changed:
      run: |
        files=$(git diff --name-only origin/main...HEAD -- 'src/*.erl' 'src/**/*.erl' \
          | grep -v '_tests\.erl$' | grep -v 'imboy_pb\.erl$' | grep -v 'elib_str\.erl$' | grep -v 'barrel_mcp_' || true)
        files=$(for f in $files; do [ -f "$f" ] && echo "$f"; done)
        [ -z "$files" ] && exit 0
        [ -x tools/gradualizer/bin/gradualizer ] || { echo "⚠️ 未安装 Gradualizer，跳过（make gradualizer-setup 安装）"; exit 0; }
        pa="-pa ebin"; for d in deps/*/ebin; do [ -d "$d" ] && pa="$pa -pa $d"; done
        out=$(tools/gradualizer/bin/gradualizer $pa -I "$PWD/include" --no_color --fmt_location brief $files 2>&1) && exit 0
        failing=$(printf '%s\n' "$out" | grep -oE '^src/[^:]+\.erl' | sort -u)
        if [ -z "$failing" ]; then
          echo "⚠️ Gradualizer 运行异常（非类型错误），放行（CI 兜底）:"
          printf '%s\n' "$out" | tail -10
          exit 0
        fi
        rc=0
        for f in $failing; do
          mod=$(basename "$f" .erl)
          if grep -qx "$mod" .gradualizer-baseline.txt 2>/dev/null; then
            echo "⚠️ $f 存量类型缝隙（基线内，放行）"
          else
            echo "❌ $f 新增 Gradualizer 失败（不在 .gradualizer-baseline.txt 基线内）:"
            printf '%s\n' "$out" | grep "^$f:" | head -10
            rc=1
          fi
        done
        exit $rc
