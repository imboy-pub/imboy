# Lefthook hooks for imboy (Erlang/OTP, cowboy)
# Generated by quality-loop T1.1 on 2026-05-08
# See .claude/plans/quality-loop.md for context

pre-commit:
  parallel: true
  commands:
    erlfmt:
      glob: "{src,apps,test}/**/*.{erl,hrl}"
      run: erlfmt --check {staged_files}
      stage_fixed: false
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact

commit-msg:
  commands:
    # 纯 shell 实现（imboy 是 Erlang 项目，避免引入 node 生态）
    # 校验 Conventional Commits：<type>(<scope>)!?: <subject>
    conventional:
      run: |
        if ! head -1 "{1}" | grep -qE '^(feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert)(\([^)]+\))?!?: .{1,90}$'; then
          echo "❌ commit message 不符合 Conventional Commits 规范" >&2
          echo "   格式: <type>(<scope>)!?: <subject>" >&2
          echo "   type: feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert" >&2
          exit 1
        fi

# pre-push：Gradualizer 变更模块快检（escript 秒级、无 JVM 依赖；CI 深度门禁由 eqWAlizer 承担）
# 依赖: make gradualizer-setup（首次）+ 最近一次 make compile 的 ebin/
pre-push:
  commands:
    gradualize-changed:
      run: |
        files=$(git diff --name-only origin/main...HEAD -- 'src/*.erl' 'src/**/*.erl' \
          | grep -v '_tests\.erl$' | grep -v 'imboy_pb\.erl$' | grep -v 'elib_log\.erl$' || true)
        [ -z "$files" ] && exit 0
        [ -x tools/gradualizer/bin/gradualizer ] || { echo "⚠️ 未安装 Gradualizer，跳过（make gradualizer-setup 安装）"; exit 0; }
        tools/gradualizer/bin/gradualizer -pa ebin -I include --no_color --fmt_location brief --stop_on_first_error $files
