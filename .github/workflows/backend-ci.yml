name: Backend CI

# P4-Q3（Golden Gates §6.2/§7 CI Gate Matrix）：本 workflow = PR/push 快速门（<10min），
# 全部 job 阻塞、零 continue-on-error（假门零容忍）。
# 阻塞集：compile + xref + E2EE + moment + Manifest(p5)。
# 契约门在 contract-gate.yml（API Contract + EntityId/TSID）；Error Code Contract
# 在 imboyapp 仓 contract.yml；慢门（full-eunit/dialyze/eqwalize/gradualize）
# 已整体迁移至 nightly.yml（每晚 20:00 UTC，无 continue-on-error，红就是红）。
#
# Smoke（8 步链子集）不在此：CI 后端起链硬依赖 PG 扩展（timescaledb
# create_hypertable ×8 / pg_jieba jiebacfg FTS 触发器 / postgis geometry 列，
# 见 priv/migrations/00000001_foundation.up.sql 等），vanilla postgres:18 官方
# 镜像均不含；自定义 imboy/pg18 镜像未发布公共 registry。Golden Install
# （release.yml，8 步全链含 Garage）已覆盖该门 → CI 冒烟子集为计划遗留
# （Golden Gates §7 Smoke 行），详见 P4-Q3 执行报告。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  compile:
    name: Compile Gate (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # OTP 28 为权威版本（与 README 一致、本地开发环境一致）；
    # 27.3 作为向后兼容观察项，不阻塞（experimental）。
    strategy:
      fail-fast: false
      matrix:
        otp: ["28"]
        include:
          - otp: "27.3"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Check duplicate module names
        run: bash scripts/check_duplicate_modules.sh

      - name: Check server zero-crypto (E2EE 私钥/明文永不经服务端, ADR 07 §6.3 / 08 §4)
        run: bash scripts/check_server_zero_crypto.sh

      - name: Check release and wallet migration gates
        run: |
          bash scripts/check_release_consistency.sh
          bash scripts/test/check_release_consistency_test.sh

      - name: Compile
        run: IMBOYENV=local make test-build

  moment-eunit:
    name: Moment EUnit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Materialize config/sys.config from example
        # sys.config 与 sys.local.config（*local*.config 被 gitignore）均不入仓，
        # CI 检出后 config/sys.config 不存在；erl -config 对缺失文件直接
        # "Could not start kernel pid ... configuration file not found" 崩溃。
        # sys.config.example 含 sql_driver/pg_conf 等全部所需 env（meck 不起 app 无需真 PG）。
        run: cp config/sys.config.example config/sys.config

      - name: Run Moment Targeted EUnit
        run: |
          # -config + 显式 application:load(imboy)：config 提供 env 须应用 load 后
          # get_env 才可见（如 sql_driver→public. 表名前缀）；meck 测试不起 app 无需 PG。
          # ⚠️ 必须用仓内 sys.config：sys.local.config 被 gitignore，CI 检出不存在
          IMBOYENV=local make eunit EUNIT_MODS='moment_repo_tests moment_logic_tests moment_handler_tests adm_moment_handler_tests' EUNIT_ERL_OPTS="-config config/sys -pa ebin -pa test -eval 'application:load(imboy)'"

  # ----------------------------------------------------------------
  # Manifest (p5) — 插件清单契约门禁（阻塞，Golden Gates §7）
  # priv/plugins/*/plugin.config 必须能被 file:consult 解析且含必备键
  # （docs/plugin/contract.md §3）。纯 escript 校验，无服务依赖、秒级完成。
  # 脚本对"零插件"会输出 0/0 通过（空数组循环 0 次）——下面先断言仓内
  # 至少存在一个 plugin.config，防止清单被整体误删时本门假绿。
  # ----------------------------------------------------------------
  p5-manifest:
    name: Plugin manifest (p5, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 只需 escript（OTP 自带），无需 rebar3——不给 rebar3-version 即不安装
      # （同 quality.yml erlang-lint 的 setup-beam 行为说明）
      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"

      - name: "Guard: at least one plugin manifest must exist"
        run: |
          set -euo pipefail
          count="$(find priv/plugins -maxdepth 2 -name plugin.config 2>/dev/null | wc -l | tr -d ' ')"
          echo "plugin.config count: ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "::error::priv/plugins 下没有任何 plugin.config —— 若插件清单被移除请同步更新本门（Golden Gates §7 Manifest 行），勿留假绿" >&2
            exit 1
          fi

      - name: Validate plugin manifests (p5)
        run: bash scripts/validate_p5_manifest.sh

  # ----------------------------------------------------------------
  # Xref — 零容忍 ratchet（阻塞，undefined 数必须为 0）
  # 完整编译后实跑 make xref，任何"调用了不存在函数"均视为 CI 失败。
  # 必须在完整 build 之后运行：beam 不全会产生假阳性（mutual undefined）。
  # 基线历史：2026-06-13 初始=42，同日全部修复，ratchet 目标 = 0。
  # ----------------------------------------------------------------
  xref:
    name: "Xref undefined-calls (ratchet: 0 allowed)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run Xref (erlang.mk 会先完整编译再 xref)
        run: |
          set -o pipefail
          IMBOYENV=local make xref 2>&1 | tee xref.log || true

      - name: Enforce zero undefined calls
        run: |
          undef_count="$(grep -c 'Undefined function' xref.log || true)"
          echo "Undefined function calls: ${undef_count}"
          if [ "${undef_count}" -gt 0 ]; then
            echo "ERROR: xref ratchet failed — ${undef_count} undefined call(s) detected:" >&2
            grep 'Undefined function' xref.log | sort -u >&2
            exit 1
          fi

      - name: Summarize Xref result
        if: always()
        run: |
          echo "## Xref undefined-calls (ratchet: 0 allowed)" >> "$GITHUB_STEP_SUMMARY"
          undef_count="$(grep -c 'Undefined function' xref.log || true)"
          echo "Undefined function calls: ${undef_count} (ratchet 目标 = 0；2026-06-13 从 42 全修)" >> "$GITHUB_STEP_SUMMARY"
          grep 'Undefined function' xref.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Xref log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xref-log
          path: xref.log
          retention-days: 14

  # ----------------------------------------------------------------
  # E2EE Verify — 安全门禁（阻塞）
  # security-gate（服务端零密码学守护 + 模块边界守护）+ 38 个 E2EE eunit 模块。
  # 本地基线 2026-08-02：387/387 绿。Critical 套件：cancelled 测试=失败（禁止 skip 降级）。
  # ----------------------------------------------------------------
  e2ee-verify:
    name: E2EE Verify Gate (security-gate + eunit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Compile
        run: IMBOYENV=local make test-build

      - name: Install ripgrep (check_module_boundaries.sh 依赖)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run E2EE verify suite
        run: |
          set -o pipefail
          make e2ee-verify 2>&1 | tee e2ee-verify.log

      - name: Guard against cancelled tests (critical no-skip)
        run: |
          cancelled="$(grep -ciE 'cancelled' e2ee-verify.log || true)"
          echo "cancelled lines: ${cancelled}"
          if [ "${cancelled}" -gt 0 ]; then
            echo "ERROR: E2EE critical suite 存在 cancelled 测试（禁止 skip 降级）:" >&2
            grep -iE 'cancelled' e2ee-verify.log | head -10 >&2
            exit 1
          fi

      - name: Upload E2EE verify log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2ee-verify-log
          path: e2ee-verify.log
          retention-days: 14

  # ----------------------------------------------------------------
  # DCO — 仅 PR 检查，验证所有 commits 带有 Signed-off-by
  # ----------------------------------------------------------------
  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO check
        uses: dco-org/dco-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
