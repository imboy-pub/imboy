name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  compile:
    name: Compile Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Compile
        run: IMBOYENV=local make test-build

  moment-eunit:
    name: Moment EUnit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run Moment Targeted EUnit
        run: |
          IMBOYENV=local make eunit EUNIT_MODS='moment_repo_tests moment_logic_tests moment_handler_tests adm_moment_handler_tests'

  # ----------------------------------------------------------------
  # DCO — 仅 PR 检查，验证所有 commits 带有 Signed-off-by
  # ----------------------------------------------------------------
  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DCO check
        uses: dco-org/dco-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
