name: Backend CI

# A2（商业化就绪）：CI 从门面变真门禁。
# 策略：阻塞门禁保持稳定（compile + 快速 eunit + dco）；
#       全量 eunit 与 dialyze 先以 continue-on-error 建立"失败基线"，
#       CI 干净环境实跑一次得到可信基线后，下一轮再按项目 ratchet 范式
#       （见 quality.yml）收紧为硬门禁。OTP 与 README 宣称的 28 对齐。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  compile:
    name: Compile Gate (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # OTP 28 为权威版本（与 README 一致、本地开发环境一致）；
    # 27.3 作为向后兼容观察项，不阻塞（experimental）。
    strategy:
      fail-fast: false
      matrix:
        otp: ["28"]
        include:
          - otp: "27.3"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Check duplicate module names
        run: bash scripts/check_duplicate_modules.sh

      - name: Check server zero-crypto (E2EE 私钥/明文永不经服务端, ADR 07 §6.3 / 08 §4)
        run: bash scripts/check_server_zero_crypto.sh

      - name: Check release and wallet migration gates
        run: |
          bash scripts/check_release_consistency.sh
          bash scripts/test/check_release_consistency_test.sh

      - name: Compile
        run: IMBOYENV=local make test-build

  moment-eunit:
    name: Moment EUnit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run Moment Targeted EUnit
        run: |
          # -config + 显式 application:load(imboy)：config 提供 env 须应用 load 后
          # get_env 才可见（如 sql_driver→public. 表名前缀）；meck 测试不起 app 无需 PG。
          # ⚠️ 必须用仓内 sys.config：sys.local.config 被 gitignore，CI 检出不存在
          IMBOYENV=local make eunit EUNIT_MODS='moment_repo_tests moment_logic_tests moment_handler_tests adm_moment_handler_tests' EUNIT_ERL_OPTS="-config config/sys -pa ebin -pa test -eval 'application:load(imboy)'"

  # ----------------------------------------------------------------
  # 全量 EUnit — 基线收集（continue-on-error，暂不阻塞）
  # 目的：在 CI 干净环境实跑全部 test/*_tests，产出真实通过/失败基线。
  # 收紧计划：基线明确后改为 ratchet（失败数只准减不准增），移除 continue-on-error。
  # ----------------------------------------------------------------
  full-eunit:
    name: Full EUnit (baseline, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [compile]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run full EUnit suite
        run: |
          set -o pipefail
          IMBOYENV=local make eunit 2>&1 | tee eunit-full.log

      - name: Summarize EUnit result
        if: always()
        run: |
          echo "## Full EUnit baseline" >> "$GITHUB_STEP_SUMMARY"
          # erlang.mk/eunit 汇总行形如 "Failed: N. ... Passed: M."
          grep -iE 'failed|passed|aborted|cancelled' eunit-full.log | tail -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload EUnit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eunit-full-log
          path: eunit-full.log
          retention-days: 14

  # ----------------------------------------------------------------
  # Dialyzer — 基线收集（continue-on-error，暂不阻塞）
  # Makefile 已设 DIALYZER_WARNINGS ?= 50 阈值；先观察 CI 实际告警数，
  # 再据此把阈值收敛为 ratchet。
  # ----------------------------------------------------------------
  dialyze:
    name: Dialyzer (baseline, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [compile]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies, build artifacts and PLT
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-dialyzer-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run Dialyzer
        run: |
          set -o pipefail
          IMBOYENV=local make dialyze 2>&1 | tee dialyze.log

      - name: Summarize Dialyzer result
        if: always()
        run: |
          echo "## Dialyzer baseline" >> "$GITHUB_STEP_SUMMARY"
          warn_count="$(grep -ciE 'warning|Warning' dialyze.log || true)"
          echo "Dialyzer warning lines: ${warn_count} (Makefile threshold DIALYZER_WARNINGS=50)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Dialyzer log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialyze-log
          path: dialyze.log
          retention-days: 14

  # ----------------------------------------------------------------
  # Gradualizer — 宽网类型基线（continue-on-error，暂不阻塞）
  # 双引擎分工：Gradualizer 管"pre-push 本地快检 + CI 全仓宽网扫描"，
  # 分层阻塞门禁由 eqWAlizer 承担（见下）。本 job 产出 failing 趋势指标；
  # 首次跑出 CI 干净基线后，设置仓库变量 GRADUALIZE_BUDGET=观察值 即激活
  # ratchet（只准减不准增，同 xref 范式）。
  # 注意：Gradualizer 构建在 OTP 29+ 需 +nowarn_match_alias_pats
  # （已固化在 make gradualizer-setup 内）。
  # ----------------------------------------------------------------
  gradualize:
    name: Gradualizer (baseline, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Cache Gradualizer escript
        uses: actions/cache@v6
        with:
          path: tools/gradualizer
          key: ${{ runner.os }}-otp28-gradualizer-23533d7eb7541d8a146a507e837fdfff6499a202

      - name: Build Gradualizer (cache hit 时秒过)
        run: make gradualizer-setup

      - name: Compile
        run: IMBOYENV=local make test-build

      - name: Run full-repo Gradualizer audit
        run: |
          set -o pipefail
          make gradualize-audit GRADUALIZE_BUDGET=${{ vars.GRADUALIZE_BUDGET || '9999' }} 2>&1 | tee gradualize.log

      - name: Summarize Gradualizer result
        if: always()
        run: |
          echo "## Gradualizer 类型健康度 (baseline, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          cat .gradualizer/metrics.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "预算 GRADUALIZE_BUDGET=${{ vars.GRADUALIZE_BUDGET || '9999' }}（设为观察值即激活 ratchet，只准减不准增）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradualizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradualizer-logs
          path: .gradualizer/logs
          retention-days: 14

  # ----------------------------------------------------------------
  # eqWAlizer (ELP) — 分层类型门禁基线（continue-on-error，暂不阻塞）
  # 本地基线（2026-07-24, elp 1.1.0, OTP 29）：lib 层 modules=70 failing=38。
  # 2026-07-25 R15 源码 spec 补全后：lib 层 failing=30（6 gen_server worker 清零）。
  # CI/OTP 28 数字可能略有漂移，以生产 CI 观察值校准仓库变量 EQWALIZE_BUDGET_LIB。
  # 收紧计划（双引擎交接）：lib 层 failing 清零 且 Gradualizer lib 层先转阻塞
  # 稳定 2 周后，本 job 移除 continue-on-error 转阻塞。
  # 注：eqWAlizer spec override 需 fork + 重编译 elp 二进制，R18 已证伪模块级方案。
  # 注意：elp eqwalize 退出码恒为 0，Makefile 目标已改为解析输出判定。
  # ----------------------------------------------------------------
  eqwalize:
    name: eqWAlizer lib layer (baseline, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Setup JDK 17 (eqWAlizer 为 Scala jar)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Cache ELP binary and eqwalizer_support
        uses: actions/cache@v6
        with:
          path: .elp
          key: ${{ runner.os }}-elp-2026-06-10-${{ hashFiles('.elp.toml', 'Makefile') }}

      - name: Install ELP (pinned 2026-06-10, otp-28 build)
        run: |
          mkdir -p .elp/bin
          if [ ! -x .elp/bin/elp ]; then
            curl -sL "https://github.com/WhatsApp/erlang-language-platform/releases/download/2026-06-10/elp-linux-x86_64-unknown-linux-gnu-otp-28.tar.gz" | tar xz -C .elp/bin
          fi
          .elp/bin/elp version

      - name: Add ELP to PATH
        run: echo "$GITHUB_WORKSPACE/.elp/bin" >> "$GITHUB_PATH"

      - name: Fetch eqwalizer_support and verify setup
        run: make elp-setup

      - name: Compile
        run: IMBOYENV=local make test-build

      - name: Run eqWAlizer on lib layer
        run: |
          set -o pipefail
          make eqwalize-layer LAYER=lib EQWALIZE_BUDGET=${{ vars.EQWALIZE_BUDGET_LIB || '32' }} 2>&1 | tee eqwalize.log

      - name: Summarize eqWAlizer result
        if: always()
        run: |
          echo "## eqWAlizer lib layer (baseline, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          grep "== eqwalize-layer" eqwalize.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "预算 EQWALIZE_BUDGET_LIB=${{ vars.EQWALIZE_BUDGET_LIB || '32' }}（ratchet：只准减不准增）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eqWAlizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eqwalizer-lib-logs
          path: .elp/logs
          retention-days: 14

  # ----------------------------------------------------------------
  # Xref — 零容忍 ratchet（阻塞，undefined 数必须为 0）
  # 完整编译后实跑 make xref，任何"调用了不存在函数"均视为 CI 失败。
  # 必须在完整 build 之后运行：beam 不全会产生假阳性（mutual undefined）。
  # 基线历史：2026-06-13 初始=42，同日全部修复，ratchet 目标 = 0。
  # ----------------------------------------------------------------
  xref:
    name: "Xref undefined-calls (ratchet: 0 allowed)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            .dialyzer_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Run Xref (erlang.mk 会先完整编译再 xref)
        run: |
          set -o pipefail
          IMBOYENV=local make xref 2>&1 | tee xref.log || true

      - name: Enforce zero undefined calls
        run: |
          undef_count="$(grep -c 'Undefined function' xref.log || true)"
          echo "Undefined function calls: ${undef_count}"
          if [ "${undef_count}" -gt 0 ]; then
            echo "ERROR: xref ratchet failed — ${undef_count} undefined call(s) detected:" >&2
            grep 'Undefined function' xref.log | sort -u >&2
            exit 1
          fi

      - name: Summarize Xref result
        if: always()
        run: |
          echo "## Xref undefined-calls (ratchet: 0 allowed)" >> "$GITHUB_STEP_SUMMARY"
          undef_count="$(grep -c 'Undefined function' xref.log || true)"
          echo "Undefined function calls: ${undef_count} (ratchet 目标 = 0；2026-06-13 从 42 全修)" >> "$GITHUB_STEP_SUMMARY"
          grep 'Undefined function' xref.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Xref log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xref-log
          path: xref.log
          retention-days: 14

  # ----------------------------------------------------------------
  # E2EE Verify — 安全门禁（阻塞）
  # security-gate（服务端零密码学守护 + 模块边界守护）+ 38 个 E2EE eunit 模块。
  # 本地基线 2026-08-02：387/387 绿。Critical 套件：cancelled 测试=失败（禁止 skip 降级）。
  # ----------------------------------------------------------------
  e2ee-verify:
    name: E2EE Verify Gate (security-gate + eunit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            .erlang.mk
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp28-beam-${{ hashFiles('Makefile', 'include/deps.mk') }}

      - name: Compile
        run: IMBOYENV=local make test-build

      - name: Install ripgrep (check_module_boundaries.sh 依赖)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run E2EE verify suite
        run: |
          set -o pipefail
          make e2ee-verify 2>&1 | tee e2ee-verify.log

      - name: Guard against cancelled tests (critical no-skip)
        run: |
          cancelled="$(grep -ciE 'cancelled' e2ee-verify.log || true)"
          echo "cancelled lines: ${cancelled}"
          if [ "${cancelled}" -gt 0 ]; then
            echo "ERROR: E2EE critical suite 存在 cancelled 测试（禁止 skip 降级）:" >&2
            grep -iE 'cancelled' e2ee-verify.log | head -10 >&2
            exit 1
          fi

      - name: Upload E2EE verify log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2ee-verify-log
          path: e2ee-verify.log
          retention-days: 14

  # ----------------------------------------------------------------
  # DCO — 仅 PR 检查，验证所有 commits 带有 Signed-off-by
  # ----------------------------------------------------------------
  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO check
        uses: dco-org/dco-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
