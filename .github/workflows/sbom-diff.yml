# SBOM 差异报告
#
# 触发：push to main 或手动 workflow_dispatch
# 步骤：
#   1. Trivy + Erlang 声明生成源码 SBOM，并校验关键依赖覆盖
#   2. 下载上一次 artifact（如有）
#   3. 对比差异（新增 / 删除 / 版本变更的依赖）
#   4. 将差异报告写入 Job Summary
#   5. 上传当前 SBOM artifact（保留 30 天）
#
# 创建：2026-05-27

name: SBOM Diff Report

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebaseline_legacy:
        description: '明确接受旧清单覆盖不可验证，建立新基线（不报告依赖增删）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  sbom-diff:
    name: Generate SBOM & diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── 1. 安装 Trivy ─────────────────────────────────────────────
      - name: Install Trivy
        run: |
          set -euo pipefail
          # 版本必须是仍存在的 release：v0.52.2 已被上游删除（tag 查询 404），
          # 安装脚本只做字符串拼接、不校验 tag 是否存在，所以日志里会先打印
          # "found version: 0.52.2" 再在下载那步 exit 1——看起来像权限问题，其实是 404。
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.72.0
          trivy --version

      - name: Check SBOM completeness regressions
        env:
          SBOM_TRIVY_BINARY: trivy
        run: python3 -m unittest discover -s scripts/test -p test_sbom_workflow.py -v

      # ── 2. 生成并验证源码 SBOM（不等同于已构建镜像清单）──────────
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          set -euo pipefail
          trivy fs . \
            --format cyclonedx \
            --include-dev-deps \
            --output /tmp/sbom-trivy.json
          python3 scripts/sbom.py prepare --root . \
            --input /tmp/sbom-trivy.json --output /tmp/sbom-current.json
          echo "已验证源码依赖数：$(jq '[.components[] | select(.purl)] | length' /tmp/sbom-current.json)"

      # ── 3. 下载上一次 SBOM artifact（如有）────────────────────────
      - name: Download previous SBOM artifact
        id: prev-sbom
        # 按 workflow/branch 找最近成功且有 artifact 的 run；run_id 与 branch 互斥。
        # Find the latest successful run with an artifact; branch excludes run_id.
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{ github.token }}
          name: sbom-cyclonedx
          path: /tmp/sbom-prev/
          workflow: sbom-diff.yml
          branch: main
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: warn

      # ── 4. 对比差异并写入 Job Summary ─────────────────────────────
      - name: Diff SBOM and write summary
        env:
          PREVIOUS_SBOM_FOUND: ${{ steps.prev-sbom.outputs.found_artifact }}
          REBASELINE_LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.rebaseline_legacy == true }}
        run: |
          set -euo pipefail
          python3 scripts/sbom.py report --root . \
            --current /tmp/sbom-current.json \
            --previous /tmp/sbom-prev/sbom-current.json \
            --found "$PREVIOUS_SBOM_FOUND" \
            --rebaseline-legacy "$REBASELINE_LEGACY" \
            --summary "$GITHUB_STEP_SUMMARY" --outputs "$GITHUB_OUTPUT"

      # ── 5. 上传当前 SBOM artifact（保留 30 天）────────────────────
      - name: Upload current SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: /tmp/sbom-current.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
