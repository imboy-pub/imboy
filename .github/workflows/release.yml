# Community release contract / 社区版发布合同
# Git tag v<VERSION> -> four image tags <VERSION> (prerelease preserved).
# Build once, verify digests in Golden gates, anonymously pull all four, then
# promote those exact digests. VERSION alone never proves image availability.
# ADMIN_REPO_REF must be an approved full frontend commit SHA, shared by Admin
# and Widget. RELEASE_FINALIZE_ENABLED and GHCR visibility are owner-controlled.

name: Release

on:
  push:
    tags:
      - 'v*' # 仅 v 前缀 tag 触发；下方第一步再做严格 semver 校验
  schedule:
    - cron: '0 19 * * *' # 每日 19:00 UTC（北京 03:00 低峰）跑 nightly golden install（G4）

# GHCR 推送/拉取需要 packages 权限；GitHub Release 仅 release-finalize 需要
# contents:write（job 级覆写），其余 job 只读。
permissions:
  contents: read
  packages: write

# Serialize each version; do not cancel halfway through four-image promotion.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-contract:
    name: Validate release and immutable source identity
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      RELEASE_TAG: ${{ steps.contract.outputs.RELEASE_TAG }}
      IMBOY_VERSION: ${{ steps.contract.outputs.IMBOY_VERSION }}
      IMBOY_GIT_SHA: ${{ steps.contract.outputs.IMBOY_GIT_SHA }}
      CANDIDATE_TAG: ${{ steps.contract.outputs.CANDIDATE_TAG }}
      PRERELEASE: ${{ steps.contract.outputs.PRERELEASE }}
      FRONTEND_SHA: ${{ steps.contract.outputs.FRONTEND_SHA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate tag, VERSION, environment and frontend source
        id: contract
        env:
          FRONTEND_SHA: ${{ vars.ADMIN_REPO_REF }}
        run: |
          set -euo pipefail
          bash scripts/release_version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::ADMIN_REPO_REF must be an approved full frontend commit SHA'; exit 1;
          }
          echo "FRONTEND_SHA=$FRONTEND_SHA" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Build Candidate — 仓根 Dockerfile 构建 + 推 GHCR candidate
  #   * checkout 固定在 tag ref（构建源 = 打 tag 的那个 commit，不漂移）
  #   * 候选标签含 VERSION、源码 SHA、run、attempt；最终标签保持完整 VERSION
  #   * digest（sha256:...）作为 job output —— 后续 Golden 门禁与
  #     Release 元数据的唯一镜像标识
  # 仅 tag push 触发（schedule 走 nightly job，不重复构建）。
  # ----------------------------------------------------------------
  build-candidate:
    name: Build & push candidate image
    if: github.event_name == 'push'
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      IMBOY_VERSION: ${{ steps.identity.outputs.IMBOY_VERSION }}
      IMBOY_GIT_SHA: ${{ steps.identity.outputs.IMBOY_GIT_SHA }}
      IMBOY_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      IMAGE_NAME: ${{ steps.identity.outputs.IMAGE_NAME }}
      IMAGE_REF: ${{ steps.identity.outputs.IMAGE_REF }}
      IMAGE_DIGEST_REF: ${{ steps.digest_ref.outputs.IMAGE_DIGEST_REF }}

    steps:
      - name: Checkout (pinned to tag ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # 固定检出发 tag 的 commit；fetch-depth 默认 1 足够

      - name: Resolve release identity
        id: identity
        run: |
          set -euo pipefail
          version="${{ needs.release-contract.outputs.IMBOY_VERSION }}"
          # 用 rev-parse HEAD 而非 github.sha：annotated tag 场景下 HEAD
          # 一定是实际被检出构建的那个 commit。
          sha="$(git rev-parse HEAD)"
          # GHCR 镜像路径必须全小写；owner 大小写因 GitHub 账号而异，
          # 动态引用 + bash 小写展开，禁止硬编码猜 owner。
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-backend"
          {
            echo "IMBOY_VERSION=${version}"
            echo "IMBOY_GIT_SHA=${sha}"
            echo "IMAGE_NAME=${image}"
            echo "IMAGE_REF=${image}:${{ needs.release-contract.outputs.CANDIDATE_TAG }}"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 认证说明（Golden Gates 计划附录 C 第 1 条）：
      # 仓库内推 GHCR 的标准做法是原生 GITHUB_TOKEN + packages:write。
      # 若组织/仓库策略要求 PAT 级 token（或需推送其它 registry），由仓库
      # 管理员（用户本人）配置到 GitHub Secrets 后在此替换——AI 会话不代办。
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-contract.outputs.IMBOY_GIT_SHA }}
            org.opencontainers.image.version=${{ needs.release-contract.outputs.IMBOY_VERSION }}
          push: true
          tags: ${{ steps.identity.outputs.IMAGE_REF }}
        # Dockerfile embeds VERSION; preflight checks it equals the source
        # Git tag without v. Do not confuse an OCI tag with the embedded version.

      - name: Resolve digest ref (immutable image reference)
        id: digest_ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "::error::unexpected digest format '${DIGEST}' (expected sha256:...)"
              exit 1
              ;;
          esac
          echo "IMAGE_DIGEST_REF=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Build Admin Candidate — 跨仓 checkout imboy-admin-frontend 构建 admin 镜像
  #
  # 为什么需要本 job：golden install/upgrade 起栈时 compose 会拉全部服务镜像；
  # imboy/imboy-admin 从未发布到公共 registry（2026-08-23 实测 Docker Hub
  # object not found），不构建 admin candidate 则 compose up 在拉取阶段必挂。
  # admin 仓独立版本化；ADMIN_REPO_REF 必须是批准的完整 commit SHA。
  # 交付版本标签不代表 admin package.json 版本；golden 门禁拉
  # digest、finalize 复打同一 digest 为正式 tag。
  # ----------------------------------------------------------------
  build-admin-candidate:
    name: Build & push admin candidate image
    if: github.event_name == 'push'
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ADMIN_IMAGE_NAME: ${{ steps.identity.outputs.ADMIN_IMAGE_NAME }}
      ADMIN_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      ADMIN_IMAGE_DIGEST_REF: ${{ steps.digest_ref.outputs.ADMIN_IMAGE_DIGEST_REF }}
      ADMIN_REPO_REF: ${{ steps.identity.outputs.ADMIN_REPO_REF }}
      ADMIN_GIT_SHA: ${{ steps.identity.outputs.ADMIN_GIT_SHA }}

    steps:
      - name: Checkout imboy-admin-frontend (PUBLIC)
        uses: actions/checkout@v7
        with:
          repository: imboy-pub/imboy-admin-frontend
          ref: ${{ needs.release-contract.outputs.FRONTEND_SHA }}
          path: imboyadmin

      - name: Resolve admin release identity
        id: identity
        working-directory: imboyadmin
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "${{ needs.release-contract.outputs.FRONTEND_SHA }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-admin"
          {
            echo "ADMIN_IMAGE_NAME=${image}"
            echo "ADMIN_IMAGE_REF=${image}:${{ needs.release-contract.outputs.CANDIDATE_TAG }}"
            echo "ADMIN_REPO_REF=${{ needs.release-contract.outputs.FRONTEND_SHA }}"
            echo "ADMIN_GIT_SHA=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin candidate image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: imboyadmin
          file: imboyadmin/Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/imboy-pub/imboy-admin-frontend
            org.opencontainers.image.revision=${{ needs.release-contract.outputs.FRONTEND_SHA }}
            org.opencontainers.image.version=${{ needs.release-contract.outputs.IMBOY_VERSION }}
          push: true
          tags: ${{ steps.identity.outputs.ADMIN_IMAGE_REF }}
        # admin 镜像构建时 Vite 把 .env.production 里的占位符
        # __IMBOY_API_HOST__ bake 进静态产物，entrypoint 启动时 sed 替换为
        # IMBOY_API_HOST 环境变量（compose 传 https://${API_DOMAIN}）。
        # 无需 build-arg，镜像跨环境通用。

      - name: Resolve digest ref (immutable image reference)
        id: digest_ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ADMIN_IMAGE_NAME: ${{ steps.identity.outputs.ADMIN_IMAGE_NAME }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "::error::unexpected digest format '${DIGEST}' (expected sha256:...)"
              exit 1
              ;;
          esac
          echo "ADMIN_IMAGE_DIGEST_REF=${ADMIN_IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Build PostgreSQL 18 Candidate — 社区版需要 pg_jieba、PostGIS、TimescaleDB
  # 等扩展，不能回落到 vanilla postgres，更不能引用不存在的 imboy/pg18。
  # 与后端/admin 相同：Golden 和 finalize 都只消费这一次构建的 digest。
  # ----------------------------------------------------------------
  build-pg-candidate:
    name: Build & push PostgreSQL 18 candidate image
    if: github.event_name == 'push'
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      PG_IMAGE_NAME: ${{ steps.identity.outputs.PG_IMAGE_NAME }}
      PG_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      PG_IMAGE_DIGEST_REF: ${{ steps.digest_ref.outputs.PG_IMAGE_DIGEST_REF }}

    steps:
      - name: Checkout (pinned to tag ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve PostgreSQL release identity
        id: identity
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-pg18"
          {
            echo "PG_IMAGE_NAME=${image}"
            echo "PG_IMAGE_REF=${image}:${{ needs.release-contract.outputs.CANDIDATE_TAG }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PostgreSQL 18 candidate image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/pg18_Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-contract.outputs.IMBOY_GIT_SHA }}
            org.opencontainers.image.version=${{ needs.release-contract.outputs.IMBOY_VERSION }}
          push: true
          tags: ${{ steps.identity.outputs.PG_IMAGE_REF }}

      - name: Resolve digest ref (immutable image reference)
        id: digest_ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PG_IMAGE_NAME: ${{ steps.identity.outputs.PG_IMAGE_NAME }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "::error::unexpected PostgreSQL digest format '${DIGEST}' (expected sha256:...)"
              exit 1
              ;;
          esac
          echo "PG_IMAGE_DIGEST_REF=${PG_IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  build-widget-candidate:
    name: Build, verify and push Widget candidate
    if: github.event_name == 'push'
    needs: [release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      WIDGET_IMAGE_NAME: ${{ steps.identity.outputs.WIDGET_IMAGE_NAME }}
      WIDGET_IMAGE_DIGEST_REF: ${{ steps.digest.outputs.WIDGET_IMAGE_DIGEST_REF }}
      FRONTEND_VERSION: ${{ steps.identity.outputs.FRONTEND_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: imboy-pub/imboy-admin-frontend
          ref: ${{ needs.release-contract.outputs.FRONTEND_SHA }}
          path: imboyadmin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14' # Same pinned toolchain as frontend CI.
      - name: Resolve Widget identity and check source pairing
        id: identity
        run: |
          set -euo pipefail
          test "$(git -C imboyadmin rev-parse HEAD)" = "${{ needs.release-contract.outputs.FRONTEND_SHA }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-widget"
          echo "WIDGET_IMAGE_NAME=$image" >> "$GITHUB_OUTPUT"
          echo "WIDGET_IMAGE_REF=$image:${{ needs.release-contract.outputs.CANDIDATE_TAG }}" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_VERSION=$(jq -r .version imboyadmin/package.json)" >> "$GITHUB_OUTPUT"
          ADMIN_REPO_DIR="$GITHUB_WORKSPACE/imboyadmin" bash scripts/check_widget_asset_pairing.sh
      - name: Build and verify the real Widget assets
        working-directory: imboyadmin
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:widget
          bun run verify:widget
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push verified Widget assets
        id: push
        uses: docker/build-push-action@v7
        with:
          context: imboyadmin
          file: imboyadmin/Dockerfile.widget
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.WIDGET_IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/imboy-pub/imboy-admin-frontend
            org.opencontainers.image.revision=${{ needs.release-contract.outputs.FRONTEND_SHA }}
            org.opencontainers.image.version=${{ needs.release-contract.outputs.IMBOY_VERSION }}
            pub.imboy.frontend.version=${{ steps.identity.outputs.FRONTEND_VERSION }}
      - name: Verify the published Widget digest in its runtime contract
        id: digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ steps.identity.outputs.WIDGET_IMAGE_NAME }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$IMAGE_NAME@$DIGEST"
          echo "WIDGET_IMAGE_DIGEST_REF=$ref" >> "$GITHUB_OUTPUT"
          docker pull --platform linux/amd64 "$ref"
          cid="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:18081:8080 "$ref")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = 101
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18081/health.txt >/dev/null; then break; fi
            sleep 1
          done
          for asset in health.txt v1/loader.js manifest.json \
            $(jq -r '.pairs[] | select(.admin != null) | .asset_path' priv/cs_widget_asset_pairing.json); do
            curl -fsS --max-time 5 "http://127.0.0.1:18081/$asset" -o "$RUNNER_TEMP/widget-asset"
            test -s "$RUNNER_TEMP/widget-asset"
          done

  # ----------------------------------------------------------------
  # Golden Install 门禁（P2-G1 脚本 / 计划 §4，G2 接入本流水线）
  #
  # ubuntu-latest = cleanroom 近似（一次性 VM：无既有 imboy 容器/卷/网络；
  # 脚本内 assert_cleanroom 仍会拒绝任何脏状态）。脚本以 sudo -E 运行：
  # /etc/hosts 注入 garage 解析需要 root；docker 对 runner 用户免 sudo。
  #
  # ci 模式差异（脚本报告内亦披露）：假域名 + 预置自签证书（无公网域名是
  # CI 的客观约束），nginx 443 公网链路不在本 job 验证范围 —— 需要真域名
  # 真签发时用 host 模式在云主机快照上手工跑同一条命令。
  # ----------------------------------------------------------------
  golden-install:
    name: Golden Install gate (<=900s + restart idempotent)
    if: github.event_name == 'push'
    needs: [build-candidate, build-admin-candidate, build-widget-candidate, build-pg-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 预算 900s + 拉镜像/克隆/重试余量
    env:
      IMAGE_DIGEST_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}
      IMAGE_NAME: ${{ needs.build-candidate.outputs.IMAGE_NAME }}
      ADMIN_IMAGE_DIGEST_REF: ${{ needs.build-admin-candidate.outputs.ADMIN_IMAGE_DIGEST_REF }}
      PG_IMAGE_DIGEST_REF: ${{ needs.build-pg-candidate.outputs.PG_IMAGE_DIGEST_REF }}
      WIDGET_IMAGE_DIGEST_REF: ${{ needs.build-widget-candidate.outputs.WIDGET_IMAGE_DIGEST_REF }}

    steps:
      - name: Checkout (scripts at tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Login to GHCR (compose pull digest)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install smoke deps (python3-websockets)
        run: sudo pip3 install --break-system-packages websockets 2>/dev/null || sudo pip3 install websockets

      # golden 脚本自行 git clone 本仓库（digest 对应 tag）；私有仓场景用
      # gh CLI 的 credential helper（GH_TOKEN 随 sudo -E 透传给 root）。
      - name: Configure git credential for golden clone (root)
        run: sudo git config --global credential.helper '!gh auth git-credential'

      - name: Run golden install (ci profile)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}
          ADMIN_IMAGE_DIGEST_REF: ${{ needs.build-admin-candidate.outputs.ADMIN_IMAGE_DIGEST_REF }}
          PG_IMAGE_DIGEST_REF: ${{ needs.build-pg-candidate.outputs.PG_IMAGE_DIGEST_REF }}
          WIDGET_IMAGE_DIGEST_REF: ${{ needs.build-widget-candidate.outputs.WIDGET_IMAGE_DIGEST_REF }}
        run: |
          set -euo pipefail
          # Actions 的 env 值不做 shell 展开，密码须在 run 内生成（runner 一次性
          # VM，argv 中的临时凭据无暴露面）
          pw="Golden$(openssl rand -hex 6)"
          sudo -E bash scripts/golden_install.sh \
            --image-ref "${IMAGE_DIGEST_REF}" \
            --admin-image-ref "${ADMIN_IMAGE_DIGEST_REF}" \
            --pg-image-ref "${PG_IMAGE_DIGEST_REF}" \
            --widget-image-ref "${WIDGET_IMAGE_DIGEST_REF}" \
            --git-ref "${{ needs.build-candidate.outputs.IMBOY_GIT_SHA }}" \
            --profile ci \
            --admin-phone 13800138000 \
            --admin-password "${pw}" \
            --workdir /tmp/golden

      - name: Upload golden-install logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-install-logs-${{ github.ref_name }}
          path: |
            /tmp/golden/run-*/install_run.log
            /tmp/golden/run-*/backend_failure.log
          retention-days: 7

  # ----------------------------------------------------------------
  # Golden Upgrade 门禁（P2-U1 脚本 / 计划 §5，U2 接入本流水线）
  #
  # 基线 vN = 最近一个稳定 tag（无 prerelease 后缀的 vX.Y.Z），镜像与
  # candidate 同 registry/owner（脚本从 --to-image 推导）。
  # 首个正式版发布前不存在 vN → 输出 SKIPPED_FIRST_RELEASE 并放行
  # （§5 U1 的 --from-image/--from-ref 显式基线即为此场景预留）。
  # ----------------------------------------------------------------
  golden-upgrade:
    name: Golden Upgrade gate (data retention)
    if: github.event_name == 'push'
    needs: [build-candidate, build-admin-candidate, build-widget-candidate, build-pg-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 60 # vN 全量安装 + 数据生成 + 迁移 + 双冒烟，无预算上限
    outputs:
      RESULT: ${{ steps.decide.outputs.RESULT }}
      FROM_TAG: ${{ steps.decide.outputs.FROM_TAG }}

    steps:
      - name: Checkout (scripts at tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # 需要完整 tag 列表找 vN

      - name: Resolve previous stable tag (vN)
        id: decide
        run: |
          set -euo pipefail
          # 稳定 tag = 严格 vX.Y.Z（无 -rc/-pre/-beta/-alpha/-nightly），
          # 排除当前 tag 及其 official 形式（v1.2.3-rc.1 → v1.2.3）
          cur_official="$(sed -E 's/^(v[0-9]+\.[0-9]+\.[0-9]+).*/\1/' <<<"${GITHUB_REF_NAME}")"
          prev="$(git tag --list 'v*' \
            | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -vx "${GITHUB_REF_NAME}" \
            | grep -vx "${cur_official}" \
            | sort -rV | head -1 || true)"
          if [ -n "${prev}" ]; then
            echo "RESULT=RAN" >> "$GITHUB_OUTPUT"
            echo "FROM_TAG=${prev}" >> "$GITHUB_OUTPUT"
            echo "vN 基线：${prev}"
          else
            # 首个正式版：无上一稳定 tag，升级门禁无对象可测，显式放行
            echo "RESULT=SKIPPED_FIRST_RELEASE" >> "$GITHUB_OUTPUT"
            echo "::notice::无上一稳定 tag（首个正式版发布），Golden Upgrade 跳过——§5 U1 设计预留"
          fi

      - name: Login to GHCR (compose pull vN + candidate)
        if: steps.decide.outputs.RESULT == 'RAN'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install smoke deps (python3-websockets)
        if: steps.decide.outputs.RESULT == 'RAN'
        run: sudo pip3 install --break-system-packages websockets 2>/dev/null || sudo pip3 install websockets

      - name: Configure git credential for golden clone (root)
        if: steps.decide.outputs.RESULT == 'RAN'
        run: sudo git config --global credential.helper '!gh auth git-credential'

      - name: Run golden upgrade (vN -> candidate digest)
        if: steps.decide.outputs.RESULT == 'RAN'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}
          ADMIN_IMAGE_DIGEST_REF: ${{ needs.build-admin-candidate.outputs.ADMIN_IMAGE_DIGEST_REF }}
          PG_IMAGE_DIGEST_REF: ${{ needs.build-pg-candidate.outputs.PG_IMAGE_DIGEST_REF }}
          WIDGET_IMAGE_DIGEST_REF: ${{ needs.build-widget-candidate.outputs.WIDGET_IMAGE_DIGEST_REF }}
        run: |
          set -euo pipefail
          pw="Golden$(openssl rand -hex 6)" # env 值不做 shell 展开，须 run 内生成
          sudo -E bash scripts/golden_upgrade.sh \
            --from "${{ steps.decide.outputs.FROM_TAG }}" \
            --to-image "${IMAGE_DIGEST_REF}" \
            --admin-image-ref "${ADMIN_IMAGE_DIGEST_REF}" \
            --pg-image-ref "${PG_IMAGE_DIGEST_REF}" \
            --widget-image-ref "${WIDGET_IMAGE_DIGEST_REF}" \
            --to-ref "${{ needs.build-candidate.outputs.IMBOY_GIT_SHA }}" \
            --profile ci \
            --admin-phone 13800138000 \
            --admin-password "${pw}" \
            --workdir /tmp/golden-up

      - name: Upload golden-upgrade logs (failure only)
        if: failure() && steps.decide.outputs.RESULT == 'RAN'
        uses: actions/upload-artifact@v7
        with:
          name: golden-upgrade-logs-${{ github.ref_name }}
          path: |
            /tmp/golden-up/run-*/install_vn.log
            /tmp/golden-up/run-*/backend_failure.log
          retention-days: 7

  # ----------------------------------------------------------------
  # Release Identity — 三元组的 workflow 级出口（单一聚合点）
  # ----------------------------------------------------------------
  release-identity:
    name: Release Identity (triple)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-candidate]
    outputs:
      IMBOY_VERSION: ${{ needs.build-candidate.outputs.IMBOY_VERSION }}
      IMBOY_GIT_SHA: ${{ needs.build-candidate.outputs.IMBOY_GIT_SHA }}
      IMBOY_IMAGE_DIGEST: ${{ needs.build-candidate.outputs.IMBOY_IMAGE_DIGEST }}
      IMAGE_NAME: ${{ needs.build-candidate.outputs.IMAGE_NAME }}
      IMAGE_REF: ${{ needs.build-candidate.outputs.IMAGE_REF }}
      IMAGE_DIGEST_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}

    steps:
      - name: Emit Release Identity to job summary
        env:
          IMBOY_VERSION: ${{ needs.build-candidate.outputs.IMBOY_VERSION }}
          IMBOY_GIT_SHA: ${{ needs.build-candidate.outputs.IMBOY_GIT_SHA }}
          IMBOY_IMAGE_DIGEST: ${{ needs.build-candidate.outputs.IMBOY_IMAGE_DIGEST }}
          IMAGE_REF: ${{ needs.build-candidate.outputs.IMAGE_REF }}
          IMAGE_DIGEST_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}
        run: |
          set -euo pipefail
          {
            echo "## Release Identity（三元组，计划 §3.1）"
            echo ""
            echo '```'
            echo "IMBOY_VERSION=${IMBOY_VERSION}"
            echo "IMBOY_GIT_SHA=${IMBOY_GIT_SHA}"
            echo "IMBOY_IMAGE_DIGEST=${IMBOY_IMAGE_DIGEST}"
            echo '```'
            echo ""
            echo "- candidate 镜像：\`${IMAGE_REF}\`"
            echo "- digest 引用（Golden 门禁消费）：\`${IMAGE_DIGEST_REF}\`"
            echo ""
            echo "> Golden Install / Golden Upgrade 全绿后，由 release-finalize 将此"
            echo "> digest 复打完整 VERSION 镜像 tag，并在原 Git tag 创建 Release。"
          } >> "$GITHUB_STEP_SUMMARY"

  # A writer's GITHUB_TOKEN cannot establish anonymous customer access.
  community-image-access:
    name: Anonymous pull and architecture gate (all four images)
    if: github.event_name == 'push'
    needs: [build-candidate, build-admin-candidate, build-widget-candidate, build-pg-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Pull every candidate anonymously by verified digest
        run: |
          bash scripts/verify_community_images.sh --platform linux/amd64 --pull \
            --backend '${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}' \
            --admin '${{ needs.build-admin-candidate.outputs.ADMIN_IMAGE_DIGEST_REF }}' \
            --widget '${{ needs.build-widget-candidate.outputs.WIDGET_IMAGE_DIGEST_REF }}' \
            --pg '${{ needs.build-pg-candidate.outputs.PG_IMAGE_DIGEST_REF }}' \
            --output "$RUNNER_TEMP/community-image-access"
      - name: Preserve anonymous verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-image-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-image-access
          retention-days: 30

  release-finalize:
    name: Publish exact four-image bundle and GitHub Release
    if: github.event_name == 'push' && vars.RELEASE_FINALIZE_ENABLED == 'true'
    needs: [release-contract, build-candidate, build-admin-candidate, build-widget-candidate, build-pg-candidate, golden-install, golden-upgrade, community-image-access]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-contract.outputs.RELEASE_TAG }}
      RELEASE_VERSION: ${{ needs.release-contract.outputs.IMBOY_VERSION }}
      IMBOY_RELEASE_OWNER: ${{ github.repository_owner }}
      BACKEND_SHA: ${{ needs.release-contract.outputs.IMBOY_GIT_SHA }}
      FRONTEND_SHA: ${{ needs.release-contract.outputs.FRONTEND_SHA }}
      FRONTEND_VERSION: ${{ needs.build-widget-candidate.outputs.FRONTEND_VERSION }}
      BACKEND_REF: ${{ needs.build-candidate.outputs.IMAGE_DIGEST_REF }}
      ADMIN_REF: ${{ needs.build-admin-candidate.outputs.ADMIN_IMAGE_DIGEST_REF }}
      WIDGET_REF: ${{ needs.build-widget-candidate.outputs.WIDGET_IMAGE_DIGEST_REF }}
      PG_REF: ${{ needs.build-pg-candidate.outputs.PG_IMAGE_DIGEST_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source tag still points to the approved commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$BACKEND_SHA"
          bash scripts/release_version.sh "$RELEASE_TAG"
      - name: Record all source identities and candidate digests before promotion
        run: |
          set -euo pipefail
          jq -n --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" \
            --arg backend_sha "$BACKEND_SHA" --arg frontend_sha "$FRONTEND_SHA" \
            --arg frontend_version "$FRONTEND_VERSION" \
            --arg backend "$BACKEND_REF" --arg admin "$ADMIN_REF" \
            --arg widget "$WIDGET_REF" --arg pg18 "$PG_REF" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{version:$version,git_tag:$tag,backend_commit:$backend_sha,frontend_commit:$frontend_sha,
              frontend_package_version:$frontend_version,platforms:["linux/amd64"],workflow:$run,
              images:{backend:$backend,admin:$admin,widget:$widget,pg18:$pg18}}' \
            > "$RUNNER_TEMP/community-images.json"
      - name: Preserve candidate receipt for resumable promotion
        uses: actions/upload-artifact@v7
        with:
          name: community-release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-images.json
          if-no-files-found: error
          retention-days: 90
      - name: Promote exact digests without rebuilding or replacing existing tags
        run: |
          bash scripts/release_promote.sh --apply "$RELEASE_VERSION" \
            "$BACKEND_REF" "$ADMIN_REF" "$WIDGET_REF" "$PG_REF"
      - name: Verify final customer tags anonymously
        run: |
          bash scripts/verify_community_images.sh --platform linux/amd64 --pull \
            --backend "${BACKEND_REF%@*}:$RELEASE_VERSION" \
            --admin "${ADMIN_REF%@*}:$RELEASE_VERSION" \
            --widget "${WIDGET_REF%@*}:$RELEASE_VERSION" \
            --pg "${PG_REF%@*}:$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/community-final-images"
      - name: Recheck final tag identity against the saved candidate receipt
        run: |
          set -euo pipefail
          jq -e --arg backend "${BACKEND_REF##*@}" --arg admin "${ADMIN_REF##*@}" \
            --arg widget "${WIDGET_REF##*@}" --arg pg "${PG_REF##*@}" '
            .ok and (.images | length == 4)
            and any(.images[]; .component == "backend" and .digest == $backend and .pull_verified)
            and any(.images[]; .component == "admin" and .digest == $admin and .pull_verified)
            and any(.images[]; .component == "widget" and .digest == $widget and .pull_verified)
            and any(.images[]; .component == "pg" and .digest == $pg and .pull_verified)
          ' "$RUNNER_TEMP/community-final-images/summary.json" >/dev/null
          for ref in "$BACKEND_REF" "$ADMIN_REF" "$WIDGET_REF" "$PG_REF"; do
            actual="$(docker buildx imagetools inspect "${ref%@*}:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')"
            test "$actual" = "${ref##*@}"
          done
      - name: Create traceable release on the existing source tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-contract.outputs.PRERELEASE }}
          UPGRADE_RESULT: ${{ needs.golden-upgrade.outputs.RESULT }}
        run: |
          set -euo pipefail
          {
            printf '## Community image bundle %s\n\n' "$RELEASE_VERSION"
            printf 'Backend commit: `%s`\n\nFrontend commit: `%s` (package `%s`)\n\n' "$BACKEND_SHA" "$FRONTEND_SHA" "$FRONTEND_VERSION"
            printf 'Four exact image digests and source identities: attached `community-images.json`.\n\n'
            printf 'Golden Install: PASS; Golden Upgrade: %s; anonymous four-image pull: PASS.\n' "$UPGRADE_RESULT"
            printf 'Verified platform: linux/amd64. Customer DNS/TLS/RTC acceptance remains separate.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          flags=(--verify-tag --latest=false)
          if [[ "$PRERELEASE" = true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/community-images.json" \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
      - name: Preserve final image evidence even after partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-final-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/community-final-images
            ${{ runner.temp }}/community-images.json
          retention-days: 30

  # ----------------------------------------------------------------
  # Golden Install Nightly（G4：每日对最新正式镜像跑 golden install，
  # 耗时进质量债务总账；vars.GOLDEN_NIGHTLY_ENABLED 控制成本，默认关）
  # ----------------------------------------------------------------
  golden-install-nightly:
    name: Golden Install nightly (latest stable image)
    if: github.event_name == 'schedule' && vars.GOLDEN_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (default branch, for scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 找最新稳定 tag

      - name: Resolve latest stable tag + digest
        id: latest
        run: |
          set -euo pipefail
          stable="$(git tag --list 'v*' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -rV | head -1 || true)"
          [ -n "${stable}" ] || { echo "::error::无稳定 tag（尚未发布正式版），nightly golden 无对象"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-backend"
          admin_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-admin"
          pg_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-pg18"
          widget_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imboy-widget"
          image_version="${stable#v}"
          digest="$(docker buildx imagetools inspect "${image}:${image_version}" --format '{{.Manifest.Digest}}')"
          admin_digest="$(docker buildx imagetools inspect "${admin_image}:${image_version}" --format '{{.Manifest.Digest}}')"
          pg_digest="$(docker buildx imagetools inspect "${pg_image}:${image_version}" --format '{{.Manifest.Digest}}')"
          widget_digest="$(docker buildx imagetools inspect "${widget_image}:${image_version}" --format '{{.Manifest.Digest}}')"
          [[ "$widget_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          case "${digest}" in sha256:*) ;; *) echo "::error::digest 格式异常：${digest}"; exit 1 ;; esac
          case "${admin_digest}" in sha256:*) ;; *) echo "::error::admin digest 格式异常：${admin_digest}"; exit 1 ;; esac
          case "${pg_digest}" in sha256:*) ;; *) echo "::error::PostgreSQL digest 格式异常：${pg_digest}"; exit 1 ;; esac
          {
            echo "STABLE=${stable}"
            echo "IMAGE_DIGEST_REF=${image}@${digest}"
            echo "ADMIN_IMAGE_DIGEST_REF=${admin_image}@${admin_digest}"
            echo "PG_IMAGE_DIGEST_REF=${pg_image}@${pg_digest}"
            echo "WIDGET_IMAGE_DIGEST_REF=${widget_image}@${widget_digest}"
          } >> "$GITHUB_OUTPUT"
          echo "nightly 对象：${image}:${image_version}（${digest}）/ ${admin_image}:${image_version}（${admin_digest}）/ ${pg_image}:${image_version}（${pg_digest}）"

      - name: Login to GHCR (compose pull digest)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install smoke deps (python3-websockets)
        run: sudo pip3 install --break-system-packages websockets 2>/dev/null || sudo pip3 install websockets

      - name: Configure git credential for golden clone (root)
        run: sudo git config --global credential.helper '!gh auth git-credential'

      - name: Run golden install against latest stable (ci profile)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST_REF: ${{ steps.latest.outputs.IMAGE_DIGEST_REF }}
          ADMIN_IMAGE_DIGEST_REF: ${{ steps.latest.outputs.ADMIN_IMAGE_DIGEST_REF }}
          PG_IMAGE_DIGEST_REF: ${{ steps.latest.outputs.PG_IMAGE_DIGEST_REF }}
          WIDGET_IMAGE_DIGEST_REF: ${{ steps.latest.outputs.WIDGET_IMAGE_DIGEST_REF }}
        run: |
          set -euo pipefail
          pw="Golden$(openssl rand -hex 6)" # env 值不做 shell 展开，须 run 内生成
          sudo -E bash scripts/golden_install.sh \
            --image-ref "${IMAGE_DIGEST_REF}" \
            --admin-image-ref "${ADMIN_IMAGE_DIGEST_REF}" \
            --pg-image-ref "${PG_IMAGE_DIGEST_REF}" \
            --widget-image-ref "${WIDGET_IMAGE_DIGEST_REF}" \
            --git-ref "${{ steps.latest.outputs.STABLE }}" \
            --profile ci \
            --admin-phone 13800138000 \
            --admin-password "${pw}" \
            --workdir /tmp/golden
          # 耗时（TOTAL=…s 总结行）由脚本产出；每周快照进 quality-ledger（Q2）

      - name: Upload nightly logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-install-nightly-logs-${{ github.run_id }}
          path: |
            /tmp/golden/run-*/install_run.log
            /tmp/golden/run-*/backend_failure.log
          retention-days: 7
