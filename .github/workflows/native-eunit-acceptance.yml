name: Native full EUnit acceptance (temporary)

# Staged for review only. Enable only after approving this exact branch push.
# No default-branch changes, dispatch, schedule, PR creation or deployment.
on:
  push:
    branches: [ci/native-eunit-acceptance-20261018]

permissions:
  contents: read

concurrency:
  group: native-eunit-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-full-eunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NATIVE_CI_ROOT: ${{ runner.temp }}/imboy-native-${{ github.run_id }}-${{ github.run_attempt }}
      NATIVE_CI_ARTIFACTS: ${{ runner.temp }}/imboy-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      # Explicit user approval received for disposable in-job fixture keys.
      NATIVE_EPHEMERAL_KEYS_APPROVED: 'true'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify real second UID before costly provisioning
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_EPHEMERAL_KEYS_APPROVED" != true ]]; then
            echo '::error::Disposable Garage fixture-key permission is unresolved; no provisioning or key creation performed.'
            exit 2
          fi
          test "$(sudo -n id -u)" = 0
          writer_uid="$(sudo -n /usr/sbin/runuser -u nobody -- /usr/bin/id -u)"
          test "$writer_uid" -gt 0
          mkdir -p "$NATIVE_CI_ARTIFACTS"
          printf 'owner_uid=0\nwriter_uid=%s\n' "$writer_uid" > "$NATIVE_CI_ARTIFACTS/uid-preflight.txt"
          git rev-parse HEAD > "$NATIVE_CI_ARTIFACTS/candidate-sha.txt"
      - name: Build pinned native toolchains and PostgreSQL extensions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/native-eunit-bootstrap.sh 2>&1 | tee "$NATIVE_CI_ARTIFACTS/bootstrap.log"
      - name: Run four actual UID HTTP cases, then unfiltered full EUnit
        shell: bash
        run: bash scripts/ci/native-eunit-run.sh
      - name: Upload allowlisted sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-eunit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_CI_ARTIFACTS }}/
          retention-days: 7
          if-no-files-found: error
