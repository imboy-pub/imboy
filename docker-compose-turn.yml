# IMBoy TURN/STUN 服务器配置
# 用于 WebRTC 音视频通话的 NAT 穿透
#
# 使用方法:
#   1. 修改下方环境变量（REALM, STATIC_AUTH_SECRET）
#   2. docker-compose -f docker-compose-turn.yml up -d
#   3. 在 imboy sys.config 中配置 turn_servers
#
version: '3.8'

services:
  coturn:
    image: coturn/coturn:4.6
    container_name: imboy-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/turnserver.conf:ro
    # 端口说明:
    # 3478  - STUN/TURN (UDP+TCP)
    # 5349  - STUN/TURN over TLS
    # 49152-65535 - relay 端口范围

  # 备选: eturnal (Erlang 原生，更轻量)
