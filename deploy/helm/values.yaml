# IMBoy Helm Chart 默认值
# 覆盖方式：helm install imboy . -f values.prod.yaml
# 或：helm install imboy . --set backend.image.tag=1.2.0

# ---------- 全局 ----------
global:
  # 时区，注入所有容器
  timezone: Asia/Shanghai
  # 镜像拉取密钥（私有 registry 时填写）
  imagePullSecrets: []
  # 镜像仓库前缀，为空时直接使用各服务的 image.repository
  imageRegistry: ""

# ---------- 后端：Erlang/OTP + Cowboy ----------
backend:
  enabled: true
  # ⚠️ 固定为 1。后端是有状态的 Erlang 分布式节点，跨 Pod 的 syn 进程注册与消息
  # 路由从未在生产集群验证过，多副本下会话可能落在不同 Pod 而消息投递不确定。
  # 集群水平扩展是路线图项，验证通过前不要调大（见 deploy/helm/README.md 顶部警示）。
  # TSID 附注（TSID-07）：多副本还意味着同 CombinedNode 双写 generator——
  # lifetime lock 会拒绝第二个 READY 实例，别用调副本数的方式"试锁"。
  replicaCount: 1

  # ── rollout 策略（TSID-07 / AC-07A）───────────────────────────────────────
  # 默认 Recreate：先停旧 Pod 再起新 Pod，消灭 RollingUpdate 的并发窗口。
  # 同 Node 双实例是 TSID 唯一性反例的根因（lifetime lock 虽会拒绝第二个
  # READY，但 RollingUpdate+maxSurge 的重叠期会制造无谓的启动失败/告警）；
  # 单副本有状态服务的正确 rollout 语义就是 Recreate。
  # RollingUpdate 仅在确认无共享 TSID state（独立 NodeId 的多副本）时才可
  # 考虑，且必须同时提供 StatefulSet ordinal NodeId 方案。
  strategy:
    type: Recreate

  image:
    repository: imboy/imboy-backend
    tag: "1.0.0-rc.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9800

  env:
    IMBOYENV: pro
    IMBOY_HTTP_PORT: "9800"
    ERL_MAX_PORTS: "1048576"

  # 通过 Secret 注入的敏感变量（见 secret.yaml）
  # IMBOY_PG_HOST / IMBOY_PG_PORT / IMBOY_PG_USER / IMBOY_PG_PASSWORD
  # IMBOY_PG_DB / IMBOY_JWT_KEY / IMBOY_POSTGRE_AES_KEY
  # IMBOY_ADM_COOKIE_SECRET / SENTRY_DSN

  # ── TSID durable generator（TSID-07 / AC-07B、AC-07D）────────────────────
  # 全部非敏感（路径/节点号/时序参数），经 ConfigMap 明文注入。
  # stateDir 必须位于持久卷挂载（见 persistence.tsid）：durable safe_before
  # 是重启后不生成重复 ID 的唯一防线，落在镜像层 = 每次重建都失忆。
  # storeBootstrap：fresh 仅首次部署显式使用（写入全新 fence，无视历史）；
  # existing 是常态——无有效槽即拒绝启动，绝不静默 fresh。
  tsid:
    stateDir: /opt/imboy/tsid_state
    dcId: 1
    nodeId: 1
    dcBits: 3
    storeBootstrap: existing
    # 首启自举（TSID-05/08，elib_tsid_bootstrap 直读 os env）：与
    # storeBootstrap 正交并列——storeBootstrap 管 store 槽位打开合同，
    # 这里三键管 pristine 首启（无割接 manifest 且 store 无 floor）如何
    # 求 floor、以及旧 writer 接管确认（割接全流程见
    # docs/architecture/tsid-cutover-runbook.md）。
    # bootstrapMode：auto_scan（缺省，扫库求 floor）| manual_floor（必须
    #   配 bootstrapFloorUnixMs：整数 unix 毫秒，floor = ms - 1735689600000）。
    # bootstrapFloorUnixMs：manual_floor 必填，auto_scan 下不读取，空串安全。
    # bootstrapLegacyAck：唯一合法值 I-CONFIRM-OLD-WRITER-STOPPED。保持
    #   空串 = 不注入该键（configmap 模板按非空才渲染；空串会被读成已
    #   设置的非法值，pristine 首启拒启）。旧 writer 接管时 --set 精确值，
    #   割接完成后改回空串。
    bootstrapMode: auto_scan
    bootstrapFloorUnixMs: ""
    bootstrapLegacyAck: ""
    # 逻辑时间领先上限（ms）：ID 时间戳最多领先墙钟多少（§5.6 有界逻辑时间）
    maxLogicalLeadMs: 512
    capacityWaitTimeoutMs: 100
    # durable fence 窗口与续租余量（ms）
    fenceWindowMs: 1000
    fenceRenewMarginMs: 100
    startupClockWaitTimeoutMs: 5000

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 8Gi

  # ulimit nofile
  ulimits:
    nofile: 1048576

  # 持久化卷
  persistence:
    # 日志卷（后端写到 /opt/imboy/log）
    log:
      enabled: true
      size: 10Gi
      storageClass: ""          # 空 = 使用集群默认 SC
      accessMode: ReadWriteOnce
    priv:
      enabled: true
      size: 5Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    # TSID durable fence 状态卷（TSID-07 / AC-07B）：48 字节×2 槽 + manifest，
    # 128Mi 绰绰有余；独立于 log/priv 卷，快照与恢复语义单独管理。
    tsid:
      enabled: true
      size: 128Mi
      storageClass: ""
      accessMode: ReadWriteOnce

  # 探针语义三分（TSID-06）：liveness 只看进程活着（/livez 恒 200——
  # 依赖故障（PG 挂 / TSID fenced）不触发容器重启风暴）；readiness 聚合
  # PG + TSID guard（/readyz，不可生成 ID 即 503 摘流量）。
  livenessProbe:
    httpGet:
      path: /livez
      port: 9800
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /readyz
      port: 9800
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9800"
    prometheus.io/path: "/metrics"

# ---------- 管理前端：React + Vite 静态 ----------
admin:
  enabled: true
  replicaCount: 1

  image:
    repository: imboy/imboy-admin
    tag: "1.0.0-rc.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  env: {}
  # VITE_API_BASE 通过 ingress 域名自动推导，或在此显式指定：
  # VITE_API_BASE: https://api.example.com

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# ---------- Ingress（对应 Compose nginx 反向代理的路由规则）----------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket 升级
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS 证书（cert-manager）
    cert-manager.io/cluster-issuer: letsencrypt-prod

  # 后端 API + WebSocket
  api:
    host: api.example.com
    tls: true
    secretName: imboy-api-tls

  # 管理后台
  admin:
    host: admin.example.com
    tls: true
    secretName: imboy-admin-tls

# ---------- 外部 PostgreSQL ----------
# PostgreSQL 不在本 chart 内部署；通过 Secret 注入连接信息
externalDatabase:
  host: "postgres.example.com"
  port: 5432
  database: imboy_pro
  # 用户名和密码来自 secret.yaml（不在此硬编码）

# ---------- Secrets（值填入 values.prod.yaml 或通过 --set 传入）----------
secrets:
  # 数据库
  postgresUser: ""
  postgresPassword: ""
  postgresDb: ""
  # 业务密钥
  jwtKey: ""
  postgreAesKey: ""
  admCookieSecret: ""
  # 可选
  sentryDsn: ""
  # Grafana 管理员密码
  grafanaAdminPassword: ""

# ---------- HPA 自动扩缩容 ----------
hpa:
  backend:
    # ⚠️ 默认关闭：自动扩缩后端等于自动触发未验证的多节点路径。
    # 后端集群化验证通过前不要开启（admin 是无状态静态前端，不受此限）。
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  admin:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# ---------- ServiceAccount ----------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------- Pod 调度 ----------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------- 网络策略 ----------
networkPolicy:
  enabled: false
