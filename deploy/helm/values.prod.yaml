# IMBoy 生产环境覆盖值
# 使用方式：
#   helm upgrade --install imboy ./deploy/helm \
#     -f ./deploy/helm/values.prod.yaml \
#     --set secrets.postgresPassword="$(cat /run/secrets/pg_pass)" \
#     --set secrets.jwtKey="$(cat /run/secrets/jwt_key)" \
#     -n imboy --create-namespace
#
# 安全提示：本文件不得含有实际密钥。
# 所有 secrets.* 字段通过 CI/CD 的 --set 或 external-secrets operator 注入。

global:
  timezone: Asia/Shanghai

backend:
  # ⚠️ 固定为 1，理由同 values.yaml：后端多副本未经生产集群验证。
  replicaCount: 1
  image:
    tag: "1.0.0-rc.1"    # CI/CD 自动替换此值
    pullPolicy: Always
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  env:
    IMBOYENV: pro
    ERL_MAX_PORTS: "1048576"
    IMBOY_PRODUCT_PROFILE: community
    IMBOY_E2EE_MODE: required
    IMBOY_FEATURE_E2EE: "true"
    IMBOY_FEATURE_CHANNEL: "true"
    IMBOY_FEATURE_CHANNEL_ORDER: "true"

admin:
  replicaCount: 2
  image:
    tag: "1.0.0-rc.1"
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  api:
    host: api.imboy.pub          # ← 改为真实域名
  admin:
    host: admin.imboy.pub        # ← 改为真实域名

externalDatabase:
  host: "pg.internal.imboy.pub"  # ← 改为真实 PG 主机
  port: 5432
  database: imboy_pro

hpa:
  backend:
    # ⚠️ 默认关闭，理由同 values.yaml。原值 3→20 会自动放大未验证的多节点路径。
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 65
  admin:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

# secrets.* 字段由 CI/CD 注入，不在此文件中填写
#
# 典型注入方式（helm upgrade 时追加 --set）：
#   --set secrets.paymentMode=live
#   --set secrets.wechatMchId="$(cat /run/secrets/wechat_mch_id)"
#   --set secrets.wechatApiV3Key="$(cat /run/secrets/wechat_api_v3_key)"
#   --set secrets.wechatPrivateKey="$(cat /run/secrets/wechat_private_key)"
#   --set secrets.wechatPlatformPublicKey="$(cat /run/secrets/wechat_platform_pub)"
#   --set secrets.wechatCertSerial="$(cat /run/secrets/wechat_cert_serial)"
#   --set secrets.wechatAppId="$(cat /run/secrets/wechat_app_id)"
#   --set secrets.wechatNotifyUrl="https://api.example.com/v1/payment/callback/wechat"
#   --set secrets.alipayAppId="$(cat /run/secrets/alipay_app_id)"
#   --set secrets.alipayPrivateKey="$(cat /run/secrets/alipay_private_key)"
#   --set secrets.alipayPublicKey="$(cat /run/secrets/alipay_public_key)"
#   --set secrets.alipayNotifyUrl="https://api.example.com/v1/payment/callback/alipay"
#   --set secrets.stripeSecretKey="$(cat /run/secrets/stripe_secret_key)"
#   --set secrets.stripeWebhookSecret="$(cat /run/secrets/stripe_webhook_secret)"
#   --set secrets.licenseFile="/opt/imboy/license.imboy"  # 社区版留空
