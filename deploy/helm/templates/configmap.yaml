{{- /*
ConfigMap：非敏感的后端运行时配置。
敏感值（密钥、密码）位于 secret.yaml。
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "imboy.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
data:
  # ---------- 后端运行时 ----------
  TZ: {{ .Values.global.timezone | quote }}
  IMBOYENV: {{ .Values.backend.env.IMBOYENV | default "pro" | quote }}
  IMBOY_HTTP_PORT: {{ .Values.backend.service.port | toString | quote }}
  ERL_MAX_PORTS: {{ .Values.backend.env.ERL_MAX_PORTS | default "1048576" | quote }}
  IMBOY_PRODUCT_PROFILE: {{ .Values.backend.env.IMBOY_PRODUCT_PROFILE | default "community" | quote }}
  IMBOY_PRODUCT_EXPERIENCE: {{ .Values.backend.env.IMBOY_PRODUCT_EXPERIENCE | default "chat" | quote }}
  IMBOY_E2EE_MODE: {{ .Values.backend.env.IMBOY_E2EE_MODE | default "required" | quote }}
  IMBOY_FEATURE_E2EE: {{ .Values.backend.env.IMBOY_FEATURE_E2EE | default "true" | quote }}
  IMBOY_FEATURE_CHANNEL: {{ .Values.backend.env.IMBOY_FEATURE_CHANNEL | default "true" | quote }}
  IMBOY_FEATURE_CHANNEL_ORDER: {{ .Values.backend.env.IMBOY_FEATURE_CHANNEL_ORDER | default "true" | quote }}

  # ---------- 外部 PostgreSQL 连接（非敏感部分）----------
  IMBOY_PG_HOST: {{ .Values.externalDatabase.host | quote }}
  IMBOY_PG_PORT: {{ .Values.externalDatabase.port | toString | quote }}
  IMBOY_PG_DB: {{ .Values.externalDatabase.database | quote }}

  # ---------- TSID durable generator（TSID-07，全非敏感：路径/节点号/时序）----------
  # stateDir 与 deployment-backend.yaml 的 backend-tsid 卷挂载点一致；
  # 非法值（越界 node/dc、非正整数）由后端启动链 fail-closed 拒绝。
  IMBOY_TSID_STATE_DIR: {{ .Values.backend.tsid.stateDir | quote }}
  IMBOY_TSID_DC_ID: {{ .Values.backend.tsid.dcId | toString | quote }}
  IMBOY_TSID_NODE_ID: {{ .Values.backend.tsid.nodeId | toString | quote }}
  IMBOY_TSID_DC_BITS: {{ .Values.backend.tsid.dcBits | toString | quote }}
  IMBOY_TSID_STORE_BOOTSTRAP: {{ .Values.backend.tsid.storeBootstrap | default "existing" | quote }}
  # 首启自举（TSID-05/08，elib_tsid_bootstrap 直读 os env）：与 storeBootstrap
  # 正交并列——本键管 store 槽位打开合同，下面三键管 pristine 首启（无割接
  # manifest 且 store 无 durable floor）如何求 floor、以及旧 writer 接管确认。
  # bootstrapMode：auto_scan（缺省，扫库求 floor）| manual_floor（配
  # bootstrapFloorUnixMs 人工下限：整数 unix 毫秒，floor = ms - 1735689600000）。
  IMBOY_TSID_BOOTSTRAP_MODE: {{ .Values.backend.tsid.bootstrapMode | default "auto_scan" | quote }}
  IMBOY_TSID_BOOTSTRAP_FLOOR_UNIX_MS: {{ .Values.backend.tsid.bootstrapFloorUnixMs | default "" | toString | quote }}
  # legacy writer 接管确认：唯一合法值 I-CONFIRM-OLD-WRITER-STOPPED，仅在
  # 显式设置时注入——envFrom 会全量注入本 ConfigMap 键，而该值按"已设置即
  # 必须精确匹配"校验，空串会被读成已设置的非法值，pristine 首启一律
  # fail-closed 拒启（空串 ≠ 未设置）。
{{- if .Values.backend.tsid.bootstrapLegacyAck }}
  IMBOY_TSID_BOOTSTRAP_LEGACY_ACK: {{ .Values.backend.tsid.bootstrapLegacyAck | quote }}
{{- end }}
  IMBOY_TSID_MAX_LOGICAL_LEAD_MS: {{ .Values.backend.tsid.maxLogicalLeadMs | default 512 | toString | quote }}
  IMBOY_TSID_CAPACITY_WAIT_TIMEOUT_MS: {{ .Values.backend.tsid.capacityWaitTimeoutMs | default 100 | toString | quote }}
  IMBOY_TSID_FENCE_WINDOW_MS: {{ .Values.backend.tsid.fenceWindowMs | default 1000 | toString | quote }}
  IMBOY_TSID_FENCE_RENEW_MARGIN_MS: {{ .Values.backend.tsid.fenceRenewMarginMs | default 100 | toString | quote }}
  IMBOY_TSID_STARTUP_CLOCK_WAIT_TIMEOUT_MS: {{ .Values.backend.tsid.startupClockWaitTimeoutMs | default 5000 | toString | quote }}

  # ---------- 域名（URL 相关，注入 BASE_URL / WS_URL）----------
  IMBOY_BASE_URL: {{ printf "https://%s" .Values.ingress.api.host | quote }}
  IMBOY_WS_URL: {{ printf "wss://%s/ws" .Values.ingress.api.host | quote }}
