{{- if .Values.backend.enabled -}}
{{- $edgeToken := required "secrets.edgeInternalToken is required for the download edge" .Values.secrets.edgeInternalToken -}}
{{- if or (lt (len $edgeToken) 32) (contains "CHANGE_ME" $edgeToken) (contains "example" $edgeToken) -}}
{{- fail "secrets.edgeInternalToken must be a non-placeholder secret of at least 32 characters" -}}
{{- end -}}
{{- range $name, $value := dict "jwtKey" .Values.secrets.jwtKey "postgreAesKey" .Values.secrets.postgreAesKey "admCookieSecret" .Values.secrets.admCookieSecret -}}
{{- if and $value (eq $edgeToken $value) -}}
{{- fail (printf "secrets.edgeInternalToken must differ from secrets.%s" $name) -}}
{{- end -}}
{{- end -}}
{{- $installCleanupUser := required "secrets.directCleanupPgUser is required" .Values.secrets.directCleanupPgUser -}}
{{- $installCleanupPassword := required "secrets.directCleanupPgPassword is required" .Values.secrets.directCleanupPgPassword -}}
{{- $installPgUser := required "secrets.postgresUser is required" .Values.secrets.postgresUser -}}
{{- $installPgPassword := required "secrets.postgresPassword is required" .Values.secrets.postgresPassword -}}
{{- if or (eq $installCleanupUser $installPgUser) (eq $installCleanupPassword $installPgPassword) -}}
{{- fail "application and direct cleanup database credentials must differ" -}}
{{- end -}}
{{- if .Release.IsUpgrade -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "imboy.secretName" .) -}}
{{- if not $existing -}}
{{- fail "existing release Secret could not be read; use a server-side upgrade with Secret read access" -}}
{{- end -}}
{{- $oldToken := get $existing.data "IMBOY_EDGE_INTERNAL_TOKEN" | default "" | b64dec -}}
{{- if or (eq $oldToken "") (ne $oldToken $edgeToken) -}}
{{- fail "existing kept Secret must contain the same IMBOY_EDGE_INTERNAL_TOKEN before upgrade" -}}
{{- end -}}
{{- $oldCleanupUser := get $existing.data "IMBOY_DIRECT_CLEANUP_PG_USER" | default "" | b64dec -}}
{{- $oldCleanupPassword := get $existing.data "IMBOY_DIRECT_CLEANUP_PG_PASSWORD" | default "" | b64dec -}}
{{- $cleanupUser := required "secrets.directCleanupPgUser is required" .Values.secrets.directCleanupPgUser -}}
{{- $cleanupPassword := required "secrets.directCleanupPgPassword is required" .Values.secrets.directCleanupPgPassword -}}
{{- if or (eq $oldCleanupUser "") (eq $oldCleanupPassword "") (ne $oldCleanupUser $cleanupUser) (ne $oldCleanupPassword $cleanupPassword) -}}
{{- fail "existing kept Secret must contain matching direct cleanup credentials before upgrade" -}}
{{- end -}}
{{- $oldPgUser := get $existing.data "POSTGRES_USER" | default "" | b64dec -}}
{{- $oldPgPassword := get $existing.data "POSTGRES_PASSWORD" | default "" | b64dec -}}
{{- if or (eq $oldPgUser "") (eq $oldPgPassword "") (eq $oldCleanupUser $oldPgUser) (eq $oldCleanupPassword $oldPgPassword) -}}
{{- fail "existing kept Secret must contain separate application and cleanup database credentials" -}}
{{- end -}}
{{- range $key := list "IMBOY_JWT_KEY" "IMBOY_POSTGRE_AES_KEY" "IMBOY_ADM_COOKIE_SECRET" -}}
{{- $oldValue := get $existing.data $key | default "" | b64dec -}}
{{- if eq $oldValue "" -}}
{{- fail (printf "existing kept Secret must contain %s before upgrade" $key) -}}
{{- end -}}
{{- if eq $oldToken $oldValue -}}
{{- fail (printf "existing edge token must differ from %s" $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imboy.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "imboy.backend.selectorLabels" . | nindent 6 }}
  # rollout 策略（TSID-07 / AC-07A）：默认 Recreate——先停旧 Pod 再起新
  # Pod，消灭并发写 TSID state 的重叠窗口（同 Node 双实例 = 唯一性反例根因）。
  # RollingUpdate 仅在无共享 TSID state 的多副本拓扑（独立 NodeId）下允许。
  strategy:
    type: {{ .Values.backend.strategy.type | default "Recreate" }}
  template:
    metadata:
      labels:
        {{- include "imboy.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "imboy.serviceAccountName" . }}

      # 优雅停机：等待 Erlang 节点排空连接
      terminationGracePeriodSeconds: 60

      # 以非 root 用户运行
      securityContext:
        runAsNonRoot: false     # Erlang 镜像可能需要 root，视实际镜像调整
        fsGroup: 1000

      containers:
        - name: backend
          image: {{ include "imboy.image" (dict "global" .Values.global "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP

          # ulimit nofile
          securityContext:
            capabilities:
              add: ["SYS_RESOURCE"]

          # ---------- 环境变量：非敏感（ConfigMap）----------
          envFrom:
            - configMapRef:
                name: {{ include "imboy.configMapName" . }}

          # ---------- 环境变量：敏感（Secret）----------
          env:
            - name: IMBOY_PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: POSTGRES_USER
            - name: IMBOY_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: IMBOY_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_JWT_KEY
            - name: IMBOY_POSTGRE_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_POSTGRE_AES_KEY
            - name: IMBOY_ADM_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ADM_COOKIE_SECRET
            - name: IMBOY_DIRECT_CLEANUP_PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_DIRECT_CLEANUP_PG_USER
            - name: IMBOY_DIRECT_CLEANUP_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_DIRECT_CLEANUP_PG_PASSWORD
            - name: IMBOY_EDGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_EDGE_INTERNAL_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: SENTRY_DSN
            # ── 支付 / Payment ──────────────────────────────────────────────
            - name: IMBOY_PAYMENT_MODE
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_PAYMENT_MODE
            - name: IMBOY_WECHAT_MCH_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_MCH_ID
            - name: IMBOY_WECHAT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_APP_ID
            - name: IMBOY_WECHAT_API_V3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_API_V3_KEY
            - name: IMBOY_WECHAT_CERT_SERIAL
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_CERT_SERIAL
            - name: IMBOY_WECHAT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_PRIVATE_KEY
            - name: IMBOY_WECHAT_PLATFORM_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_PLATFORM_PUBLIC_KEY
            - name: IMBOY_WECHAT_NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_WECHAT_NOTIFY_URL
            - name: IMBOY_ALIPAY_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_APP_ID
            - name: IMBOY_ALIPAY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_PRIVATE_KEY
            - name: IMBOY_ALIPAY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_PUBLIC_KEY
            - name: IMBOY_ALIPAY_PID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_PID
            - name: IMBOY_ALIPAY_APP_CERT_SN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_APP_CERT_SN
            - name: IMBOY_ALIPAY_ROOT_CERT_SN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_ROOT_CERT_SN
            - name: IMBOY_ALIPAY_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_AES_KEY
            - name: IMBOY_ALIPAY_NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_ALIPAY_NOTIFY_URL
            - name: IMBOY_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_STRIPE_SECRET_KEY
            - name: IMBOY_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_STRIPE_WEBHOOK_SECRET
            - name: IMBOY_LICENSE_FILE
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_LICENSE_FILE

          # ---------- 资源 ----------
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          # ---------- 健康检查 ----------
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}

          # ---------- 持久化卷挂载 ----------
          volumeMounts:
            {{- if .Values.backend.persistence.log.enabled }}
            - name: backend-log
              mountPath: /opt/imboy/log
            {{- end }}
            {{- if .Values.backend.persistence.priv.enabled }}
            - name: backend-priv
              mountPath: /opt/imboy/priv_runtime
            {{- end }}


        - name: download-edge
          image: {{ include "imboy.image" (dict "global" .Values.global "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/bin/sh", "/opt/imboy/bin/start_download_edge.sh"]
          ports:
            - name: edge
              containerPort: 13990
          readinessProbe:
            tcpSocket:
              port: edge
            periodSeconds: 5
            timeoutSeconds: 2
          env:
            - name: EDGE_AUTHORIZE_URL
              value: http://127.0.0.1:{{ .Values.backend.service.port }}/api/v1/attachment/edge/authorize
            - name: EDGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imboy.secretName" . }}
                  key: IMBOY_EDGE_INTERNAL_TOKEN

      volumes:
        {{- if .Values.backend.persistence.log.enabled }}
        - name: backend-log
          persistentVolumeClaim:
            claimName: {{ include "imboy.fullname" . }}-backend-log
        {{- end }}
        {{- if .Values.backend.persistence.priv.enabled }}
        - name: backend-priv
          persistentVolumeClaim:
            claimName: {{ include "imboy.fullname" . }}-backend-priv
        {{- end }}


      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
{{- if .Values.backend.persistence.log.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "imboy.fullname" . }}-backend-log
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.backend.persistence.log.accessMode }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.log.size }}
  {{- if .Values.backend.persistence.log.storageClass }}
  storageClassName: {{ .Values.backend.persistence.log.storageClass }}
  {{- end }}
{{- end }}
---
{{- if .Values.backend.persistence.priv.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "imboy.fullname" . }}-backend-priv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.backend.persistence.priv.accessMode }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.priv.size }}
  {{- if .Values.backend.persistence.priv.storageClass }}
  storageClassName: {{ .Values.backend.persistence.priv.storageClass }}
  {{- end }}
{{- end }}
---

{{- end }}
