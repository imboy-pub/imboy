{{- /*
HPA（HorizontalPodAutoscaler）—— 后端 + Admin 前端
要求：集群已安装 metrics-server
*/ -}}

{{- if and .Values.backend.enabled .Values.hpa.backend.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "imboy.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "imboy.fullname" . }}-backend
  minReplicas: {{ .Values.hpa.backend.minReplicas }}
  maxReplicas: {{ .Values.hpa.backend.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.backend.targetCPUUtilizationPercentage }}
    {{- if .Values.hpa.backend.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.backend.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      # 缩容保守：5 分钟稳定窗口，防止 Erlang 节点频繁重启
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      # 扩容激进：快速响应流量突增
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
{{- end }}

---
{{- if and .Values.admin.enabled .Values.hpa.admin.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "imboy.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "imboy.fullname" . }}-admin
  minReplicas: {{ .Values.hpa.admin.minReplicas }}
  maxReplicas: {{ .Values.hpa.admin.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.admin.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
{{- end }}
