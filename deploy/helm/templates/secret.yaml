{{- /*
Secret：存储数据库连接信息及业务密钥。
生产部署建议通过 external-secrets operator 或 Vault 注入，
而非在 values.yaml 中明文填写。
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "imboy.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imboy.labels" . | nindent 4 }}
  annotations:
    # 防止 helm upgrade 覆盖已由外部工具管理的 Secret
    # 若使用 external-secrets，可删除本资源并直接引用外部 Secret 名称
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ---------- PostgreSQL ----------
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}

  # ---------- 后端业务密钥 ----------
  IMBOY_JWT_KEY: {{ .Values.secrets.jwtKey | quote }}
  IMBOY_POSTGRE_AES_KEY: {{ .Values.secrets.postgreAesKey | quote }}
  IMBOY_ADM_COOKIE_SECRET: {{ .Values.secrets.admCookieSecret | quote }}

  # ---------- 可选 ----------
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | default "" | quote }}

  # ---------- Grafana ----------
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | default "changeme" | quote }}

  # ---------- 支付模式 / Payment mode ----------
  IMBOY_PAYMENT_MODE: {{ .Values.secrets.paymentMode | default "sandbox" | quote }}

  # ---------- 微信支付 / WeChat Pay ----------
  IMBOY_WECHAT_MCH_ID: {{ .Values.secrets.wechatMchId | default "" | quote }}
  IMBOY_WECHAT_APP_ID: {{ .Values.secrets.wechatAppId | default "" | quote }}
  IMBOY_WECHAT_API_V3_KEY: {{ .Values.secrets.wechatApiV3Key | default "" | quote }}
  IMBOY_WECHAT_CERT_SERIAL: {{ .Values.secrets.wechatCertSerial | default "" | quote }}
  IMBOY_WECHAT_PRIVATE_KEY: {{ .Values.secrets.wechatPrivateKey | default "" | quote }}
  IMBOY_WECHAT_PLATFORM_PUBLIC_KEY: {{ .Values.secrets.wechatPlatformPublicKey | default "" | quote }}
  IMBOY_WECHAT_NOTIFY_URL: {{ .Values.secrets.wechatNotifyUrl | default "" | quote }}

  # ---------- 支付宝 / Alipay ----------
  IMBOY_ALIPAY_APP_ID: {{ .Values.secrets.alipayAppId | default "" | quote }}
  IMBOY_ALIPAY_PRIVATE_KEY: {{ .Values.secrets.alipayPrivateKey | default "" | quote }}
  IMBOY_ALIPAY_PUBLIC_KEY: {{ .Values.secrets.alipayPublicKey | default "" | quote }}
  IMBOY_ALIPAY_NOTIFY_URL: {{ .Values.secrets.alipayNotifyUrl | default "" | quote }}

  # ---------- Stripe ----------
  IMBOY_STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "" | quote }}
  IMBOY_STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | default "" | quote }}

  # ---------- License ----------
  IMBOY_LICENSE_FILE: {{ .Values.secrets.licenseFile | default "" | quote }}
