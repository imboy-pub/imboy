# IMBoy CS Widget 站点配置（DEP-01 A04 缓存策略 + A05 SSE 直通）
#
# 运行身份：非 root（uid 101）—— pid/全部 temp 路径收口 /tmp，日志走 stdout/stderr。
#
# ── 缓存策略（A04）────────────────────────────────────────────────────────
# 前提事实：widget 产物文件名**固定不带 hash**（FE 约定：Playwright E2E 按
# 确定性路径 page.route，见 admin vite.config.ts CSW-01）。据此：
#   * HTML 与 /loader.js（升级入口）不可控缓存：no-cache / 短缓存+强制协商，
#     ETag 协商校验生效 —— 升级与回滚（切 tag）即刻可见（A04/A06）；
#   * /assets/ **不用 immutable 长缓存**：文件名无 hash，immutable 会让升级
#     后旧内容按同名永生（缓存永不再校验）。改用短 max-age + must-revalidate
#     + ETag；待产物改带内容 hash 后方可升为 immutable（届时回滚语义也随
#     tag 内文件名闭合）。
# ── SSE（A05）─────────────────────────────────────────────────────────────
# 访客事件流经本反代到后端 Cowboy：必须禁缓冲/禁缓存 + 1h 读超时 + 显式
# X-Accel-Buffering no（防上游层误开缓冲）；上游地址为构建期固化
# （__WIDGET_BACKEND_UPSTREAM__ 占位，Dockerfile ARG 替换）。

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    etag on;

    # 非 root 可写 temp 路径（镜像内已预建并 chown 101）
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # 存活探针（compose healthcheck / LB 共用）
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 宿主页 loader：短缓存 + 强制协商（ETag）；升级/回滚窗口 ≤ max-age
        location = /loader.js {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
        }

        # 宿主嵌码 HTML 与 widget 应用 HTML：no-cache（每次协商），回滚即刻生效
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location = /widget {
            return 301 /widget/;
        }
        location = /widget/ {
            try_files /widget/index.html =404;
            add_header Cache-Control "no-cache" always;
        }

        # 版本化脚本/CSS：产物名固定无 hash（见文件头）——短缓存+强制协商，
        # **不得**加 immutable（升级后旧资产会永生）
        location /assets/ {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
        }

        # SSE 访客事件流（A05）：禁缓冲/禁缓存 + 1h 超时
        location ~ ^/api/v1/cs/widget/sessions/[^/]+/events$ {
            proxy_pass __WIDGET_BACKEND_UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # 根路径跳转 widget 应用入口
        location = / {
            return 302 /widget/;
        }
    }
}
