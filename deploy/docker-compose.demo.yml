# IMBoy 本地演示环境 —— 最小可运行集
#
# 用途：快速验证产品可演示性（注册/登录/消息收发/E2EE 密钥交换）
# 不含：nginx/certbot/监控栈/LiveKit/Grafana（生产用 docker-compose.prod.yml）
#
# 使用：
#   cd deploy
#   cp .env.demo .env.demo.local   # 可选：覆盖默认值
#   docker compose -f docker-compose.demo.yml up -d
#   curl http://127.0.0.1:9800/api/v1/init
#
# 停止：
#   docker compose -f docker-compose.demo.yml down
#   docker compose -f docker-compose.demo.yml down -v  # 连数据一起清

name: imboy-demo

services:

  # ========== PostgreSQL 18 + 扩展 ==========
  imboy_pg18:
    image: ${PG_IMAGE:-ghcr.io/imboy-pub/imboy-pg18:${IMBOY_VERSION:-1.0.0-alpha.59}}
    container_name: imboy_demo_pg18
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      POSTGRES_USER: imboy_user
      POSTGRES_PASSWORD: demo_secret_2026
      POSTGRES_DB: imboy_demo
    volumes:
      - demo_pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imboy_user -d imboy_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== imboy 后端（Erlang/OTP + Cowboy）==========
  imboy_backend:
    image: ${BACKEND_IMAGE:-ghcr.io/imboy-pub/imboy-backend:${IMBOY_VERSION:-1.0.0-alpha.59}}
    container_name: imboy_demo_backend
    restart: unless-stopped
    depends_on:
      imboy_pg18:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      IMBOYENV: pro
      IMBOY_HTTP_PORT: "9800"
      IMBOY_PG_HOST: imboy_pg18
      IMBOY_PG_PORT: "5432"
      IMBOY_PG_USER: imboy_user
      IMBOY_PG_PASSWORD: demo_secret_2026
      IMBOY_PG_DB: imboy_demo
      IMBOY_BASE_URL: http://127.0.0.1:9800
      IMBOY_WS_URL: ws://127.0.0.1:9800/api/ws
      IMBOY_JWT_KEY: demo_jwt_key_32_bytes_placeholder_
      IMBOY_POSTGRE_AES_KEY: demo_aes_key_32_bytes_placeholder_
      IMBOY_ADM_COOKIE_SECRET: demo_adm_cookie_secret___________
      IMBOY_SOLIDIFIED_KEY: demo_solidified_key_32_bytes______
      IMBOY_SOLIDIFIED_KEY_IV: demo_iv_16_bytes
      IMBOY_API_AUTH_SWITCH: "on"
      IMBOY_EDITION: community
      IMBOY_PAYMENT_MODE: sandbox
      ERL_MAX_PORTS: "262144"
    ports:
      - "9800:9800"
    healthcheck:
      test: ["CMD-SHELL", "/opt/imboy/bin/imboy ping || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  demo_pg_data:
    driver: local
