server {
    listen 80;
    listen [::]:80;
    server_name prodadm.imboy.pub;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/prodadm.imboy.pub;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
    access_log  /www/wwwlogs/prodadm.imboy.pub.log;
    error_log   /www/wwwlogs/prodadm.imboy.pub.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prodadm.imboy.pub;
    root /www/wwwroot/prodadm.imboy.pub;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/cert/prodadm.imboy.pub/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/prodadm.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 1. 后端 REST API (/v1, /adm-api, /app_version) ──────────────────
    location ~ ^/(v1|adm-api|app_version)/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 60s;
    }

    # ── 1b. 后端 REST API (/api/adm, /api/v1) → 代理到 Erlang 节点 ────
    location /api/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 60s;
    }

    # ── 2. SPA 静态资产 (Vite base=/adm/ 打包，资产在 /adm/assets/) ─────
    #   比 /adm/ 更具体，nginx 前缀匹配取最长，所以先命中这里
    location /adm/assets/ {
        alias /www/wwwroot/prodadm.imboy.pub/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 3. Vite 其他静态文件 ─────────────────────────────────────────────
    location = /adm/vite.svg {
        alias /www/wwwroot/prodadm.imboy.pub/vite.svg;
        access_log off;
    }

    # ── 4. 旧 /adm/ 根路径重定向到新 SPA 根 ─────────────────────────────
    #   精确匹配优先级高于前缀，避免把 /adm/ 当 API 处理
    location = /adm/ {
        return 302 /;
    }
    location = /adm {
        return 302 /;
    }

    # ── 5. 后端 Admin API (/adm/*) → 代理到 Erlang 节点 ─────────────────
    #   包括 /adm/user/list, /adm/admin/config/sidebar, /adm/stats/* 等
    location /adm/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 60s;
    }

    # ── 6. 带 hash 的构建产物 (/assets/index-XXXX.js) 长缓存 ────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 7. index.html 永不缓存旧版：每次都向服务器 revalidate ───────────
    #   根因修复：部署新版后浏览器刷新即拿到新 chunk 引用，不再跑旧 JS
    #   注意 location 内出现 add_header 会屏蔽 server 级继承，故重复 HSTS
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── 8. SPA 兜底 — 所有页面路由 (/dashboard, /users, /login...) ──────
    #   try_files 内部重定向到 /index.html 会重新匹配 location，命中第 7 条
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/prodadm.imboy.pub.log;
    error_log   /www/wwwlogs/prodadm.imboy.pub.error.log;
}
