upstream pro_imboy_api {
    server 127.0.0.1:9800;
}

# nginx 层速率限制（等保2.0 访问控制要求）
# API 通用：60 req/min/IP；passport 登录：10 req/min/IP
limit_req_zone $binary_remote_addr zone=pro_api_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=pro_passport_per_ip:10m rate=10r/m;

server
{
    listen 80;
    listen 443 ssl  ;
    http2 on;
    server_name pro.imboy.pub;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/pro.imboy.pub;
    include /www/server/panel/vhost/nginx/extension/pro.imboy.pub/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/pro.imboy.pub.conf;
    #CERT-APPLY-CHECK--END
    # ACME webroot for certbot (cs-mode unified renewal)
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }


    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /etc/letsencrypt/live/pro.imboy.pub/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/pro.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497  https://$host$request_uri;

    #SSL-END

    # 安全响应头 / Security response headers (等保2.0 + OWASP 推荐)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # REST API + WS，不提供交互式 HTML 页面，禁止一切资源加载
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src * wss: ws:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END


    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    # 指标端点禁止公网访问：后端 is_internal_ip 校验 TCP peer，经反代后
    # peer 变为内网 IP 会被放行，必须在入口拦截，否则泄露 License/用户数/系统指标。
    location ~ ^/(api/)?(v1/)?metrics$ {
        return 403;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # cp -Rf /www/wwwroot/imboy-api/apps/imadm/priv/static /www/wwwroot/pro.imboy.pub/
    # package_info_plus web 读取（2026-08-17）
    location = /version.json {
        root /www/wwwroot/pro.imboy.pub;
    }

    # 解决静态资源404问题
    # Flutter Web 静态资源（wasm/data 等，2026-08-17）
    location ~* ^/(canvaskit|assets)/.*\.(wasm|data|mem|json|otf|mp3|wav|webm|tflite)$ {
        root /www/wwwroot/pro.imboy.pub;
    }

    location ~ .*\.(js|css|ttf|woff|woff2)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/pro.imboy.pub.access.log;
    error_log  /www/wwwlogs/pro.imboy.pub.error.log;

    # nginx 自定义日志记录请求时间
    # https://cloud.tencent.com/developer/article/1437647
    # 首先在 NGINX配置的http节点下面设置如下1行
    # log_format statistics_time "$request $request_time";
    # 其次在 NGINX server节点如下设置
    #access_log '/www/wwwlogs/dev.imboy.pub.time_pma.log' statistics_time; # 注意这行
    # $request_time 请求处理时间，单位为秒，精度毫秒；
    # 从读入客户端的第一个字节开始，直到把最后一个字符发送给客户端后进行日志写入为止。

    client_max_body_size 500M;
    client_body_buffer_size 512k;

    # /ws 无尾斜杠精确匹配 —— WebSocket 客户端不跟随 301，必须直接握手
    # 2026-07-07 后端 43224c1f 硬切换 /api 前缀，裸 /ws 路由已被移除，
    # 真实后端路由是 /api/ws；这里内部转发到 /api/ws，对外 URL 保持 /ws
    # 不变（服务端下发的 ws_url 配置仍是 wss://pro.imboy.pub/ws，客户端零感知）。
    location = /ws {
        proxy_pass http://pro_imboy_api/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location ^~ /api/v1/rtc/ {
        proxy_pass http://pro_imboy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://pro_imboy_api/api/ws/;
        proxy_http_version 1.1;
        # 下面这两行是关键
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 保持长连接
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # 避免某些代理缓存
        proxy_buffering off;
    }

    # 2026-07-08 事故修复：ws_url 一度改成 /api/ws，落到下面的通用
    # location / 兜底，那个 location 没转发 Upgrade/Connection 头，
    # 握手直接 400。这里给 /api/ws、/api/v1/ws 单独开 location，
    # 语义对齐 /ws、/ws/（必须带 Upgrade 头转发）。ws_url 最终收敛到
    # /api/v1/ws（v0 /api/ws 计划下架，这里留一份兜住还没吃到新配置的
    # 存量客户端连接）。
    location = /api/ws {
        proxy_pass http://pro_imboy_api/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location = /api/v1/ws {
        proxy_pass http://pro_imboy_api/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # 浏览器访问 /adm/ 重定向到专用域名
    location = /adm/ {
        return 301 https://prodadm.imboy.pub/adm/;
    }
    # APK 下载静态目录（自动化测试升级流程 2026-08-17）
    location ^~ /dl/ {
        root /www/wwwroot/pro.imboy.pub;
    }

    location = /adm/index.html {
        return 301 https://prodadm.imboy.pub/adm/;
    }
    # /adm/* 其余路径（API 调用）代理到后端
    location /adm/ {
        # CORS: prodadm.imboy.pub 跨域请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://prodadm.imboy.pub' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-Client-Id, X-Device-Id' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://pro_imboy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 60s;
    }
    location /app/ {
        autoindex on;
        default_type application/octet-stream;
    }

    # passport 登录接口：10 req/min/IP，burst=5（宽容短暂集中请求，超出立即 429）
    location ~ ^/(api/)?(v1/)?passport/ {
        limit_req zone=pro_passport_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header  X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_pass http://pro_imboy_api;
    }

    # LiveKit WebSocket signaling; media uses direct UDP/TCP ports.
    location ^~ /livekit {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # Flutter Web 首页（精确匹配优先于兜底代理；2026-08-17 web build 部署）
    location = / {
        root /www/wwwroot/pro.imboy.pub;
        try_files /index.html =404;
    }

    location / {
        limit_req zone=pro_api_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header  X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        #proxy_pass http://127.0.0.1:9800;
        proxy_pass http://pro_imboy_api;
    }

    location ~ /\.ht {
        deny all;
    }
}
