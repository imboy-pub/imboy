# rtc.imboy.pub —— LiveKit RTC 信令域 WSS 反代（LK-DEP-01 新增，目标形态）
#
# 角色：wss://rtc.imboy.pub → 127.0.0.1:7880（imboy_livekit 信令，TLS 由本
# OpenResty 终结）。媒体 UDP 50000-50200 / TCP 7881 / TURN 3478+5349 均不经
# nginx 直连宿主。proxy 写法对齐 pro.imboy.pub.conf 的 /livekit location。
#
# 部署形态（本文件 = 形态 B，最终态）：
#   A. 首次签发（纯 80 形态）：只保留下方第一个 server（listen 80），注释掉
#      443 server 块（引用 /etc/letsencrypt/live/rtc.imboy.pub/ 的证书尚不存在，
#      nginx -t 会失败）。然后签发：
#        certbot certonly --webroot -w /var/www/certbot -d rtc.imboy.pub
#   B. 签发成功后放开 443 server 块，nginx -t && nginx -s reload。
# 本文件入库时即含两个块：新机恢复时按上述顺序操作一次即可。
#
# 依赖（服务器侧，快照不含）：$connection_upgrade 的全局 map（与 pro.imboy.pub.conf
# 同一依赖）、/var/www/certbot webroot、宝塔 include 文件（见 prod-vhosts/README.md）。
# 续期：宿主机 certbot webroot + reload 钩子（nginx 侧自动；与 LiveKit 容器无关，
# 本域证书不经容器挂载）。

server
{
    listen 80;
    server_name rtc.imboy.pub;
    root /www/wwwroot/rtc.imboy.pub;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/rtc.imboy.pub.conf;
    #CERT-APPLY-CHECK--END
    # ACME webroot for certbot（统一续期模式，同 pro.imboy.pub.conf）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书就绪前不强制跳转 HTTPS（纯 80 初始签发形态下 ACME 之外的全部请求 404，
    # 该域只承载 WSS，无 HTTP 页面）；443 server 生效后可改为 301。
    location / {
        return 404;
    }

    access_log  /www/wwwlogs/rtc.imboy.pub.log;
    error_log   /www/wwwlogs/rtc.imboy.pub.error.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name rtc.imboy.pub;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/rtc.imboy.pub.conf;
    #CERT-APPLY-CHECK--END
    # ACME webroot for certbot（续期与首次同路径）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    #SSL-START SSL相关配置
    ssl_certificate    /etc/letsencrypt/live/rtc.imboy.pub/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/rtc.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:RTC_SSL:10m;
    ssl_session_timeout 10m;
    error_page 497  https://$host$request_uri;
    #SSL-END

    # WebSocket 长连接反代（写法对齐 pro.imboy.pub.conf /livekit location）：
    # Upgrade/Connection 头 + 3600s 长超时 + 关闭缓冲，缺一 WSS 握手即失败。
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    access_log  /www/wwwlogs/rtc.imboy.pub.ssl.log;
    error_log   /www/wwwlogs/rtc.imboy.pub.ssl.error.log;
}
