# web.imboy.pub — Flutter Web 独立域名（web_deploy.sh 发布契约 + 同源 API/WS 反代）
# 部署布局 / Layout: /www/wwwroot/web.imboy.pub/{.imboy-web-root,releases/<id>,current->releases/<id>}
#   `current` 由 scripts/lib/web_deploy.sh activate 原子切换（mv -Tf），nginx 无需 reload；
#   .imboy-web-root / .imboy-web-release / .web-deploy-lock 均为 dotfile，已在下方统一 404。
# 证书 / Cert: /etc/letsencrypt/live/web.imboy.pub/（certbot webroot /var/www/certbot，
#   cs 模式统一续期：certbot.timer + renewal-hooks/deploy/reload-openresty.sh 自动 reload，无额外脚本）。
# 监听 / Listen: 443 公网由 stream 层 SNI 分流兜底到 127.0.0.1:10443（0.livekit-l4-sni-realip.conf
#   经 proxy_protocol 还原真实 IP）。禁止 listen 443 —— 会被 stream 层遮蔽（见 cs.imboy.pub.conf 注释）。
# 上游 / Upstream: 复用 http 级共享 upstream `pro_imboy_api`（定义于 pro.imboy.pub.conf）。
#   blue_green_deploy.sh 切流只改写该 upstream 端口；硬编码 127.0.0.1:98xx 会在下一次切色后 502
#   （2026-10-20 /invite/ 502 事故，详见本目录 README.md）。
# API 同源 / Same-origin API: web_deploy.sh 以 WEB_API_BASE_URL=https://web.imboy.pub 构建，
#   const.dart 261 个 API 常量全部为 /api/v1/... 前缀 → 本 vhost 反代 /api/ 及四个 WS 入口形态，
#   并镜像 pro 的 /livekit（7880）特例 location。edge(13990) 三路由（/_avatar/、/edge、
#   talk-records/client-audio-source）**不引入**：该边车仅社区模板形态部署
#   （根 Compose + Helm imboy_edge），prod 蓝绿机无此进程，
#   live pro vhost 也已移除——留死路由会让误请 502 而非 404（2026-11-19 实证 13990 未监听）。

# nginx 层速率限制（对齐 pro.imboy.pub 等保2.0 口径；zone 名带 web_ 前缀避免跨文件重名）
limit_req_zone $binary_remote_addr zone=web_api_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=web_passport_per_ip:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name web.imboy.pub;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
    access_log  /www/wwwlogs/web.imboy.pub.log;
    error_log   /www/wwwlogs/web.imboy.pub.error.log;
}

server {
    listen 127.0.0.1:10443 ssl proxy_protocol;
    listen [::1]:10443 ssl proxy_protocol;
    http2 on;
    server_name web.imboy.pub;

    root /www/wwwroot/web.imboy.pub/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/web.imboy.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头 / Security headers（等保2.0 + OWASP；SPA 允许 camera/mic=self 支持浏览器 RTC）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src * ws: wss:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;

    # nginx 每请求开文件，确保 current 符号链接切版即时生效（防止 open_file_cache 读旧 release）
    open_file_cache off;

    # main.dart.js 体积大，静态直出必须压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # 隐藏 dotfile（web_deploy 契约文件与锁目录），ACME 仅走 80 端口 vhost，不受影响
    location ~ /\. { return 404; }

    # ---- Flutter Web 静态资源（releases 布局）----
    # 哈希化资源长缓存（assets/ 与 canvaskit/ wasm/字体）
    location ~* ^/(assets|canvaskit)/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
    # HTML 入口 no-store（切版即时生效）。SPA 兜底与 index 内部跳转都会落到此 location，
    # 安全响应头在此重复声明（nginx location 持有 add_header 时不再继承 server 级）。
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
    }
    # 引导链文件：no-cache（每次回源校验，配合 releases 切版；旧 release 目录保留，回滚即时可用）
    location ~ ^/(flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|manifest\.json|__web_release\.json)$ {
        add_header Cache-Control "no-cache" always;
    }
    # SPA 路由回退：/ 经 index 指令内部跳转到 /index.html（吃 no-store 头）；未知路径回退 SPA
    location / { try_files $uri $uri/ /index.html; }

    # ---- 同源 API/WS 反代（对齐 pro.imboy.pub.conf 语义）----
    # Origin 剥离（2026-11-19 CORS 事故修复）：后端 cors_middleware 按
    # cors_allowed_origins（sys.config，现含 pro.imboy.pub 等）精确校验 Origin，
    # web.imboy.pub 不在白名单 → 403 "CORS request not allowed"。本域 API 调用全部
    # 同源，浏览器同源请求不需要 CORS 头；剥离 Origin 后端按非 CORS 请求放行，
    # 免重启 prod 节点改白名单。置空字符串 = 该头不上传 upstream。
    # 若未来后端白名单正式加入 https://web.imboy.pub，此行可保留（幂等无害）。
    # 指标端点禁止公网访问：后端 is_internal_ip 校验 TCP peer，经反代后 peer 变内网 IP 会被放行，
    # 必须在入口拦截（对齐 pro 同款 location）。
    location ~ ^/(api/)?(v1/)?metrics$ { return 403; }

    # WS 四形态（Upgrade 头必须；ws_url 由后端 initConfig 按请求 Host 下发，历史三形态兜底）。
    # 2026-07-08 事故：裸 /ws 落到无 Upgrade 头的兜底 location 会 400（见 pro 快照注释）。
    location = /ws {
        proxy_pass http://pro_imboy_api/api/ws;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location /ws/ {
        proxy_pass http://pro_imboy_api/api/ws/;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location = /api/ws {
        proxy_pass http://pro_imboy_api/api/ws;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    location = /api/v1/ws {
        proxy_pass http://pro_imboy_api/api/v1/ws;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # passport 登录接口：10 req/min/IP，burst=5（对齐 pro）
    location ~ ^/(api/)?(v1/)?passport/ {
        limit_req zone=web_passport_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://pro_imboy_api;
        proxy_set_header Origin "";
    }

    # Web bootstrap WS 兜底（2026-11-19 ws 事故）：init 下发的 ws_url 当前为
    # wss://pro.imboy.pub/api/v1/web/ws（pro vhost 已加同款 location）；本域精确
    # location 兜底未来 ws_url 指向 web.imboy.pub 的形态。= 精确匹配优先于下方
    # ^~ /api/v1/web/ 前缀（后者会把 Host+Origin 改写为 pro——握手路由同样需要，
    # 这里直接显式固化，语义一致）。Upgrade 头必须转发。
    location = /api/v1/web/ws {
        proxy_pass http://pro_imboy_api/api/v1/web/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Host "pro.imboy.pub";
        proxy_set_header Origin "https://pro.imboy.pub";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # web 命名空间（surface=web_human 面，2026-11-19 CORS 事故②）：与普通 /api/ 相反，
    # 后端对 web_human 面 fail-closed（缺席 Origin 的 POST 也 403），且线上
    # 2026-11-19 12:49 构建的 cors_middleware.beam 实证为 **Host 锁定**：
    # tcpdump 取证 Origin=https://pro.imboy.pub + Host=web.imboy.pub 仍 403，
    # 而 Host=pro + Origin=pro 同接口放行（对照组）→ 校验要求 Origin 与 Host 同源，
    # 与仓库 HEAD 的 cors_middleware.erl（仅查 cors_allowed_origins 名单）不一致，
    # 部署版来自在途 qr_login 分支。因此本 location 把 Host+Origin 成对改写为
    # pro.imboy.pub（后端视角与 pro 域调用完全等价）。qr_create 响应不含 Host
    # 派生 URL；同源浏览器不消费 ACAO 回显。普通命名空间路由不受影响（init
    # 下发的 ws_url 仍按 web.imboy.pub Host 生成）。
    # 根治项（属主下次发版窗口）：后端 web_face 校验对齐仓库语义（名单校验）
    # 或 sys.config cors_allowed_origins 加入 https://web.imboy.pub，随后本
    # location 的改写行可保留（幂等无害）或删除。
    location ^~ /api/v1/web/ {
        limit_req zone=web_api_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass_header Server;
        proxy_set_header Host "pro.imboy.pub";
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "https://pro.imboy.pub";
        proxy_pass http://pro_imboy_api;
    }

    # 通用 API（plain prefix：metrics/passport 正则先行；60 req/min/IP burst=20 对齐 pro）
    location /api/ {
        limit_req zone=web_api_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://pro_imboy_api;
        proxy_set_header Origin "";
    }

    # LiveKit 信令（与 live pro 同款；127.0.0.1:7880 由 imboy_livekit 容器承载）
    location ^~ /livekit {
        proxy_pass http://127.0.0.1:7880/;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    client_max_body_size 500m;
    client_body_buffer_size 512k;

    access_log  /www/wwwlogs/web.imboy.pub.log;
    error_log   /www/wwwlogs/web.imboy.pub.error.log;
}
