server {
    listen 80;
    listen [::]:80;
    server_name s3.imboy.pub;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
    access_log  /www/wwwlogs/s3.imboy.pub.log;
    error_log   /www/wwwlogs/s3.imboy.pub.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.imboy.pub;

    ssl_certificate     /etc/letsencrypt/live/s3.imboy.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Amz 分流：带签名(presigned S3 API)->3900(Host保留,签名匹配)；匿名公开读->3902 website(Host映射imboy-public桶)
    location / {
        set $s3_pass "127.0.0.1:3902";
        set $s3_host "imboy-public.s3.imboy.pub";
        if ($args ~* "X-Amz-") {
            set $s3_pass "127.0.0.1:3900";
            set $s3_host $http_host;
        }
        if ($http_authorization != "") {
            set $s3_pass "127.0.0.1:3900";
            set $s3_host $http_host;
        }
        proxy_pass http://$s3_pass;
        proxy_set_header Host $s3_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
    access_log  /www/wwwlogs/s3.imboy.pub.log;
    error_log   /www/wwwlogs/s3.imboy.pub.error.log;
}
