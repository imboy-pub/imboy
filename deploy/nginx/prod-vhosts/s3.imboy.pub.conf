server {
    listen 80;
    listen [::]:80;
    server_name s3.imboy.pub;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
    access_log  /www/wwwlogs/s3.imboy.pub.log;
    error_log   /www/wwwlogs/s3.imboy.pub.error.log;
}

server {
    listen 127.0.0.1:10443 ssl proxy_protocol;
    listen [::1]:10443 ssl proxy_protocol;
    http2 on;
    server_name s3.imboy.pub;

    ssl_certificate     /etc/letsencrypt/live/s3.imboy.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Amz 分流：带签名(presigned S3 API)->3900(Host保留,签名匹配)；匿名公开读->3902 website(Host映射imboy-public桶)
    location / {
        # CORS（2026-11-19 web 媒体直读）：全状态码带 ACAO；OPTIONS 预检短路 204。
        # Garage 仅在错误路径自带 ACAO（200 不带）→ proxy_hide_header 吃掉上游
        # ACAO，nginx 统一单发，杜绝双 ACAO 头（重复即非法，浏览器直接拒）。
        # location 持有 add_header 不再继承 server 级 HSTS，重复声明防丢。
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        set $s3_pass "127.0.0.1:3902";
        set $s3_host "imboy-public.s3.imboy.pub";
        if ($args ~* "X-Amz-") {
            set $s3_pass "127.0.0.1:3900";
            set $s3_host $http_host;
        }
        if ($http_authorization != "") {
            set $s3_pass "127.0.0.1:3900";
            set $s3_host $http_host;
        }
        proxy_pass http://$s3_pass;
        proxy_set_header Host $s3_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
    access_log  /www/wwwlogs/s3.imboy.pub.log;
    error_log   /www/wwwlogs/s3.imboy.pub.error.log;
}
