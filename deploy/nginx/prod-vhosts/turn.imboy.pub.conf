# turn.imboy.pub —— LiveKit embedded TURN 域（LK-DEP-01 更新）
#
# 职责（唯一）：turn.imboy.pub 证书的 ACME webroot 签发/续期（纯 80 vhost）。
# 本域无 443 —— TURN_443=BLOCKED（LK-01 合同 §3）：443/TCP 只归 nginx；
# TURN/TLS 由 LiveKit 进程直接监听 5349（turn.tls_port，证书只读挂载进容器），
# STUN/TURN over UDP 走 3478。除 ACME 验证外本 vhost 不服务任何业务流量。
#
# 证书链路：宿主机 certbot webroot（/var/www/certbot）签发/续期 →
# /etc/letsencrypt/live/turn.imboy.pub/ → deploy hook
# deploy/nginx/livekit-turn-cert-deploy-hook.sh（安装于
# /etc/letsencrypt/renewal-hooks/deploy/）原子复制到 /etc/imboy/livekit-certs/
# 并安全重启 imboy_livekit 容器。hook 未装好前进入 W5 会导致续期后 TURN/TLS
# 失败（LK-01 风险 R5）——hook 必须与 W5 同批次完成。

server
{
    listen 80;
    server_name turn.imboy.pub;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/turn.imboy.pub;
    include /www/server/panel/vhost/nginx/extension/turn.imboy.pub/*.conf;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/turn.imboy.pub.conf;
    #CERT-APPLY-CHECK--END
    # ACME webroot for certbot（统一续期模式，同 pro.imboy.pub.conf；
    # 宝塔 well-known include 与本 location 并存，certbot 只认 webroot 路径）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    # 故意不配置 443/ssl —— 见文件头说明（TURN/TLS 5349 由 LiveKit 直接承载）
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/turn.imboy.pub.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/turn.imboy.pub.log;
    error_log  /www/wwwlogs/turn.imboy.pub.error.log;
}
