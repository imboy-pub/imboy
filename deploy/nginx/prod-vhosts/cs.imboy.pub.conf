# Managed by imboy-deploy.sh cs (CSD-CLI-01), contract hosted-widget-contract-v1 S7.
# 本文件由部署工具 staged → nginx -t → 原子替换管理，请勿手工编辑。

server {
    listen 80;
    server_name cs.imboy.pub;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name cs.imboy.pub;

    ssl_certificate     /etc/letsencrypt/live/cs.imboy.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    # S5/S6: Widget 会话 SSE —— 关闭缓冲，读超时对齐 API vhost（3600s）
    location ~ ^/api/v1/cs/widget/sessions/[0-9A-Za-z_-]+/events$ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # S4: 动态 frame /w/:public_widget_id → backend（no-store 由 backend 下发）
    location ^~ /w/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # S5: 同源 Widget API（含旧 frame 兼容路径与上传代理端点）
    location /api/v1/cs/widget/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # S6: 静态产物（直连 nginx 形态下由本 vhost 按冻结缓存表下发）
    location = /v1/loader.js {
        root /www/wwwroot/cs.imboy.pub;
        try_files /loader.js =404;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        root /www/wwwroot/cs.imboy.pub;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /widget/ {
        root /www/wwwroot/cs.imboy.pub;
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.json { root /www/wwwroot/cs.imboy.pub; add_header Cache-Control "no-store" always; }
    location = /health.txt   { root /www/wwwroot/cs.imboy.pub; add_header Cache-Control "no-store" always; }
    location / { return 404; }

    # 安全头最小集（server 级唯一来源；XFO/CSP 由 backend 逐路径下发，网关零注入）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
