server
{
    listen 80;
    listen 443 ssl  ;
    http2 on;
    server_name dev.imboy.pub;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/dev.imboy.pub;
    include /www/server/panel/vhost/nginx/extension/dev.imboy.pub/*.conf;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/dev.imboy.pub.conf;
    #CERT-APPLY-CHECK--END
    # ACME webroot for certbot (cs-mode unified renewal)
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }


    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /etc/letsencrypt/live/dev.imboy.pub/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/dev.imboy.pub/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/dev.imboy.pub.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # cp -Rf /www/wwwroot/imboy-api/apps/imadm/priv/static /www/wwwroot/dev.imboy.pub/
    # 解决静态资源404问题
    location ~ .*\.(js|css|ttf|woff|woff2)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/dev.imboy.pub.access.log;
    error_log  /www/wwwlogs/dev.imboy.pub.error.log;

    # nginx 自定义日志记录请求时间
    # https://cloud.tencent.com/developer/article/1437647
    # 首先在 NGINX配置的http节点下面设置如下1行
    # log_format statistics_time "$request $request_time";
    # 其次在 NGINX server节点如下设置
    #access_log '/www/wwwlogs/dev.imboy.pub.time_pma.log' statistics_time; # 注意这行
    # $request_time 请求处理时间，单位为秒，精度毫秒；
    # 从读入客户端的第一个字节开始，直到把最后一个字符发送给客户端后进行日志写入为止。

    client_max_body_size 500M;
    client_body_buffer_size 512k;

    location /ws/ {
        proxy_pass http://127.0.0.1:9700/ws/;
        #proxy_pass http://127.0.0.1:9701/ws/;
        proxy_http_version 1.1;
        # 下面这两行是关键
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Version 13;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 保持长连接
        proxy_read_timeout 7200s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # 避免某些代理缓存
        proxy_buffering off;
    }

    location /adm/ {
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header  X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9706;
        #proxy_pass http://127.0.0.1:9707;
    }
    location /app/ {
        autoindex on;
        default_type application/octet-stream;
    }

    location / {
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header  X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9700;
        #proxy_pass http://127.0.0.1:9701;
    }

    location ~ /\.ht {
        deny all;
    }
}
