# IMBoy 后端 secret 以 _FILE + 0600 持久化文件注入（DEP-01 A03 示例 overlay）
#
# 定位：示例与校验载体 —— 只声明「文件路径」注入，**不含任何 secret 明文**
# （明文只存在于部署机磁盘文件里，不入 compose、不入 .env、不入仓）。
# 叠加使用：
#   docker compose -f docker-compose.community.yml -f docker-compose.secrets.example.yml config
#
# 部署机生成（umask 077 + install -m 600；值为随机合成材料，示例仅示意）：
#   umask 077 && mkdir -p deploy/secrets
#   openssl rand -hex 32 > deploy/secrets/cs_widget_subject_key
#   printf '1:%s' "$(openssl rand -hex 32)" > deploy/secrets/cs_widget_identity_keys
#   chmod 600 deploy/secrets/cs_widget_subject_key deploy/secrets/cs_widget_identity_keys
#
# fail-closed 语义（读方 src/lib/imboy_env_overrides.erl）：
#   * 文件缺失 / 不可读            → erlang:error(secret_file_unreadable) 启动拒绝
#   * 权限非精确 0600（组/他位可读）→ erlang:error(secret_file_permissions) 启动拒绝
#   * direct 与 _FILE 双源同给      → erlang:error(conflicting_env) 启动拒绝
#   * 文件内容不进任何日志或错误项
#
# 服务键 imboy_backend = docker-compose.community.yml 的后端服务名；
# 商务版 docker-compose.prod.yml 后端服务名若不同，把本片段键名对齐即可。
services:
  imboy_backend:
    environment:
      IMBOY_CS_WIDGET_SUBJECT_KEY_FILE: /run/imboy-secrets/cs_widget_subject_key
      IMBOY_CS_WIDGET_IDENTITY_KEYS_FILE: /run/imboy-secrets/cs_widget_identity_keys
    volumes:
      - ./secrets/cs_widget_subject_key:/run/imboy-secrets/cs_widget_subject_key:ro
      - ./secrets/cs_widget_identity_keys:/run/imboy-secrets/cs_widget_identity_keys:ro
