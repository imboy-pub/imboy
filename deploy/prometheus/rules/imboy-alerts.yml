# IMBoy SLO 告警规则 / SLO Alerting Rules
#
# 覆盖 / Coverage:
#   1. 服务可用性 / Service availability
#   2. 消息投递延迟 SLO / Message delivery latency SLO
#   3. HTTP 错误率 / HTTP error rate
#   4. Erlang VM 内存告警 / Erlang VM memory alert
#   5. Erlang 进程数上限 / Erlang process count ceiling
#   6. PostgreSQL 连接/事务异常 / PostgreSQL connectivity & transaction anomaly
#   7. 消息积压 / Message backlog
#   8. WebSocket 连接陡降 / WebSocket connection drop
#   9. 主机资源 / Host resources (memory / disk)
#  10. Erlang 节点宕机 / Erlang node down
#  11. PG 连接池耗尽 / PG connection pool exhausted
#  12. 备份健康 / Backup health
#  13. E2EE/OLM 密钥与安全事件 / E2EE (OLM) key & security events (W3-A04)
#  14. License 有效性/到期/配额 / License validity, expiry & quota (W3-A04)
#  15. 在线用户陡降 / Online user drop (W3-A04)
#  16. 红包过期 job 心跳与失败 / Red packet expiry job heartbeat & errors (W3-A04)
#  17. L4 SNI listen 漂移巡检 / L4 SNI listen-drift patrol (Task 2)
#
# 接入告警渠道 / Alert routing:
#   在 Prometheus alertmanager.yml 中配置 receiver（钉钉 / Slack / PagerDuty 等）
#   Configure receiver in Prometheus alertmanager.yml (DingTalk / Slack / PagerDuty, etc.)

groups:

  # ============================================================
  # 1. 服务可用性 / Service Availability
  # ============================================================
  - name: imboy.availability
    interval: 15s
    rules:

      # 后端服务停止响应 > 1min → CRITICAL
      # Backend unreachable for > 1 min → CRITICAL
      - alert: ImBoyBackendDown
        expr: up{job="imboy_backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "IMBoy 后端不可用 / Backend is down"
          description: >
            imboy_backend 在 {{ $labels.instance }} 上已停止响应超过 1 分钟。
            imboy_backend on {{ $labels.instance }} has been unreachable for over 1 minute.
          runbook: "运行 docker compose logs imboy_backend 查看原因 / Run: docker compose logs imboy_backend"

      # 后端服务重启 (uptime 突降) → WARNING
      # Backend process restarted (uptime reset) → WARNING
      - alert: ImBoyBackendRestarted
        expr: process_uptime_seconds{job="imboy_backend"} < 120
        for: 0m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "IMBoy 后端刚刚重启 / Backend recently restarted"
          description: >
            进程运行时间 {{ $value | humanizeDuration }}，可能发生了意外重启。
            Process uptime is {{ $value | humanizeDuration }}; an unexpected restart may have occurred.

  # ============================================================
  # 2. 消息投递延迟 SLO / Message Delivery Latency SLO
  # SLO 目标：p99 < 500ms (5m 窗口)
  # SLO target: p99 < 500ms over a 5-minute window
  # ============================================================
  - name: imboy.latency
    interval: 30s
    rules:

      # p99 投递延迟 > 500ms 持续 5min → WARNING
      - alert: ImBoyMsgDeliveryLatencyHigh
        expr: >
          histogram_quantile(0.99,
            sum(rate(imboy_msg_deliver_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: msg_delivery_p99
        annotations:
          summary: "消息投递 p99 延迟过高 / Message delivery p99 latency too high"
          description: >
            消息投递 p99 延迟为 {{ $value | humanizeDuration }}，超过 SLO 目标 500ms（已持续 5 分钟）。
            Message delivery p99 latency is {{ $value | humanizeDuration }}, exceeding the 500ms SLO (for 5 minutes).

      # p99 投递延迟 > 2s 持续 2min → CRITICAL（SLO 严重违反）
      - alert: ImBoyMsgDeliveryLatencyCritical
        expr: >
          histogram_quantile(0.99,
            sum(rate(imboy_msg_deliver_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 2m
        labels:
          severity: critical
          team: backend
          slo: msg_delivery_p99
        annotations:
          summary: "消息投递 p99 延迟严重超标 / Message delivery p99 latency critically high"
          description: >
            消息投递 p99 延迟为 {{ $value | humanizeDuration }}，已超过 2s SLO 临界值（持续 2 分钟）。
            Message delivery p99 latency is {{ $value | humanizeDuration }}, exceeding the 2s critical threshold (for 2 minutes).

  # ============================================================
  # 3. HTTP 错误率 / HTTP Error Rate
  # SLO 目标：5xx 错误率 < 1%（5m 窗口）
  # SLO target: 5xx error rate < 1% over 5-minute window
  # ============================================================
  - name: imboy.http
    interval: 30s
    rules:

      # 5xx 错误率 > 1% 持续 5min → WARNING
      - alert: ImBoyHTTPErrorRateHigh
        expr: >
          sum(rate(imboy_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(imboy_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: http_error_rate
        annotations:
          summary: "HTTP 5xx 错误率过高 / High HTTP 5xx error rate"
          description: >
            HTTP 5xx 错误率为 {{ $value | humanizePercentage }}，超过 SLO 目标 1%（已持续 5 分钟）。
            HTTP 5xx error rate is {{ $value | humanizePercentage }}, exceeding the 1% SLO (for 5 minutes).

      # 5xx 错误率 > 5% 持续 2min → CRITICAL
      - alert: ImBoyHTTPErrorRateCritical
        expr: >
          sum(rate(imboy_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(imboy_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
          slo: http_error_rate
        annotations:
          summary: "HTTP 5xx 错误率严重超标 / HTTP 5xx error rate critically high"
          description: >
            HTTP 5xx 错误率为 {{ $value | humanizePercentage }}，已超过 5% 临界值（持续 2 分钟）。
            HTTP 5xx error rate is {{ $value | humanizePercentage }}, exceeding the 5% critical threshold (for 2 minutes).

  # ============================================================
  # 4. Erlang VM 内存 / Erlang VM Memory
  # 参考：docker-compose.prod.yml 中 BACKEND_MEM_LIMIT=8192M
  # Reference: BACKEND_MEM_LIMIT=8192M in docker-compose.prod.yml
  # ============================================================
  - name: imboy.erlang_vm
    interval: 30s
    rules:

      # 总内存 > 6GB 持续 5min → WARNING（容器上限 8GB 的 75%）
      # Total memory > 6GB for 5min → WARNING (75% of 8GB container limit)
      - alert: ImBoyErlangMemoryHigh
        expr: >
          erlang_vm_memory_bytes{job="imboy_backend", kind="total"}
          > 6 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Erlang VM 内存使用率高 / High Erlang VM memory usage"
          description: >
            Erlang VM 总内存为 {{ $value | humanize1024 }}B，超过容器上限 8GB 的 75%（已持续 5 分钟）。
            Erlang VM total memory is {{ $value | humanize1024 }}B, exceeding 75% of the 8GB container limit (for 5 minutes).

      # 总内存 > 7.5GB 持续 2min → CRITICAL（接近 OOM kill）
      - alert: ImBoyErlangMemoryCritical
        expr: >
          erlang_vm_memory_bytes{job="imboy_backend", kind="total"}
          > 7.5 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Erlang VM 内存接近 OOM / Erlang VM memory near OOM"
          description: >
            Erlang VM 总内存为 {{ $value | humanize1024 }}B，容器即将被 OOM Kill（持续 2 分钟）。
            Erlang VM total memory is {{ $value | humanize1024 }}B; container is near OOM Kill (for 2 minutes).
          runbook: "检查是否有消息积压或内存泄漏 / Check for message backlog or memory leak"

  # ============================================================
  # 5. Erlang 进程数 / Erlang Process Count
  # OTP 默认上限 262144；超过 200000 需告警
  # OTP default max 262144; alert above 200000
  # ============================================================
  - name: imboy.erlang_processes
    interval: 30s
    rules:

      - alert: ImBoyErlangProcessCountHigh
        expr: erlang_vm_process_count{job="imboy_backend"} > 200000
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Erlang 进程数过多 / Too many Erlang processes"
          description: >
            Erlang 进程数为 {{ $value }}，接近 OTP 默认上限 262144（已持续 5 分钟）。
            Erlang process count is {{ $value }}, approaching the OTP default limit of 262144 (for 5 minutes).
          runbook: "检查是否有进程泄漏（gen_server 未正常退出等）/ Check for process leaks (gen_server not terminating, etc.)"

  # ============================================================
  # 6. PostgreSQL 健康 / PostgreSQL Health
  # ============================================================
  - name: imboy.postgres
    interval: 30s
    rules:

      # postgres_exporter 离线 > 2min → CRITICAL
      - alert: ImBoyPostgresExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PostgreSQL exporter 离线 / PostgreSQL exporter is down"
          description: >
            postgres_exporter 已离线超过 2 分钟，数据库健康状态未知。
            postgres_exporter has been offline for over 2 minutes; database health is unknown.
          runbook: "检查 imboy_pg18 容器状态 / Check imboy_pg18 container: docker compose logs imboy_pg18"

      # 事务回滚率 > 5%（5m 窗口）→ WARNING
      # Transaction rollback rate > 5% over 5m → WARNING
      - alert: ImBoyPostgresHighRollbackRate
        expr: >
          rate(pg_stat_database_xact_rollback{datname="imboy_pro"}[5m])
          /
          (
            rate(pg_stat_database_xact_commit{datname="imboy_pro"}[5m])
            + rate(pg_stat_database_xact_rollback{datname="imboy_pro"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "PostgreSQL 事务回滚率过高 / High PostgreSQL rollback rate"
          description: >
            imboy_pro 数据库事务回滚率为 {{ $value | humanizePercentage }}，超过 5%（已持续 5 分钟）。
            Transaction rollback rate for imboy_pro is {{ $value | humanizePercentage }}, exceeding 5% (for 5 minutes).

  # ============================================================
  # 7. 消息发送速率陡降（疑似故障）/ Message Send Rate Drop
  # 仅在平均速率 > 1msg/s 的情况下触发，避免低峰期误报
  # Only triggers when avg rate > 1 msg/s to avoid off-peak false positives
  # ============================================================
  - name: imboy.message
    interval: 30s
    rules:

      - alert: ImBoyMsgRateDrop
        expr: >
          sum(rate(imboy_msg_sent_total[5m])) < 0.1
          and
          sum(rate(imboy_msg_sent_total[30m])) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "消息发送速率陡降 / Message send rate dropped sharply"
          description: >
            过去 5 分钟消息发送速率降至 {{ $value | humanize }} msg/s，但过去 30 分钟均值 > 1 msg/s，疑似故障。
            Message send rate dropped to {{ $value | humanize }} msg/s over the last 5 minutes, while the 30-minute average was > 1 msg/s — possible incident.

  # ============================================================
  # 8. WebSocket 连接陡降 / WebSocket Connection Drop
  # ============================================================
  - name: imboy.websocket
    interval: 30s
    rules:

      # WS 连接数较 10min 前下降超过 50% → WARNING（可能发生断线风暴）
      # WS connections dropped > 50% vs 10 min ago → WARNING (possible mass disconnect)
      - alert: ImBoyWSConnectionsDrop
        expr: >
          imboy_ws_connections_current > 10
          and
          (
            imboy_ws_connections_current
            / imboy_ws_connections_current offset 10m
          ) < 0.5
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "WebSocket 连接数陡降 / WebSocket connections dropped sharply"
          description: >
            WebSocket 在线连接数为 {{ $value }}，较 10 分钟前下降超过 50%，可能发生批量断线。
            WebSocket connections are at {{ $value }}, a drop of more than 50% from 10 minutes ago — possible mass disconnect.
          runbook: "检查 nginx WS 代理和后端日志 / Check nginx WS proxy and backend logs"

  # ============================================================
  # 9. 主机资源 / Host Resources (node_exporter 需部署)
  # node_exporter 部署：docker run -d --net="host" --pid="host" \
  #   -v "/:/host:ro,rslave" prom/node-exporter --path.rootfs=/host
  # ============================================================
  - name: imboy.host_resources
    interval: 60s
    rules:

      # 系统内存使用率 > 85% 持续 5min → WARNING（等保2.0 资源可用性基线）
      # Host memory usage > 85% for 5min → WARNING (MLPS 2.0 resource availability baseline)
      - alert: IMBoyHighMemoryUsage
        expr: >
          (
            1 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            )
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "主机内存使用率过高 / Host memory usage too high"
          description: >
            主机内存使用率为 {{ $value | humanizePercentage }}，超过 85% 警戒线（已持续 5 分钟）。
            Host memory usage is {{ $value | humanizePercentage }}, exceeding the 85% threshold (for 5 minutes).
          runbook: "执行 free -h 和 docker stats 定位高内存容器 / Run free -h and docker stats to identify high-memory containers"

      # 系统内存使用率 > 95% 持续 2min → CRITICAL
      - alert: IMBoyHighMemoryUsageCritical
        expr: >
          (
            1 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            )
          ) > 0.95
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "主机内存严重不足 / Host memory critically low"
          description: >
            主机内存使用率为 {{ $value | humanizePercentage }}，系统即将 OOM（持续 2 分钟）。
            Host memory usage is {{ $value | humanizePercentage }}; system is near OOM (for 2 minutes).

      # 磁盘使用率 > 80% → WARNING（等保2.0 日志留存 180 天要求）
      # Disk usage > 80% → WARNING (MLPS 2.0 180-day log retention requirement)
      - alert: IMBoyHighDiskUsage
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}
            )
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "磁盘使用率过高 / High disk usage"
          description: >
            根分区磁盘使用率为 {{ $value | humanizePercentage }}，超过 80% 警戒线（已持续 5 分钟）。
            Root partition disk usage is {{ $value | humanizePercentage }}, exceeding the 80% threshold (for 5 minutes).
          runbook: "执行 df -h 和 du -sh /var/lib/docker 检查空间分布 / Run df -h and du -sh /var/lib/docker to check space usage"

      # 磁盘使用率 > 90% → CRITICAL
      - alert: IMBoyHighDiskUsageCritical
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}
            )
          ) > 0.90
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "磁盘严重不足 / Disk critically full"
          description: >
            根分区磁盘使用率为 {{ $value | humanizePercentage }}，服务即将因磁盘满而崩溃（持续 2 分钟）。
            Root partition disk usage is {{ $value | humanizePercentage }}; services may crash due to full disk (for 2 minutes).

  # ============================================================
  # 10. Erlang 节点宕机检测 / Erlang Node Down
  # 补充 imboy.availability 组中 up==0 的 5min 节点级告警
  # ============================================================
  - name: imboy.node_down
    interval: 30s
    rules:

      # Erlang 后端节点 5 分钟无心跳 → CRITICAL
      # Erlang backend node has no heartbeat for 5 minutes → CRITICAL
      - alert: IMBoyNodeDown
        expr: up{job="imboy_backend"} == 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Erlang 节点宕机 / Erlang node is down"
          description: >
            imboy_backend 节点（{{ $labels.instance }}）已 5 分钟无 Prometheus 心跳，判定节点宕机。
            imboy_backend node ({{ $labels.instance }}) has had no Prometheus heartbeat for 5 minutes; node is considered down.
          runbook: >
            1. docker compose -f docker-compose.prod.yml logs imboy_backend
            2. docker compose -f docker-compose.prod.yml restart imboy_backend
            3. 确认 BEAM 崩溃原因后再重启 / Investigate BEAM crash before restarting

  # ============================================================
  # 11. PG 连接池耗尽 / PostgreSQL Connection Pool Exhausted
  # 基于 pg_stat_database.numbackends 与 max_connections 对比
  # ============================================================
  - name: imboy.pg_pool
    interval: 30s
    rules:

      # PG 连接池使用率 > 90% 持续 5min → WARNING
      # PG connection usage > 90% for 5min → WARNING
      - alert: IMBoyDatabasePoolExhausted
        expr: >
          sum(pg_stat_database_numbackends{datname="imboy_pro"})
          /
          pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "PG 连接池使用率过高 / PG connection pool near exhaustion"
          description: >
            PostgreSQL 连接池使用率为 {{ $value | humanizePercentage }}，超过 90% 警戒线（已持续 5 分钟）。
            当前连接数接近 max_connections 上限，可能导致新连接被拒绝。
            PostgreSQL connection usage is {{ $value | humanizePercentage }}, exceeding the 90% threshold (for 5 minutes).
            New connections may be rejected as max_connections is nearly reached.
          runbook: >
            1. SELECT count(*), state FROM pg_stat_activity GROUP BY state;
            2. SELECT * FROM pg_stat_activity WHERE state = 'idle' ORDER BY state_change;
            3. 检查 pooler 配置是否需要扩容 / Check if pooler needs scaling

      # PG 连接池使用率 > 95% 持续 2min → CRITICAL
      - alert: IMBoyDatabasePoolExhaustedCritical
        expr: >
          sum(pg_stat_database_numbackends{datname="imboy_pro"})
          /
          pg_settings_max_connections > 0.95
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PG 连接池即将耗尽 / PG connection pool critically exhausted"
          description: >
            PostgreSQL 连接池使用率为 {{ $value | humanizePercentage }}，新连接即将被拒绝（持续 2 分钟）。
            PostgreSQL connection usage is {{ $value | humanizePercentage }}; new connections will be rejected (for 2 minutes).

  # ============================================================
  # 12. 备份健康 / Backup Health
  # 依赖：imboy/scripts/backup_pg.sh 执行成功后写入 Prometheus Pushgateway
  # 在 backup_pg.sh 末尾添加：
  #   echo "imboy_backup_last_success_timestamp $(date +%s)" | \
  #     curl --data-binary @- http://pushgateway:9091/metrics/job/imboy_backup
  # ============================================================
  - name: imboy.backup
    interval: 300s
    rules:

      # 24 小时内无成功备份记录 → CRITICAL（等保2.0 数据备份恢复要求）
      # No successful backup in past 24 hours → CRITICAL (MLPS 2.0 data backup requirement)
      - alert: IMBoyBackupNotRunning
        expr: >
          (time() - imboy_backup_last_success_timestamp) > 86400
          or absent(imboy_backup_last_success_timestamp)
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "备份超过 24 小时未运行 / Backup has not run in the past 24 hours"
          description: >
            距离最后一次成功备份已超过 24 小时（或从未有备份记录），违反等保2.0 数据备份恢复要求。
            The last successful backup was more than 24 hours ago (or no backup record exists).
            This violates the MLPS 2.0 data backup and recovery requirement.
          runbook: >
            1. 手动触发备份：bash imboy/scripts/backup_pg.sh
            2. 检查 cron 任务是否正常：crontab -l | grep backup
            3. 检查 Pushgateway 是否在线：curl http://pushgateway:9091/metrics

      # 备份作业本身失败（脚本已退出但状态为失败）→ WARNING
      # Backup job reported failure status → WARNING
      - alert: IMBoyBackupJobFailed
        expr: imboy_backup_last_status == 0
        for: 0m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "备份作业上报失败 / Backup job reported failure"
          description: >
            component={{ $labels.component }} 的最近一次备份以失败状态结束。
            The most recent backup for component={{ $labels.component }} ended in a failed state.
          runbook: >
            1. 查看日志：tail -100 /var/log/imboy/backup_pg.log
            2. 确认 PG 容器在跑：docker ps | grep imboy_pg
            3. 确认备份目录可写且磁盘未满：df -h


      # ── B-22 恢复演练（指标由 scripts/restore_smoke.sh 经 Pushgateway 推送）──
      # 备份"能生成"和备份"能恢复"是两件事。此前每日演练的结果只留在 cron 日志里，
      # 没有人会去看 —— 等于"备份不可恢复"永远不会有人被通知到。

      - alert: IMBoyRestoreDrillFailed
        expr: imboy_restore_drill_last_status == 0
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "备份恢复演练失败 / Restore drill failed"
          description: >
            最近一次恢复演练未通过。这意味着**备份可能无法恢复** ——
            备份文件生成成功不等于能恢复出数据。
          runbook: >
            1. 查演练日志：tail -200 /var/log/imboy/restore_smoke.log
            2. 重点看是否报"源库有 N 行但恢复后 0 行" —— 那是 hypertable 未恢复
               （典型为缺 timescaledb_pre_restore 包裹）
            3. 手工重跑：bash scripts/restore_smoke.sh

      # 演练本身停摆比演练失败更隐蔽：没有结果就没有告警，看起来一切正常
      - alert: IMBoyRestoreDrillStalled
        expr: >
          absent(imboy_restore_drill_last_success_timestamp)
          or (time() - imboy_restore_drill_last_success_timestamp) > 172800
        for: 30m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "恢复演练超过 48 小时未成功 / Restore drill has not succeeded for 48h"
          description: >
            演练每日执行，超过 48 小时没有一次成功即说明它没在跑或一直失败。
          runbook: >
            1. 确认 cron 生效：cat /etc/cron.d/imboy-ops
            2. 确认 /etc/imboy/ops.env 里 PUSHGATEWAY_URL 已设置（见 deploy/ops.env.example）
            3. 确认 DRY_RUN 未被误设为 1 —— 该模式**不推成功指标**，正是为了避免假绿

  - name: imboy.tls
    interval: 300s
    rules:

      # 指标由 scripts/check_tls_expiry.sh 经 Pushgateway 推送
      # Metric is pushed by scripts/check_tls_expiry.sh via Pushgateway
      - alert: IMBoyTLSCertExpiringSoon
        expr: (imboy_tls_cert_expiry_timestamp - time()) < 14 * 86400
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "TLS 证书 14 天内到期 / TLS certificate expires within 14 days"
          description: >
            域名 {{ $labels.component }} 的证书将在 14 天内到期。
            The certificate for {{ $labels.component }} expires within 14 days.
          runbook: >
            1. 手动续期：certbot renew
            2. 确认自动续期定时器：systemctl list-timers | grep certbot
            3. 续期后重载 nginx：nginx -s reload

      - alert: IMBoyTLSCertExpired
        expr: (imboy_tls_cert_expiry_timestamp - time()) <= 0
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "TLS 证书已过期 / TLS certificate has expired"
          description: >
            域名 {{ $labels.component }} 的证书已过期，客户端将无法建立连接。
            The certificate for {{ $labels.component }} has expired; clients cannot connect.
          runbook: >
            1. 立即续期：certbot renew --force-renewal
            2. 重载 nginx：nginx -s reload
            3. 确认 check_tls_expiry.sh 的 cron 为何未提前告警

      # 检查脚本本身停跑（指标消失）也要能发现，否则过期会静默
      - alert: IMBoyTLSCheckStale
        expr: absent(imboy_tls_cert_expiry_timestamp)
        for: 6h
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "TLS 到期检查指标缺失 / TLS expiry metric missing"
          description: >
            超过 6 小时没有收到 imboy_tls_cert_expiry_timestamp，
            check_tls_expiry.sh 可能未运行或 IMBOY_TLS_DOMAINS 未配置。
            No TLS expiry metric received for over 6 hours.
          runbook: >
            1. 检查 cron：cat /etc/cron.d/imboy-ops
            2. 手动跑一次：IMBOY_TLS_DOMAINS=... bash scripts/check_tls_expiry.sh
            3. 确认 /etc/imboy/ops.env 里 IMBOY_TLS_DOMAINS 与 PUSHGATEWAY_URL 已设置

  - name: imboy.payment
    interval: 60s
    rules:

      # 指标由 src/logic/payment_callback_logic.erl 的 handle/3 唯一出入口产出
      # Metric is emitted from the single choke point in payment_callback_logic:handle/3
      - alert: IMBoyPaymentCallbackErrorRateHigh
        expr: >
          sum(rate(payment_callback_total{result="error"}[10m]))
          /
          clamp_min(sum(rate(payment_callback_total[10m])), 0.001)
          > 0.1
        for: 10m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付回调错误率超过 10% / Payment callback error rate above 10%"
          description: >
            近 10 分钟支付回调错误率超过 10%，可能是订单查不到、金额校验失败或下游异常。
            Payment callback error rate exceeded 10% over the last 10 minutes.
          runbook: >
            1. 查错误日志：grep payment_callback /var/log/imboy/*.log | tail -50
            2. 确认 payment_transaction 表写入是否正常
            3. 确认第三方网关状态页是否有故障

      # 验签失败是安全信号（伪造回调 / 密钥不一致），阈值独立于业务错误
      - alert: IMBoyPaymentSignFailureSpike
        expr: sum(rate(payment_callback_sign_failed_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "支付回调验签失败激增 / Spike in payment callback signature failures"
          description: >
            近 5 分钟支付回调验签失败率异常，可能是伪造回调攻击或网关密钥配置不一致。
            Abnormal rate of payment callback signature verification failures.
          runbook: >
            1. 确认来源 IP 是否为网关官方回调地址
            2. 核对网关公钥/密钥配置是否与商户后台一致
            3. 必要时在 nginx 层临时限制回调来源

      # ── B-07 对账（指标由 src/logic/payment_reconcile_logic.erl 的 ecron 入口产出）──
      # Reconciliation metrics come from payment_reconcile_logic:run_hourly/0 (ecron).
      # 指标名与 metrics_handler:metric_name/1 的输出**逐字一致**（atom 原样，无前缀）——
      # 这一条是刻意核对过的，不要照抄本文件其它组里那些不匹配的名字（见 B-26）。

      # 收了钱但业务侧没落地 = 漏单。补单是自动的，但发生本身必须有人知道。
      - alert: IMBoyPaymentReconcileMismatch
        expr: increase(payment_reconcile_mismatch_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付对账发现不一致 / Payment reconciliation found mismatches"
          description: >
            对账 job 发现「payment_transaction 已成功但业务订单未落地」的流水。
            系统已尝试自动补单，但差异本身说明入账链路有缺口，必须查因。
            Reconciliation found successful transactions whose business order was not credited.
          runbook: >
            1. 查日志：grep payment_reconcile /var/log/imboy/*.log | tail -50
            2. 看 payment_reconcile_repair_total{outcome="failed"} 是否同时上涨
            3. 若 outcome=repaired 则钱已补上，仍需定位为何回调当时没入账

      # 补单失败：钱收了、补也补不上，属人工介入级别
      - alert: IMBoyPaymentReconcileRepairFailed
        expr: increase(payment_reconcile_repair_total{outcome="failed"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付对账补单失败 / Payment reconciliation repair failed"
          description: >
            对账发现漏单但自动补单失败，用户已付款而权益未发放，需人工处理。
            Automatic repair failed; the user paid but did not receive the entitlement.
          runbook: >
            1. 按 trade_no 在日志里定位 repair_failed 记录
            2. 核对 payment_transaction 与业务订单的实际状态
            3. 手工补单后确认 channel_order/recharge_order 状态为已支付

      # 流水存在但业务订单查不到 —— 补不了，只能人工判定是脏流水还是订单被误删
      - alert: IMBoyPaymentReconcileUnrepairable
        expr: increase(payment_reconcile_unrepairable_total[6h]) > 0
        for: 0m
        labels:
          severity: warning
          team: payment
        annotations:
          summary: "支付流水找不到对应业务订单 / Payment transaction has no business order"
          description: >
            对账发现成功流水的业务订单不存在，无法自动补单。
          runbook: >
            1. 按 trade_no 核对该流水来源
            2. 确认业务订单是否被误删或订单号写错

      # 心跳：job 该跑没跑，等同于对账形同虚设（悄悄失效比报错更危险）
      - alert: IMBoyPaymentReconcileStalled
        expr: increase(payment_reconcile_run_total[3h]) == 0
        for: 10m
        labels:
          severity: warning
          team: payment
        annotations:
          summary: "支付对账 job 已停摆 / Payment reconciliation job stalled"
          description: >
            近 3 小时没有一次对账执行（正常每小时一次），漏单将无人发现。
          runbook: >
            1. 确认节点存活且 ecron 已启动：make ctl ARGS="node status"
            2. 查 sys.config 的 ecron jobs 是否还有 payment_reconcile 项
            3. 查 payment_reconcile_error_total 是否在涨（跑了但一直失败）

      # ── W3-A04 对账执行失败：与上面 Stalled 互补——那条管"没跑"，这条管"跑了但一直失败" ──
      # 阈值依据：对账每小时一次（ecron），error_total 仅在 run/1 异常捕获分支递增
      # （src/logic/payment_reconcile_logic.erl:82/101），零容忍：任何一次失败都意味着
      # 本轮漏单未被扫描，资金差异无人发现，故 >0 即触发、critical。
      - alert: IMBoyPaymentReconcileErrors
        expr: sum(increase(payment_reconcile_error_total[1h])) > 0
        for: 0m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付对账执行失败 / Payment reconciliation run failed"
          description: >
            对账 job 在跑但最近 1 小时内有执行以异常结束——本轮流水未被完整扫描，
            漏单与差异将无人发现（停摆由 IMBoyPaymentReconcileStalled 另行覆盖）。
            Reconciliation run(s) ended with an exception in the last hour.
          runbook: >
            1. 查异常日志：grep payment_reconcile /var/log/imboy/*.log | tail -50
            2. 区分 run 入口失败（DB 不可达）与逐单修复失败（看堆栈模块）
            3. 连续多轮失败时，人工对账当日流水兜底：核对 payment_transaction 与渠道账单

  # ============================================================
  # 13. E2EE/OLM 密钥与安全事件 / E2EE (OLM) Key & Security Events
  # 指标来源：src/logic/olm_identity_logic.erl 的 elib_metric:increment 调用点
  # （计数器，经 /metrics 导出）。E2EE 域告警按两类设计：
  #   - 密钥可用性（otk_exhausted / prekey_unavailable）：协议允许偶发，
  #     客户端补传密钥即自愈，>5 次/10min 持续才说明补传管道断裂
  #   - 安全事件（claim_unauthorized / identity_pop_rejected / fallback_unsigned）：
  #     攻击面信号，低阈值高敏感
  # C12-followup（AC-26）新增来源：
  #   - src/logic/msg_c2g_logic.erl group_e2ee_gate/5：
  #     group_e2ee_plaintext_rejected_total（required-E2EE 群拒收明文，
  #     rollout 期旧客户端撞墙信号）/ group_e2ee_check_failed_total（fail-closed 拒发）
  #   - src/logic/e2ee_recovery_logic.erl：e2ee_recovery_failed_total（恢复 DB 失败）
  #   - src/logic/e2ee_backup_logic.erl：e2ee_backup_op_failed_total{op=put|get|info|delete}
  #     （备份服务端故障，5xx 等价物；客户端 4xx 与 version_conflict 409 不计）
  # ============================================================
  - name: imboy.e2ee
    interval: 30s
    rules:

      # OTK 耗尽：给该用户建立新 E2EE 会话时一次性预共享密钥已用完。
      # 阈值依据：单用户偶发耗尽属协议正常流程（等客户端 refill），
      # 10 分钟内 >5 次说明客户端密钥补传管道断裂，受影响用户加密消息发不出。
      - alert: ImBoyOlmOtkExhausted
        expr: sum(increase(olm_otk_exhausted_total[10m])) > 5
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "E2EE OTK 密钥持续耗尽 / E2EE OTK persistently exhausted"
          description: >
            近 10 分钟 OTK 耗尽 {{ $value | humanize }} 次（阈值 >5）。偶发耗尽是协议
            正常现象（等客户端补传），持续耗尽说明密钥补传管道断裂，受影响用户无法
            建立新的端到端加密会话。
            Sustained OTK exhaustion means the key refill pipeline is broken;
            affected users cannot establish new E2EE sessions.
          runbook: >
            1. 按实例和时间窗核对 olm_otk_exhausted_total；该计数不包含用户或设备标识
            2. 确认客户端版本是否刚发过版（refill 逻辑变更）
            3. 获得测试资源授权后，用合成账号验证 OTK 补传和领取；勿使用真实用户密钥

      # 预共享密钥不可用：对端从未上传 prekey 或已失效，会话无法建立。
      # 阈值依据：与 OTK 耗尽同型——新注册用户未上传首批密钥会偶发，
      # >5 次/10min 持续说明上传/拉取链路系统性故障。
      - alert: ImBoyOlmPrekeyUnavailable
        expr: sum(increase(olm_prekey_unavailable_total[10m])) > 5
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "E2EE 预共享密钥持续不可用 / E2EE prekeys persistently unavailable"
          description: >
            近 10 分钟 prekey 不可用 {{ $value | humanize }} 次（阈值 >5）。
            对端无可用预共享密钥，端到端加密会话无法建立。
            Prekeys persistently unavailable; E2EE sessions cannot be established.
          runbook: >
            1. 查 olm prekey 存储表读写是否有报错（grep prekey /var/log/imboy/*.log）
            2. 确认 olm 上传接口（claim/upload）HTTP 5xx 是否同时上涨
            3. 对照 ImBoyOlmOtkExhausted 是否同现（同源故障）

      # 未授权 claim：有人用别人身份拉取密钥（伪造/越权），安全攻击信号。
      # 阈值依据：合法客户端不会触发该路径，出现即为信号，>0 零容忍。
      # 若生产基线证明旧客户端 bug 造成噪声，再上调并记录于此。
      - alert: ImBoyOlmClaimUnauthorized
        expr: sum(increase(olm_claim_unauthorized_total[10m])) > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "E2EE 出现未授权密钥 claim / Unauthorized E2EE key claim"
          description: >
            近 10 分钟出现 {{ $value }} 次未授权 claim——有人尝试用非本人身份拉取
            E2EE 密钥（伪造请求或越权探测），属安全事件。
            Unauthorized key claims detected: possible forgery or probing.
          runbook: >
            1. 定位来源：grep claim_unauthorized /var/log/imboy/*.log，提取 device_id/IP
            2. 核对涉事账号是否有异地登录/令牌异常
            3. 评估是否临时封禁来源，必要时走安全事件流程

      # 身份密钥 PoP 验签被拒：设备身份证明失败（客户端损坏或篡改）。
      # 阈值依据：个别事件可能是旧客户端版本不匹配，10 分钟 >3 次
      # 说明系统性客户端损坏或身份伪造尝试。
      - alert: ImBoyOlmIdentityPopRejected
        expr: sum(increase(olm_identity_pop_rejected_total[10m])) > 3
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "E2EE 身份密钥验签被拒激增 / Spike in E2EE identity PoP rejections"
          description: >
            近 10 分钟身份密钥 PoP 验签被拒 {{ $value }} 次（阈值 >3）。
            个别事件可能是客户端版本不匹配，激增说明系统性客户端故障或身份伪造。
          runbook: >
            1. 按设备版本聚合被拒记录，确认是否集中在某一客户端版本
            2. 若集中旧版本：评估强制升级；若分散：按安全事件处理
            3. 与 ImBoyOlmClaimUnauthorized 同现时优先按攻击处置

      # 走了未签名 fallback：E2EE 完整性防线被绕过的降级路径被使用。
      # 阈值依据：fallback 是兼容性兜底，稳态应为零流量；>3 次/10min
      # 说明有客户端持续绕过签名校验（降级攻击或损坏客户端）。
      - alert: ImBoyOlmFallbackUnsigned
        expr: sum(increase(olm_fallback_unsigned_total[10m])) > 3
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "E2EE 未签名降级路径被使用 / Unsigned E2EE fallback in use"
          description: >
            近 10 分钟未签名 fallback 使用 {{ $value }} 次（阈值 >3）。
            fallback 为兼容兜底，稳态应无流量；持续出现说明签名校验被绕过。
          runbook: >
            1. 定位走 fallback 的设备/账号：grep fallback_unsigned /var/log/imboy/*.log
            2. 确认是旧协议版本残留还是主动降级尝试
            3. 计划收紧 fallback 策略前先确认存量客户端占比

      # ── C12-followup（AC-26）补齐：以下计数器此前有计数无告警 ──

      # 身份根轮换被拒：双签名验签失败/单向上限/撤销设备重放被拦。
      # 阈值依据：合法客户端走 report_identity 正常轮换不会触发该分支；
      # 被拒=身份根保护机制在报事件（攻击尝试或客户端密钥损坏），>0 持续 5min 即 critical。
      - alert: ImBoyOlmIdentityRotationRejected
        expr: sum(increase(olm_identity_rotation_rejected_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "E2EE 身份根轮换被拒 / E2EE identity rotation rejected"
          description: >
            近 5 分钟身份根轮换被拒 {{ $value }} 次。轮换被拒说明换根请求未通过
            双签名验证（伪造尝试、撤销设备重放或客户端密钥损坏），fail-closed 生效中。
            Rejected identity rotations: forgery attempt, revoked-device replay,
            or corrupted client keys; fail-closed is holding.
          runbook: >
            1. 查被拒详情：grep rotation_rejected /var/log/imboy/*.log，提取 uid/device_id
            2. 核对涉事设备是否刚被撤销（正常重放 vs 攻击）
            3. 与 ImBoyOlmClaimUnauthorized 同现时按攻击处置

      # 轮换事件落库失败：换钥本身成功但 trust_audit 事件写失败（审计链断裂）。
      # 阈值依据：审计事件 append-only 是信任链证据，丢失即不可追溯；换钥低频，
      # 任何一次失败都值得人工补录，>0 持续 5min critical。
      - alert: ImBoyOlmRotationEventFailed
        expr: sum(increase(olm_rotation_event_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "E2EE 轮换审计事件写入失败 / E2EE rotation audit event write failed"
          description: >
            近 5 分钟轮换事件落库失败 {{ $value }} 次。换钥已完成但 trust_audit
            未记录，审计链出现缺口（不阻断换钥，但事件不可追溯）。
            Rotation succeeded but audit trail has gaps.
          runbook: >
            1. 查 trust_audit 表写入报错：grep rotation_event_failed /var/log/imboy/*.log
            2. 核对 DB 连接/约束（trust_audit_repo insert_event）
            3. 日志只保留固定失败事件，不能据此重建签名审计记录；登记审计缺口
            4. 保留已有可信签名证据，按获批准的恢复合同核对幂等重放；不得伪造或直接补写事件

      # required-E2EE 群拒收明文：rollout 期旧客户端在加密群发明文被拒的"撞墙"信号。
      # 阈值依据：这不是故障而是版本门在生效——warning 级别用于观察存量旧客户端规模，
      # 指导升级催办节奏；门放开后（全量加密客户端）应归零。
      - alert: ImBoyGroupE2eePlaintextRejected
        expr: sum(increase(group_e2ee_plaintext_rejected_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "required-E2EE 群拒收明文消息（旧客户端撞墙）/ Plaintext rejected by required-E2EE groups"
          description: >
            近 10 分钟加密群拒收明文消息 {{ $value }} 次。版本门在正常生效：
            旧客户端（不支持群 E2EE）在 e2ee_mode=1 的群发消息被 fail-closed 拒收。
            持续增长说明存量旧客户端规模可观，需催办升级。
            The E2EE gate is working; aging clients are being rejected.
          runbook: >
            1. 按客户端版本聚合被拒请求，确认旧版本存量规模
            2. 评估推送升级提醒（管理后台版本门/公告）
            3. 若单用户高频被拒：定向排查其客户端是否故障

      # required-E2EE 群配置查询失败：fail-closed 拒发（不是客户端问题，是服务端问题）。
      # 阈值依据：该分支只在 group_ds:e2ee_mode 查询出错时触达（DB 故障），
      # 正常流量为 0；>0 持续 2min 说明群配置读取链路故障，大量群消息被误拒。
      - alert: ImBoyGroupE2eeCheckFailed
        expr: sum(increase(group_e2ee_check_failed_total[10m])) > 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "required-E2EE 群配置查询失败（fail-closed 拒发中）/ E2EE group config query failing"
          description: >
            近 10 分钟群 E2EE 配置查询失败 {{ $value }} 次。查询失败触发 fail-closed
            拒发——用户视角是"消息发不出"，需与 DB 告警对照定位。
            Group config queries failing; fail-closed is rejecting sends.
          runbook: >
            1. 对照 PostgreSQL 告警/慢查询（group 表读取）
            2. 查 group_e2ee_gate_query_failed 固定事件确认故障时间窗；日志不含群标识或原始数据库错误
            3. 与 ImBoyGroupE2eePlaintextRejected 区分：那条是版本门正常生效

      # E2EE 恢复失败：start_server_backup_recovery 查询 DB 出错（非"无备份"）。
      # 阈值依据：恢复是用户主动低频操作，DB 失败即该用户恢复流程中断；
      # >0 持续 5min 说明备份表读取故障，warning（单用户重试可自愈，持续则升级）。
      - alert: ImBoyE2eeRecoveryFailed
        expr: sum(increase(e2ee_recovery_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "E2EE 恢复流程查询失败 / E2EE recovery flow query failed"
          description: >
            近 10 分钟恢复启动时备份查询失败 {{ $value }} 次（非"无备份"的正常路径）。
            受影响用户无法进入恢复流程，服务端返回 internal_error。
            Backup lookups failing during recovery start.
          runbook: >
            1. 查 start_server_backup_recovery_db_error 日志
            2. 与 ImBoyE2eeBackupOpFailed 同现时优先排查备份表读取链路

      # E2EE 备份操作服务端失败：put/get/info/delete 的 5xx 等价物（带 op 标签）。
      # 阈值依据：备份成功是用户密钥可恢复的前提，服务端故障=用户重装后可能
      # 无法恢复密钥；客户端 4xx 与 version_conflict 409 不计入。>0 持续 5min warning。
      - alert: ImBoyE2eeBackupOpFailed
        expr: sum(increase(e2ee_backup_op_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "E2EE 密钥备份操作服务端失败 / E2EE backup operation failing"
          description: >
            近 10 分钟备份服务端操作失败 {{ $value }} 次（按 op 标签区分
            put/get/info/delete）。备份不可用时用户重装设备将无法恢复 E2EE 密钥。
            Backup operations failing server-side (see op label).
          runbook: >
            1. 按 op 标签定位失败操作：/metrics 里 e2ee_backup_op_failed_total{op=...}
            2. 查 e2ee_backup 表读写报错（grep backup_save_failed / backup_query_failed）
            3. DB 层恢复后抽查一个账号验证 put→get 链路

  # ============================================================
  # 14. License 有效性/到期/配额 / License Validity, Expiry & Quota
  # 指标来源：src/api/metrics_handler.erl license_metrics/0（gauge，
  # 经 /metrics 导出）。注意两个防误报关键事实（源自 src/lib/imboy_license.erl）：
  #   - 社区版是合法稳态：valid=0、expires_at=0（ms）、max_nodes=1。
  #     不能直接对 valid==0 或 expires_at 时间差告警，否则社区部署常亮
  #   - expires_at 是毫秒时间戳（imboy_license:info() 原样导出），与
  #     time() 秒比较需 /1000
  #   - max=0 表示不限量（check_user_quota 注释），所有配额告警需 >0 guard
  # ============================================================
  - name: imboy.license
    interval: 60s
    rules:

      # License 由有效转为无效（过期超 7 天宽限/域名绑定不匹配/验签失败 → 降级社区版）。
      # 阈值依据：用 offset 1h 对比「1 小时前还是 1」过滤掉从未有过 license 的
      # 社区部署（valid 恒 0 是合法稳态），只捕获降级事件。
      - alert: ImBoyLicenseInvalid
        expr: >
          imboy_license_valid{job="imboy_backend"} == 0
          and
          imboy_license_valid{job="imboy_backend"} offset 1h == 1
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "License 已失效（降级社区版）/ License became invalid (degraded to community)"
          description: >
            imboy_license_valid 由 1 变 0：license 过期超 7 天宽限、域名绑定不匹配或
            验签失败，商业版能力已降级为社区版。社区部署（从未有 license）不会触发本告警。
          runbook: >
            1. 查降级原因：grep "license" /var/log/imboy/*.log（过期/域名/签名三类）
            2. 域名问题：核对当前 host 与 license 绑定域名列表
            3. 联系授权方续期/重签后：重启或 imboy_license:load_and_validate() 重新加载

      # License 即将到期（含已过期）。14 天提前量与 TLS 到期告警口径一致：
      # 续期涉及商务流程，需给足人工处理时间。
      - alert: ImBoyLicenseExpiringSoon
        expr: >
          imboy_license_expires_at{job="imboy_backend"} > 0
          and
          (imboy_license_expires_at{job="imboy_backend"} / 1000 - time()) < 14 * 86400
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "License 14 天内到期 / License expires within 14 days"
          description: >
            License 将在 {{ $value | humanizeDuration }} 后到期（负值=已过期）。
            过期后仍有 7 天宽限期（GRACE_DAYS=7）按授权运行，宽限期满降级社区版。
            社区版（expires_at=0）不触发本告警。
          runbook: >
            1. 联系授权方续期，拿到新 license 文件
            2. 替换后重载：_rel/imboy/bin/imboy eval 'imboy_license:load_and_validate().'
            3. 确认 imboy_license_valid 回 1、告警恢复

      # 用户配额接近上限：注册在 current >= max 时被 check_user_quota 拒绝。
      # 阈值依据：90% 提前预警，为续期/扩容留出操作窗口。max=0（不限量）不触发。
      # 社区版上限默认 100 人，接近时告警是有效提醒（达到社区版规模上限）。
      - alert: ImBoyLicenseUserQuotaNear
        expr: >
          (imboy_license_users_max{job="imboy_backend"} > 0)
          and
          (imboy_license_users_current{job="imboy_backend"}
            / imboy_license_users_max{job="imboy_backend"} > 0.9)
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "License 用户配额即将用尽 / License user quota near exhaustion"
          description: >
            注册用户数已达 license 上限的 {{ $value | humanizePercentage }}（阈值 90%）。
            达到上限后新用户注册将被 check_user_quota 拒绝。
          runbook: >
            1. 确认当前配额：管理后台「License 信息」或 imboy_license:info()
            2. 商业版：续期/升配；社区版（默认 100 人）：评估升级商业版
            3. 若属误配（max 配低）：核对 license 文件配额字段

      # 节点配额已超限：新节点接入被 check_node_quota 拒绝。
      # 阈值依据：节点配额是小整数（社区版 1 / 试用版 3），"接近 90%" 在 1/1 时
      # 恒真会常亮，故只对「已超限」告警（current > max）。
      - alert: ImBoyLicenseNodeQuotaExceeded
        expr: >
          (imboy_license_nodes_max{job="imboy_backend"} > 0)
          and
          (imboy_license_nodes_current{job="imboy_backend"}
            > imboy_license_nodes_max{job="imboy_backend"})
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "License 节点配额已超限 / License node quota exceeded"
          description: >
            当前节点数已超过 license 允许的上限，新节点接入将被 check_node_quota 拒绝。
          runbook: >
            1. 确认是否误扩容：imboy_license:info() 核对 max_nodes
            2. 需要多节点：续期升配后重启节点
            3. 误扩容：缩容到配额内，避免脑裂告警噪声

  # ============================================================
  # 15. 在线用户陡降 / Online User Drop
  # imboy_online_users 来自 syn:registry_count(imboy)（唯一在线用户数），
  # 比连接数更接近"真实用户掉线"——连接抖动重连不会减少唯一用户数。
  # ============================================================
  - name: imboy.online_users
    interval: 30s
    rules:

      # 镜像 ImBoyWSConnectionsDrop 的写法（10 分钟跌 >50%），但基线提高到 >50：
      # 在线用户数低于 50 的小规模部署波动占比天然大，避免误报。
      # severity=critical：唯一用户级陡降排除连接抖动，是大规模掉线的确证信号。
      - alert: ImBoyOnlineUsersDrop
        expr: >
          imboy_online_users{job="imboy_backend"} > 50
          and
          (imboy_online_users{job="imboy_backend"}
            / imboy_online_users{job="imboy_backend"} offset 10m) < 0.5
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "在线用户数陡降 / Online users dropped sharply"
          description: >
            在线用户数（syn 唯一用户）较 10 分钟前下降超过 50%（当前基线 >50）。
            唯一用户级下降排除了连接抖动重连，是大规模掉线/整区域故障的确证。
          runbook: >
            1. 与 ImBoyWSConnectionsDrop 对照：同现为接入层/后端故障，仅本条为客户端侧异常
            2. 查后端异常日志与最近变更：tail -200 /var/log/imboy/*.log
            3. 确认消息收发是否仍正常（受影响用户是否只是掉线统计问题）

  # ============================================================
  # 16. 红包过期 job 心跳与失败 / Red Packet Expiry Job Heartbeat & Errors
  # 指标来源：src/logic/red_packet_logic.erl run_expire_refund/1（ecron 每小时
  # 第 23 分执行，见 config/sys.config.example）。job 设计为「异常记日志后跳过、
  # 恒 ok 不抛给调度器」——意味着失败完全静默，必须靠指标告警。
  # ============================================================
  - name: imboy.red_packet
    interval: 60s
    rules:

      # 心跳停摆：镜像 IMBoyPaymentReconcileStalled 的模式（同为小时级 job，
      # 3 小时窗口 = 连续 3 轮未执行）。
      - alert: ImBoyRedPacketExpireStalled
        expr: increase(red_packet_expire_run_total[3h]) == 0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "红包过期退款 job 已停摆 / Red packet expiry job stalled"
          description: >
            近 3 小时红包过期 job 无一次执行记录（正常每小时第 23 分执行），
            过期未领完的红包余额将一直滞留。
          runbook: >
            1. 确认 ecron 在跑：make ctl ARGS="node status"，查 cron.config 是否含 job
            2. 手动补跑一轮：_rel/imboy/bin/imboy eval 'red_packet_logic:run_expire_refund().'
            3. 与对账 job 停摆同现时优先查 ecron 整体故障

      # 执行失败：job 在跑但持续抛异常（恒 ok 的静默失败设计使错误不上报调度器）。
      # 阈值依据：>0 零容忍——单次失败即本轮红包未退款，用户资金滞留。
      - alert: ImBoyRedPacketExpireErrors
        expr: sum(increase(red_packet_expire_error_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "红包过期退款 job 执行失败 / Red packet expiry job failed"
          description: >
            近 1 小时红包过期 job 有执行以异常结束（run_failed）。该 job 失败时
            静默跳过本轮，过期红包余额不会退回发送者。
          runbook: >
            1. 查异常：grep red_packet_expire /var/log/imboy/*.log | tail -50
            2. 修复原因后补跑：_rel/imboy/bin/imboy eval 'red_packet_logic:run_expire_refund().'
            3. 抽查若干过期红包确认余额已退回

  # ============================================================
  # 17. L4 SNI listen 漂移巡检 / L4 SNI listen-drift patrol (Task 2)
  # 指标来源：宿主机 cron 每 5 分钟跑 scripts/check_l4_sni_listen.sh
  # --strict --push（deploy/cron/imboy-ops.cron），经 Pushgateway
  # job=imboy_l4_sni_check 推入；prometheus.yml 以 honor_labels 抓取
  # pushgateway，job 标签得以保留。巡检只校验配置文本的 listen 合同，
  # 不证明运行配置、端口归属或媒体健康。
  #
  # 失败可见性语义链（推送失败不会假绿）：
  #   - 检测出漂移/输入错误且推送成功 → drift>0 / check_success=0 直接告警
  #     （脚本 exit 1/2 路径仍会推送指标，exit 2 时 drift 序列被整体替换消失）；
  #   - 推送本身失败（脚本 exit 3：URL 缺失/网络不通）→ 指标停留在
  #     Pushgateway 旧值不刷新 → L4SNIStaleMetrics 兜底（Pushgateway 无 TTL，
  #     旧 drift=0 永不自动消失，只有时间戳能暴露巡检已死）；
  #   - Pushgateway 数据被清（重启清空/分组删除）→ 指标序列消失 →
  #     L4SNIMetricsMissing（仅在 Pushgateway 抓取存活时判定，抓取本身
  #     挂掉由部署侧 scrape/up 验证负责，不属本组职责）。
  # ============================================================
  - name: imboy.l4_sni
    interval: 30s
    rules:

      # listen 漂移：直连 443 / 非 loopback:10443 / 缺独立 proxy_protocol
      # for=10m：容忍一轮 cron（5min）+ 抓取周期抖动，两轮巡检仍漂移才告警。
      - alert: L4SNIListenDrift
        expr: imboy_l4_sni_listen_drift > 0
        for: 10m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "L4 SNI nginx listen 配置漂移 / L4 SNI listen drift detected"
          description: >
            {{ $labels.config_file }} 的 server {{ $labels.server }} 出现 listen 漂移
            （直连 443、非 loopback:10443 或缺独立 proxy_protocol token），
            已持续 10 分钟以上。受管 vhost 可能被面板或自动 reload 重写。
          runbook: >
            1. 查巡检日志：tail -100 /var/log/imboy/l4_sni_listen.log（诊断含 file:line）
            2. 核对受管 vhost 是否被宝塔面板/自动 reload 重写
            3. 人工 reload 前必须先跑：cd /opt/imboy && bash scripts/check_l4_sni_listen.sh

      # 巡检作业本身失败（输入/解析错误，脚本 exit 2 且推送成功路径）：
      # env 文件缺失、vhost 不可读、include/跨行指令等 fail-closed 场景。
      # 配置发现链路断裂等于巡检失明，不能静默——此时 drift 序列通常已被
      # 整体替换消失，本告警是唯一可见信号。
      - alert: L4SNICheckFailed
        expr: imboy_l4_sni_check_success == 0
        for: 10m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "L4 SNI 巡检执行失败 / L4 SNI patrol check failed"
          description: >
            巡检以输入/解析错误收尾（check_success=0，对应脚本 exit 2：发现 env
            缺失、文件不可读、include/跨行指令等 fail-closed 结构），且失败状态
            已持续 10 分钟以上。
          runbook: >
            1. 查巡检日志：tail -100 /var/log/imboy/l4_sni_listen.log
            2. 核对 /etc/imboy/livekit-l4-sni.env 的 NGINX_VHOST_DIR 与 HTTPS_VHOST_FILES
            3. 手动复现：cd /opt/imboy && bash scripts/check_l4_sni_listen.sh --strict --push

      # 新鲜度兜底：cron 停跑、PUSHGATEWAY_URL 失效、推送持续失败（exit 3）
      # 都表现为时间戳停更——Pushgateway 里的旧 drift=0 不消失，唯独时间戳会老。
      # 阈值 900s（冻结合同）= 3 轮巡检未推；for=5m 再滤单次抓取抖动。
      - alert: L4SNIStaleMetrics
        expr: time() - imboy_l4_sni_last_check_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "L4 SNI 巡检指标过期 / L4 SNI patrol metrics stale"
          description: >
            imboy_l4_sni_last_check_timestamp_seconds 已 {{ $value | humanizeDuration }}
            未刷新（阈值 900s，正常每 5 分钟一推）。cron 停跑或推送持续失败
            （脚本 exit 3）都会停在这里，这是「推送失败不能假绿」的兜底告警。
          runbook: >
            1. 确认巡检行：grep l4_sni /etc/cron.d/imboy-ops
            2. 手动跑一次看退出码：cd /opt/imboy && bash scripts/check_l4_sni_listen.sh --strict --push
            3. 核对 /etc/imboy/ops.env 的 PUSHGATEWAY_URL 与 pushgateway（127.0.0.1:9091）存活

      # 指标缺失：只在 Pushgateway 抓取存活（up=1）时判定「job 从未推过/
      # 指标被整体删除」；全局 absent_over_time 会掩盖单台主机失联，故另含
      # 按 instance 维度的 offset 检测子句（15 分钟前存在、现在消失）。
      - alert: L4SNIMetricsMissing
        expr: |
          (
            absent_over_time(imboy_l4_sni_check_success[15m]) == 1
            and
            max(up{job=~".*pushgateway.*"}) == 1
          )
          or
          (
            count by (instance) (imboy_l4_sni_check_success offset 15m)
            unless on(instance)
            imboy_l4_sni_check_success
          )
        for: 0m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "L4 SNI 巡检指标缺失 / L4 SNI patrol metrics missing"
          description: >
            Pushgateway 抓取正常（up=1）但 imboy_l4_sni_check 的 check_success
            序列缺失：该 job 从未成功推送（cron/env 配置缺失），或指标被整体
            删除（pushgateway 重启清空、单 instance 分组序列消失）。
          runbook: >
            1. 看推送侧现状：curl -s http://127.0.0.1:9091/metrics | grep imboy_l4_sni
            2. 确认 /etc/cron.d/imboy-ops 巡检行与 /etc/imboy/ops.env 的 PUSHGATEWAY_URL
            3. pushgateway 重启会清空数据，等下一轮 cron（≤5 分钟）补推后自愈
