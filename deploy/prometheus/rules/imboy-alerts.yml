# IMBoy SLO 告警规则 / SLO Alerting Rules
#
# 覆盖 / Coverage:
#   1. 服务可用性 / Service availability
#   2. 消息投递延迟 SLO / Message delivery latency SLO
#   3. HTTP 错误率 / HTTP error rate
#   4. Erlang VM 内存告警 / Erlang VM memory alert
#   5. Erlang 进程数上限 / Erlang process count ceiling
#   6. PostgreSQL 连接/事务异常 / PostgreSQL connectivity & transaction anomaly
#   7. 消息积压 / Message backlog
#   8. WebSocket 连接陡降 / WebSocket connection drop
#   9. 主机资源 / Host resources (memory / disk)
#  10. Erlang 节点宕机 / Erlang node down
#  11. PG 连接池耗尽 / PG connection pool exhausted
#  12. 备份健康 / Backup health
#
# 接入告警渠道 / Alert routing:
#   在 Prometheus alertmanager.yml 中配置 receiver（钉钉 / Slack / PagerDuty 等）
#   Configure receiver in Prometheus alertmanager.yml (DingTalk / Slack / PagerDuty, etc.)

groups:

  # ============================================================
  # 1. 服务可用性 / Service Availability
  # ============================================================
  - name: imboy.availability
    interval: 15s
    rules:

      # 后端服务停止响应 > 1min → CRITICAL
      # Backend unreachable for > 1 min → CRITICAL
      - alert: ImBoyBackendDown
        expr: up{job="imboy_backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "IMBoy 后端不可用 / Backend is down"
          description: >
            imboy_backend 在 {{ $labels.instance }} 上已停止响应超过 1 分钟。
            imboy_backend on {{ $labels.instance }} has been unreachable for over 1 minute.
          runbook: "运行 docker compose logs imboy_backend 查看原因 / Run: docker compose logs imboy_backend"

      # 后端服务重启 (uptime 突降) → WARNING
      # Backend process restarted (uptime reset) → WARNING
      - alert: ImBoyBackendRestarted
        expr: process_uptime_seconds{job="imboy_backend"} < 120
        for: 0m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "IMBoy 后端刚刚重启 / Backend recently restarted"
          description: >
            进程运行时间 {{ $value | humanizeDuration }}，可能发生了意外重启。
            Process uptime is {{ $value | humanizeDuration }}; an unexpected restart may have occurred.

  # ============================================================
  # 2. 消息投递延迟 SLO / Message Delivery Latency SLO
  # SLO 目标：p99 < 500ms (5m 窗口)
  # SLO target: p99 < 500ms over a 5-minute window
  # ============================================================
  - name: imboy.latency
    interval: 30s
    rules:

      # p99 投递延迟 > 500ms 持续 5min → WARNING
      - alert: ImBoyMsgDeliveryLatencyHigh
        expr: >
          histogram_quantile(0.99,
            sum(rate(imboy_msg_deliver_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: msg_delivery_p99
        annotations:
          summary: "消息投递 p99 延迟过高 / Message delivery p99 latency too high"
          description: >
            消息投递 p99 延迟为 {{ $value | humanizeDuration }}，超过 SLO 目标 500ms（已持续 5 分钟）。
            Message delivery p99 latency is {{ $value | humanizeDuration }}, exceeding the 500ms SLO (for 5 minutes).

      # p99 投递延迟 > 2s 持续 2min → CRITICAL（SLO 严重违反）
      - alert: ImBoyMsgDeliveryLatencyCritical
        expr: >
          histogram_quantile(0.99,
            sum(rate(imboy_msg_deliver_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 2m
        labels:
          severity: critical
          team: backend
          slo: msg_delivery_p99
        annotations:
          summary: "消息投递 p99 延迟严重超标 / Message delivery p99 latency critically high"
          description: >
            消息投递 p99 延迟为 {{ $value | humanizeDuration }}，已超过 2s SLO 临界值（持续 2 分钟）。
            Message delivery p99 latency is {{ $value | humanizeDuration }}, exceeding the 2s critical threshold (for 2 minutes).

  # ============================================================
  # 3. HTTP 错误率 / HTTP Error Rate
  # SLO 目标：5xx 错误率 < 1%（5m 窗口）
  # SLO target: 5xx error rate < 1% over 5-minute window
  # ============================================================
  - name: imboy.http
    interval: 30s
    rules:

      # 5xx 错误率 > 1% 持续 5min → WARNING
      - alert: ImBoyHTTPErrorRateHigh
        expr: >
          sum(rate(imboy_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(imboy_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: http_error_rate
        annotations:
          summary: "HTTP 5xx 错误率过高 / High HTTP 5xx error rate"
          description: >
            HTTP 5xx 错误率为 {{ $value | humanizePercentage }}，超过 SLO 目标 1%（已持续 5 分钟）。
            HTTP 5xx error rate is {{ $value | humanizePercentage }}, exceeding the 1% SLO (for 5 minutes).

      # 5xx 错误率 > 5% 持续 2min → CRITICAL
      - alert: ImBoyHTTPErrorRateCritical
        expr: >
          sum(rate(imboy_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(imboy_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
          slo: http_error_rate
        annotations:
          summary: "HTTP 5xx 错误率严重超标 / HTTP 5xx error rate critically high"
          description: >
            HTTP 5xx 错误率为 {{ $value | humanizePercentage }}，已超过 5% 临界值（持续 2 分钟）。
            HTTP 5xx error rate is {{ $value | humanizePercentage }}, exceeding the 5% critical threshold (for 2 minutes).

  # ============================================================
  # 4. Erlang VM 内存 / Erlang VM Memory
  # 参考：docker-compose.prod.yml 中 BACKEND_MEM_LIMIT=8192M
  # Reference: BACKEND_MEM_LIMIT=8192M in docker-compose.prod.yml
  # ============================================================
  - name: imboy.erlang_vm
    interval: 30s
    rules:

      # 总内存 > 6GB 持续 5min → WARNING（容器上限 8GB 的 75%）
      # Total memory > 6GB for 5min → WARNING (75% of 8GB container limit)
      - alert: ImBoyErlangMemoryHigh
        expr: >
          erlang_vm_memory_bytes_total{job="imboy_backend", kind="total"}
          > 6 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Erlang VM 内存使用率高 / High Erlang VM memory usage"
          description: >
            Erlang VM 总内存为 {{ $value | humanize1024 }}B，超过容器上限 8GB 的 75%（已持续 5 分钟）。
            Erlang VM total memory is {{ $value | humanize1024 }}B, exceeding 75% of the 8GB container limit (for 5 minutes).

      # 总内存 > 7.5GB 持续 2min → CRITICAL（接近 OOM kill）
      - alert: ImBoyErlangMemoryCritical
        expr: >
          erlang_vm_memory_bytes_total{job="imboy_backend", kind="total"}
          > 7.5 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Erlang VM 内存接近 OOM / Erlang VM memory near OOM"
          description: >
            Erlang VM 总内存为 {{ $value | humanize1024 }}B，容器即将被 OOM Kill（持续 2 分钟）。
            Erlang VM total memory is {{ $value | humanize1024 }}B; container is near OOM Kill (for 2 minutes).
          runbook: "检查是否有消息积压或内存泄漏 / Check for message backlog or memory leak"

  # ============================================================
  # 5. Erlang 进程数 / Erlang Process Count
  # OTP 默认上限 262144；超过 200000 需告警
  # OTP default max 262144; alert above 200000
  # ============================================================
  - name: imboy.erlang_processes
    interval: 30s
    rules:

      - alert: ImBoyErlangProcessCountHigh
        expr: erlang_vm_process_count{job="imboy_backend"} > 200000
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Erlang 进程数过多 / Too many Erlang processes"
          description: >
            Erlang 进程数为 {{ $value }}，接近 OTP 默认上限 262144（已持续 5 分钟）。
            Erlang process count is {{ $value }}, approaching the OTP default limit of 262144 (for 5 minutes).
          runbook: "检查是否有进程泄漏（gen_server 未正常退出等）/ Check for process leaks (gen_server not terminating, etc.)"

  # ============================================================
  # 6. PostgreSQL 健康 / PostgreSQL Health
  # ============================================================
  - name: imboy.postgres
    interval: 30s
    rules:

      # postgres_exporter 离线 > 2min → CRITICAL
      - alert: ImBoyPostgresExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PostgreSQL exporter 离线 / PostgreSQL exporter is down"
          description: >
            postgres_exporter 已离线超过 2 分钟，数据库健康状态未知。
            postgres_exporter has been offline for over 2 minutes; database health is unknown.
          runbook: "检查 imboy_pg18 容器状态 / Check imboy_pg18 container: docker compose logs imboy_pg18"

      # 事务回滚率 > 5%（5m 窗口）→ WARNING
      # Transaction rollback rate > 5% over 5m → WARNING
      - alert: ImBoyPostgresHighRollbackRate
        expr: >
          rate(pg_stat_database_xact_rollback{datname="imboy_pro"}[5m])
          /
          (
            rate(pg_stat_database_xact_commit{datname="imboy_pro"}[5m])
            + rate(pg_stat_database_xact_rollback{datname="imboy_pro"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "PostgreSQL 事务回滚率过高 / High PostgreSQL rollback rate"
          description: >
            imboy_pro 数据库事务回滚率为 {{ $value | humanizePercentage }}，超过 5%（已持续 5 分钟）。
            Transaction rollback rate for imboy_pro is {{ $value | humanizePercentage }}, exceeding 5% (for 5 minutes).

  # ============================================================
  # 7. 消息发送速率陡降（疑似故障）/ Message Send Rate Drop
  # 仅在平均速率 > 1msg/s 的情况下触发，避免低峰期误报
  # Only triggers when avg rate > 1 msg/s to avoid off-peak false positives
  # ============================================================
  - name: imboy.message
    interval: 30s
    rules:

      - alert: ImBoyMsgRateDrop
        expr: >
          sum(rate(imboy_msg_sent_total[5m])) < 0.1
          and
          sum(rate(imboy_msg_sent_total[30m])) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "消息发送速率陡降 / Message send rate dropped sharply"
          description: >
            过去 5 分钟消息发送速率降至 {{ $value | humanize }} msg/s，但过去 30 分钟均值 > 1 msg/s，疑似故障。
            Message send rate dropped to {{ $value | humanize }} msg/s over the last 5 minutes, while the 30-minute average was > 1 msg/s — possible incident.

  # ============================================================
  # 8. WebSocket 连接陡降 / WebSocket Connection Drop
  # ============================================================
  - name: imboy.websocket
    interval: 30s
    rules:

      # WS 连接数较 10min 前下降超过 50% → WARNING（可能发生断线风暴）
      # WS connections dropped > 50% vs 10 min ago → WARNING (possible mass disconnect)
      - alert: ImBoyWSConnectionsDrop
        expr: >
          imboy_ws_connections_total > 10
          and
          (
            imboy_ws_connections_total
            / imboy_ws_connections_total offset 10m
          ) < 0.5
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "WebSocket 连接数陡降 / WebSocket connections dropped sharply"
          description: >
            WebSocket 在线连接数为 {{ $value }}，较 10 分钟前下降超过 50%，可能发生批量断线。
            WebSocket connections are at {{ $value }}, a drop of more than 50% from 10 minutes ago — possible mass disconnect.
          runbook: "检查 nginx WS 代理和后端日志 / Check nginx WS proxy and backend logs"

  # ============================================================
  # 9. 主机资源 / Host Resources (node_exporter 需部署)
  # node_exporter 部署：docker run -d --net="host" --pid="host" \
  #   -v "/:/host:ro,rslave" prom/node-exporter --path.rootfs=/host
  # ============================================================
  - name: imboy.host_resources
    interval: 60s
    rules:

      # 系统内存使用率 > 85% 持续 5min → WARNING（等保2.0 资源可用性基线）
      # Host memory usage > 85% for 5min → WARNING (MLPS 2.0 resource availability baseline)
      - alert: IMBoyHighMemoryUsage
        expr: >
          (
            1 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            )
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "主机内存使用率过高 / Host memory usage too high"
          description: >
            主机内存使用率为 {{ $value | humanizePercentage }}，超过 85% 警戒线（已持续 5 分钟）。
            Host memory usage is {{ $value | humanizePercentage }}, exceeding the 85% threshold (for 5 minutes).
          runbook: "执行 free -h 和 docker stats 定位高内存容器 / Run free -h and docker stats to identify high-memory containers"

      # 系统内存使用率 > 95% 持续 2min → CRITICAL
      - alert: IMBoyHighMemoryUsageCritical
        expr: >
          (
            1 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            )
          ) > 0.95
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "主机内存严重不足 / Host memory critically low"
          description: >
            主机内存使用率为 {{ $value | humanizePercentage }}，系统即将 OOM（持续 2 分钟）。
            Host memory usage is {{ $value | humanizePercentage }}; system is near OOM (for 2 minutes).

      # 磁盘使用率 > 80% → WARNING（等保2.0 日志留存 180 天要求）
      # Disk usage > 80% → WARNING (MLPS 2.0 180-day log retention requirement)
      - alert: IMBoyHighDiskUsage
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}
            )
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "磁盘使用率过高 / High disk usage"
          description: >
            根分区磁盘使用率为 {{ $value | humanizePercentage }}，超过 80% 警戒线（已持续 5 分钟）。
            Root partition disk usage is {{ $value | humanizePercentage }}, exceeding the 80% threshold (for 5 minutes).
          runbook: "执行 df -h 和 du -sh /var/lib/docker 检查空间分布 / Run df -h and du -sh /var/lib/docker to check space usage"

      # 磁盘使用率 > 90% → CRITICAL
      - alert: IMBoyHighDiskUsageCritical
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}
            )
          ) > 0.90
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "磁盘严重不足 / Disk critically full"
          description: >
            根分区磁盘使用率为 {{ $value | humanizePercentage }}，服务即将因磁盘满而崩溃（持续 2 分钟）。
            Root partition disk usage is {{ $value | humanizePercentage }}; services may crash due to full disk (for 2 minutes).

  # ============================================================
  # 10. Erlang 节点宕机检测 / Erlang Node Down
  # 补充 imboy.availability 组中 up==0 的 5min 节点级告警
  # ============================================================
  - name: imboy.node_down
    interval: 30s
    rules:

      # Erlang 后端节点 5 分钟无心跳 → CRITICAL
      # Erlang backend node has no heartbeat for 5 minutes → CRITICAL
      - alert: IMBoyNodeDown
        expr: up{job="imboy_backend"} == 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Erlang 节点宕机 / Erlang node is down"
          description: >
            imboy_backend 节点（{{ $labels.instance }}）已 5 分钟无 Prometheus 心跳，判定节点宕机。
            imboy_backend node ({{ $labels.instance }}) has had no Prometheus heartbeat for 5 minutes; node is considered down.
          runbook: >
            1. docker compose -f docker-compose.prod.yml logs imboy_backend
            2. docker compose -f docker-compose.prod.yml restart imboy_backend
            3. 确认 BEAM 崩溃原因后再重启 / Investigate BEAM crash before restarting

  # ============================================================
  # 11. PG 连接池耗尽 / PostgreSQL Connection Pool Exhausted
  # 基于 pg_stat_database.numbackends 与 max_connections 对比
  # ============================================================
  - name: imboy.pg_pool
    interval: 30s
    rules:

      # PG 连接池使用率 > 90% 持续 5min → WARNING
      # PG connection usage > 90% for 5min → WARNING
      - alert: IMBoyDatabasePoolExhausted
        expr: >
          sum(pg_stat_database_numbackends{datname="imboy_pro"})
          /
          pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "PG 连接池使用率过高 / PG connection pool near exhaustion"
          description: >
            PostgreSQL 连接池使用率为 {{ $value | humanizePercentage }}，超过 90% 警戒线（已持续 5 分钟）。
            当前连接数接近 max_connections 上限，可能导致新连接被拒绝。
            PostgreSQL connection usage is {{ $value | humanizePercentage }}, exceeding the 90% threshold (for 5 minutes).
            New connections may be rejected as max_connections is nearly reached.
          runbook: >
            1. SELECT count(*), state FROM pg_stat_activity GROUP BY state;
            2. SELECT * FROM pg_stat_activity WHERE state = 'idle' ORDER BY state_change;
            3. 检查 pooler 配置是否需要扩容 / Check if pooler needs scaling

      # PG 连接池使用率 > 95% 持续 2min → CRITICAL
      - alert: IMBoyDatabasePoolExhaustedCritical
        expr: >
          sum(pg_stat_database_numbackends{datname="imboy_pro"})
          /
          pg_settings_max_connections > 0.95
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PG 连接池即将耗尽 / PG connection pool critically exhausted"
          description: >
            PostgreSQL 连接池使用率为 {{ $value | humanizePercentage }}，新连接即将被拒绝（持续 2 分钟）。
            PostgreSQL connection usage is {{ $value | humanizePercentage }}; new connections will be rejected (for 2 minutes).

  # ============================================================
  # 12. 备份健康 / Backup Health
  # 依赖：imboy/scripts/backup_pg.sh 执行成功后写入 Prometheus Pushgateway
  # 在 backup_pg.sh 末尾添加：
  #   echo "imboy_backup_last_success_timestamp $(date +%s)" | \
  #     curl --data-binary @- http://pushgateway:9091/metrics/job/imboy_backup
  # ============================================================
  - name: imboy.backup
    interval: 300s
    rules:

      # 24 小时内无成功备份记录 → CRITICAL（等保2.0 数据备份恢复要求）
      # No successful backup in past 24 hours → CRITICAL (MLPS 2.0 data backup requirement)
      - alert: IMBoyBackupNotRunning
        expr: >
          (time() - imboy_backup_last_success_timestamp) > 86400
          or absent(imboy_backup_last_success_timestamp)
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "备份超过 24 小时未运行 / Backup has not run in the past 24 hours"
          description: >
            距离最后一次成功备份已超过 24 小时（或从未有备份记录），违反等保2.0 数据备份恢复要求。
            The last successful backup was more than 24 hours ago (or no backup record exists).
            This violates the MLPS 2.0 data backup and recovery requirement.
          runbook: >
            1. 手动触发备份：bash imboy/scripts/backup_pg.sh
            2. 检查 cron 任务是否正常：crontab -l | grep backup
            3. 检查 Pushgateway 是否在线：curl http://pushgateway:9091/metrics

      # 备份作业本身失败（脚本已退出但状态为失败）→ WARNING
      # Backup job reported failure status → WARNING
      - alert: IMBoyBackupJobFailed
        expr: imboy_backup_last_status == 0
        for: 0m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "备份作业上报失败 / Backup job reported failure"
          description: >
            component={{ $labels.component }} 的最近一次备份以失败状态结束。
            The most recent backup for component={{ $labels.component }} ended in a failed state.
          runbook: >
            1. 查看日志：tail -100 /var/log/imboy/backup_pg.log
            2. 确认 PG 容器在跑：docker ps | grep imboy_pg
            3. 确认备份目录可写且磁盘未满：df -h


      # ── B-22 恢复演练（指标由 scripts/restore_smoke.sh 经 Pushgateway 推送）──
      # 备份"能生成"和备份"能恢复"是两件事。此前每日演练的结果只留在 cron 日志里，
      # 没有人会去看 —— 等于"备份不可恢复"永远不会有人被通知到。

      - alert: IMBoyRestoreDrillFailed
        expr: imboy_restore_drill_last_status == 0
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "备份恢复演练失败 / Restore drill failed"
          description: >
            最近一次恢复演练未通过。这意味着**备份可能无法恢复** ——
            备份文件生成成功不等于能恢复出数据。
          runbook: >
            1. 查演练日志：tail -200 /var/log/imboy/restore_smoke.log
            2. 重点看是否报"源库有 N 行但恢复后 0 行" —— 那是 hypertable 未恢复
               （典型为缺 timescaledb_pre_restore 包裹）
            3. 手工重跑：bash scripts/restore_smoke.sh

      # 演练本身停摆比演练失败更隐蔽：没有结果就没有告警，看起来一切正常
      - alert: IMBoyRestoreDrillStalled
        expr: >
          absent(imboy_restore_drill_last_success_timestamp)
          or (time() - imboy_restore_drill_last_success_timestamp) > 172800
        for: 30m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "恢复演练超过 48 小时未成功 / Restore drill has not succeeded for 48h"
          description: >
            演练每日执行，超过 48 小时没有一次成功即说明它没在跑或一直失败。
          runbook: >
            1. 确认 cron 生效：cat /etc/cron.d/imboy-ops
            2. 确认 /etc/imboy/ops.env 里 PUSHGATEWAY_URL 已设置（见 deploy/ops.env.example）
            3. 确认 DRY_RUN 未被误设为 1 —— 该模式**不推成功指标**，正是为了避免假绿

  - name: imboy.tls
    interval: 300s
    rules:

      # 指标由 scripts/check_tls_expiry.sh 经 Pushgateway 推送
      # Metric is pushed by scripts/check_tls_expiry.sh via Pushgateway
      - alert: IMBoyTLSCertExpiringSoon
        expr: (imboy_tls_cert_expiry_timestamp - time()) < 14 * 86400
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "TLS 证书 14 天内到期 / TLS certificate expires within 14 days"
          description: >
            域名 {{ $labels.component }} 的证书将在 14 天内到期。
            The certificate for {{ $labels.component }} expires within 14 days.
          runbook: >
            1. 手动续期：certbot renew
            2. 确认自动续期定时器：systemctl list-timers | grep certbot
            3. 续期后重载 nginx：nginx -s reload

      - alert: IMBoyTLSCertExpired
        expr: (imboy_tls_cert_expiry_timestamp - time()) <= 0
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "TLS 证书已过期 / TLS certificate has expired"
          description: >
            域名 {{ $labels.component }} 的证书已过期，客户端将无法建立连接。
            The certificate for {{ $labels.component }} has expired; clients cannot connect.
          runbook: >
            1. 立即续期：certbot renew --force-renewal
            2. 重载 nginx：nginx -s reload
            3. 确认 check_tls_expiry.sh 的 cron 为何未提前告警

      # 检查脚本本身停跑（指标消失）也要能发现，否则过期会静默
      - alert: IMBoyTLSCheckStale
        expr: absent(imboy_tls_cert_expiry_timestamp)
        for: 6h
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "TLS 到期检查指标缺失 / TLS expiry metric missing"
          description: >
            超过 6 小时没有收到 imboy_tls_cert_expiry_timestamp，
            check_tls_expiry.sh 可能未运行或 IMBOY_TLS_DOMAINS 未配置。
            No TLS expiry metric received for over 6 hours.
          runbook: >
            1. 检查 cron：cat /etc/cron.d/imboy-ops
            2. 手动跑一次：IMBOY_TLS_DOMAINS=... bash scripts/check_tls_expiry.sh
            3. 确认 /etc/imboy/ops.env 里 IMBOY_TLS_DOMAINS 与 PUSHGATEWAY_URL 已设置

  - name: imboy.payment
    interval: 60s
    rules:

      # 指标由 src/logic/payment_callback_logic.erl 的 handle/3 唯一出入口产出
      # Metric is emitted from the single choke point in payment_callback_logic:handle/3
      - alert: IMBoyPaymentCallbackErrorRateHigh
        expr: >
          sum(rate(payment_callback_total{result="error"}[10m]))
          /
          clamp_min(sum(rate(payment_callback_total[10m])), 0.001)
          > 0.1
        for: 10m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付回调错误率超过 10% / Payment callback error rate above 10%"
          description: >
            近 10 分钟支付回调错误率超过 10%，可能是订单查不到、金额校验失败或下游异常。
            Payment callback error rate exceeded 10% over the last 10 minutes.
          runbook: >
            1. 查错误日志：grep payment_callback /var/log/imboy/*.log | tail -50
            2. 确认 payment_transaction 表写入是否正常
            3. 确认第三方网关状态页是否有故障

      # 验签失败是安全信号（伪造回调 / 密钥不一致），阈值独立于业务错误
      - alert: IMBoyPaymentSignFailureSpike
        expr: sum(rate(payment_callback_sign_failed_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "支付回调验签失败激增 / Spike in payment callback signature failures"
          description: >
            近 5 分钟支付回调验签失败率异常，可能是伪造回调攻击或网关密钥配置不一致。
            Abnormal rate of payment callback signature verification failures.
          runbook: >
            1. 确认来源 IP 是否为网关官方回调地址
            2. 核对网关公钥/密钥配置是否与商户后台一致
            3. 必要时在 nginx 层临时限制回调来源

      # ── B-07 对账（指标由 src/logic/payment_reconcile_logic.erl 的 ecron 入口产出）──
      # Reconciliation metrics come from payment_reconcile_logic:run_hourly/0 (ecron).
      # 指标名与 metrics_handler:metric_name/1 的输出**逐字一致**（atom 原样，无前缀）——
      # 这一条是刻意核对过的，不要照抄本文件其它组里那些不匹配的名字（见 B-26）。

      # 收了钱但业务侧没落地 = 漏单。补单是自动的，但发生本身必须有人知道。
      - alert: IMBoyPaymentReconcileMismatch
        expr: increase(payment_reconcile_mismatch_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付对账发现不一致 / Payment reconciliation found mismatches"
          description: >
            对账 job 发现「payment_transaction 已成功但业务订单未落地」的流水。
            系统已尝试自动补单，但差异本身说明入账链路有缺口，必须查因。
            Reconciliation found successful transactions whose business order was not credited.
          runbook: >
            1. 查日志：grep payment_reconcile /var/log/imboy/*.log | tail -50
            2. 看 payment_reconcile_repair_total{outcome="failed"} 是否同时上涨
            3. 若 outcome=repaired 则钱已补上，仍需定位为何回调当时没入账

      # 补单失败：钱收了、补也补不上，属人工介入级别
      - alert: IMBoyPaymentReconcileRepairFailed
        expr: increase(payment_reconcile_repair_total{outcome="failed"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付对账补单失败 / Payment reconciliation repair failed"
          description: >
            对账发现漏单但自动补单失败，用户已付款而权益未发放，需人工处理。
            Automatic repair failed; the user paid but did not receive the entitlement.
          runbook: >
            1. 按 trade_no 在日志里定位 repair_failed 记录
            2. 核对 payment_transaction 与业务订单的实际状态
            3. 手工补单后确认 channel_order/recharge_order 状态为已支付

      # 流水存在但业务订单查不到 —— 补不了，只能人工判定是脏流水还是订单被误删
      - alert: IMBoyPaymentReconcileUnrepairable
        expr: increase(payment_reconcile_unrepairable_total[6h]) > 0
        for: 0m
        labels:
          severity: warning
          team: payment
        annotations:
          summary: "支付流水找不到对应业务订单 / Payment transaction has no business order"
          description: >
            对账发现成功流水的业务订单不存在，无法自动补单。
          runbook: >
            1. 按 trade_no 核对该流水来源
            2. 确认业务订单是否被误删或订单号写错

      # 心跳：job 该跑没跑，等同于对账形同虚设（悄悄失效比报错更危险）
      - alert: IMBoyPaymentReconcileStalled
        expr: increase(payment_reconcile_run_total[3h]) == 0
        for: 10m
        labels:
          severity: warning
          team: payment
        annotations:
          summary: "支付对账 job 已停摆 / Payment reconciliation job stalled"
          description: >
            近 3 小时没有一次对账执行（正常每小时一次），漏单将无人发现。
          runbook: >
            1. 确认节点存活且 ecron 已启动：make ctl ARGS="node status"
            2. 查 sys.config 的 ecron jobs 是否还有 payment_reconcile 项
            3. 查 payment_reconcile_error_total 是否在涨（跑了但一直失败）
