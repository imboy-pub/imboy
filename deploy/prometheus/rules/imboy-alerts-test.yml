# ImBoy cache-sync 告警组规则单测（promtool test rules）。
# 运行：promtool test rules deploy/prometheus/rules/imboy-alerts-test.yml
#
# 覆盖策略：
#   * 不触发边界（健康态、恢复窗口内自愈、for:5m 未满、有界重试范围的中止）
#     用 alert_rule_test 空断言 —— 无注解匹配负担，措辞改动不破坏测试。
#   * 触发路径用 promql_expr_test 在表达式级断言（注解含 $value 外推浮点，
#     逐字匹配不可维护）；severity/team 等 rule labels 接线由活体
#     Prometheus 的 /api/v1/rules 证据核验（见 closeout-v1 附录 B）。
# 指标名与 deploy/grafana/dashboards/imboy-cache-sync.json 对账（B-26 纪律）。
rule_files:
  - imboy-alerts.yml

evaluation_interval: 1m

tests:
  # 1) 健康态：status=2、三个计数器平坦 → 5 条告警全不触发
  - interval: 1m
    input_series:
      - series: 'imboy_cache_sync_status{job="imboy_backend",instance="n1"}'
        values: "2+0x14"
      - series: 'reject_total{job="imboy_backend",instance="n1"}'
        values: "100+0x14"
      - series: 'unknown_total{job="imboy_backend",instance="n1"}'
        values: "7+0x14"
      - series: 'snapshot_abort_total{job="imboy_backend",instance="n1"}'
        values: "3+0x14"
    alert_rule_test:
      - eval_time: 12m
        alertname: ImBoyCacheSyncStuckRecovering
        exp_alerts: []
      - eval_time: 12m
        alertname: ImBoyCacheSyncDegraded
        exp_alerts: []
      - eval_time: 12m
        alertname: ImBoyCacheSyncRejected
        exp_alerts: []
      - eval_time: 12m
        alertname: ImBoyCacheSyncUnknownEvents
        exp_alerts: []
      - eval_time: 12m
        alertname: ImBoyCacheSyncSnapshotAborting
        exp_alerts: []

  # 2a) recovering 短暂（4 分钟内自愈）→ for:5m 不满足，不触发
  - interval: 1m
    input_series:
      - series: 'imboy_cache_sync_status{job="imboy_backend",instance="n2"}'
        values: "2 1 1 1 1 2 2 2"
    alert_rule_test:
      - eval_time: 6m
        alertname: ImBoyCacheSyncStuckRecovering
        exp_alerts: []

  # 2b) recovering 持续：4 分钟未满 for 窗口不触发；6 分钟表达式命中
  - interval: 1m
    input_series:
      - series: 'imboy_cache_sync_status{job="imboy_backend",instance="n3"}'
        values: "1+0x9"
    alert_rule_test:
      - eval_time: 4m
        alertname: ImBoyCacheSyncStuckRecovering
        exp_alerts: []
    promql_expr_test:
      - expr: imboy_cache_sync_status{job="imboy_backend"} == 1
        eval_time: 6m
        exp_samples:
          - labels: 'imboy_cache_sync_status{job="imboy_backend",instance="n3"}'
            value: 1

  # 3) degraded（status=0）与进程消失（-1）同表达式命中；for:0m 立即告警
  - interval: 1m
    input_series:
      - series: 'imboy_cache_sync_status{job="imboy_backend",instance="n4"}'
        values: "0+0x3"
    promql_expr_test:
      - expr: imboy_cache_sync_status{job="imboy_backend"} <= 0
        eval_time: 1m
        exp_samples:
          - labels: 'imboy_cache_sync_status{job="imboy_backend",instance="n4"}'
            value: 0

  # 4) 快照中止：10 分钟窗口 +1（有界重试范围）不触发；+3 表达式命中
  - interval: 1m
    input_series:
      - series: 'snapshot_abort_total{job="imboy_backend",instance="n5"}'
        values: "5+0x8 6 6 6"
    alert_rule_test:
      - eval_time: 11m
        alertname: ImBoyCacheSyncSnapshotAborting
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'snapshot_abort_total{job="imboy_backend",instance="n6"}'
        values: "5+0x8 8 8 8"
    promql_expr_test:
      - expr: increase(snapshot_abort_total{job="imboy_backend"}[10m]) > 2
        eval_time: 11m
        exp_samples:
          - labels: '{job="imboy_backend",instance="n6"}'
            value: 3.3333333333333335

  # 5) 拒绝 / 未知消息：10 分钟窗口内出现增长即命中（for:0m）
  - interval: 1m
    input_series:
      - series: 'reject_total{job="imboy_backend",instance="n7"}'
        values: "10+0x8 11 11 11"
    promql_expr_test:
      - expr: increase(reject_total{job="imboy_backend"}[10m]) > 0
        eval_time: 11m
        exp_samples:
          - labels: '{job="imboy_backend",instance="n7"}'
            value: 1.1111111111111112
  - interval: 1m
    input_series:
      - series: 'unknown_total{job="imboy_backend",instance="n8"}'
        values: "1+0x8 2 2 2"
    promql_expr_test:
      - expr: increase(unknown_total{job="imboy_backend"}[10m]) > 0
        eval_time: 11m
        exp_samples:
          - labels: '{job="imboy_backend",instance="n8"}'
            value: 1.1111111111111112
