# Grafana Dashboard 自动发现
# 挂载路径: /etc/grafana/provisioning/dashboards/default.yml

apiVersion: 1

providers:
  - name: imboy
    orgId: 1
    folder: IMBoy
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
