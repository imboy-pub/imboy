# Grafana 数据源 / Grafana data source

apiVersion: 1

datasources:
  # ===== Prometheus（指标）=====
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://imboy_prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
