// IMBoy Protocol Buffers Schema
// Version: 1.0.0
//
// This is the top-level envelope message for all WebSocket communication.
// All messages are wrapped in IMBoyMessage for transport over binary WebSocket frames.
//
// Design Principles:
//   - Envelope pattern: single top-level message wraps all subtypes
//   - TSID IDs: sint64 (matching PostgreSQL BIGINT)
//   - Timestamps: int64 milliseconds (Unix epoch)
//   - Payload: bytes for flexibility (can contain nested protobuf or raw data)
//   - Schema evolution: use field numbers, never reuse deleted numbers

syntax = "proto3";

package imboy;

option java_package = "pub.imboy.proto";
option java_multiple_files = true;

// ============================================================
// Top-Level Envelope
// ============================================================

// IMBoyMessage is the single entry point for all WebSocket binary frames.
// Both client and server send/receive this message type exclusively.
message IMBoyMessage {
  // Unique message identifier (TSID)
  string id = 1;

  // Message direction / channel
  MsgDirection type = 2;

  // Sender UID (TSID as sint64, 0 for server-originated)
  sint64 from = 3;

  // Recipient UID or Group ID (TSID as sint64)
  sint64 to = 4;

  // Content type of the payload
  ContentType msg_type = 5;

  // Action for message operations (revoke, edit, read, etc.)
  // Empty string means normal message (no action)
  string action = 6;

  // End-to-end encryption metadata (null/absent if not encrypted)
  E2EEMeta e2ee = 7;

  // Message payload - varies by msg_type, see PayloadXxx messages
  bytes payload = 8;

  // Client-side creation time (business time only, NOT authoritative for ordering)
  // RFC3339 string in current JSON protocol, here as millisecond timestamp
  int64 created_at = 9;

  // Server-assigned timestamp (authoritative for ordering)
  // Only present in server-to-client messages
  int64 server_ts = 10;

  // Message self-destruct timer in seconds (0 = no expiry)
  int32 expire_secs = 11;

  // Conversation sequence number (for strict ordering in history sync)
  // Only present in archived/synced messages
  int64 conv_seq = 12;
}

// ============================================================
// Enums
// ============================================================

// Message direction / channel type
enum MsgDirection {
  MSG_DIRECTION_UNSPECIFIED = 0;
  C2C = 1;          // Client-to-Client (single chat)
  C2G = 2;          // Client-to-Group (group chat)
  C2S = 3;          // Client-to-Server (service request)
  S2C = 4;          // Server-to-Client (system message)
  // WebRTC signaling types
  WEBRTC_OFFER = 10;
  WEBRTC_ANSWER = 11;
  WEBRTC_CANDIDATE = 12;
  WEBRTC_BYE = 13;
  // ACK types
  C2C_SERVER_ACK = 20;
  C2G_SERVER_ACK = 21;
  CLIENT_ACK = 22;
  CLIENT_ACK_CONFIRM = 23;
}

// Content type of the message payload
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  FILE = 5;
  LOCATION = 6;
  CUSTOM = 7;
  E2EE = 8;         // End-to-end encrypted (payload is ciphertext)
}

// S2C system action types
enum S2CAction {
  S2C_ACTION_UNSPECIFIED = 0;
  PULL_OFFLINE_MSG = 1;
  PLEASE_REFRESH_TOKEN = 2;
  DEVICE_KICKED = 3;
  APP_UPGRADE = 4;
  C2C_DEL_EVERYONE = 5;
  C2G_DEL_FOR_ME = 6;
  C2G_DEL_EVERYONE = 7;
  STORE_SHARD = 8;
  SHARD_STORED = 9;
  E2EE_KEY_CHANGED_ACK = 10;
  INVALID_MESSAGE_TYPE = 11;
  POLICY_VIOLATION = 12;
  LOGGED_ANOTHER_DEVICE = 13;
}

// ============================================================
// E2EE (End-to-End Encryption)
// ============================================================

// E2EE metadata attached to encrypted messages
message E2EEMeta {
  // E2EE protocol version
  int32 ver = 1;

  // Cipher suite identifier, e.g. "RSA-OAEP-256+AES-256-GCM", "OLM.V1", "MEGOLM.V1"
  string suite = 2;

  // Nonce/IV for the symmetric cipher (base64-encoded in JSON, raw bytes here)
  // Used by RSA-OAEP suite only.
  bytes nonce = 3;

  // Per-device encrypted symmetric keys (RSA-OAEP suite only)
  repeated E2EEDeviceKey keys = 4;

  // --- v2 routing fields (ADR 02 §7) ---

  // Protocol identifier for v2 routing: "olm", "megolm", "rsa-oaep"
  string protocol = 5;

  // Protocol version (e.g. 1 for OLM.V1)
  int32 protocol_version = 6;

  // --- Olm suite fields (OLM.V1) ---

  // Sender's UID (receiver uses this to locate the Olm session peer)
  string peer_uid = 7;

  // Sender's device ID
  string peer_device_id = 8;

  // Olm message type: 0 = prekey message, 1 = normal message
  int32 message_type = 9;

  // Session identifier (Olm session ID or Megolm session ID)
  string session_id = 10;

  // --- Megolm suite fields (MEGOLM.V1) ---

  // Megolm ratchet message index
  int32 message_index = 11;

  // Group identifier (for C2G messages)
  string group_id = 12;

  // --- v3 Protected Frame (ADR 15) ---

  // Meta version: 1 = legacy RSA, 2 = v2 routing, 3 = protected frame
  int32 meta_version = 13;
}

// Per-device wrapped key for E2EE
message E2EEDeviceKey {
  // Device ID
  string did = 1;

  // Key ID (public key fingerprint)
  string kid = 2;

  // Key wrapping algorithm, e.g. "RSA-OAEP-256"
  string wrap_alg = 3;

  // Encrypted symmetric key (base64-encoded in JSON, raw bytes here)
  bytes ek = 4;
}

// ============================================================
// Payload Messages
// (Serialized into IMBoyMessage.payload as bytes)
// ============================================================

// --- Text Message ---
message PayloadText {
  // Message body text
  string body = 1;

  // @mentioned user UIDs (TSID)
  repeated sint64 mentions = 2;

  // Reply-to reference (optional)
  ReplyRef reply_to = 3;
}

// Reference to a message being replied to
message ReplyRef {
  string msg_id = 1;
  sint64 from_id = 2;
  string snippet = 3;   // Preview text of original message
}

// --- Image Message ---
message PayloadImage {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
  int64 size = 4;          // File size in bytes
  string mime_type = 5;
  string thumbnail_url = 6;
  int32 thumbnail_width = 7;
  int32 thumbnail_height = 8;
}

// --- Video Message ---
message PayloadVideo {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
  int64 size = 4;          // File size in bytes
  int32 duration = 5;      // Duration in seconds
  string mime_type = 6;
  string thumbnail_url = 7;
}

// --- Audio Message ---
message PayloadAudio {
  string url = 1;
  int64 size = 2;          // File size in bytes
  int32 duration = 3;      // Duration in seconds
  string mime_type = 4;
  // Waveform data for visualization (optional)
  repeated int32 waveform = 5;
}

// --- File Message ---
message PayloadFile {
  string url = 1;
  string filename = 2;
  int64 size = 3;          // File size in bytes
  string mime_type = 4;
}

// --- Location Message ---
message PayloadLocation {
  double latitude = 1;
  double longitude = 2;
  string title = 3;
  string address = 4;
}

// --- Message Revoke ---
message PayloadRevoke {
  string original_msg_id = 1;
  int64 revoked_at = 2;   // Timestamp ms
}

// --- Message Edit ---
message PayloadEdit {
  string original_msg_id = 1;
  string body = 2;         // New content
  int64 edited_at = 3;     // Timestamp ms
}

// --- Message Read Receipt ---
message PayloadRead {
  string original_msg_id = 1;
  int64 read_at = 2;       // Timestamp ms
}

// ============================================================
// S2C System Payloads
// ============================================================

// Token refresh notification
message PayloadRefreshToken {
  int64 expire_at = 1;     // Token expiration timestamp ms
}

// App upgrade notification
message PayloadAppUpgrade {
  string upgrade_type = 1;  // "force" or "soft"
  string vsn = 2;           // Target version
  string download_url = 3;
  string description = 4;
  repeated string changelog = 5;
  int64 file_size = 6;
  string file_hash = 7;     // "sha256:..."
}

// Device kicked notification
message PayloadDeviceKicked {
  string reason = 1;
}

// Logged in from another device notification
message PayloadLoggedAnotherDevice {
  string did = 1;     // Device ID that triggered the notification
  string dname = 2;   // Device name
}

// Message deleted notification
message PayloadMsgDeleted {
  string old_msg_id = 1;
}

// ============================================================
// C2S Service Payloads
// ============================================================

// Incremental message sync request
message PayloadSync {
  // Per-conversation cursors for incremental sync
  repeated SyncCursor cursors = 1;
  int32 limit = 2;          // Max messages per conversation (default 50)
}

// Sync cursor for a single conversation
message SyncCursor {
  string conv_key = 1;      // e.g. "c2c:123:456" or "c2g:789"
  int64 last_conv_seq = 2;  // Last known sequence number
}

// Sync response (server sends back as S2C)
message PayloadSyncResult {
  repeated IMBoyMessage messages = 1;
  bool has_more = 2;
}

// ============================================================
// CLIENT_ACK Protocol
// ============================================================

// Client acknowledgement for received messages
// Replaces the text-based "CLIENT_ACK,{Type},{MsgId},{DID}" protocol
message PayloadClientAck {
  MsgDirection msg_direction = 1;  // Original message type (C2C, C2G, S2C)
  string msg_id = 2;               // Message ID being acknowledged
  string did = 3;                   // Device ID
}

// Server confirmation of client ACK
message PayloadClientAckConfirm {
  string msg_id = 1;
  int64 server_ts = 2;
}

// ============================================================
// WebRTC Signaling
// ============================================================

message PayloadWebRTCOffer {
  string sdp = 1;
  string call_id = 2;
  string media_type = 3;   // "audio" or "video"
}

message PayloadWebRTCAnswer {
  string sdp = 1;
  string call_id = 2;
}

message PayloadWebRTCCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_m_line_index = 3;
  string call_id = 4;
}

message PayloadWebRTCBye {
  string call_id = 1;
  string reason = 2;       // "hangup", "busy", "timeout", "cancel"
}

// ============================================================
// Batch / Multiplexing (future extension)
// ============================================================

// For sending multiple messages in a single WebSocket frame
message IMBoyBatch {
  repeated IMBoyMessage messages = 1;
}
