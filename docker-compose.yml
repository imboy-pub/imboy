# =====================================================
# Imboy 单一 docker-compose（profiles 切换 dev / pro / turn）
#
# 历史：
#   * docker-compose.yml          (dev 数据库)
#   * docker-compose-pg18-pro.yml (生产数据库)
#   * docker-compose-turn.yml     (TURN 服务)
# 三份文件硬编码密码、容器名、端口分散在不同文件里，
# 现在统一到本文件，通过 docker compose --profile 切换。
#
# 用法：
#   1. 第一次：cp .env.example .env 并填写 IMBOY_PG_PASSWORD / IMBOY_PG_PRO_PASSWORD
#   2. dev 数据库：    docker compose --profile dev up -d
#   3. 生产数据库：    docker compose --profile pro up -d
#   4. TURN 服务：     docker compose --profile turn up -d
#   5. 多 profile 同启：docker compose --profile dev --profile turn up -d
#
# 注意：
#   * pro 与 dev 容器名 / volume 路径 / 端口完全独立，可同机共存。
#   * 不带 --profile 时 `docker compose up -d` 不启动任何服务（避免误操作）。
# =====================================================

services:
  imboy_pg18:
    profiles: ["dev"]
    image: imboy/pg18:3.6.1-2
    container_name: imboy_pg18
    hostname: pg.docker.imboy.pub
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      POSTGRES_USER: ${IMBOY_PG_USERNAME:-imboy_user}
      POSTGRES_PASSWORD: ${IMBOY_PG_PASSWORD:?IMBOY_PG_PASSWORD required (see .env.example)}
      POSTGRES_DB: ${IMBOY_PG_DATABASE:-imboy_v1}
    volumes:
      - "./docker/imboy_pg18:/var/lib/postgresql"
    ports:
      - "${IMBOY_PG_HOST_PORT:-4323}:5432"
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 4096M
    mem_limit: 4096M
    memswap_limit: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  pro_imboy_pg18:
    profiles: ["pro"]
    image: imboy/pg18:3.6.1-2
    container_name: pro_imboy_pg18
    hostname: pg18pro.docker.imboy.pub
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      POSTGRES_USER: ${IMBOY_PG_PRO_USERNAME:-imboy_user}
      POSTGRES_PASSWORD: ${IMBOY_PG_PRO_PASSWORD:?IMBOY_PG_PRO_PASSWORD required (see .env.example)}
      POSTGRES_DB: ${IMBOY_PG_PRO_DATABASE:-imboy_pro}
    volumes:
      - "/data/docker/pro_imboy_pg18:/var/lib/postgresql"
    ports:
      - "${IMBOY_PG_PRO_HOST_PORT:-5181}:5432"
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 4096M
    mem_limit: 4096M
    memswap_limit: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    container_name: imboy-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/turnserver.conf:ro
    # 端口说明（host 网络，无需 ports 映射）:
    #   3478          STUN/TURN (UDP+TCP)
    #   5349          STUN/TURN over TLS
    #   49152-65535   relay 端口范围

networks:
  default:
    external: true
    name: imboy-network
