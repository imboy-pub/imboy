# =============================================================================
# P4-Q1 known-failures registry（Golden Gates 计划 §6.1 nightly 失败分类）
#
# 语义（计划钉死，勿改）：
#   NEW_FAILURE  = 不在本清单的新失败 -> 阻断 nightly + 自动建 gitee issue（P4-Q4）
#   KNOWN_FAILURE= 本清单内存量失败   -> 只计数，不阻断
#   FIXED        = 上期在本清单、本期消失 -> 棘轮收紧（人工 review 后从本清单移除）
#   FLAKY        = 失败后 step 级 retry 即过 -> 单独计数不阻断（连续 3 次升级 issue 属 Q4 统计口径）
#   INFRA_FAILURE= CI/环境问题        -> 不计入产品质量（启发式自动判定 + 人工复核）
#
# 消费者：.qa/classify.sh（known 清单按「缩进 6 空格的 - 项」解析，勿改变缩进层级）
# 产出者：bash .qa/classify.sh <gate> <log> --emit-known  -> 输出片段，人工 review 后贴回本文件
# 注意：改本清单是人工 review 动作，CI/脚本只读不写（棘轮收紧也是人工确认后移除）。
#
# 首版盘点来源（2026-08-22，macOS 本机实测，见文件末尾 diff 附注）：
#   full-eunit     留空 —— 本机全量 eunit 45min 超出 P4-Q1 实测时间边界，首跑 nightly 回填
#   dialyze        留空 —— 本机无 .dialyzer_plt 缓存，从零建 PLT >10min 即止，首跑 nightly 回填
#   eqwalizer-lib  实测 31 条（elp 1.1.0+build-2026-02-27, lib 层 75 模块 failing 31）
#   gradualizer    实测 277 条（gradualize-audit, 507 模块 failing 277）
#   elvis          实测 308 条（elvis 5.0.4 homebrew, 10397 violations / 308 FAIL 文件）
# =============================================================================
