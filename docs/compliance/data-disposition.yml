# data-disposition.yml —— 数据处置清单（Implementation Plan Task D-02）
#
# 作用：账号删除链的处置真源。D-03 编排器按本表 action 执行；
# 校验测试（data_disposition_tests）断言：当前 schema 的每张表
# 必须在本表映射，或出现在 exclusions 并给理由，否则失败。
#
# 受限 YAML 子集（自解析器约定，超集语法会校验报错）：
#   * 顶层三段：meta / tables / exclusions
#   * tables 与 exclusions 下每表一块：两空格缩进表名，
#     四空格缩进字段行 `key: value`（value 禁含冒号+空格）
#   * action ∈ delete | anonymize | retain
#   * review ∈ self-evident | pending-owner
#
# 产品决策默认（四项 pending-owner，_owner 确认后改 review: owner-approved）：
#   1. trust_audit 审计：retain（安全留存）
#   2. 消息：delete（服务端密文；E2EE 下其他用户设备本地副本不受控，已注明）
#   3. 群/工作区/频道所有权：转移给继任成员，无继任则删除/关闭
#   4. 钱包：余额必须为 0 才能完成删除；财务流水法定留存并匿名化

