(--surface);border-bottom:1px solid var(--line);min-height:64px}.nav h1{flex:1;text-align:center;font-size:20px}.nav button{width:44px;font-size:22px;padding:0}.content{flex:1;overflow:auto;overscroll-behavior:contain;padding:20px 16px;min-height:0}.footer{padding:12px 16px 24px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0}.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:16px 0}.card:first-child{margin-top:0}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row>div{flex:1;min-width:0}.row h3{overflow-wrap:anywhere}.icon{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;background:var(--tint);color:var(--brand);border-radius:12px;font-weight:700}.end{color:var(--muted);font-size:14px;white-space:nowrap}.pill{display:inline-block;padding:2px 8px;background:var(--bg);color:var(--muted);font-size:12px;border-radius:8px}.search{display:block;width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}.tabs{display:flex;gap:4px;margin:16px 0}.tabs button{flex:1;font-size:14px;color:var(--muted);padding:8px 4px}.tabs .selected{color:var(--brand);background:var(--tint);font-weight:600}.label{display:block;font-size:14px;color:var(--muted);margin:20px 0 8px}.field{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;min-height:48px}.notice{padding:12px 16px;border-left:3px solid var(--brand);background:var(--tint);font-size:14px;border-radius:0 12px 12px 0;margin:16px 0}.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:16px 0}.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--brand)}.timer{font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;text-align:center;margin:20px 0 4px}.center{text-align <div class="shell"><aside class="rail"><div class="brand">IMBoy <span class="badge">DESIGN / 05</span></div><p class="muted" style="margin-bottom:20px">面聊记录 · 个人 / 企业 V5</p><nav id="navigation"></nav><p class="subtle">可点击原型 · 示例数据<br>不录音、不上传、不调用 AI</p></aside><main class="stage"><div class="tabs" id="modebar" style="width:100%;margin:0" aria-label="设计场景"></div><div class="caption"><small id="step">工作台入口 → 面聊记录</small><button class="link" onclick="document.body.classList.toggle('dark')">切换明暗</button></div><section class="phone" aria-label="移动端设计原型"><div class="status"><span>09:41</span><span>▰  Wi-Fi  95%</span></div><header class="nav"><button aria-label="返回" onclick="back()">‹</button><h1 id="title">面聊记录</h1><button aria-label="更多操作" onclick="openPage('actions')">⋯</button></header><div class="content" id="content"></div><footer class="footer" id="footer"></footer></section><small>内容区独立滚动 · 操作区不覆盖正文 · 所有业务结果为演示</small></main><aside class="aside"><span class="badge">V5 · BYOK 首版</span><p class="subtle">本区是设计评审控件，不是正式产品界面。</p><h2>查看者角色</h2><select class="field" aria-label="评审角色" onchange="inspectRole(this.value)"><option value="owner">创建者 / 责任人</option><option value="editor">编辑者</option><option value="viewer">只读查看者</option></select><label class="check"><input type="checkbox" checked onchange="S.exportAllowed=this.checked;render()"><span>当前记录允许导出（策略示例）</span></label><h2>处理与恢复状态</h2><div class="states"><button onclick="scenario('offline')">断网仍可本机录音</button><button onclick="scenario('interrupt')">来电中断与手动恢复</button><button onclick="scenario('low_storage')">空间不足与保留已录内容</button><button onclick="scenario('denied')">麦克风权限拒绝</button><button onclick="scenario('unavailable')">未配置整理能力</button><button onclick="scenario('upload_failed')">上传失败</button><button onclick="scenario('queued')">转写排队</button><button onclick="scenario('running')">正在转写</button><button onclick="scenario('failed')">转写失败可回听</button><button onclick="scenario('no_speech')">没有可转写语音</button><button onclick="scenario('ready')">摘要与原文就绪</button><button onclick="scenario('stale')">摘要已过时</button><button onclick="scenario('conflict')">编辑版本冲突</button></div><h2>AI 服务与费用</h2><div class="states"><button onclick="openPage('aiServices')">本设备 AI 服务</button><button onclick="aiScenario('key_invalid')">密钥失效</button><button onclick="aiScenario('balance_limited')">余额不足</button><button onclick="aiScenario('rate_limited')">限流等待</button><button onclick="aiScenario('provider_unknown')">付费结果待确认</button><button onclick="aiScenario('wait_device')">等待本机继续</button><button onclick="S.enterpriseAiAllowed=!S.enterpriseAiAllowed;openPage('aiServices')">切换企业外发策略（评审）</button></div><h2>删除结果</h2><div class="states"><button onclick="scenario('cleanup:pending')">清理中</button><button onclick="scenario('cleanup:blocked_hold')">Hold 保护</button><button onclick="scenario('cleanup:blocked_retention')">留存期未到</button><button onclick="scenario('cleanup:failed')">清理失败</button><button onclick="scenario('cleanup:complete')">清理完成</button></div><h2>评审边界</h2><p>示例状态、权限、音频与结果，不访问麦克风、不调用模型、不发送消息。声音档案退出首版流程。</p><a href="DESIGN.md">产品与交互规范</a><br><a href="BACKEND-API.md">表结构与 API</a><br><a href="PLAN.md">任务与验收计划</a></aside></div><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="actions"><button class="secondary" onclick="document.getElementById('modal').close()">取消</button><button class="primary" id="confirm">确认</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const S={scope:'personal',role:'owner',view:'entry',history:[],recording:false,paused:false,seconds:0,recordContext:null,offline:false,process:'ready',exportAllowed:true,filter:'all',query:'',tab:'summary',editingGrant:-1,recipient:'',grantRole:'viewer',grantExport:false,selectedFormat:'md',exportReady:false,cleanup:'pending',conflict:false,aiKeys:{minimax:false,zhipu:false},aiProvider:'minimax',enterpriseAiAllowed:true,aiUnknownAttempts:0,aiStage:null};
const data={personal:{title:'一次产品访谈',draftTitle:'',workspace:'',grants:[],marks:[],notes:'',participants:[],speakers:['说话人 1','参与者乙']},organization:{title:'产品例会',draftTitle:'',workspace:'',grants:[],marks:[],notes:'',participants:[],speakers:['说话人 1','同事乙']}};
const D=()=>data[S.scope];const enterprise=()=>S.scope==='organization';const owner=()=>S.role==='owner';const editor=()=>S.role!=='viewer';const context=()=>enterprise()?'IMBoy'+(D().workspace?' · '+D().workspace:' · 企业空间'):'个人空间';
const people=()=>enterprise()?['同事甲','同事乙','同事丙']:['联系人甲','联系人乙','联系人丙'];
const pages={aiServices:'AI 服务',aiProvider:'配置服务',entry:'功能入口',list:'记录列表',prepare:'开始准备',destination:'保存位置',record:'录音中',processing:'保存与处理',detail:'记录详情',speakers:'校对发言人',share:'分享管理',grant:'添加或编辑权限',actions:'记录管理',transfer:'移交管理责任',export:'导出文字',cleanup:'清理状态',lost:'访问已失效'};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function modal(title,text,label,fn){$('modalTitle').textContent=title;$('modalText').textContent=text;$('confirm').textContent=label;$('confirm').onclick=()=>{$('modal').close();fn()};$('modal').showModal()}
function openPage(v,push=true){if(push&&S.view!==v)S.history.push(S.view);S.view=v;render();$('content').scrollTop=0}
function back(){S.view=S.history.pop()||'list';render()}
function switchScope(v){S.scope=v;S.history=[];S.query='';S.view='entry';S.editingGrant=-1;render()}
function inspectRole(v){S.role=v;S.exportAllowed=v==='owner';if(['share','grant','transfer','cleanup'].includes(S.view)&&!owner())S.view='detail';if(S.view==='speakers'&&!editor())S.view='detail';render()}
function stamp(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function btn(label,js,style='link',disabled=false){return `<button class="${style}" onclick="${esc(js)}" ${disabled?'disabled':''}>${label}</button>`}
function row(icon,title,sub,tail,js){return `<button class="row" onclick="${esc(js)}"><span class="icon" aria-hidden="true">${icon}</span><div><h3>${esc(title)}</h3><small>${esc(sub)}</small></div><span class="end">${esc(tail)}</span></button>`}
function hint(t){return `<div class="notice">${t}</div>`}
function footer(x){$('footer').innerHTML=x;$('footer').hidden=!x}
function waves(){return '<div class="wave" aria-label="示例输入电平">'+Array.from({length:32},(_,i)=>`<i style="height:${S.paused?6:8+i*13%48}px"></i>`).join('')+'</div>'}
function returnRecording(){if(!S.recordContext)return;S.scope=S.recordContext.scope;S.view='record';render()}
function startRecording(){if(S.recording){returnRecording();return}S.role='owner';D().title=D().draftTitle.trim()||(enterprise()?'未命名讨论':'未命名记录');S.recordContext={scope:S.scope,workspace:D().workspace};D().marks=[];S.seconds=0;S.recording=true;S.paused=false;S.offline=false;S.process='only_audio';openPage('record')}
function stopRecording(){modal('结束并保存？','先保存录音；完成后可自行选择是否使用外部 AI 整理。','结束并保存',()=>{S.recording=false;S.paused=false;S.process=S.offline?'upload_failed':'only_audio';openPage('processing')})}
function togglePause(){S.paused=!S.paused;render()}
function mark(){D().marks.push({time:S.seconds,text:'重点 '+(D().marks.length+1)});render();toast('已添加重点（示例）')}
function saveGrant(){const target=S.recipient||people()[0];const next={name:target,role:S.grantRole,export:S.grantExport&&S.exportAllowed};modal('确认保存权限？',`${target}将获得${next.role==='editor'?'校对与编辑':'查看与回听'}权限。不会自动发送卡片或通知。`,'保存权限',()=>{const old=D().grants.findIndex(g=>g.name===target);if(S.editingGrant>=0)D().grants[S.editingGrant]=next;else if(old>=0)D().grants[old]=next;else D().grants.push(next);S.editingGrant=-1;openPage('share');toast('权限已保存（示例）')})}
function editGrant(i){S.editingGrant=i;const g=i>=0?D().grants[i]:{name:people()[0],role:'viewer',export:false};S.recipient=g.name;S.grantRole=g.role;S.grantExport=g.export;openPage('grant')}
function revoke(i){const g=D().grants[i];modal('撤销查看权限？',`${g.name}将无法继续访问原记录。已导出或保存的副本无法收回。`,'撤销权限',()=>{D().grants.splice(i,1);render();toast('已撤销权限（示例）')})}
function setScenario(v){S.process=v;if(['upload_failed','queued','running'].includes(v))openPage('processing');else openPage('detail')}
function render(){
 $('navigation').innerHTML=Object.entries(pages).filter(([k])=>!['grant','cleanup','lost'].includes(k)&&(!['share','transfer'].includes(k)||owner())&&(k!=='transfer'||enterprise())&&(k!=='speakers'||editor())).map(([k,v])=>btn(v,`openPage('${k}')`,S.view===k?'active':'')).join('');
 $('modebar').innerHTML=btn('个人场景',"switchScope('personal')",!enterprise()?'selected':'')+btn('企业场景',"switchScope('organization')",enterprise()?'selected':'');
 $('title').textContent=S.view==='entry'?(enterprise()?'工作台':'我'):pages[S.view];$('step').textContent=context()+' → '+pages[S.view];footer('');let c='';
 if(S.recording&&S.view!=='record')c+=`<button class="notice recordingbar" onclick="returnRecording()">● ${S.recordContext.scope==='organization'?'企业':'个人'}录音${S.paused?'已暂停':'进行中'} · ${stamp(S.seconds)} · 返回</button>`;
 switch(S.view){
 case 'aiServices': c+=aiServicesContent();break;
 case 'aiProvider': c+=aiProviderContent();break;
 case 'entry':
 c+=`<span class="label">${enterprise()?'IMBoy · 协作工具':'个人空间 · 个人工具'}</span><div class="card">${row('≋','面聊记录',enterprise()?'记录讨论，沉淀团队决定':'记录交流，回顾想法','›',"openPage('list')")}${row(enterprise()?'群':'⌑',enterprise()?'群组':'我的收藏',enterprise()?'企业内交流与协作':'保存重要内容','›',"toast('已有产品入口，本稿聚焦面聊记录')")}</div>${hint(enterprise()?'企业归属不等于全员可见。新记录默认仅创建者可见。':'保存在个人空间，不随加入或离开企业改变归属。')}`;break;
 case 'list':
 c+=`<small>${esc(context())}</small><input type="search" class="search" placeholder="搜索标题或记录内容" aria-label="搜索记录" value="${esc(S.query)}" oninput="S.query=this.value;updateList()"><div class="tabs">${[['all','全部'],['owned','我创建的'],['shared','共享给我']].map(([k,v])=>btn(v,`S.filter='${k}';render()`,S.filter===k?'selected':'')).join('')}</div><div id="records"></div>`;footer(btn(S.recording?'返回正在进行的录音':'＋ 新建记录',S.recording?'returnRecording()':"openPage('prepare')",'primary'));break;
 case 'prepare':
 c+=`<h1>${enterprise()?'留下团队的讨论':'记录此刻的交流'}</h1><p class="subtle">先保存录音，再按需要整理和分享。</p><label class="label" for="recordTitle">标题（选填）</label><input id="recordTitle" class="field" value="${esc(D().draftTitle)}" placeholder="${enterprise()?'例如：项目例会':'例如：一次访谈'}" oninput="D().draftTitle=this.value"><div class="card">${row('◎','保存到',context(),'更改',"openPage('destination')")}${row('文','AI 服务',S.aiKeys.minimax&&S.aiKeys.zhipu?'MiniMax 转写 · 智谱摘要':'未配置，可先保存录音','›',"openPage('aiServices')")}</div>`;
 if(enterprise())c+=`<details class="card"><summary>补充协作信息 <span class="pill">选填</span></summary><label for="workspace" class="label">工作区</label><select id="workspace" class="field" onchange="D().workspace=this.value"><option value="">企业空间，不指定工作区</option>${['产品协作','客户项目'].map(v=>`<option ${D().workspace===v?'selected':''}>${v}</option>`).join('')}</select><label class="label">参与同事</label>${people().map(n=>`<label class="check"><input type="checkbox" ${D().participants.includes(n)?'checked':''} onchange="D().participants=this.checked?[...D().participants,'${n}']:D().participants.filter(x=>x!=='${n}')"><span>${n}</span></label>`).join('')}<small>选择参与者不会向其授权，也不证明对方身份。</small></details>`;
 c+=hint(enterprise()?'默认仅自己可见。企业记录受当前访问、保留和导出规则约束。':'默认仅自己可见，之后可选择联系人共享。')+`<label class="check"><input id="noticeAck" type="checkbox" onchange="$('startBtn').disabled=!this.checked"><span>我已告知现场人员将录音。使用外部 AI 前将另行确认发送范围与费用。</span></label><small>点击开始后才请求系统麦克风权限。此原型不会实际录音。</small>`;

function aiProgress(){
 const states={only_audio:['尚未申请','录音已保存，是否整理由你选择','生成文字与摘要'],queued:['待开始','由配置了密钥且有权限的设备执行','开始整理'],transcribed:['原文就绪','可先校对原文，再单独申请摘要','生成摘要'],running:['处理中',S.aiStage==='summarize'?'智谱正在生成摘要，不重复转写':'MiniMax 正在转写，摘要需另行申请','查看处理说明'],key_invalid:['需处理','密钥失效，录音与已有结果保留','检查 AI 服务'],balance_limited:['需充值','供应商余额不足，未自动切换付费方式','检查 AI 服务'],rate_limited:['等待','供应商限流，达到重试上限后等待你继续','查看处理说明'],provider_unknown:['待确认','请求可能已计费，没有自动重复调用','处理未知结果'],wait_device:['待继续','已保存分块结果，等待在本设备继续','继续整理']};
 const value=states[S.process]||['未开始','已有音频可回听','生成文字与摘要'];return {label:value[0],description:value[1],action:value[2]};
}

 return `<h1>AI 服务</h1><p class="subtle">使用你自己的 API 账户，费用由供应商收取。</p><div class="card">${rows}</div>${hint('密钥仅保存在当前设备，不上传 IMBoy、不参与云备份或换机迁移。换设备需要重新填写。')}${enterprise()?hint(S.enterpriseAiAllowed?'示例企业策略允许这两家服务；发送前仍需本次处理同意。':'示例企业策略禁止外发。即使配有密钥，也只能先保存和回听录音。'):''}<p class="subtle">此原型只演示配置状态，请勿输入真实密钥；按钮不会联网。</p>`;

 const id=S.aiProvider;const name=id==='minimax'?'MiniMax':'智谱 GLM-5.3-Flash';const configured=S.aiKeys[id];

function removeAiKey(id){modal('删除本设备密钥？','停止该服务的新请求。已有录音和结果保留，供应商已有请求无法撤回。','删除密钥',()=>{S.aiKeys[id]=false;render();toast('已清除演示配置')})}
function requestAi(stage){
 if(!editor()){toast('整理记录需要编辑权限');return}
 if(enterprise()&&!S.enterpriseAiAllowed){toast('企业策略禁止向外部服务发送内容');return}
 const unknown=S.process==='provider_unknown';
 stage=stage||(unknown?S.aiStage:(['ready','stale','transcribed'].includes(S.process)?'summarize':'transcribe'));
 if(!['transcribe','summarize'].includes(stage)){toast('请先选择需要恢复的处理阶段');return}
 if(unknown&&stage!==S.aiStage){toast('先处理原阶段的未知结果，不能切换阶段绕过');return}
 if(['running','rate_limited'].includes(S.process)){toast('当前阶段尚未结束，不重复发起请求');return}
 if(stage==='summarize'&&!D().aiTranscript&&!['ready','stale','transcribed'].includes(S.process)){toast('请先转写；已有原文后可单独生成摘要');return}
 const provider=stage==='transcribe'?'minimax':'zhipu';
 if(!S.aiKeys[provider]){S.aiProvider=provider;openPage('aiProvider');return}
 const description=stage==='transcribe'?'仅将录音发送给 MiniMax 生成原文，不发送给智谱。':'仅将已有原文发送给智谱生成摘要，不再次发送录音。';
 modal(unknown?'确认重新请求当前阶段？':stage==='transcribe'?'仅生成原文？':'生成摘要？',unknown?'先前当前阶段请求可能已计费。重新请求可能再次扣费；保留旧请求事实。':description+' 由你的 API 账户付费。此原型不会实际发送。',unknown?'仍要重新请求':'确认本阶段',()=>{if(unknown)S.aiUnknownAttempts+=1;S.aiStage=stage;S.process='running';openPage('processing')});
}

function confirmTransfer(){const n=$('newOwner').value||people()[0],keep=$('keepAccess').checked;modal('确认移交给 '+n+'？',keep?'你将保留查看权限，不再管理记录。':'移交后你将无法继续查看。','移交',()=>{S.role='viewer';openPage(keep?'detail':'lost');toast('移交结果示例，不实际修改任何权限')})}
function updateList(){const examples=[[D().title,'今天 · 12分34秒','owned'],[enterprise()?'需求评审':'读书交流','昨天 · 28分12秒 · 共享给我','shared']].filter(x=>(S.filter==='all'||x[2]===S.filter)&&x[0].includes(S.query));$('records').innerHTML=examples.length?'<div class="card">'+examples.map(x=>row('≋',x[0],x[1],'›',"openPage('detail')")).join('')+'</div>':'<div class="card center"><h2>没有找到记录</h2><p class="subtle">试试其他关键词或清除筛选。</p></div>'}
function summaryContent(){return hint(S.process==='stale'?'原文或署名已更新，摘要可能过时。':'AI 整理草稿 · 使用前请核对')+`<div class="card"><h3>讨论概览</h3><p>确认首版范围，优先完成关键流程和异常恢复。</p><hr class="divider"><h3>讨论决定</h3><p>先保证记录可保存、可恢复、可回顾。</p>${btn('查看依据 · 03:24 ↗',"S.tab='transcript';render();toast('演示：定位03:24原文')")}<hr class="divider"><h3>待办草稿</h3><p>补充首版验收清单</p><small>负责人和截止时间尚未明确</small>${editor()?btn('确认草稿',"toast('仅确认记录内草稿，不创建任务或通知同事')"):''}</div>`}
let editSegment=0;function texts(){return D().texts??=['先把讨论的目标确定下来，保证大家顺畅完成核心流程。','异常恢复也应该列入验收，避免网络不稳定时丢失已记录内容。','先按这个范围推进，负责人和具体时间稍后再确认。']}
function transcriptContent(){return `<input class="search" placeholder="搜索本条原文" aria-label="搜索原文" oninput="document.querySelectorAll('.segment').forEach(e=>e.hidden=!e.textContent.includes(this.value))">`+[[D().speakers[0],'00:12',texts()[0]],[D().speakers[1],'00:48',texts()[1]],[D().speakers[0],'03:24',texts()[2]]].map(([n,t,x],i)=>`<article class="segment"><header><strong>${esc(n)}</strong><span class="pill">${n.startsWith('说话人')?'匿名':'人工标记'}</span>${btn(t+' ▷',`toast('演示：回听${t}')`)}</header><p>${esc(x)}</p>${editor()?btn('校对文字',`editSegment=${i};openPage('segmentEdit')`):''}</article>`).join('')}
function scenario(v){if(v==='low_storage'){S.recording=true;S.recordContext={scope:S.scope};S.paused=true;openPage('record');modal('本机空间不足','录音已暂停以避免继续写入失败。请保存已落盘的部分；未写入的内容不能恢复。','保存现有录音',()=>{S.recording=false;S.process='upload_failed';openPage('processing')})}else if(v==='offline'){S.recording=true;S.recordContext={scope:S.scope};S.offline=true;openPage('record')}else if(v==='interrupt'){S.recording=true;S.recordContext={scope:S.scope};S.paused=true;openPage('record');toast('来电中断示例：已暂停，需要手动继续')}else if(v==='conflict'){S.conflict=true;openPage('conflict')}else if(v==='unavailable'){S.process=v;openPage('prepare')}else if(v==='denied'){openPage('prepare');modal('麦克风权限未开启','录音需要麦克风权限。正式产品将提供设置入口；此原型不访问系统权限。','了解了',()=>{})}else if(v.startsWith('cleanup:')){S.cleanup=v.split(':')[1];openPage('cleanup')}else setScenario(v)}
pages.conflict='编辑版本冲突';pages.segmentEdit='校对片段';
setInterval(()=>{if(S.recording&&!S.paused){S.seconds++;if(S.view==='record'&&$('timer'))$('timer').textContent=stamp(S.seconds)}},1000);
render();

</script></html>
