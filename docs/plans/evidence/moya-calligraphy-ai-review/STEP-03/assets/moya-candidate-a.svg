<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- 墨芽习字 头像候选 A「悬针竖·双芽」：优化版现状构图，红章内收、笔画块面加大 -->
  <!-- 纸白背景 -->
  <rect width="144" height="144" fill="#FAF6EE"/>
  <!-- 隐约田字格：外框 + 十字虚线（144px 下仍隐约可辨） -->
  <g stroke="#D9D2C0" stroke-width="1.6" fill="none" opacity="0.62">
    <rect x="30" y="30" width="84" height="84" rx="2"/>
    <path d="M72 30 V114 M30 72 H114" stroke-dasharray="5 4"/>
  </g>
  <!-- 墨色悬针竖：上顿下收，粗壮块面保证小尺寸辨识 -->
  <path d="M66 36 C62.5 50 60.5 68 62.5 84 C64 93 66.5 100 70 106 L71.5 106 C68.5 99 67 92 67 84 C67 68 68.5 50 72.5 36 Z" fill="#26221C"/>
  <!-- 飞白笔丝 -->
  <path d="M75.5 44 C74 62 73.5 82 74.5 100" stroke="#26221C" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- 茎顶两片对生嫩芽：左叶（深）右叶（嫩） -->
  <path d="M63.5 46 C52 36.5 38.5 35.5 31 43.5 C37 54 52.5 56 62.5 50 Z" fill="#7FA85C"/>
  <path d="M76 42 C86 32.5 100.5 31.5 107.5 39.5 C102 49.5 87 52.5 76.5 47.5 Z" fill="#9CC069"/>
  <!-- 嫩芽叶脉（极简一笔） -->
  <path d="M62 45 C52 42 44 42 38 44 M77 41 C86 38 94 38 100 40" stroke="#5F8A43" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- 印章红小方章：内收到安全圆（圆裁切零损失），镂空内框模拟印章 -->
  <rect x="40" y="92" width="14" height="14" rx="2" fill="#C3272B"/>
  <rect x="43.5" y="95.5" width="7" height="7" rx="1" fill="none" stroke="#FAF6EE" stroke-width="1.6"/>
</svg>
