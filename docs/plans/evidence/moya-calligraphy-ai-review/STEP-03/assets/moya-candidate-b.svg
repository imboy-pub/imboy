<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- 墨芽习字 头像候选 B「一画·右芽」：写字从"一"开始，长横右端生出嫩芽 -->
  <!-- 纸白背景 -->
  <rect width="144" height="144" fill="#FAF6EE"/>
  <!-- 隐约田字格 -->
  <g stroke="#D9D2C0" stroke-width="1.6" fill="none" opacity="0.62">
    <rect x="30" y="30" width="84" height="84" rx="2"/>
    <path d="M72 30 V114 M30 72 H114" stroke-dasharray="5 4"/>
  </g>
  <!-- 墨色长横"一"：藏锋圆起、上扬收笔 -->
  <path d="M33 81 C37 75 46 72.5 62 71.5 C82 70.5 97 69.5 106 67.5 C110 66.8 112.5 67.3 112 69.3 C111.5 71.3 107.5 73.3 99.5 74.5 C81 77 57 79.5 43 82.5 C36.5 84 32.5 83.5 33 81 Z" fill="#26221C"/>
  <!-- 收笔飞白一丝 -->
  <path d="M106 67.5 C109 66 111 65 113 64" stroke="#26221C" stroke-width="1.6" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- 右端短茎 -->
  <path d="M107 68 C106.5 62 107.5 58 109.5 54.5" stroke="#5F8A43" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 顶端两片嫩芽 -->
  <path d="M108 56 C102.5 49.5 95 48.5 90.5 52.5 C94.5 58 102 59.5 107.5 58.5 Z" fill="#7FA85C"/>
  <path d="M110.5 55 C114.5 47.5 121.5 45.5 123.5 49.5 C120.5 56 113.5 58.5 111 57.5 Z" fill="#9CC069"/>
  <!-- 印章红小方章：左下安全圆内 -->
  <rect x="44" y="92" width="14" height="14" rx="2" fill="#C3272B"/>
  <rect x="47.5" y="95.5" width="7" height="7" rx="1" fill="none" stroke="#FAF6EE" stroke-width="1.6"/>
</svg>
