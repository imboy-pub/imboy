<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- 墨芽习字 头像候选 C「墨点·抽芽」：极简大块面，小尺寸辨识度最高 -->
  <!-- 纸白背景 -->
  <rect width="144" height="144" fill="#FAF6EE"/>
  <!-- 隐约田字格 -->
  <g stroke="#D9D2C0" stroke-width="1.6" fill="none" opacity="0.62">
    <rect x="30" y="30" width="84" height="84" rx="2"/>
    <path d="M72 30 V114 M30 72 H114" stroke-dasharray="5 4"/>
  </g>
  <!-- 饱满墨点（侧点）：最大块面 -->
  <path d="M48 74 C52 67.5 62 65.5 72 69.5 C80 73 86 80 84 88 C82 94 74 96.5 64 94.5 C54 92.5 45.5 83.5 48 74 Z" fill="#26221C"/>
  <!-- 点上飞白 -->
  <path d="M56 72 C62 69.5 70 70 76 73" stroke="#FAF6EE" stroke-width="1.4" fill="none" opacity="0.45" stroke-linecap="round"/>
  <!-- 从点右上抽出的短撇嫩茎 -->
  <path d="M79 73 C82.5 66 87 60.5 91.5 56.5" stroke="#5F8A43" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- 顶端两片嫩芽 -->
  <path d="M91 57.5 C86 50.5 78.5 48.5 74.5 52 C78 58 85.5 60.5 90.5 59.5 Z" fill="#7FA85C"/>
  <path d="M93.5 56.5 C98 48.5 106 46.5 110.5 50.5 C107.5 57.5 100 60 95 59 Z" fill="#9CC069"/>
  <!-- 印章红小方章：右上小章（更小，点缀） -->
  <rect x="90" y="28" width="11" height="11" rx="1.5" fill="#C3272B"/>
  <rect x="92.8" y="30.8" width="5.4" height="5.4" rx="0.8" fill="none" stroke="#FAF6EE" stroke-width="1.3"/>
</svg>
