# 墨芽习字（moya）教学域 API 契约 — Step 4 冻结版
#
# 基线：imboy 5b7e2055（main）；moya 9644a2e（main）
# 计划来源：imboy/docs/plans/2026-09-09-moya-calligraphy-ai-review-execution-plan.md §7.1
#
# 硬约束（Step 4 冻结，Step 8/9/13 实现必须遵守）：
#   1. 所有 TSID / 64-bit ID 字段 JSON 表达一律 type: string（pattern ^[0-9]{1,19}$），
#      防 JavaScript Number 精度丢失（API-01）。旧 imboy 端点 integer 传输方式不在本
#      契约范围，不因此改动。
#   2. 响应统一复用 imboy elib_response envelope：{code, msg, sv_ts, payload}。
#      业务错误 = HTTP 200 + envelope code != 0（imboy 主流惯例）；
#      仅认证边界（token 缺失/无效/过期）使用真实 HTTP 401 + 同一 envelope
#      （elib_response:error_with_status/4 先例）。
#   3. 客户端提交的 organization_id / workspace_id / learner_id / reviewer_uid /
#      published_at / AI status 一律不可信；服务端从 JWT uid + DB 关系解析。
#      请求体中出现这些字段时仅作"期望值提示"，服务端拒绝不一致（见 threat-model.md）。
#   4. openid / unionid 只进入身份映射层（sso_identity），不进入任何教学 API 的
#      请求/响应业务字段。
#   5. 分页沿用 imboy 惯例：query 参数 page（默认 1）/ size（默认 20）；
#      响应 payload 内 {list, page, size}，可选 total（group_notice_handler 先例）。
#   6. 附件上传/播放复用现有 /api/v1/attachment/{presign,confirm,view_url}
#      （attach_handler），教学侧新增 scope 校验在 Step 10 实现；本契约不重定义
#      附件端点，仅在 submissions 引用 attachment_id（string）。
openapi: 3.0.3
info:
  title: moya-teaching API
  version: 1.0.0-step4-frozen
  description: |
    墨芽习字教学域（Organization → Workspace → Group/class → learner →
    assignment → submission → AI draft → teacher review）REST 契约。

    角色定义（计划 §5）：
    - Organization 治理成员：organization_member 中 active owner/admin 匹配
      JWT uid。该关系独立于 workspace_member，不自动授予 Workspace 访问权。
    - 授权老师：class_staff 行（manager|teacher|assistant，status=active）匹配
      (group_id, JWT uid)；"任课老师" = teacher/manager。
    - 监护人：guardian_learner 行（status=active）匹配 (guardian_uid, learner_id)；
      can_submit / can_view_review 细分。
    - 学习者 learner 无账号（首版），是资源主体而非请求主体。

    deny-by-default：所有端点先解析 JWT uid → 资源链 → 角色关系，任一环节
    失败即拒绝（envelope code 403 或域码，见 error-codes.md）。
servers:
  - url: '{baseUrl}'
    description: IMBoy API 基地址（试点用开发环境占位，非生产承诺）
    variables:
      baseUrl:
        default: https://api.example.invalid
        description: 由部署配置决定；小程序端不得硬编码。

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 微信小程序登录与 IMBoy 身份映射（openid 只进身份映射层）
  - name: context
    description: 教学身份/上下文解析与显式切换（ACL-02：业务 API 每次独立鉴权）
  - name: parent
    description: 家长视角：作业查看、幂等提交、已发布回评（永不返回 AI 草稿）
  - name: teacher
    description: 老师视角：待评队列、工作台、草稿保存、发布回评
  - name: history
    description: 学员成长历史（同 Organization 跨 Workspace，仅已发布回评）

paths:
  /auth/wechat-mini/login:
    post:
      operationId: wechatMiniLogin
      tags: [auth]
      summary: 微信小程序登录（一次性 code 换 IMBoy token）
      description: |
        服务端以 jscode2session 用一次性 code 换 openid/session_key；
        openid 只进入 sso_identity 映射（provider=wechat_mini），按
        (provider, subject) 解析或建立 IMBoy 用户，返回 IMBoy JWT。

        - code 一次性：已被消费的 code 返回 5402（AUTH-01）。
        - 未配置 provider / appsecret 缺失：5403，响应不泄漏内部细节。
        - 请求可携带 InvitationToken（占位，首版可空）以关联机构，但机构
          归属仍以 DB 关系为准，客户端声明不直接信任。
        - 响应不返回 openid/unionid/session_key。
      security: []   # 登录端点免 Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login() 一次性凭证；5~128 字符
                  minLength: 5
                  maxLength: 128
                device_id:
                  type: string
                  maxLength: 64
                  description: 可选设备标识，用于多点会话管理
      responses:
        '200':
          description: |
            登录结果。HTTP 恒为 200，业务结果看 envelope.code：
            0 = 成功；5401/5402/5403 = 失败（结构同为 ErrorEnvelope）。
          content:
            application/json:
              schema:
                description: 成功为 LoginSuccessEnvelope；业务失败（5401/5402/5403）为同构 ErrorEnvelope
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccessEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ok:
                  value:
                    code: 0
                    msg: success.
                    sv_ts: 1757400000123
                    payload:
                      token: eyJhbGciOi...
                      expires_in: 3600
                      refresh_token: eyJhbGciOi...
                      has_teaching_identity: true
                wechatCodeReused:
                  value:
                    code: 5402
                    msg: 微信登录凭证无效或已使用
                    sv_ts: 1757400000123
                    payload: {}

  /teaching/contexts:
    get:
      operationId: listTeachingContexts
      tags: [context]
      summary: 当前用户可用的教学身份与上下文
      description: |
        返回 JWT uid 在教学域的全部可用身份：
        - guardian 身份：每个 active guardian_learner 关系一条，含 learner 概要、
          can_submit/can_view_review、所属 organization/workspace/class。
        - teacher 身份：每个 active class_staff 关系一条，含 role 与班级概要。
        - organization 治理身份：每个 active owner/admin 关系一条（不因
          该身份自动获得 Workspace 成员权限或儿童资源，仅用于机构
          治理入口，见 §5.2 矩阵）。

        客户端不传任何过滤器；服务端全量解析（deny-by-default）。
        新客户端传 schema_version=2 获得 organization 上下文；省略时为
        旧客户端保留 org_owner 表示，且不暴露新增 admin 上下文。
      parameters:
        - in: query
          name: schema_version
          required: false
          schema:
            type: integer
            enum: [2]
          description: 上下文表示版本；新客户端固定传 2。省略时为兼容版本 1。
      responses:
        '200':
          description: 成功返回身份列表（可能为空 = 该用户无教学身份）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/TeachingContexts'
              examples:
                multiRole:
                  value:
                    code: 0
                    msg: success.
                    sv_ts: 1757400000123
                    payload:
                      contexts:
                        - context_type: guardian
                          organization_id: '4718592023'
                          workspace_id: '4718592101'
                          group_id: '4718000001'
                          group_name: 书法一班
                          learner_id: '562949953421312'
                          learner_display_name: 小明
                          can_submit: true
                          can_view_review: true
                        - context_type: teacher
                          organization_id: '4718592023'
                          workspace_id: '4718592101'
                          group_id: '4718000001'
                          group_name: 书法一班
                          role: teacher
                        - context_type: organization
                          organization_id: '4718592023'
                          organization_name: 墨芽书院
                          role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/context/switch:
    post:
      operationId: switchTeachingContext
      tags: [context]
      summary: 显式切换当前教学上下文（多身份用户）
      description: |
        校验所请求的上下文确实属于 JWT uid（guardian_learner、class_staff
        或 organization_member 关系存在且 active），成功后仅返回该上下文
        完整快照。客户端可在本地记住选择；服务端不保存选中状态。

        重要语义（ACL-02）：switch 只做归属校验与快照回显。后续业务 API 的服务端
        鉴权永远从 JWT uid + 请求内资源 ID 独立解析，绝不继承上一次资源
        上下文 —— 本端点不签发任何凭证、不产生 context token（D-04：不
        增加第二套鉴权）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context_type]
              properties:
                context_type:
                  type: string
                  enum: [guardian, teacher, organization, org_owner]
                  description: org_owner 仅供旧客户端滚动升级兼容，新客户端必须使用 organization。
                organization_id:
                  allOf: [{ $ref: '#/components/schemas/TsidString' }]
                  description: 期望机构（服务端校验一致性）
                workspace_id:
                  allOf: [{ $ref: '#/components/schemas/TsidString' }]
                group_id:
                  allOf: [{ $ref: '#/components/schemas/TsidString' }]
                learner_id:
                  allOf: [{ $ref: '#/components/schemas/TsidString' }]
                  description: guardian 上下文必填
      responses:
        '200':
          description: |
            成功返回上下文快照；或业务拒绝（code 5420 上下文不属于当前用户 /
            5421 上下文已失效）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/TeachingContext'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/assignments:
    get:
      operationId: listAssignments
      tags: [parent]
      summary: 家长视角作业列表（按 learner）
      description: |
        返回当前用户作为监护人（can_submit 或 can_view_review 任一为 true）
        的学员所关联的教学 assignment，按作业状态分组信息由客户端呈现。

        服务端只接受 learner_id 过滤；learner_id 不在监护人绑定集合内时
        返回 5422（不是空列表 —— 明确拒绝跨 learner 枚举）。
      parameters:
        - in: query
          name: learner_id
          required: true
          schema:
            allOf: [{ $ref: '#/components/schemas/TsidString' }]
          description: 必须是当前 JWT uid 有效监护的学员
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, submitted, reviewing, reviewed]
          description: 可选筛选（客户端展示态，服务端按 submission 状态推导）
      responses:
        '200':
          description: 作业列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/AssignmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/assignments/{id}:
    get:
      operationId: getAssignment
      tags: [parent]
      summary: 作业详情（家长或授权老师）
      description: |
        可见性：该 assignment 的 learner 的有效监护人（can_submit 或
        can_view_review），或该班级 active class_staff（manager/teacher/
        assistant）。Organization 治理成员不因 owner/admin 身份获得（§5.2）。
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      responses:
        '200':
          description: 作业详情（含该 learner 的提交时间线概要；不含 AI 草稿）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/AssignmentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/assignments/{id}/submissions:
    post:
      operationId: createSubmission
      tags: [parent]
      summary: 创建练字提交（幂等）
      description: |
        守卫（全部服务端解析）：
        1. assignment 存在且属于教学形态（learner_id 非空）。
        2. JWT uid 是该 assignment.learner 的有效监护人且 can_submit=true。
        3. assignment 未截止被关闭（task status 允许提交；5442 若已截止且老师未放开）。
        4. assets 内每个 attachment_id 已 confirm 落库、created_by=JWT uid、
           MIME/时长在允许集合内（视频必填 1 个 practice_video；final_photo 0..3）。

        幂等：请求头 Idempotency-Key（客户端 UUID）。服务端按
        (uid, assignment_id, idempotency_key) 记录；同 key 重试返回同一
        submission（不新增 attempt），payload.idempotent_replayed=true。
        同 key 但 body 实质不同：返回 5460 幂等键冲突，不覆盖原结果。

        服务端自动计算 attempt_no = 已有最大 attempt + 1；客户端不可提交
        attempt_no / status / submitted_at。
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          description: 客户端生成的重试幂等键；同一逻辑提交重试必须复用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
            examples:
              typical:
                value:
                  learner_id: '562949953421312'
                  assets:
                    - attachment_id: '7036874417766401'
                      kind: practice_video
                      sort_order: 0
                    - attachment_id: '7036874417766402'
                      kind: final_photo
                      sort_order: 0
                  note: 这周每天练了三行
      responses:
        '200':
          description: |
            创建成功或幂等重放（envelope code=0）；业务失败见
            5440/5441/5442/5423/5460 等（error-codes.md）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/SubmissionCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/submissions/{id}:
    get:
      operationId: getSubmission
      tags: [parent, teacher]
      summary: 提交详情（视角感知）
      description: |
        视角由服务端按 JWT uid 与资源关系决定：
        - 监护人视角（can_view_review=true）：返回学员提交、附件播放引用、
          已发布回评（若有）。**永不返回 ai_draft 字段**（D-10；家长 payload
          schema 与老师 payload 为不同 schema）。
        - 任课老师视角：额外返回 ai_draft（老师视角 schema）与本人草稿。
        同一 uid 兼具两身份时返回老师视角（信息超集），仍仅限该班级。
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
      responses:
        '200':
          description: 提交详情（视角感知 payload）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        oneOf:
                          - $ref: '#/components/schemas/SubmissionParentView'
                          - $ref: '#/components/schemas/SubmissionTeacherView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/review-queue:
    get:
      operationId: listReviewQueue
      tags: [teacher]
      summary: 老师待点评队列
      description: |
        仅 active class_staff（manager/teacher；assistant 默认可见队列但
        无发布权，由 Step 9 配置）可访问；按提交时间升序，支持按 group/
        assignment/AI 状态筛选。withdrawn 的 submission 立即从队列消失
        （服务端过滤 status='submitted'）。
        Organization 治理成员不因 owner/admin 身份获得队列（§5.2）。
      parameters:
        - in: query
          name: group_id
          schema:
            allOf: [{ $ref: '#/components/schemas/TsidString' }]
          description: 限定班级（必须是 JWT uid 任教班级，否则 5423）
        - in: query
          name: assignment_id
          schema:
            allOf: [{ $ref: '#/components/schemas/TsidString' }]
        - in: query
          name: ai_status
          schema:
            type: string
            enum: [queued, running, succeeded, failed, none]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 队列分页（含 total，供老师统计）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/ReviewQueuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/submissions/{id}/review-workbench:
    get:
      operationId: getReviewWorkbench
      tags: [teacher]
      summary: 回评工作台聚合数据（老师视角）
      description: |
        仅该班级任课老师（class_staff manager/teacher；assistant 只读）。
        返回 submission 全量、附件播放引用、AI 草稿（任意状态都不阻塞进入
        工作台，failed/none 时前端走纯人工）、该老师现有草稿、学员概要。
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
      responses:
        '200':
          description: 工作台聚合 payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/ReviewWorkbench'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/submissions/{id}/review-draft:
    put:
      operationId: saveReviewDraft
      tags: [teacher]
      summary: 保存/更新老师回评草稿（幂等 upsert per reviewer）
      description: |
        仅任课老师（manager/teacher；assistant 无写权，5425）。每个
        (submission, reviewer) 至多一份有效草稿（重复 PUT 覆盖草稿体，
        不产生多行）。draft 状态下不通知家长。

        服务端忽略请求中的 reviewer_uid / published_at / status 字段；
        reviewer_uid 恒为 JWT uid，published_at 恒为空。
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDraftSaveRequest'
      responses:
        '200':
          description: 保存成功返回当前草稿快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/TeacherReview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/submissions/{id}/reviews/publish:
    post:
      operationId: publishReview
      tags: [teacher]
      summary: 发布回评（draft→published 条件更新，只许一次）
      description: |
        仅任课老师（manager/teacher；assistant 无发布权，5425）。
        条件更新语义：UPDATE ... WHERE status='draft' AND reviewer_uid=JWT uid；
        行数为 0 时——若该 submission 已有已发布回评，返回 200 +
        已发布结果（payload.already_published=true，幂等友好）；否则 5480。

        published_at 由服务端在条件更新成功的事务内设置；请求体不接受
        published_at / reviewer_uid / status。

        发布守卫：草稿必须含至少一种有效反馈内容（文字四要素 ≥1 或
        video_attachment_id 非空）；rework_required=true 时家长端呈现重练
        入口（下一次提交是新 submission/attempt）。
        submission 已 withdrawn 时发布被拒绝（5482）。
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: 可选；发布天然幂等（重复请求返回已发布结果）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 可选确认信息；服务端仅作展示回显，不做信任源
              properties:
                confirm_learner_id:
                  allOf: [{ $ref: '#/components/schemas/TsidString' }]
                  description: 二次确认的学员 ID；与 submission.learner_id 不一致时 5483
      responses:
        '200':
          description: 发布成功或已发布重放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/ReviewPublishResult'
              examples:
                first:
                  value:
                    code: 0
                    msg: success.
                    sv_ts: 1757400060123
                    payload:
                      review:
                        review_id: '6214747500760321'
                        submission_id: '6214747500760300'
                        status: published
                        reviewer_uid: '1000000000000001'
                        positive_point: 横画起笔稳
                        focus_problem: 竖画歪斜
                        practice_action: 每天慢写三行竖画
                        comment: ''
                        video_attachment_id: '7036874417766999'
                        rework_required: false
                        published_at: '2026-09-09T10:01:00Z'
                        created_at: '2026-09-09T09:55:00Z'
                        updated_at: '2026-09-09T10:01:00Z'
                      already_published: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teaching/learners/{id}/history:
    get:
      operationId: getLearnerHistory
      tags: [history]
      summary: 学员成长历史（跨 Workspace，限同 Organization）
      description: |
        可见性：该 learner 的有效监护人（can_view_review=true）或
        Organization 内该 learner 就读班级的任课老师；历史按 Organization
        聚合、跨 Workspace 连续（D-09），只含已发布回评；AI 草稿永不出现。
        跨 Organization 历史分区且不可互读（HISTORY-01）。
      parameters:
        - $ref: '#/components/parameters/LearnerIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - in: query
          name: group_id
          required: false
          schema:
            allOf: [{ $ref: '#/components/schemas/TsidString' }]
          description: 可选按班级过滤
      responses:
        '200':
          description: 按时间倒序的提交+已发布回评时间线（分页，含 total）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/LearnerHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "IMBoy 现有 API JWT（auth_middleware_api_v1 校验 Authorization: Bearer <token>）"

  parameters:
    PageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: imboy 分页惯例（elib_param:page）
    SizeParam:
      in: query
      name: size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: imboy 分页惯例，默认 20
    AssignmentIdPath:
      in: path
      name: id
      required: true
      schema:
        allOf: [{ $ref: '#/components/schemas/TsidString' }]
      description: group_task_assignment ID（TSID 字符串）
    SubmissionIdPath:
      in: path
      name: id
      required: true
      schema:
        allOf: [{ $ref: '#/components/schemas/TsidString' }]
      description: homework_submission ID（TSID 字符串）
    LearnerIdPath:
      in: path
      name: id
      required: true
      schema:
        allOf: [{ $ref: '#/components/schemas/TsidString' }]
      description: learner ID（TSID 字符串）

  responses:
    Unauthorized:
      description: |
        认证边界失败（token 缺失/无效/过期）：真实 HTTP 401 + imboy envelope
        （elib_response:error_with_status/4 先例）。业务权限拒绝不用 401，
        用 HTTP 200 + envelope code 403/域码。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 401
            msg: 未认证
            sv_ts: 1757400000123
            payload: {}

  schemas:
    TsidString:
      type: string
      pattern: '^[0-9]{1,19}$'
      description: |
        TSID/64-bit ID 的 JSON 表达。硬约束：一律十进制纯数字字符串，
        严禁 number（JS Number 2^53 精度丢失，API-01 / MOYA-ID-01）。
        例：'562949953421312'

    NullableTsidString:
      type: string
      nullable: true
      pattern: '^[0-9]{1,19}$'
      description: 可空 TSID（同 TsidString 硬约束，字符串而非 number）

    SuccessEnvelope:
      type: object
      required: [code, msg, sv_ts, payload]
      description: imboy elib_response 统一成功 envelope（HTTP 200）
      properties:
        code:
          type: integer
          enum: [0]
        msg:
          type: string
        sv_ts:
          type: integer
          format: int64
          description: 服务器毫秒时间戳
        payload:
          type: object

    ErrorEnvelope:
      type: object
      required: [code, msg, sv_ts]
      description: |
        imboy 统一错误 envelope。业务错误 HTTP=200 + code!=0；
        认证边界 HTTP=401 + code=401。错误码语义见 STEP-04/error-codes.md。
      properties:
        code:
          type: integer
          minimum: 1
          description: 0 之外的错误码（400/401/403/404/409/410/422/5xxx 域码；恒 >= 1）
        msg:
          type: string
          description: 人类可读消息（中文），不含内部细节
        sv_ts:
          type: integer
          format: int64
        payload:
          type: object
          default: {}

    LoginSuccessEnvelope:
      type: object
      required: [code, msg, sv_ts, payload]
      properties:
        code:
          type: integer
          enum: [0]
        msg:
          type: string
        sv_ts:
          type: integer
          format: int64
        payload:
          type: object
          required: [token, expires_in]
          properties:
            token:
              type: string
              description: "IMBoy JWT（后续请求 Authorization: Bearer 头携带）"
            expires_in:
              type: integer
              description: 秒
            refresh_token:
              type: string
              description: 刷新令牌（复用 imboy refreshtoken 机制）
            has_teaching_identity:
              type: boolean
              description: 是否存在任何教学身份（引导小程序进入身份选择）

    TeachingContexts:
      type: object
      required: [contexts]
      properties:
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/TeachingContext'

    TeachingContext:
      type: object
      required: [context_type, organization_id]
      properties:
        context_type:
          type: string
          enum: [guardian, teacher, organization, org_owner]
          description: schema_version=2 返回 organization；兼容版本可返回 org_owner。
        organization_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        organization_name:
          type: string
        workspace_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        group_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        group_name:
          type: string
        role:
          type: string
          enum: [owner, admin, manager, teacher, assistant]
          description: organization 上下文为 owner/admin；teacher 上下文为 manager/teacher/assistant。
        learner_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        learner_display_name:
          type: string
        can_submit:
          type: boolean
        can_view_review:
          type: boolean

    AssignmentSummary:
      type: object
      required: [assignment_id, task_id, group_id, title, status]
      properties:
        assignment_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        task_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        group_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        group_name:
          type: string
        learner_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, submitted, reviewing, reviewed]
          description: 服务端按最新 submission/review 推导的家长视角状态
        latest_submission:
          $ref: '#/components/schemas/NullableTsidString'
        latest_attempt_no:
          type: integer
          nullable: true
        rework_required:
          type: boolean
          description: 最新已发布回评是否要求重练

    AssignmentPage:
      type: object
      required: [list, page, size]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentSummary'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          description: 可选总数（imboy group_notice 先例）

    AssignmentDetail:
      type: object
      description: 作业详情 + 拍摄要求 + 该 learner 的提交时间线概要（无 AI 草稿）
      allOf:
        - $ref: '#/components/schemas/AssignmentSummary'
        - type: object
          properties:
            submissions:
              type: array
              description: 按提交时间倒序的提交概要（家长可见字段）
              items:
                $ref: '#/components/schemas/SubmissionSummary'

    SubmissionSummary:
      type: object
      required: [submission_id, attempt_no, status, submitted_at]
      properties:
        submission_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        assignment_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        attempt_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [submitted, withdrawn]
        submitted_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
        published_review_id:
          $ref: '#/components/schemas/NullableTsidString'

    SubmissionCreateRequest:
      type: object
      required: [learner_id, assets]
      properties:
        learner_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
          description: 期望学员；服务端校验 = assignment.learner_id 且 JWT uid 为其 can_submit 监护人
        assets:
          type: array
          minItems: 1
          maxItems: 4
          description: 恰好 1 个 practice_video；0..3 个 final_photo
          items:
            type: object
            required: [attachment_id, kind]
            properties:
              attachment_id:
                allOf: [{ $ref: '#/components/schemas/TsidString' }]
                description: 已通过 /api/v1/attachment/confirm 落库的附件 ID
              kind:
                type: string
                enum: [practice_video, final_photo]
              sort_order:
                type: integer
                minimum: 0
                maximum: 9
                default: 0
        note:
          type: string
          maxLength: 500
          description: 家长备注（可选，进入 AI 输入前做注入过滤，见威胁模型 T9）

    SubmissionCreated:
      type: object
      required: [submission_id, assignment_id, learner_id, attempt_no, status, submitted_at]
      properties:
        submission_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        assignment_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        learner_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        attempt_no:
          type: integer
        status:
          type: string
          enum: [submitted]
        submitted_at:
          type: string
          format: date-time
        ai_status:
          type: string
          enum: [queued]
          description: 家长可见的 AI 处理态只到"整理中"级别，不暴露草稿内容
        idempotent_replayed:
          type: boolean
          default: false
          description: true = 幂等键重放，返回的是既有提交

    AssetView:
      type: object
      required: [attachment_id, kind]
      description: 附件引用；播放 URL 由小程序另调 /api/v1/attachment/view_url 获取短时授权
      properties:
        attachment_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        object_key:
          type: string
          description: 传给 view_url 的对象键（复用 imboy 附件能力）
        kind:
          type: string
          enum: [practice_video, final_photo]
        sort_order:
          type: integer

    SubmissionParentView:
      type: object
      description: 家长视角提交详情 —— 硬约束：schema 级排除任何 ai_draft 字段（D-10）
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          properties:
            assets:
              type: array
              items:
                $ref: '#/components/schemas/AssetView'
            note:
              type: string
            published_review:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/PublishedReview'
            ai_status_hint:
              type: string
              enum: [processing, done, none]
              description: 仅三态提示（processing=AI 整理中/done=老师工作台就绪/none=无 AI 参与），永不暴露草稿

    SubmissionTeacherView:
      type: object
      description: 老师视角提交详情（信息超集：含 AI 草稿与老师草稿）
      allOf:
        - $ref: '#/components/schemas/SubmissionParentView'
        - type: object
          properties:
            learner_display_name:
              type: string
            ai_draft:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AiReviewDraftTeacherView'
            my_review_draft:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/TeacherReview'

    AiReviewDraftTeacherView:
      type: object
      description: |
        AI 草稿（仅老师可见）。计划 §7.3 最小字段；置信度仅供老师参考，
        不向家长宣传。result 为 null 当 status != succeeded。
        该 schema 永不出现在家长视角任何响应中（AI-02 / D-10）。
      required: [draft_id, submission_id, status]
      properties:
        draft_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        submission_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error_code:
          type: string
          nullable: true
          description: failed 时的机器可读原因（如 timeout/provider_error/bad_schema/attachment_missing）
        model_profile:
          type: string
        prompt_version:
          type: string
        rubric_version:
          type: string
        result:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiDraftResult'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    AiDraftResult:
      type: object
      description: AI 结构化结果（result_json）。不含模型思维链（AI-02）。
      required: [positive_point, focus_problem, evidence_moments, practice_action, script_outline, needs_human_check]
      properties:
        positive_point:
          type: string
          description: 正向观察（1 条）
        focus_problem:
          type: string
          description: 主要问题（1 条）
        evidence_moments:
          type: array
          minItems: 1
          maxItems: 5
          description: 证据时间点（秒）
          items:
            type: number
        practice_action:
          type: string
          description: 一个练习动作
        script_outline:
          type: array
          maxItems: 3
          description: 老师口播提纲（≤3 点）
          items:
            type: string
        needs_human_check:
          type: boolean
          description: 需人工特别核对标记
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 仅供老师参考；不得对家长宣传为准确率

    TeacherReview:
      type: object
      description: 老师回评（草稿/已发布）。reviewer_uid、published_at、status 服务端权威。
      required: [review_id, submission_id, reviewer_uid, status]
      properties:
        review_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        submission_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        reviewer_uid:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
          description: 服务端写入；draft 时=当前老师，published 后不可变
        positive_point:
          type: string
          maxLength: 200
        focus_problem:
          type: string
          maxLength: 200
        practice_action:
          type: string
          maxLength: 200
        comment:
          type: string
          maxLength: 1000
        video_attachment_id:
          $ref: '#/components/schemas/NullableTsidString'
        rework_required:
          type: boolean
          default: false
        status:
          type: string
          enum: [draft, published, discarded]
        published_at:
          type: string
          format: date-time
          nullable: true
          description: 仅 published 非空；服务端事务内设置
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PublishedReview:
      type: object
      description: 家长可见的已发布回评子集（不含 reviewer 内部字段；status 恒为 published 故不设字段）
      required: [review_id, published_at]
      properties:
        review_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        positive_point:
          type: string
        focus_problem:
          type: string
        practice_action:
          type: string
        comment:
          type: string
        video_attachment_id:
          $ref: '#/components/schemas/NullableTsidString'
        video_object_key:
          type: string
          nullable: true
        rework_required:
          type: boolean
        published_at:
          type: string
          format: date-time

    ReviewDraftSaveRequest:
      type: object
      description: 保存草稿请求。服务端忽略 reviewer_uid/status/published_at（伪造即 5484）。
      properties:
        positive_point:
          type: string
          maxLength: 200
        focus_problem:
          type: string
          maxLength: 200
        practice_action:
          type: string
          maxLength: 200
        comment:
          type: string
          maxLength: 1000
        video_attachment_id:
          description: 老师 confirm 过的点评视频附件（可空）
          allOf:
            - $ref: '#/components/schemas/NullableTsidString'
        rework_required:
          type: boolean
        adopt_ai:
          type: boolean
          description: 是否采用 AI 草稿（老师反馈统计：采用/修改/判断错误）
        ai_feedback:
          type: string
          enum: [adopted, modified, wrong]
          description: AI 草稿反馈标记（仅统计，不影响流程）

    ReviewPublishResult:
      type: object
      required: [review, already_published]
      properties:
        review:
          $ref: '#/components/schemas/TeacherReview'
        already_published:
          type: boolean
          description: true = 此前已发布，本次为幂等重放

    ReviewQueueItem:
      type: object
      required: [submission_id, assignment_id, group_id, learner_id, learner_display_name, submitted_at, attempt_no, ai_status]
      properties:
        submission_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        assignment_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        task_title:
          type: string
        group_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        group_name:
          type: string
        learner_id:
          allOf: [{ $ref: '#/components/schemas/TsidString' }]
        learner_display_name:
          type: string
        submitted_at:
          type: string
          format: date-time
        attempt_no:
          type: integer
        ai_status:
          type: string
          enum: [queued, running, succeeded, failed, none]
        has_published_review:
          type: boolean
          description: 重练场景中旧 attempt 已评标记

    ReviewQueuePage:
      type: object
      required: [list, page, size, total]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer

    ReviewWorkbench:
      type: object
      required: [submission]
      description: AI 草稿位于 submission.ai_draft（SubmissionTeacherView 内）
      properties:
        submission:
          $ref: '#/components/schemas/SubmissionTeacherView'
        my_review_draft:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TeacherReview'
        learner_display_name:
          type: string
        assignment_title:
          type: string

    LearnerHistoryPage:
      type: object
      required: [list, page, size, total]
      properties:
        list:
          type: array
          items:
            type: object
            required: [submission_id, assignment_id, group_id, attempt_no, submitted_at]
            properties:
              submission_id:
                allOf: [{ $ref: '#/components/schemas/TsidString' }]
              assignment_id:
                allOf: [{ $ref: '#/components/schemas/TsidString' }]
              task_title:
                type: string
              group_id:
                allOf: [{ $ref: '#/components/schemas/TsidString' }]
              group_name:
                type: string
              workspace_id:
                allOf: [{ $ref: '#/components/schemas/TsidString' }]
                description: 同 Organization 跨 Workspace 连续（D-09）
              attempt_no:
                type: integer
              submitted_at:
                type: string
                format: date-time
              status:
                type: string
                enum: [submitted, withdrawn]
              published_review:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/PublishedReview'
                description: 仅已发布回评出现；AI 草稿永不出现
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
